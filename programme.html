 Schneck - University of Stuttgart, Germany\tAbstract: Annoyed by ever-changing communication protocols and funky quirks of your lab equipment? Feel overwhelmed by 42 different implementations from former students? Then check out this object-based implementation in Python. Based on ABC metaclasses, it forces every new implementation into a well-defined, common form.\tDemo 6 \tTitle: Generate Vector Graphics with TikZ \tPresenter: Felipe Villenas Cortez - Eindhoven University of Technology, the Netherlands\tAbstract: With just LaTeX and a text file with data, you can use TikZ to generate vector graphics such as plots and block diagrams. In this demo, I will show some of the main advantages of using TikZ for the figures in your papers, reports, and presentations, alongside some basic examples to get started.\tDemo 7 \tTitle: GPU programming in Python and MATLAB for dummies \tPresenter: Kadir Gümüs - Eindhoven University of Technology, the Netherlands\tAbstract: In this demo, I will give a quick overview of the basics of GPU programming for both Python and MATLAB. These basics are enough to significantly speed up any of your code, and even with little to no experience, you'll be able to program on the GPU after this demo.\tDemo 8 \tTitle: Learn how to configure and operate a MATLAB-based coherent transport DSP with up to 700 \tparameters using LabVIEW! \tPresenter: Robert Emmerich - Fraunhofer Heinrich-Hertz-Institut, Germany\tAbstract: The recent advent of open-source software has led to a decline in the use of proprietary environments such as the graphical programming languages LabVIEW and MATLAB. However, these tools are still in use in state-of-the-art optical transmission labs and require continuous optimisation of operations. In this demonstration, we will present an interactive demo based on an experiment conducted in our Berlin laboratory. This demo will use our MATLAB-based coherent transport DSP in conjunction with a LabVIEW-based GUI for configuration and DSP control. Furthermore, an introduction to the setup and construction of the multi-band transmission system used for this year's OFC post-deadline paper will be given to viewers.\tDemo 9 \tTitle: The lost art of using GPUs not for AI \tPresenter: Mindaugas Jarmolovicius - University College London (UCL), London, United Kingdom\tAbstract: Do you have a piece of code that just takes forever to run? No? Well, do you have a thesis to write and would just do anything else, let's say, making your code run faster? If that's the case, rewriting everything in C++ is (probably) not the procrastination you want. This demo will enlighten you with advanced procrastination methods making not only your number-crunching Python code run faster than C++ could, but also will shock you with how little GPU VRAM you can get way with while doing it. This demo will introduce basic and more advanced concepts of running Python code on GPUs (big and small, new and old ones), providing a guide through a jungle of GPU frameworks, mostly focusing on JAX ecosystem, while also encompassing discussions of why you may or may not want to do this in your research, and other Hack Your Research style tricks. https://github.com/zceemja/labathon_ecoc2026\tDemo 10 \tTitle: Plug, Play, and Talk: Agentic Optical Networks with ETSI TeraFlowSDN\tPresenter: Ricard Vilalta (CTTC, Spain) & Andrea Sgambelluri (CNIT/SSSA, Italy)\tAbstract: This demonstration presents the latest enhancements in the ETSI TeraFlowSDN controller to manage optical transport networks through agentic automation. The demo combines recent optical-controller advances for ROADMs, Transponders, optical connectivity services, and flex-grid spectrum handling with new Model Context Protocol (MCP) and Agent-to-Agent (A2A) capabilities. TeraFlowSDN exposes its control functions through MCP, enabling AI agents to inspect topology, devices, links, services, and optical spectrum resources. Multiple TeraFlowSDN controller instances, each responsible for a different optical domain, coordinate through Agent-to-Agent (A2A) interfaces to negotiate cross-domain optical connectivity services. The demo leverages emulated optical devices, allowing experimentation without requiring specialized hardware. TeraFlowSDN is an open-source, cloud-native, and microservice-based SDN controller developed mainly in Python and hosted under the umbrella of ETSI. New contributors are welcome to join. This demo has been developed in the context of PROTEUS-6G (GA 101139134).\tDemo 11 \tTitle: Splice: streaming telemetry and agentic control for mixed-vendor networks \tPresenter: Agastya Raj, Tian Tian, Marco Ruffini - Trinity College Dublin, Ireland\tAbstract:- Disaggregated, multi-vendor networks promise freedom from lock-in. But in practice every box speaks its own management dialect, so monitoring, control, and automation get rebuilt per vendor. Splice is a lightweight, open-source (Apache 2.0, pure Python) bridge that hides those differences behind one clean interface: a single client can configure a device, stream live telemetry, and be driven by an AI agent - whatever protocol (NETCONF, gNMI) the hardware underneath speaks. It's the missing glue for a genuinely vendor-neutral stack, from a lab testbed up to a production disaggregated line system. At the table I'll show it live: an agent driving mixed gear with telemetry streaming back in real time - grab the repo and point it at your own network\tDemo 12\tTitle: Open-Source Differentiable Photonic Design & GPU Simulation \tPresenter: Joaquin Matres - GDSFactory\tAbstract: This hackathon will showcase an open-source, differentiable, GPU-accelerated photonic design workflow, connecting GDSFactory layouts directly to multiple simulation engines. Participants will use GDSFactory to create photonic layouts and explore SAX, Circulax, MEOW, and BeamZ for fast circuit- and device-level simulation. The tools enable GPU acceleration and differentiable simulation, making it possible to efficiently optimize photonic components and circuits using gradient-based methods. The goal is to demonstrate a unified workflow from layout → simulation → optimization, while giving participants hands-on experience with the growing open-source ecosystem for photonic chip design.","goal":"","papers":[]},{"sessionid":"5538611","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"","room":"","type":"Registration","typeColor":"black","category":"","title":"Registration","description":"","goal":"","papers":[]},{"sessionid":"5538670","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"08:30-09:00","room":"","type":"Coffee break","typeColor":"black","category":"","title":"Morning coffee","description":"","goal":"","papers":[]},{"sessionid":"5538447","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"09:00-10:30","room":"A1 Auditorium 1","type":"Tutorial and contributed session","typeColor":"#d0e0e3","category":"SC 05: Optical transmission systems","title":"We1-A SDM systems","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Georg Rademacher","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Tutorial","code":"#0 /","title":"We1-A1 High capacity SDM transmission","speaker":"Ruben Luis","affiliation":"National Institute of Information and Communications Technology","authors":"","start":"09:00","end":"10:00","abstractid":null,"order":1},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Kouki Shibahara","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#105 / We1-A2","title":"10.33 Pb/s GMI Data-Rate S+C+L Transmission over a Standard-250 μm Coating Diameter, 6-Mode, 7-Core Fiber","speaker":"Stefano Gaiani","affiliation":"","authors":"Stefano  Gaiani, Ruben S.  Luís, Julian  Schneck, Daniele  Orsuti, Katsuyoshi  Sakaime, Haoshuo  Chen, Roland  Ryf, Nicolas K.  Fontaine, Dicky  Chung, Ray  Man, Georg  Rademacher, Pierpaolo  Boffi, Hideaki  Furukawa","start":"10:00","end":"","abstractid":210588,"order":2,"abstract":"Abstract (summary)  We achieve 10.33 Pb/s (GMI-estimated) or 9.72 Pb/s (FEC-decoded) data-rate by transmitting 775, polarization-multiplexed, 256-QAM channels across S+C+L-bands (19.25 THz bandwidth) over a 26.6 km, standard-coating, 6-mode, 7-core fiber with a cladding diameter of 171 μm, which is the lowest reported to date.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-105.pdf"},{"role":"speaker","rolename":"Contributed","code":"#279 / We1-A3","title":"A Simplified Model for Linear Mode Coupling in Multimode Fibers with Experimental Assessment","speaker":"Paolo Carniello","affiliation":"Technical University of Munich","authors":"Paolo  Carniello, Filipe M.  Ferreira, Fabio A.  Barbosa, Ming-Jun  Li, Norbert  Hanik","start":"10:15","end":"","abstractid":211025,"order":3,"abstract":"Abstract (summary)  We propose a novel surrogate model for linear coupling in graded-index multimode fibers that is computationally more efficient than existing models, and can be tuned through a single measurable parameter. The model is benchmarked numerically and experimentally on a 90-polarization-mode fiber.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-279.pdf"}]},{"sessionid":"5538451","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"09:00-10:30","room":"A2 Auditorium 2","type":"Invited and contributed","typeColor":"#f4cccc","category":"SC 03: Photonic integrated circuits, assemblies and packaging","title":"We1-B Optical computing","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Francesco Da Ros","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#33 / We1-B1","title":"Microring Resonators as Neuromorphic Primitives for Optical Computing: Spiking Networks, Complex Perceptrons, and Pho-tonic Preprocessing","speaker":"Lorenzo Pavesi","affiliation":"Nanoscience Laboratory, Department of Physics, University of Trento","authors":"Lorenzo  Pavesi","start":"09:00","end":"09:30","abstractid":208448,"order":1,"abstract":"Abstract (summary)  Silicon microring resonators are versatile neuromorphic primitives. We present three applications: all-optical spiking networks for sparse signalling, complex photonic perceptrons for link equalization, and reservoir arrays for sensor pre-processing. These architectures leverage nonlinear dynamics and non-fading memory to enable  low-latency, high-speed optical computing solutions.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Pavesi.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Claudio Porzi","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1196 / We1-B2","title":"20 GHz In-situ Optical Backpropagation for Training AWGR-based Hyperdimensional Photonic Tensor Cores","speaker":"Odysseas Asimopoulos","affiliation":"","authors":"Odysseas  Asimopoulos, Stefanos  Kovaios, Apostolos  Tsakyridis, Miltiadis  Moralis-Pegios, Loukia  Avramelou, Nikolaos  Passalis, Anastasios  Tefas, Konstantinos  Vyrsokinos, Nikolaos  Pleros","start":"09:30","end":"","abstractid":212402,"order":2,"abstract":"Abstract (summary)  We demonstrate in-situ optical backpropagation and train a hyperdimensional AWGR-based photonic tensor core, performing both forward and backward MVM operations at 20 GHz and presenting inference accuracies of 93.5% and 81.6% for the Wine and Moons datasets, respectively.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1196.pdf"},{"role":"speaker","rolename":"Contributed","code":"#141 / We1-B3","title":"Photonic 5D Convolutional Tensor Core Using Time-Wavelength-Space Multiplexing","speaker":"Wenjia Zhang","affiliation":"Shanghai Jiao Tong University","authors":"Wenjia  Zhang, Jiayuan  Guo, Zuyuan  He","start":"09:45","end":"","abstractid":210710,"order":3,"abstract":"Abstract (summary)   We present the first five-dimensional photonic convolutional tensor core integrating a 2×2×2×4 MRR weighting bank for high-accuracy edge extraction and classification. It achieves a computational density of 179.65 TOPS/mm2, which is 5 times higher than existing photonic programmable accelerators.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-141.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1369 / We1-B4","title":"High-Fidelity Generative Image Reconstruction using a Digital Optical Multiplier","speaker":"Pierre Nay","affiliation":"","authors":"Pierre  Nay, Chengpeng  Xia, Xiansong  Meng, Kwangwoong  Kim, Po  Dong, Ingemar J.  Cox, Christina  Lioma, Hao  Hu, Deming  Kong","start":"10:00","end":"","abstractid":212591,"order":4,"abstract":"Abstract (summary)  We demonstrate generative image reconstruction via digital optical transposed convolution operating at 5 Gbit/s. The system reconstructs 28×28 images from feature maps with a MSE of 3.42×10−5 against ground truth. Comparison with an analog simulation shows greater robustness against noise accumulation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1369.pdf"},{"role":"speaker","rolename":"Contributed","code":"#152 / We1-B5","title":"Noise analysis in optical computing systems based on analog bits","speaker":"Raúl López March","affiliation":"Universitat Politècnica de València","authors":"Raúl  López, Andres  Macho, José  Capmany","start":"10:15","end":"","abstractid":210729,"order":5,"abstract":"Abstract (summary)  We analyse noise in optical computing systems based on analog bits (anbits) by mapping photocurrent perturbations at the receiver onto the Generalized Bloch Sphere. Our results enable the design of noise-tolerant, high-density anbit constellations in scalable photonic processors for artificial intelligence and machine learning applications.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-152.pdf"}]},{"sessionid":"5538455","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"09:00-10:30","room":"E1 Exhibition room 1","type":"Invited and contributed","typeColor":"#e2efda","category":"SC 02: Discrete photonic devices and technologies","title":"We1-C Advanced integrated modulators and transmitters","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Aleksandra Kaszubowska-Anandarajah","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#227 / We1-C1","title":"Over 110 GHz Bandwidth Differential Drive EML with Flip Chip Bonding Technique for 400G/lane Applications","speaker":"Kyohei Maekawa","affiliation":"Sumitomo Electric Device Innovations, Inc.","authors":"Kyohei  Maekawa, Hideki  Oe, Fumihiro  Nakajima, Taketo  Kawano, Kosuke  Saito, Masahiro  Honda, Hiroshi  Hara, Daisei  Shoji","start":"09:00","end":"","abstractid":210953,"order":1,"abstract":"Abstract (summary)   A wideband differential drive EML using face-up mounting and flip chip bonding is reported. 3 dB bandwidth exceeds 110 GHz, with simulation indicating 123 GHz. It achieved 3.63 dB extinction ratio and 2.43 dB TDECQ at 180 Gbd PAM4 with 1.5 Vpp differential drive.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-227.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Wilfried  Maineult","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#421 / We1-C2","title":"Low-polarization-dependent Membrane InP-based Electro-absorption Modulator on Si Photonics Platform","speaker":"Tatsurou Hiraki","affiliation":"NTT, Inc.","authors":"Tatsurou  Hiraki, Takuma  Aihara, Yoshiho  Maeda, Takuro  Fujii, Hiroki  Sugiyama, Tomonari  Sato, Shinji  Matsuo","start":"09:15","end":"","abstractid":211323,"order":2,"abstract":"Abstract (summary)  We demonstrate a low-polarization-dependent membrane InP electro-absorption modulator on Si photonic circuits. The device exhibits a polarization-dependent insertion loss below 1 dB. PAM4 operation at 256 and 300 Gbps is demonstrated for TE, TM, and mixed polarization, with extinction ratios of 3.0-3.4 and 3.2-3.7 dB.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-421.pdf"},{"role":"speaker","rolename":"Invited","code":"#171 / We1-C3","title":"Reconfigurable Integrated Photonics for Massively Scaling AI Systems","speaker":"Keren Bergman","affiliation":"Columbia University","authors":"Keren  Bergman","start":"09:30","end":"10:00","abstractid":210792,"order":3,"abstract":"Abstract (summary)  High-performance systems are limited by the energy and bandwidth of data movement, with off-chip links lagging on-chip communication by orders of magnitude. Integrated silicon photonics ena-bles ultra-broadband, low-power DWDM links, supporting petabit/s chip escape and reconfigurable ar-chitectures that unify connectivity and accelerate distributed AI/ML workloads.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Paper_Bergman.pdf"},{"role":"speaker","rolename":"Contributed","code":"#269 / We1-C4","title":"Demonstration of 310 Gb/s PAM4 Operation for a Dual-modulator Differential Electro-Absorption Integrated Laser Diode on an AC-terminated Sub-mount","speaker":"Asami Uchiyama","affiliation":"Mitsubishi Electric Corporation","authors":"Asami  Uchiyama, Mizuki  Shirao, Kenichi  Terao, Shinya  Okuda, Shunto  Katsumi, Nobuo  Ohata, Keisuke  Matsuda","start":"10:00","end":"","abstractid":211003,"order":4,"abstract":"Abstract (summary)  We demonstrate 155 Gbaud PAM4 (310 Gb/s) operation of a dual-modulator differential EML with AC termination, achieving a clear optical eye with measured TDECQ of 2.1 dB. A small-footprint AC termination using a single capacitor experimentally showed an 80 GHz bandwidth comparable to DC-terminated designs.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-269.pdf"},{"role":"speaker","rolename":"Contributed","code":"#197 / We1-C5","title":"Demonstration of an Optical I/Q Modulator Using Surface-Normal Electroabsorption Modulators","speaker":"Haoshuo Chen","affiliation":"Nokia","authors":"Haoshuo  Chen, Tam  Huynh, Ting-Chen  Hu, Nicolas K.  Fontaine, Roland  Ryf, Stefano  Grillanda, Lauren  Dallachiesa, Kwangwoong  Kim, Yang  Liu, Pat  Iannone, Jesse E.  Simsarian, Rene  Essiambre, Mikael  Mazur, Xiaonan  Xu, Mark  Earnshaw, David T.  Neilson, Aihu  Zheng, Liangliang  Wang","start":"10:15","end":"","abstractid":210867,"order":5,"abstract":"Abstract (summary)  We experimentally demonstrate a broadband optical I/Q modulator based on compact surface-normal electroabsorption modulators (SNEAMs).   The device exhibits a wide operating wavelength range, reduced footprint, and temperature insensitivity, making it well suited for high-density integration and a promising candidate for co-packaged optics applications.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-197.pdf"}]},{"sessionid":"5538459","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"09:00-10:30","room":"C1.1 Conference room 1.1","type":"Invited and contributed","typeColor":"#d9ead3","category":"SC 08: Sensing and microwave photonics","title":"We1-D THz transmission and sensing","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Sebastian Randel","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#73 / We1-D1","title":"Field Trial of 300-GHz THz Signal Transmission over Deployed PBG-HCF Using an Amplifier-Free, Full-Optically Powered RAU for Ultra-Compact, Low-Latency Seamless Links","speaker":"Pham Dat","affiliation":"NICT","authors":"Pham  Tien Dat, Yuki  yoshida, Keizo  Inagaki, Norihiko  Sekine, Katsumi  Fujii, Atsushi  kanno, Tetsuya  Kawanishi, Kouichi  Akahane, Naokatsu  Yamamoto, Takeshi  Takagi, Kazunori  Mukasa, Motoharu  Matsuura, Satoru  Okamoto, Hiroyuki  Tsuda, Naoaki  Yamanaka","start":"09:00","end":"","abstractid":210369,"order":1,"abstract":"Abstract (summary)   We report the first field trial of THz signal transmission over a deployed PBG-HCF link using an amplifier-free, locally power-free RAU. A 50-Gb/s signal was successfully transmitted over 1 km of deployed PBG-HCF and a 120-m, 300-GHz wireless link with full optical powering.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-73.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Oskars Ozolinš","affiliation":"Riga Technical University","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1017 / We1-D2","title":"On-chip Antenna-Integrated Photonic THz Transmitter for Multi-Band 280-Gbit/s Superchannel Wireless Transmission","speaker":"Yinjun Liu","affiliation":"Fudan University","authors":"Yinjun  Liu, Mingwei  Sun, Zhifeng  Yue, Mengjing  Xu, Qingyu  Han, Yaxuan  Li, Boyu  Dong, Changzheng  Sun, Zhibiao  Hao, Jian  Wang, Lai  Wang, Yanjun  Han, Hongtao  Li, Lin  Gan, Nan  Chi, Bing  Xiong, Junwen  Zhang, Yi  Luo","start":"09:15","end":"","abstractid":212215,"order":2,"abstract":"Abstract (summary)  We demonstrate a compact antenna-integrated MUTC-PD THz transmitter enabling multi-band wireless transmission across the W- and D-bands. Simultaneous 36/34-Gbaud 16-QAM superchannel signals achieve a total line rate of 280 Gbit/s after 10-km SSMF delivery and 1-m wireless transmission, validating high-capacity broadband photonic THz operation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1017.pdf"},{"role":"speaker","rolename":"Contributed","code":"#565 / We1-D4","title":"Dual chirps for photonic THz hyperspectral imaging with high spectral resolution and scan rate","speaker":"Xing Fang","affiliation":"Zhejiang University","authors":"Xing  Fang, Lu  Zhang, Zhidong  Lyu, Oskars  Ozolins, Xiaodan  Pang, Xianbin  Yu","start":"09:30","end":"","abstractid":211696,"order":4,"abstract":"Abstract (summary)  We propose and experimentally demonstrate a photonic terahertz imaging system based on dual chirped signals, resolving 250-270GHz spectrum within 40 μs with a resolution of 31.25 MHz and leading ultrafast pixel rates for THz hyperspectral imaging.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-565.pdf"},{"role":"speaker","rolename":"Contributed","code":"#385 / We1-D5","title":"Integrated Antenna-Coupled Photonic Terahertz Spectrum Analyzer with Hz-Level Accuracy on Thin-Film Lithium Niobate","speaker":"Aleksei Gaier","affiliation":"EPFL","authors":"Aleksei  Gaier, Gabriel  Jülg, Jiawen  Liu, Ileana-Cristina  Benea-Chelmus","start":"09:45","end":"","abstractid":211232,"order":5,"abstract":"Abstract (summary)  We demonstrate an antenna-coupled thin-film lithium niobate photonic spectrum analyzer for wide-span 80–400 GHz spectral analysis with sub-MHz resolution. Optical frequency referencing, together with comb-referenced sampling, enables Hz-accurate frequency readout, establishing an integrated platform for precise characterization of wireless terahertz and millimeter-wave signals.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-385.pdf"}]},{"sessionid":"5538463","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"09:00-10:00","room":"C1.4 Conference room 1.4","type":"Contributed session","typeColor":"#d9eaf7","category":"SC 01: Novel fibres, fibre devices and amplifiers","title":"We1-E Multicore and multimode fibres, devices and characterisation","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Kazuhide Nakajima","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#170 / We1-E1","title":"Statistical Characterization of Spatial and Polarization Mode Coupling in Field-Deployed Coupled-core Multi-core Fibers","speaker":"Manish Raj","affiliation":"Chalmers University of Technology","authors":"Manish  Raj, Lucas Alves  Zischler, Giammarco  Di Sciullo, Tetsuya  Hayashi, Antonio  Mecozzi, Cristian  Antonelli, Magnus  Karlsson","start":"09:00","end":"","abstractid":210791,"order":1,"abstract":"Abstract (summary)  We experimentally investigate spatial and polarization mode coupling dynamics in field-deployed coupled-core multi-core fibers in both time and frequency domains. We observe that the fiber exhibits similar isotropic probability density functions in both domains, with spatial modes decorrelating faster in time than polarization modes.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-170.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Alexander Heidt","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#743 / We1-E2","title":"Detecting Longitudinal Variations of Spatial Mode Dispersion in Coupled-Core Multicore Fibers via Four-Wave Mixing","speaker":"Chiara  Lasagni","affiliation":"","authors":"Chiara  Lasagni, Paolo  Serena, Lucas  Zischler, Giammarco  Di Sciullo, Antonio  Mecozzi, Cristian  Antonelli, Alberto  Bononi","start":"09:15","end":"","abstractid":211916,"order":2,"abstract":"Abstract (summary)  We propose a method for spatially-resolved estimation of the spatial mode dispersion (SMD) coefficient in coupled-core multicore fibers, exploiting the dependence of four-wave mixing on the local SMD. Results from simulations and measurements confirm the ability of the method to detect anomalous longitudinal SMD variations.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-743.pdf"},{"role":"speaker","rolename":"Contributed","code":"#285 / We1-E3","title":"Experimental Observation of Modal-Dispersion-Induced FWM Efficiency Increase and Non-linearity Coefficient Characterization in Deployed Coupled-Core Multi-Core Fibers","speaker":"Lucas Alves Zischler","affiliation":"University of L'Aquila","authors":"Lucas  Alves Zischler, Chiara  Lasagni, Manish  Raj, Giammarco  Di Sciullo, Magnus  Karlsson, Paolo  Serena, Alberto  Bononi, Tetsuya  Hayashi, Antonio  Mecozzi, Cristian  Antonelli","start":"09:30","end":"","abstractid":211036,"order":3,"abstract":"Abstract (summary)  We experimentally observe enhanced four-wave mixing efficiency induced by spatial-mode dispersion at large channel spacing in a field-deployed coupled-core 4-core fiber, consistent with the theory. We characterize the MCF effective non-linearity coefficient, demonstrating a 4.26-fold reduction against a co-deployed single-mode fiber.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-285.pdf"},{"role":"speaker","rolename":"Contributed","code":"#819 / We1-E4","title":"Long-Range Birefringence Characterization in a Field-Deployed Uncoupled-Core Fiber","speaker":"Loreto Valentina Romero Ponce","affiliation":"Department of Information Engineering, University of Padova","authors":"Loreto Valentina  Romero Ponce, Martina  Cappelletti, Cristian  Antonelli, Antonio  Mecozzi, Giammarco  Di Sciullo, Tetsuya  Hayashi, Andrea  Galtarossa, Luca  Schenato, Luca  Palmieri","start":"09:45","end":"","abstractid":212002,"order":4,"abstract":"Abstract (summary)  Distributed birefringence measurements are presented for a field-deployed 4-core uncoupled-core fiber. Using polarization-sensitive OFDR with section-wise compensation, we achieve kilometer-scale birefringence characterization and observe strong inter-core correlation of the local birefringence vector over the full reconstructed distance. Bidirectional probing at the midsection corroborates measurement reliability.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-819.pdf"}]},{"sessionid":"5538468","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"09:00-10:30","room":"C2.1 Conference room 2.1","type":"Symposia","typeColor":"","category":"","title":"We1-F ITU-T ION-2030: Architectures and standards of optical networks for the AI era","description":"AI workloads, IMT-2030 (6G) transport and hyperscale data-centre optics are converging, forcing networks toward 800G/1.6T interfaces, microsecond-level synchronization, deterministic latency, and stringent energy budgets.\tOrganisers: Raul Muñoz (CTTC), Xiang Liu (Huawei), Glenn Parsons (Ericsson)\tThe symposium will consist of two 90 minute sessions. Each session features six 10 minute presentations and includes a 30 minute panel discussion.\tSession I (Mobile and Broadband Optical Access in the AI era)\tOpening of the ITU-T ION-2030 symposium, Raul Muñoz (CTTC) and Xiang Liu (Huawei)\tIntroduction of the ITU-T ION-2030 framework, Glenn Parsons (Chair of ITU-T SG15, Ericsson)\tOptics for radio access towards 6G: challenges and opportunities, Fabio Cavaliere,  Ericsson, Italy\tStatus and evolution of optical access broadband, Philippe Chanclou, Orange, France\tFiber sensing and mobile fronthaul in metro/access optical networks, Antionio Napoli, Nokia, Germany.\tAI-oriented broadband and home networks in the era of ION-2030, Liang Zhang, Huawei Technologies, China.\tDistributed fiber optic sensing (DFOS) industry standards and practical use cases, Jun Shan Wey, Verizon, USA.\tBroadband Access networks in an IA world, Marcos Martinez, Maxlinear, Spain.\tPanel discussion (All)","goal":"","papers":[{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Raul Muñoz","affiliation":"CTTC","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Xiang  Liu","affiliation":"Huawei Technologies","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Glenn Parsons","affiliation":"Ericsson","authors":"","start":"","end":"","abstractid":null,"order":3}]},{"sessionid":"5538471","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"09:00-10:30","room":"C2.2 Conference room 2.2","type":"Invited and contributed","typeColor":"#e4dfec","category":"SC 04: Signal processing for optical communication and sensing","title":"We1-G DSP-based optical network monitoring","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Fatih Yaman","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#156 / We1-G1","title":"Tens-Meter-Level Least Squares Longitudinal Power Monitoring:A Truncated Singular Value Decomposition Method","speaker":"Yichao Wang","affiliation":"Beijing University of  Posts and Telecommunications","authors":"Yichao  Wang, Peiyun  Ge, Tianrun  Sun, Yu  Zhang, Jiarun  Zhao, Lixia  Xi, Hengying  Xu, Chenglin  Bai, Xiaoguang  Zhang","start":"09:00","end":"","abstractid":210747,"order":1,"abstract":"Abstract (summary)  A tens-meter-level single-channel least-squares longitudinal power monitoring scheme is proposed. By incorporating the truncated singular value decomposition method assisted by a window function, the proposed scheme achieves estimation step sizes at 50 m and 75 m in the 80-GBaud simulated and experimental systems, respectively.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC2026_paperID_156_revising.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Elie Awwad","affiliation":"Télécom Paris","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#293 / We1-G2","title":"Practical Implementation of Power Profile estimation with Reduced complexity and Pre-FEC data","speaker":"Yingjie  Jiang","affiliation":"State Key Laboratory of Information Photonics and Optical Communications, School of Information and Communication Engineering, Beijing University of Posts and Telecommunications","authors":"Yingjie  Jiang, Du  Tang, Fan  Zhang, Hengying  Xu, Chenglin  Bai, Aiying  Yang, Yaojun  Qiao","start":"09:15","end":"","abstractid":211049,"order":2,"abstract":"Abstract (summary)  We demonstrate practical power profile estimation with preserved fidelity using symbol-rate data and fewer step size numbers to reduce complexity, and pre-FEC data to remove the need for ideal transmitted data, validated in an 80-GBaud DP-16QAM 5-span experiment.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-293.pdf"},{"role":"speaker","rolename":"Contributed","code":"#883 / We1-G3","title":"Highly Sensitive and Phase-Noise-Tolerant Multipath Interference Localization in IM/DD Systems by Block-based SNC","speaker":"Shen Wang","affiliation":"Key Laboratory of Optical Fibre Sensing and Communications, University of Electronic Science and Technology of China","authors":"Shen  Wang, Hong  Lin, Chenjin  Li, Junyuan  Nie, Jiahao  Zhou, Shaohua  Hu, Jing  Zhang, Kun  Qiu","start":"09:30","end":"","abstractid":212075,"order":3,"abstract":"Abstract (summary)  We propose and experimentally demonstrate a phase-noise-tolerant block-based SNC (BSNC) method for MPI localization. This method detects MPI even at a 40-dB SIR, achieving a 14-dB sensitivity improvement. The estimation exhibits a positive correlation with MPI intensity to enable reliable in-service early fault warning.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-883.pdf"},{"role":"speaker","rolename":"Contributed","code":"#405 / We1-G4","title":"Localization of Heterogeneous Fiber Type Using Inverse Scattering Transform","speaker":"Ryosuke Takagi","affiliation":"The University of Osaka","authors":"Ryoske  Takagi, Takumi  Motomura, Shoichiro  Oda, Yuki  Yoshida, Hideaki  Furukawa, Akihiro  Maruta, Ken  Mishina","start":"09:45","end":"","abstractid":211285,"order":4,"abstract":"Abstract (summary)  We demonstrate the first inverse scattering transform-based method for localizing heterogeneous fiber spans in optical links. Experimental and simulation results show accurate NZ-DSF span identification with dispersion parameter estimation error below 1 ps/nm/km.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-405.pdf"},{"role":"speaker","rolename":"Invited","code":"#67 / We1-G5","title":"Digital Signal Processing for Longitudinal Power Monitoring and Nonlinear Interference Estimation","speaker":"Dario Pilori","affiliation":"Politecnico di Torino","authors":"Dario  Pilori","start":"10:00","end":"","abstractid":210106,"order":5,"abstract":"Abstract (summary)  Longitudinal Power Monitoring (LPM) enables DSP-based receiver-side reconstruction of the optical power evolution. This paper reviews recent LPM techniques and implementations, and demonstrates its use for nonlinear interference estimation and span-wise power optimization, enabling accurate, model-light, and scalable performance monitoring in real-world optical networks.","pdf":"/static/upload/ow193/events/ev667/abssub/2026_ECOC_Invited_LPM_5.pdf"}]},{"sessionid":"5538475","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"09:00-10:30","room":"E2 Exhibition room 2","type":"Contributed session","typeColor":"#dce6f1","category":"SC 07: Optical networks for access, mobile X-haul, in-building, and intra-datacentre interconnects","title":"We1-H Digital signal processing & equalization for PON","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Oded Raz","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#544 / We1-H1","title":"Equalization and FEC Evaluation Beyond D/E2 Class 50G-PON","speaker":"Luiz Anet Neto","affiliation":"IMT Atlantique","authors":"Luiz  Anet Neto, Dylan  Chevalier, Gaël  Simon, Lucas  Inglés, Jérémy  Potet, Fabienne  Saliou, Philippe  Chanclou","start":"09:00","end":"","abstractid":211662,"order":1,"abstract":"Abstract (summary)  We experimentally assess different equalization schemes allowing optical power budgets beyond 41 dB post-LDPC(17280,14592) decoding in 50G-PON. We also investigate decoder performances in terms of the number of needed iterations on average and assess the accuracy of pre-FEC threshold estimations when compared to post-FEC measurements.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-544.pdf"},{"role":"speaker","rolename":"Contributed","code":"#101 / We1-H2","title":"Dual Line Coherent Detection","speaker":"Nelson Castro","affiliation":"Aston Institute of Photonic Technologies, Aston University","authors":"Nelson  Castro, Yiming  Li, Mohammed  Patel, Frank  Smyth, Sergei  Turitsyn, Andrew  Ellis","start":"09:15","end":"","abstractid":210563,"order":2,"abstract":"Abstract (summary)  We experimentally demonstrate dual-line coherent detection using an optical frequency comb local oscillator, enabling large frequency offset tolerance with minimal additional signal processing. The proposed method achieves 200 GHz offset tolerance for 400 Gbit/s signals with low penalty, supporting uncooled, low-cost coherent transceivers.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-101.pdf"},{"role":"speaker","rolename":"Contributed","code":"#169 / We1-H3","title":"An Exploratory Study of RS Decoding and Equalization in 50G-PON","speaker":"Luiz Anet Neto","affiliation":"IMT Atlantique","authors":"Dylan  Chevalier, Luiz  Anet Neto, Gaël  Simon, Jeremy  Potet, Fabienne  Saliou, Pascal  Scalart, Lucas  Inglès, Philippe  Chanclou","start":"09:30","end":"","abstractid":210790,"order":3,"abstract":"Abstract (summary)  We investigate whether XGS -PON RS(248,216) FEC combined with stronger equalization can support 50G-PON optical power budgets with reduced ONU complexity. Experimental results show that MLSE+RS achieves performance equivalent to aFFE+HI-LDPC, while DFE+RS operates within 0.6 dB over 25 km without iterative decoding.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-169.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Yaxi YAN","affiliation":"The HK Polytechnic University","authors":"","start":"","end":"","abstractid":null,"order":3},{"role":"speaker","rolename":"Contributed","code":"#133 / We1-H4","title":"DSP-Based Mitigation of Extreme DC Leakage for 100G/200G Coherent PON","speaker":"Haipeng Zhang","affiliation":"CableLabs","authors":"Haipeng  Zhang, Zhensheng  Jia","start":"09:45","end":"","abstractid":210695,"order":4,"abstract":"Abstract (summary)  We analyze DC leakage in coherent TDM-PON burst transmitters and demonstrate three mitigations: a frequency-domain adaptive notch, an IF-based transmitter with digital band-pass filter, and an IF plus Rx EO-edge prefilter. Experiments at 30-GBd DP-QPSK/16QAM show leakage tolerance improved from −47.1 dBm to −5.1 dBm.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-133.pdf"},{"role":"speaker","rolename":"Contributed","code":"#345 / We1-H5","title":"Integrated Hybrid 50G DD and 200G Coherent PON with a Shared OLT based on 67-GHz TFLN MZM and Bias Optimization","speaker":"Yimin Hu","affiliation":"Shanghai Jiao Tong University","authors":"Yimin  Hu, Yixiao  Zhu, Ziheng  Zhang, Luyao  Huang, Dezhi  Zhang, Ming  Jiang, Weisheng  Hu","start":"10:00","end":"","abstractid":211145,"order":5,"abstract":"Abstract (summary)  We propose and experimentally demonstrate a hybrid DD-Coherent PON, leveraging single ultra-wideband TFLN MZM-based OLT and frequency-division multiplexing. The trade-off between bias voltage and signal power ratio are optimized. The architecture simultaneously supports 50-Gb/s OOK and 200-Gb/s 16-QAM signals at DD and coherent ONUs, respectively.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-345.pdf"},{"role":"speaker","rolename":"Contributed","code":"#315 / We1-H6","title":"Demonstration of 50-Gbps SSB DCPC Transmission for Over-40-km-Reach and 1:512-Split PON Using Remotely Pumped BiDi-EDFA and Distributed Raman Amplification","speaker":"Ryo Koma","affiliation":"NTT, Inc.","authors":"Ryo  Koma, Kazutaka  Hara, Jin  Uchiyama, Jun-Ichi  Kani, Tatsuya  Shimada","start":"10:15","end":"","abstractid":211108,"order":6,"abstract":"Abstract (summary)  We propose a long‑reach, high‑splitting‑ratio PON using bidirectional remotely pumped EDFA and Raman amplification. Upstream and downstream 50‑Gb/s transmission experiments in L- and C-bands confirm feasibility of over 40–60 km reach and split ratios of up to 1:512.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-315.pdf"}]},{"sessionid":"5538479","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"09:00-10:30","room":"PV-R Multipurpose room","type":"Invited and contributed","typeColor":"#ead1dc","category":"SC 11: Quantum communications, physical layer security, and optical quantum technologies","title":"We1-I Quantum networks","description":"","goal":"","papers":[{"role":"speaker","rolename":"Contributed","code":"#1149 / We1-I1","title":"Long-Distance Entanglement Distribution Between Integrated Silicon Photonic Chips","speaker":"Damien Roux","affiliation":"Technical University of Denmark (DTU)","authors":"Damien  Roux, Giulia  Guarda, Mujtaba  Zahidy, Yunhong  Ding, Siyan  Zhou, Domenico  Ribezzo, Battulga  Munkhbat, Francesco  Da Ros, Davide  Bacco, Caterina  Vigliar","start":"09:00","end":"","abstractid":212354,"order":1,"abstract":"Abstract (summary)  Phase decoherence prevents long-distance path-encoded entanglement distribution. We report chip-to-chip entanglement-based QKD between silicon photonic chips over an 80-km multicore fiber link. Stabilized via a phase-locked loop, we achieve an 85.7% Bell state fidelity and 2.03 bits/s secure key rate.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1149.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Laurent Schmalen","affiliation":"Karlsruhe Institute of Tedchnology (KIT)","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1353 / We1-I2","title":"Quantum Teleportation of Weak Coherent Polarization States on a Metropolitan Fiber Network in Coexistence With Classical Traffic","speaker":"Zofia Anna Borowska","affiliation":"Deutsche Telekom AG","authors":"Zofia Anna  Borowska, Shane  Andrewski, Giorgio  De Pascalis, Mael  Flament, Marc  Geitz, Oliver  Holschke, Mehdi  Namazi, Matheus  Sena, Olivia  Brasher","start":"09:15","end":"","abstractid":212575,"order":2,"abstract":"Abstract (summary)  We demonstrate polarization-encoded quantum teleportation on Deutsche Telekom’s metropolitan fiber testbed using commercial devices over a 30 km deployed-fiber loop. An average fidelity of 91.4±3.1% is achieved over 30 km, and 91.3±2.6% while co-propagating live classical traffic, confirming compatibility with existing telecom infrastructure.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1353.pdf"},{"role":"speaker","rolename":"Contributed","code":"#797 / We1-I3","title":"Field Trial of a Four-User Entanglement Distribution Network for QKD over Deployed Metropolitan Fiber Using a Commercial Photon Source","speaker":"Sarah Sommermeier","affiliation":"Fraunhofer Heinrich-Hertz-Institute, HHI","authors":"Sarah  Sommermeier, Tomi  Getselev, Nino  Walenta, Nicolas  Perlot, Ronald  Freund","start":"09:30","end":"","abstractid":211980,"order":3,"abstract":"Abstract (summary)  We demonstrate simultaneous BBM92 quantum key distribution between user pairs in a four -user network over 13.8 km deployed fiber. Using a single commercial entanglement source, wavelength-division multiplexing and White Rabbit synchronization, we achieve 2–2.5 % QBER and 40–54 bit/s secret-key rates.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-797.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1315 / We1-I4","title":"Single-Copy Entanglement Distillation via Hyperentanglement for Raman-Resilient Quantum Networks","speaker":"Domenico Ribezzo","affiliation":"Dipartimento di Fisica e Astronomia, Università degli Studi di Firenze","authors":"Domenico  Ribezzo, Giulia  Guarda, Alessandro  Zavatta, Davide  Bacco","start":"09:45","end":"","abstractid":212537,"order":4,"abstract":"Abstract (summary)  We demonstrate a practical single-copy distillation protocol for hyperentangled states to enhance QKD resilience against Raman noise in shared fibers. By exploiting frequency-domain correlations, we achieve a 4~dB increase in maximum classical launch power tolerance during co-existence with genuine, co-propagating telecom traffic.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1315.pdf"},{"role":"speaker","rolename":"Invited","code":"#1432 / We1-I5","title":"A Quantum Internet Based on Solid-State Quantum Nodes","speaker":"Samuele Grandi","affiliation":"Arq Quantum Technologies","authors":"Samuele  Grandi, Emanuele  Distante","start":"10:00","end":"","abstractid":214884,"order":5,"abstract":"Abstract (summary)  We present ARQ's approach to a deployable quantum internet: rack-compatible quantum repeaters based on solid-state rare-earth memories interfaced with telecom-band entanglement sources. We discuss how native multidimensional multiplexing in this architecture enables high-rate memory-memory entanglement distribution.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Arq.pdf"}]},{"sessionid":"5538487","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"10:30-11:00","room":"","type":"Coffee break","typeColor":"black","category":"","title":"Coffee break","description":"","goal":"","papers":[]},{"sessionid":"5538448","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"11:00-12:30","room":"A1 Auditorium 1","type":"Tutorial and contributed session","typeColor":"#fce5cd","category":"SC 06: Architecture, modelling and performance of optical networks","title":"We2-A Advancements on optical fiber transmission","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Takehiro Tsuritani","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Tutorial","code":"#390 / We2-A1","title":"Optical fibre communications and network innovations: the past 60 years and what the future holds","speaker":"Russell  Davey","affiliation":"BT","authors":"Russell  Davey","start":"11:00","end":"12:00","abstractid":211249,"order":1,"abstract":"Abstract (summary)  This tutorial reviews the history and vital role of optical fibre communications from a BT perspective and speculates what the future may hold.","pdf":"/static/upload/ow193/events/ev667/abssub/Davey ECOC26 tutorial 7apr26.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Carmen Mas Machuca","affiliation":"University of the Bundeswehr Munich","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#679 / We2-A2","title":"Mixed-Signal Transmission for Long-Haul High-Capacity Optical Paths and Low Latency Optical Paths Using DSF Transmission Line and Inter-Band Wavelength Conversion Technology","speaker":"Toshiya Matsuda","affiliation":"NTT Inc.","authors":"Toshiya  Matsuda, Kenji  Cruzado, Takafumi  Fukatani, Takeshi  Seki, Shimpei  Shimizu, Masashi  Abe, Takushi  Kazama, Koji  Enbutsu, Takayuki  Kobayashi, Takeshi  Umeki, Yutaka  Miyamoto, Rie  Hayashi","start":"12:00","end":"","abstractid":211845,"order":2,"abstract":"Abstract (summary)   We propose mixed-signal transmission that utilises the DSF to directly transmit low-latency optical paths without dispersion compensation, while converting conventional C-band long-haul high-capacity paths to the L-band using inter-band wavelength conversion technology to avoid nonlinear effects. We also experimentally evaluate the effectiveness of our proposal.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-679.pdf"},{"role":"speaker","rolename":"Contributed","code":"#718 / We2-A3","title":"Field Trial of Digital Subcarrier Multiplexing-based P2MP over 170 km for Distributed Data Center Network Interconnect","speaker":"Chenxiao Zhang","affiliation":"KDDI Research, Inc.","authors":"Chenxiao  Zhang, Ceng  Wang, Shinji  Nimura, Daiki  Soma, Ryo  Inohara, Takehiro  Tsuritani","start":"12:15","end":"","abstractid":211887,"order":3,"abstract":"Abstract (summary)  We demonstrate a DSCM-based P2MP optical interconnect architecture through a  ~170‑km metro field trial. Full C-band transmission, long-term stability, coexistence with legacy services, asymmetric link tolerance, and dynamic re-grouping capabilities are experimentally validated.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-718.pdf"}]},{"sessionid":"5538452","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"11:00-12:30","room":"A2 Auditorium 2","type":"Invited and contributed","typeColor":"#e2efda","category":"SC 02: Discrete photonic devices and technologies","title":"We2-B SiP Based Modulators","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Eric Bernier","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#0 /","title":"We2-B1 Pushing terabits: 800g and 1.6t silicon photonic transmitters at scale","speaker":"Erman Timurdogan","affiliation":"Lumentum","authors":"","start":"11:00","end":"11:30","abstractid":null,"order":1},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Yuriko Maegami","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#80 / We2-B2","title":"Silicon Microring Modulators with 5.2 THz FSR and 69 GHz EO Bandwidth for 3.2-Tbps DWDM Integrated Photonic Transmitters","speaker":"Yeyu Tong","affiliation":"Hong Kong University of Science and Technology (Guangzhou)","authors":"Kaihang  Lu, Yuxiang  Yin, Wu  Zhou, Hao  Chen, Baohua  Wen, Chi-Hang  Chan, Yeyu  Tong","start":"11:30","end":"","abstractid":210420,"order":2,"abstract":"Abstract (summary)  We present a high-performance O-band silicon microring modulator with a 2.5 um radius, achieving a 5.2 THz free spectral range, 69 GHz electro-optic bandwidth, and 0.4 nm/mW heater efficiency. This design facilitates a 3.2-Tbps integrated photonic transmitter using 16×224 Gbps DWDM PAM-4.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-80.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1289 / We2-B3","title":"Beyond 110 GHz Silicon-Organic Hybrid Modulator","speaker":"Wim Bogaerts","affiliation":"","authors":"Conglin  Sun, Gokhan  Kara, Michele  Merla, Michiel  Debaets, Minkyu  Kim, Chiara  Marchese, Adam  Barzanji, Peter  Verheyen, Pol  Van Dorpe, Francky  Catthoor, Wim  Bogaerts, Joris  Van Campenhout, Christian  Haffner","start":"11:45","end":"","abstractid":212506,"order":3,"abstract":"Abstract (summary)  First-time demonstration of 3dB bandwidth larger than 110GHz for a vertical silicon organic hybrid electro-optical (EO) modulator without back gating. For the same Pockels coefficient, the new configuration shows a two times reduced VπL compared to classical SOH devices","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1289.pdf"},{"role":"speaker","rolename":"Contributed","code":"#163 / We2-B4","title":"Post-Fabrication Laser-Trimmed Microring Modulator Operating Beyond 100 Gbaud","speaker":"Erwan Weckenmann","affiliation":"Universite Laval","authors":"Erwan  Weckenmann, Philippe  Lassonde, Jean-Philippe  Bérubé, Philippe  Gagnon, Simon  Duval, Fabrice  Potvin, Dylan  Chevalier, Alireza  Geravand, Simon  Levasseur, François  Légaré, Louis-Rafaël  Robichaud, Wei  Shi","start":"12:00","end":"","abstractid":210768,"order":4,"abstract":"Abstract (summary)  We demonstrate the first laser-trimmed silicon microring modulator validated under high-speed data transmission beyond 100 Gbaud. Post-fabrication trimming enables a permanent 376 GHz resonance shift without compromising modulation efficiency or electro-optic bandwidth. Bit-error-rate measurement confirms no performance penalty induced by trimming.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-163.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1163 / We2-B5","title":"200 GBaud PAM-4 Silicon Photonic Traveling-Wave Mach-Zehnder Modulator for 400G/lane IM/DD Links","speaker":"Simone Cammarata","affiliation":"imec","authors":"Simone  Cammarata, Nishant  Singh, Leandro  Da Silva, Gael  Jongbloet, Jasper  Jans, Peter  Ossieur, Cedric  Bruynsteen, Xin  Yin","start":"12:15","end":"","abstractid":212368,"order":5,"abstract":"Abstract (summary)  A silicon photonic Mach–Zehnder modulator supporting 400 Gb/s per lane with 200 GBaud PAM‑4 modulation format is demonstrated, featuring carrier-dispersion phase shifters and differential push-pull electrodes with ground shielding to suppress parasitic RF mode excitation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1163.pdf"}]},{"sessionid":"5538456","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"11:00-12:30","room":"E1 Exhibition room 1","type":"Invited and contributed","typeColor":"#dae3f3","category":"SC 10: Control and management of optical networks","title":"We2-C LLM-driven control and automation in optical networks","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Behnam Shariati","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#939 / We2-C1","title":"Token-Efficient and Output-Reliable LLM Agent for Link Fault Diagnosis via Skill-Augmented and SOP-Constrained Design","speaker":"Shengnan Li","affiliation":"Beijing University of Posts and Telecommunications","authors":"Shengnan  Li, Fubin  Wang, Zihao  Cui, Min  Zhang, Danshi  Wang","start":"11:00","end":"","abstractid":212132,"order":1,"abstract":"Abstract (summary)  We propose a skill-augmented and SOP-constrained LLM Agent for optical link fault diagnosis. By organizing diagnostic capabilities into reusable skills with progressive disclosure, the Agent reduces token usage by 86% and achieves 100% RCA accuracy on a commercial-equipment testbed, while ensuring deterministic operation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-939.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Raul Muñoz","affiliation":"CTTC","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1339 / We2-C2","title":"A T-API-Compliant ReAct Agentic Loop for Optical Networks: Generic vs. Domain-Specific Tool Abstractions","speaker":"Morteza Ahmadian","affiliation":"Chalmers University of Technology","authors":"Morteza  Ahmadian, Paolo  Monti, Carlos  Natalino","start":"11:15","end":"","abstractid":212561,"order":2,"abstract":"Abstract (summary)  Optical networks need intent-driven, closed-loop agentic management, a key enabler for higher autonomy levels. We present the first T-API-compliant reasoning and act (ReAct) loop. We show that domain-specific composite tools achieve 90% oracle-validated correctness with threefold token savings compared to generic tools.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1339.pdf"},{"role":"speaker","rolename":"Invited","code":"#1409 / We2-C3","title":"LLMs and Optical Networks: A Symbiotic Relationship","speaker":"Massimo  Tornatore","affiliation":"Politecnico di Milano","authors":"Memedhe  Ibrahimi, Qiaolun  Zhang, Giovanni  Sticca, Jiaheng  Xiong, Francesco  Musumeci, Massimo  Tornatore","start":"11:30","end":"12:00","abstractid":213023,"order":3,"abstract":"Abstract (summary)  This paper explores the emerging symbiosis between LLMs and optical networks. LLMs require geo-distributed training, which demands advanced optical transport capabilities that require new technical enablers, as WAN-aware CCL algorithms, ZR+ pluggables, and Hollow-Core Fibers. Conversely, LLMs also enable new forms of autonomous network management","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026___invited_MT.pdf"},{"role":"speaker","rolename":"Contributed","code":"#731 / We2-C4","title":"Agentic AI for IPoDWDM Network Lifecycle Automation: An MCP-Enabled Architecture","speaker":"Chunmin Xia","affiliation":"Adtran Networks SE","authors":"Chunmin  Xia, Jakub  Harbaczewski, Nikhil  Dsilva, Julie  Raulin, Dominic  Schneider, Achim  Autenrieth","start":"12:00","end":"","abstractid":211903,"order":4,"abstract":"Abstract (summary)  We present a distributed, vendor‑agnostic multi‑MCP architecture for SDN-based automation and autonomous control of multi-vendor, multi-layer IPoDWDM networks. The framework enables E2E service lifecycle automation, closed-loop cross-layer control using GNPy model and optical telemetry, and is experimentally validated on a IPoDWDM testbed.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-731.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1025 / We2-C5","title":"Hybrid Active-Online Learning Framework for Label-Efficient Concept Drift Adaptation in Optical Network Failure Detection","speaker":"Yousuf Moiz Ali","affiliation":"Aston University","authors":"Yousuf  Moiz Ali, Jaroslaw  E. Prilepsky, João  Pedro, Sasipim  Srivallapanondh, Antonio  Napoli, Sergei  K. Turitsyn, Pedro  Freire","start":"12:15","end":"","abstractid":212223,"order":5,"abstract":"Abstract (summary)  We propose a hybrid active-online learning framework for label-efficient concept drift adaptation in optical network failure detection. Using margin-based selective labeling, our method achieves near- ceiling accuracy and AUC scores while querying only 3.4% of streaming samples, with negligible latency overhead compared to static inference.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1025.pdf"}]},{"sessionid":"5538460","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"11:00-12:30","room":"C1.1 Conference room 1.1","type":"Invited and contributed","typeColor":"#d0e0e3","category":"SC 05: Optical transmission systems","title":"We2-D Ultra-wideband systems","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Chiara  Lasagni","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#443 / We2-D1","title":"423.7 + 426.5 Tb/s GMI Bi-Directional HCF Transmission","speaker":"Jiaqian Yang","affiliation":"University College London (UCL)","authors":"Jiaqian  Yang, Romulo  Aparecido, Eric  Sillekens, Ronit  Sohanpal, Mindaugas  Jarmolovicius, Zelin  Gan, Yang  Hong, Morteza  Kamalian-Kopae, Abdallah  Ali, Shahab  Bakhtiari Gorajoobi, Ruben  Luís, Daniele  Orsuti, Aleksandr  Donodin, Vitaly  Mikhailov, Jiawei  Luo, David  Digiovanni, Nicolas  Fontaine, Lauren  Dallachiesa, Mikael  Mazur, Roland  Ryf, Haoshuo  Chen, David  Neilson, Ian  Phillips, Wladek  Forysiak, Sergei  Turitsyn, Hideaki  Furukawa, Jamie  Gaudette, David  Richardson, Benjamin  Puttnam, Robert  Killey, Polina  Bayvel","start":"11:00","end":"","abstractid":211393,"order":1,"abstract":"Abstract (summary)  We demonstrate OESCL-band same-wavelength bi-directional transmission over 60 km HCF with 42.5 THz bandwidth, achieving GMIs comparable with the highest unidirectional SMF data-rates in both directions, with an aggregate of 423.7 + 426.5 Tb/s.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-443.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Mingming Tan","affiliation":"Aston University","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#968 / We2-D2","title":"75.6-Tbps (700 Gbps x 108 ch.) L+U-band Transmission over Multi-span Field-deployed DSF Link Enabled by PPLN-based OPA/EDFA Hybrid Repeater","speaker":"Megumi Hoshi","affiliation":"Network Innovation Laboratories, NTT, Inc.","authors":"Megumi  Hoshi, Shimpei  Shimizu, Masashi  Abe, Takushi  Kazama, Koji  Enbutsu, Takahiro  Kashiwazaki, Asuka  Inoue, Shunya  Konno, Kana  Sumihara, Kosuke  Kimura, Masanori  Nakamura, Fukutaro  Hamaoka, Takeshi  Umeki, Takayuki  Kobayashi, Yutaka  Miyamoto","start":"11:15","end":"","abstractid":212163,"order":2,"abstract":"Abstract (summary)  We demonstrated 75.6-Tbps L+U-band WDM transmission over 2×70.4-km field-deployed DSF using a hybrid repeater of EDFAs and waveband converting optical parametric amplifiers with PPLN waveguides. The gain stability of our hybrid repeater and signal quality in the L- and U-band was validated over an hour.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-968.pdf"},{"role":"speaker","rolename":"Contributed","code":"#497 / We2-D3","title":"S+C+L-band WDM Transmission Under Realistic Telco Transport Network Conditions","speaker":"Erwan Louis Pincemin","affiliation":"Orange SA","authors":"Erwan  Pincemin, Bertrand  Le Guyader, Naveena  Genay, Jenny  L'Escop, Noella  Evanno, Jannik  Ehlert, Yannick  Lempereur, Wallace  Clements, Serguei  Papernyi, Mikael  Nassiri, Ludovic  Fulop, Michel  Morvan","start":"11:30","end":"","abstractid":211535,"order":3,"abstract":"Abstract (summary)  We report here a S+C+L-band WDM transmission over 4x100-km SSMF carrying 50-Tbps overall on 12-THz bandwidth with Raman-assisted mitigation of inter-band Raman crosstalk under realistic telco transport network conditions including the use of industrial coherent transponders.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-497.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1325 / We2-D4","title":"Time-Domain Two-Pulse Collisions Nonlinear Interference Noise Model for Ultra-Wideband Links","speaker":"Marco Santagiustina","affiliation":"","authors":"Francesco  Lorenzi, Luca  Schenato, Antonio  Mecozzi, Cristian  Antonelli, Marco  Santagiustina","start":"11:45","end":"","abstractid":212547,"order":4,"abstract":"Abstract (summary)  We extend the time-domain model of two-pulse collisions nonlinear interference noise to ultra-wideband single-mode links. We identify key length scales, derive a classification of collision regimes, and explain similarities and differences with Gaussian noise models, especially under low dispersion and low differential group delay.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1325.pdf"},{"role":"speaker","rolename":"Invited","code":"#988 / We2-D5","title":"Enabling Technologies for Long-Haul Ultra-Wideband Transmission Utilizing Extremely Long Wavelengths","speaker":"Shimpei Shimizu","affiliation":"NTT, Inc.","authors":"Shimpei  Shimizu, Kosuke  Kimura, Akira  Kawai, Masashi  Abe, Shunya  Konno, Takushi  Kazama, Koji  Enbutsu, Takahiro  Kashiwazaki, Megumi  Hoshi, Masanori  Nakamura, Fukutaro  Hamaoka, Takeshi  Umeki, Takayuki  Kobayashi, Yutaka  Miyamoto","start":"12:00","end":"","abstractid":212184,"order":5,"abstract":"Abstract (summary)  We introduce our work on extending the WDM bandwidth to longer wavelengths in the U- and X-bands and its key technologies for long-haul transmission, including the ISRS design and an ultra-wideband inline repeater using high-efficiency parametric waveband conversion with periodically poled lithium niobate (PPLN) waveguides.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC2026_invited_shimizu_v2_2.pdf"}]},{"sessionid":"5538464","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"11:00-12:30","room":"C1.4 Conference room 1.4","type":"Invited and contributed","typeColor":"#d9ead3","category":"SC 08: Sensing and microwave photonics","title":"We2-E Advanced distributed fiber sensing","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Sonia Martín López","affiliation":"Consejo Superior de Investigadores Científicas","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1037 / We2-E1","title":"Towards Six-Decade Dynamic Range for Distributed Strain Sensing Using Coherent Microwave-Frequency OTDR","speaker":"Yan Ren","affiliation":"Universidad de Alcalá","authors":"Yan  Ren, María R.  Fernández-Ruiz, Sonia  Martin-Lopez, Luis  Costa, Zhongwen  Zhan, Miguel  Gonzalez-Herraez","start":"11:00","end":"","abstractid":212236,"order":1,"abstract":"Abstract (summary)  A coherent microwave-frequency OTDR scheme is demonstrated. By simultaneously extracting radio frequency and optical frequency signals through coherent detection, it supports distributed strain sensing from sub-nanostrain to hundreds of microstrain levels, offering a promising approach for saturation-free wide-range sensing in earthquake early warning applications.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1037.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"María del Rosario Fernández-Ruíz","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#703 / We2-E2","title":"Distributed Single-Shot Birefringence Measurement with Sub-Meter Resolution Using Dual-Polarization TEΦOTDR","speaker":"Julia Mateu-Comas","affiliation":"Universidad de Alcalá","authors":"Julia  Mateu-Comas, Miguel  Soriano-Amat, Sonia  Martin-Lopez, Miguel  Gonzalez-Herraez, Luca  Palmieri, María R.  Fernández-Ruiz","start":"11:15","end":"","abstractid":211869,"order":2,"abstract":"Abstract (summary)  We demonstrate a single-shot, fully distributed technique for linear birefringence measurement of single-mode optical fibers based on dual-polarization TE-ΦOTDR. The method retrieves the local birefringence magnitude from local spectral shifts, achieving sub-meter spatial resolution. We also prove its capacity for sensing transverse loads.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-703.pdf"},{"role":"speaker","rolename":"Contributed","code":"#721 / We2-E3","title":"Distributed and dynamic strain sensing in a hollow-core anti-resonant fiber","speaker":"Pedro Jose Vidal Moreno","affiliation":"University of Alcala","authors":"Pedro J.  Vidal-Moreno, Alonso  Romero-Barrueco, Javier  Barco-Alvárez, Luis  Costa, Sonia  Martin-Lopez, Mª Rosario  Fernandez-Ruiz, Carmen  Vázquez, Radan  Slavik, Francesco  Poletti, Miguel  Gonzalez-Herraez","start":"11:30","end":"","abstractid":211892,"order":3,"abstract":"Abstract (summary)  Distributed acoustic sensing is limited by strain–temperature cross-sensitivity in standard fibers. We demonstrate distributed sensing in hollow-core fiber using mode walk-off interferometry, enabling spatial mapping and dynamic strain sensing without Rayleigh scattering. Results show localized perturbation detection over hundreds of meters.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-721.pdf"},{"role":"speaker","rolename":"Contributed","code":"#185 / We2-E4","title":"Phase Noise Suppression in Distributed Acoustic Sensing Using a Hollow-Core-Fiber-Assisted Interferometer","speaker":"Jiazhen Ji","affiliation":"Shanghai Jiao Tong University","authors":"Jiazhen  Ji, Yangyang  Wan, Jiangbing  Du, Lin  Ma, Zuyuan  He","start":"11:45","end":"","abstractid":210838,"order":4,"abstract":"Abstract (summary)  The performance of distributed acoustic sensing degrades significantly when the interrogator is subject to phase-noise induced by environmental perturbations. We propose a hollow-core-fiber delay interferometer for environmentally robust phase-noise compensation, achieving a 46% improvement in strain resolution at 50 km sensing range under environmental perturbations.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-185.pdf"},{"role":"speaker","rolename":"Invited","code":"#123 / We2-E5","title":"Distributed measurement of hollow core optical fibres","speaker":"Radan Slavik","affiliation":"University of Southampton","authors":"Radan  Slavik, Xuhao  Wei, Francesco  Poletti","start":"12:00","end":"","abstractid":210657,"order":5,"abstract":"Abstract (summary)  We review the brief history of distributed measurement techniques for characterization of anti resonant hollow-core fibres, highlighting the associated challenges and solutions, which often differ from those in single-mode optical fibre measurements.","pdf":"/static/upload/ow193/events/ev667/abssub/Slavik_ECOC_2026_OTDR_InvitedFINAL.pdf"}]},{"sessionid":"5538467","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"11:00-12:30","room":"C2.1 Conference room 2.1","type":"Symposia","typeColor":"","category":"","title":"We2-F ITU-T ION-2030: Architectures and standards of optical networks for the AI era","description":"AI workloads, IMT-2030 (6G) transport and hyperscale data-centre optics are converging, forcing networks toward 800G/1.6T interfaces, microsecond-level synchronization, deterministic latency, and stringent energy budgets.\tOrganisers: Raul Muñoz (CTTC), Xiang Liu (Huawei), Glenn Parsons (Ericsson)\tThe symposium will consist of two 90 minute sessions. Each session features six 10 minute presentations and includes a 30 minute panel discussion.\tSession II (AI Datacenters and AI-ready optical networks)\tThe current state of AI in Broadband today, and its role in the future, Martin Creaner, World Broadband Association\tOptical interconnects for scaleup architectures and the standardization efforts, Fotini Karinou, Microsoft, UK.\tFramework and Requirements for AI deployment in Telco Transport Networks, Juan Pedro Fernández Palacios, Telefónica, Spain\tAll-Optical Network 3.0: Evolution toward AI Data Center Networks and ION-2030,  Chengliang Zhang, China Telecom, China\tSustainable Optical Transport Architectures for AI: The F5G Advanced Perspective, Olivier Ferveur, Post Technologies, Luxembourg.\tSilicon photonics Optical switches for next gen AI datacenters, Daniel Pérez-López, Ipronics, Spain\tPanel discussion (All)\tClosing of the ITU-T ION-2030 symposium, Raul Muñoz (CTTC), Xiang Liu (Huawei) and Glenn Parsons (Chair of ITU-T SG15, Ericsson).","goal":"","papers":[{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Raul Muñoz","affiliation":"CTTC","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Xiang  Liu","affiliation":"Huawei Technologies","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Glenn Parsons","affiliation":"Ericsson","authors":"","start":"","end":"","abstractid":null,"order":3}]},{"sessionid":"5538472","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"11:00-12:30","room":"C2.2 Conference room 2.2","type":"Invited and contributed","typeColor":"#f4cccc","category":"SC 03: Photonic integrated circuits, assemblies and packaging","title":"We2-G Optical processing","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Wenjia Zhang","affiliation":"Shanghai Jiao Tong University","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#297 / We2-G1","title":"Microring-Based Programmable Temporal Kernels for Ultrafast Photonic Neural Networks","speaker":"Shaojie Liu","affiliation":"The Chinese University of Hong Kong","authors":"Shaojie  Liu, Tengji  Xu, Benshan  Wang, Jiayong  Peng, Qiarong  Xiao, Li  Fan, Hongwei  Chen, Chaoran  Huang","start":"11:00","end":"","abstractid":211054,"order":1,"abstract":"Abstract (summary)  We propose a temporal convolution paradigm for photonic neural networks beyond static weighting. A single microring resonator performs programmable multi-tap convolution at 128 Gbaud, achieving 5.12 TOPS computing throughput. We demonstrate a multiplexed system enabling hardware-efficient and high-dimensional computing with 48 TOPS/mm2","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-297.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Francesco Da Ros","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#84 / We2-G2","title":"Experimental Demonstration of Few-Sample Energy-Aware Hardware-in-the-Loop Training of Photonic Neural Networks","speaker":"Guangwei Cong","affiliation":"AIST, Japan","authors":"Guangwei  Cong, Hiroki  Matsutani, Ryotaro  Konoike, Daiki  Yamashita, Shoichi  Hirasawa, Michihiro  Koibuchi, Shu  Namiki, Takeru  Amano","start":"11:15","end":"","abstractid":210444,"order":2,"abstract":"Abstract (summary)  We propose and experimentally demonstrate an energy-aware augmented simultaneous perturbation stochastic approximation (SPSA) algorithm and few-sample in-situ training of photonic neural networks (PNNs), reducing power consumption by ~20–57% and improving both time and power efficiency in training by 10-30x while maintaining >95% classification accuracy.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-84.pdf"},{"role":"speaker","rolename":"Invited","code":"#71 / We2-G3","title":"Heterogeneous Photonic Integration for High-Performance Communication and Computing","speaker":"Liangjun Lu","affiliation":"Shanghai Jiao Tong University","authors":"Liangjun  Lu, Jinwei  Su, Yibo  Wang, Wei  Gao, Yuyao  Guo, Yu  Li, Jianping  Chen, Linjie  Zhou","start":"11:30","end":"12:00","abstractid":210255,"order":3,"abstract":"Abstract (summary)  In this talk, I will review our recent work on heterogeneously integrated photonic devices via micro-transfer printing for high-performance communication and computing, achieving a 110-GHz modulator and a −45-dB crosstalk optical switch by synergistically combining silicon nitride with thin-film lithium tantalate/niobate.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Paper_Template_4.pdf"},{"role":"speaker","rolename":"Contributed","code":"#816 / We2-G4","title":"Experimental Demonstration of Flexible, Multi-Wavelength All-Optical Equalization using a Receiver-Side Integrated Photonic Reservoir","speaker":"Sarah Masaad","affiliation":"Ugent - imec","authors":"Sarah  Masaad, Jakob  Declercq, Aleksandr  Donodin, Emmanuel  Gooskens, Stylianos  Sygletos, Xin  Yin, Peter  Bienstman","start":"12:00","end":"","abstractid":211999,"order":4,"abstract":"Abstract (summary)  As IM/DD links scale, equalization across multiple wavelength channels becomes increasingly demanding. Here, we demonstrate an integrated photonic reservoir for adaptable, multi-wavelength equalization using TDM-assisted training. Results on 14–28 Gbaud/λ, 20–70km and up to four wavelengths show up to four orders BER improvement over DSP","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-816.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1257 / We2-G5","title":"Compact Single Chip SiGe BiCMOS Optical Phased Array for Energy Efficient, Fast Beam Steering","speaker":"Saeed Arsanjani","affiliation":"Technical University of Berlin and Silicon Austria Labs GmbH","authors":"Saeed  Arsanjani, Ion  Vornicu, Laurentiu  Acasandrei, Muhammad S.  Khan, Muhammad H.  Malik, Jochen  Bardong, Georg  Winzer, Lars  Zimmermann, Tommaso  Cassese","start":"12:15","end":"","abstractid":212470,"order":5,"abstract":"Abstract (summary)  A compact, energy efficient SiGe BiCMOS optical phased array (OPA) implemented on an electro-photonic integrated circuit (EPIC) platform is presented. The 1×32 array achieves a 51.2°×15.7° beam steering range, a reduced per-channel electrical power consumption of 2.5mW /π, and a fast 2.6μs beam configuration time.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1257.pdf"}]},{"sessionid":"5538476","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"11:00-12:15","room":"E2 Exhibition room 2","type":"Invited and contributed","typeColor":"#d9eaf7","category":"SC 01: Novel fibres, fibre devices and amplifiers","title":"We2-H SDM transmission","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Patrice Mégret","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#1419 / We2-H1","title":"Space Division Multiplexing for Ultra-High Capacity Optical Communications","speaker":"Chigo Okonkwo","affiliation":"Eindhoven University of Technology","authors":"Chigo  Okonkwo","start":"11:00","end":"11:30","abstractid":213046,"order":1,"abstract":"Abstract (summary)  We review progress in space-division multiplexing towards recent records in standard-cladding 19-core randomly coupled multi-core fibres, including 1.7 Pb/s and 568.8 Tb/s over 5,166 km, addressing the yearly increase in capacity demands from AI and hyperscale datacenter interconnects.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC2026-InvitedTalk-Chigo _1.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Peter Ingo Borel","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#148 / We2-H2","title":"Impact of Separated/Coupled Core Amplification on MDL and SMD Characteristics in Coupled Multi-core Fibre Link","speaker":"Taiji Sakamoto","affiliation":"NTT Inc.","authors":"Taiji  Sakamoto, Masaki  Wada, Ryota  Imada, Kazuhide  Nakajima, Takashi  Matsui","start":"11:30","end":"","abstractid":210718,"order":2,"abstract":"Abstract (summary)  We quantitatively clarify that coupled-core multi-core fibre amplifiers simultaneously achieve low mode-dependent loss (MDL) and low spatial-mode dispersion (SMD) over the C-band, while separated-core amplification poses severer requirements regarding the property variations between single-mode amplifiers to lower MDL and SMD even with independent gain control.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-148.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1012 / We2-H3","title":"Characterization of Mode-Dependent Gain in Distributed-Raman-Amplified 90-km Multi-mode Fiber with Remote Digital Holography","speaker":"Divya Ann  Shaji","affiliation":"University of L'Aquila","authors":"Divya  Ann Shaji, Quinten  Moonen, Menno  Van Den Hout, Vincent  Van Vliet, Besma  Kalla, Tom  Bradley, Antonio  Mecozzi, Chigo  Okonkwo, Cristian  Antonelli","start":"11:45","end":"","abstractid":212210,"order":3,"abstract":"Abstract (summary)  Using optical injection-locking-based remote digital holography, we investigate the impact of distributed Raman amplification (DRA) on the mode-dependent gain (MDG) of a 90-km, three-mode graded-index multi-mode fiber. Observed MDG trends are further supported by the corresponding mode-differential-gain due to DRA in an emulated transmission system.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1012.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1326 / We2-H4","title":"Demonstration of Dispersion-Diversity Signal Processing Using a 19-Core Heterogeneous Multicore Fiber","speaker":"Sergi García Cortijo","affiliation":"Universitat Politècnica de València","authors":"Mario  González, Mario  Ureña, Sergi  Garcia, Thomas  Stelzer, Linda  Uta, Michael H.  Frosz, Ivana  Gasulla","start":"12:00","end":"","abstractid":212548,"order":4,"abstract":"Abstract (summary)  We demonstrate a 19-core heterogeneous multicore fiber operating as a tunable sampled true-time delay line for dispersion-diversity signal processing. Three distinct preforms, scaled to implement the 19 cores, enable quasi-linear chromatic dispersion
