sea Cables for Scalable Deep-Ocean Geophysical Monitoring","speaker":"Adonis Bogris","affiliation":"","authors":"Georgios Aias  Karydis, Nicolas  Celli, David  Craig, Örn  Jónsson, Andrés  Arnar Hlynsson, Eoin  Kenny, Charis  Mesaritakis, Christopher  Bean, Adonis  Bogris","start":"11:45","end":"","abstractid":211651,"order":4,"abstract":"Abstract (summary)  We demonstrate low-cost microwave frequency fibre interferometry for per-span monitoring of a 1,770 km operational subsea cable connecting Ireland and Iceland. Over four months, this approach successfully resolved tidal variations, storms, and teleseismic earthquakes, highlighting its potential for large-scale, cost-effective ocean monitoring","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-537.pdf"},{"role":"speaker","rolename":"Invited","code":"#40 / Th2-B5","title":"The Mediterranean as an Earth-Scale Geophysical Sensor: Polarization Sensing on Subsea Fiber Infrastructure","speaker":"Antonio Mecozzi","affiliation":"University of L'Aquila","authors":"Antonio  Mecozzi","start":"12:00","end":"","abstractid":209735,"order":5,"abstract":"Abstract (summary)  We demonstrate that commercial coherent submarine telecommunication links can operate as ultra‑low‑frequency environmental sensors by monitoring polarization telemetry from DSP receivers. Multiple Mediterranean cables detected both Rayleigh waves and Earth‑scale precursor anomalies preceding the 29 July 2025  Mw 8.8 Kamchatka earthquake at ~9000 km distances.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_18.pdf"}]},{"sessionid":"5538406","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"11:00-12:30","room":"E1 Exhibition room 1","type":"Invited and contributed","typeColor":"#c9daf8","category":"SC 09: Free-space optics and optical wireless technologies","title":"Th2-C End-to-end optical communications systems for space: demonstration and validation","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Anaëlle Maho","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#252 / Th2-C1","title":"Satellite to Ground FSO Communication Links enhanced by Mode Diversity Reception and Adaptive Optics","speaker":"Jian Wu","affiliation":"Beijing University of Posts and Telecommunications","authors":"Jian  Wu, Wenjie  Guo, Yan  Li, Ao  Li, Xiaokai  Li, Yaning  Sun, Shuai  Wei, Hongxiang  Guo, Chao  Liu, Ze  Zhang","start":"11:00","end":"11:30","abstractid":210982,"order":1,"abstract":"Abstract (summary)  We experimentally demonstrate a joint adaptive optics and mode diversity reception (AO+MDR) scheme for GEO satellite-to-ground laser communication. A 1 Gbit/s BPSK link achieves 4.0 dB power gain and improves the probability of BER < 1 × 10−3 from 54.2% to 88.8%, confirming synergistic compensation.","pdf":"/static/upload/ow193/events/ev667/abssub/Satellite to Ground FSO Communication Links enhanced by Mode Diversity Reception and Adaptive Optics.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Hidenori Takahashi","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1165 / Th2-C2","title":"Real-Hardware Demonstration of a 1.25 Gb/s Free-Space Optical Inter-Satellite Link on 6U CubeSat Engineering Models with Simultaneous Closed-Loop PAT","speaker":"Amna Riaz","affiliation":"Northumbria University","authors":"Amna  Riaz, Eamon  Scullion, Robert  Wicks, Richard  Binns, Elias  Sepúlveda, Nassima  Khorchef, James  Martin, Jethro  Vernon","start":"11:30","end":"11:45","abstractid":212370,"order":3,"abstract":"Abstract (summary)  Real-Hardware Demonstration of a 1.25 Gb/s Free-Space Optical Inter-Satellite Link on 6U CubeSat Engineering Models with Simultaneous Closed-Loop PAT","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1165.pdf"},{"role":"speaker","rolename":"Contributed","code":"#834 / Th2-C3","title":"Design and Validation of Low Penalty High-Power (>50W) Optical Amplifier for Satellite Communications using Commercial Coherent Transceiver","speaker":"Rajiv Boddeda","affiliation":"Nokia Bell Labs","authors":"Rajiv  Boddeda, Eric  Dutisseuil, Dinesh Kumar  Umasankar, Sylvain  Bordais, Marco  Casale, Vincent  Pollier, Regis  Grasser, Khmaies  Guesmi, Laurent-Daniel  Haret, Sébastien  Bigo","start":"11:45","end":"12:00","abstractid":212019,"order":4,"abstract":"Abstract (summary)  A high‑power optical amplifier for ground‑to‑satellite optical links was developed using polarization beam combination to alleviate nonlinear effects. We demonstrate net 100‑Gb/s transmission with commercial coherent transceivers and experimentally characterize the resulting penalty from the nonlinear distortions.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-834.pdf"},{"role":"speaker","rolename":"Contributed","code":"#432 / Th2-C4","title":"Wavelength-Polarization Domain Synthetic Aperture Combining of Noncoherent Multi-beams for Turbulence-Resilient Satellite-to-Ground Laser Downlinks","speaker":"Fang Dong","affiliation":"Fudan University","authors":"Fang  Dong, Haoyu  Zhang, Yinjun  Liu, Jianfeng  Sun, Junwen  Zhang, Nan  Chi","start":"12:00","end":"12:15","abstractid":211365,"order":5,"abstract":"Abstract (summary)  We propose a wavelength-polarization domain synthetic aperture combining scheme for turbulence-resilient satellite-to-ground downlinks based on VCM-FSM-enabled noncoherent multibeam transmission. This architecture supports all-weather uninterrupted communication under atmospheric turbulence and demonstrates 2.24 Tbit/s transmission over a 3000 km FSO equivalent link.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-432.pdf"}]},{"sessionid":"5538416","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"11:00-12:15","room":"C1.1 Conference room 1.1","type":"Contributed session","typeColor":"#dce6f1","category":"SC 07: Optical networks for access, mobile X-haul, in-building, and intra-datacentre interconnects","title":"Th2-D Advances in coherent PON","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Derek Nesset","affiliation":"Huawei","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1263 / Th2-D1","title":"960/480/240/120 Gbit/s Single-Carrier Super-Rated Hybrid Coherent Upstream Burst-Mode PON","speaker":"Kovendhan Vijayan","affiliation":"Nokia Bell Labs","authors":"Kovendhan  Vijayan, Robert  Borkowski, Doutje  Van Veen, Vincent  Houtsma","start":"11:00","end":"","abstractid":212477,"order":1,"abstract":"Abstract (summary)  We propose and experimentally verify a hybrid coherent architecture for an upstream TDMA PON, in which multiple ONU transmitter types can be supported by a single OLT receiver. We demonstrate more than 40-dB loss budget for 480-Gbit/s using 120-GBd DP-QAM4 in upstream burst-mode reception.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1263.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Rene Bonk","affiliation":"Nokia","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#821 / Th2-D2","title":"Experimental Burst-Mode Reception of LDPC Forward-Error-Corrected 256Gbps Coherent PON with 24 dB Dynamic Range using a Static-Gain TIA","speaker":"Jad  Sarkis","affiliation":"Huawei Heisenberg Research Center","authors":"Jad  Sarkis, Robert  Palmer, Balazs  Matuz, Giuseppe  Talli, Valter  Ferrero, Roberto  Gaudino","start":"11:15","end":"","abstractid":212004,"order":2,"abstract":"Abstract (summary)  We demonstrate post-FEC error-free upstream burst-mode transmission of 256 Gbps DP QPSK over 20 km in the C-band. The proposed receiver scheme with commercial ICR and static-gain TIA supports 24 dB of dynamic range (DR) exceeding the typical 20 dB ITU-T requirement for PON systems.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-821.pdf"},{"role":"speaker","rolename":"Contributed","code":"#680 / Th2-D3","title":"Low-Complexity FPGA Implementation of Channel Estimation and Equalization for 100G Real-Time Upstream Burst-Mode Detection in Coherent PON","speaker":"Renle Zheng","affiliation":"Fudan University","authors":"Renle  Zheng, An  Yan, Penghao  Luo, Shuhong  He, Xuyu  Deng, Junhao  Zhao, Yongzhu  Hu, Nan  Chi, Junwen  Zhang","start":"11:30","end":"","abstractid":211846,"order":3,"abstract":"Abstract (summary)  We experimentally demonstrate low-complexity FPGA-based channel estimation and equalization for 100-Gb/s real-time upstream burst-mode detection in coherent PON. Reduced-parallelism one-tap SOP-aided MMSE decreases FPGA resource consumption by 35.8% versus full 128-parallel processing, with only 1-dB dynamic-range penalty and a 45.7-dB power budget.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-680.pdf"},{"role":"speaker","rolename":"Contributed","code":"#557 / Th2-D4","title":"First Field Trial of Coherent TDM-PON Up to 300 Gb/s","speaker":"Yixiao Zhu","affiliation":"Shanghai Jiao Tong University","authors":"Yixiao  Zhu, Luyao  Huang, Yimin  Hu, Ziheng  Zhang, Chaofeng  Ge, Dezhi  Zhang, Ming  Jiang, Weisheng  Hu","start":"11:45","end":"","abstractid":211682,"order":4,"abstract":"Abstract (summary)  We report the first field trial demonstration of coherent TDM-PON over 57-km deployed urban fiber (~34-dB loss), achieving flexible rates up to 300 Gb/s and fast-convergence DSP with a 30-ns preamble. The power budgets are 42/39 dB for 200-/300-Gb/s data rates.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-557.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1252 / Th2-D5","title":"Impact of Rayleigh backscattering on next-generation bidirectional 200 Gb/s FDMA coherent PON","speaker":"Juan Lautaro Moreno Morrone","affiliation":"Fraunhofer Heinrich Hertz Institute","authors":"Juan L.  Moreno Morrone, Laurenz  Ebner, Abdelrahmane  Moawad, Johannes K.  Fischer, Ronald  Freund","start":"12:00","end":"","abstractid":212465,"order":5,"abstract":"Abstract (summary)  We experimentally evaluate the impact of Rayleigh backscattering in the upstream in a single‑wavelength 200 Gb/s DP‑QPSK FDMA coherent PON between two ONUs and an OLT. Simulations show a trade-off between downstream and upstream transmit powers and identify an operational region enabling simultaneous bidirectional transmission.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1252.pdf"}]},{"sessionid":"5538410","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"11:00-12:15","room":"C1.4 Conference room 1.4","type":"Contributed session","typeColor":"#f4cccc","category":"SC 03: Photonic integrated circuits, assemblies and packaging","title":"Th2-E Receivers and photodetectors","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Jose Manuel Luque González","affiliation":"University of Málaga","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1286 / Th2-E1","title":"A 4-𝜆 x 64 Gb/s Polarization-diverse Silicon Photonic DWDMReceiver using low-PDL 2D Grating Couplers","speaker":"Nandish Mehta","affiliation":"NVIDIA","authors":"Nandish  Mehta, Thomas H  Greer Iii, Meer  Sakib, C. Thomas  Gray","start":"11:00","end":"","abstractid":212502,"order":1,"abstract":"Abstract (summary)  We demonstrate a 4-λx64 Gb/s silicon-photonic polarization-diverse receiver using a low-PDL 2D grating coupler. Co-optimized grating geometry and fiber coupling angle yield <+/-0.2-dB PDL across a 300-mm wafer. Stable eye-diagrams and BER measured under fast 2000-rad/s SOP scrambling confirm fully passive reception independent of polarization.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1286.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Marianna Pantouvaki","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#630 / Th2-E2","title":"Neural Inverse Design of Electrodes Enables Uni-Traveling-Carrier Photodiodes with 220 GHz Bandwidth and 2.7 dBm Output Power at 170 GHz","speaker":"Jianwei Chen","affiliation":"Southeast University (China)","authors":"Jianwei  Chen, Min  Zhu, Xingyu  Chen, Jiao  Zhang, Yuancheng  Cai, Bingchang  Hua, Yunwu  Wang, Long  Zhang, Xiaohu  You","start":"11:15","end":"","abstractid":211783,"order":2,"abstract":"Abstract (summary)  We demonstrate neural inverse-designed uni-traveling-carrier photodiodes achieving a 220 GHz bandwidth and 2.7 dBm output power at 170 GHz. By tailoring the inductive-capacitive resonance of the on-chip electrodes to compensate for intrinsic RC roll-off, this approach simultaneously enhances bandwidth and output power without heterogeneous integration.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-630.pdf"},{"role":"speaker","rolename":"Contributed","code":"#783 / Th2-E3","title":"Highly Reliable CMP-Free Ge-on-Si Waveguide Photodiodes for Data Center Optical Interconnects","speaker":"Solomon Musibau","affiliation":"imec","authors":"Solomon  Musibau, Conor  Coughlan, Natarajan  Rajasekaran, Hakim  Kobbi, Artemisia  Tsiara, Sadhishkumar  Balakrishnan, Leili  Shiramin, Philippe  Absil","start":"11:30","end":"","abstractid":211963,"order":3,"abstract":"Abstract (summary)  We demonstrate reliable CMP-free Ge‑on‑Si photodiodes, validated through extensive accelerated aging, showing stable dark current. The device exhibits 0.89 A/W responsivity, 65.3 GHz bandwidth, and sub-10 nA dark current, enabling simplified silicon photonics integration for optical interconnects in AI data centers with strict reliability requirements.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-783.pdf"},{"role":"speaker","rolename":"Contributed","code":"#758 / Th2-E4","title":"On-Chip Real-Time Polarization Demultiplexing using an Adaptive MZI Photonic Mesh","speaker":"Seyedmohammad Seyedinnavadeh","affiliation":"Politecnico di Milano","authors":"Seyedmohammad  Seyedinnavadeh, Samuele  De Gaetano, Monica  Crico, Andrea  Melloni, Francesco  Zanetto, Francesco  Morichetti","start":"11:45","end":"","abstractid":211933,"order":4,"abstract":"Abstract (summary)  We demonstrate on-chip real-time demultiplexing of two 25 Gbps signals with orthogonal, randomly scrambled polarizations. The photonic circuit consists of a polarization-insensitive 4x2 reconfigurable MZI mesh that also compensates phase drifts of the input signals and is adaptively configured through monolithically integrated electronic multiplexers.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-758.pdf"},{"role":"speaker","rolename":"Contributed","code":"#632 / Th2-E5","title":"A High Sensitivity 200 Gbps PAM4 Receiver with Flip Chip Integrated Si-Ge Avalanche Photodiode and CMOS Transimpedance Amplifier","speaker":"Chao Cheng","affiliation":"University of Chinese Academy of Sciences","authors":"Chao  Cheng, Yihao  Yang, Shenlei  Bao, Houyou  Lai, Xishan  Yu, Qian  Liu, Jintao  Xue, Wenfu  Zhang, Binhao  Wang","start":"12:00","end":"","abstractid":211785,"order":5,"abstract":"Abstract (summary)  This paper reports a high-sensitivity optical receiver based on flip-chip integrated Si–Ge avalanche photodiode and CMOS transimpedance amplifier. Clear eye diagrams are achieved at 100 Gbps NRZ and 200 Gbps PAM4, with sensitivities of -26.1 dBm and -20 dBm, respectively.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC2026-632v2.pdf"}]},{"sessionid":"5538412","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"11:00-12:30","room":"C2.1 Conference room 2.1","type":"Symposia","typeColor":"","category":"","title":"Th2-F Programmable photonics: architectures, control and applications","description":"Programmable Integrated Photonics (PIP) represents a paradigm shift from application-specific PICs to reconfigurable optical subsystems integrating hardware, electronics, and control algorithms.\tOrganisers: Wim Bogaerts (Ghent University–imec), Ioannis Tomkos (University of Patras)\tPart 2. Chair: Wim Bogaerts\tDavid Marpaung (University of Twente, Netherlands). “Programmable Microwave Photonics”\tShuang Zheng (Huazhong University of Science and Technology, China) . “WDM-enabled Programmable Silicon Photonic Meshes for Parallel Optical Signal Processing”\tAndrea Melloni (Politecnico di Milano, Italy).  “Control and calibration of programmable photonic integrated circuits”\tIoannis Tomkos (University of Patras, Greece). \"Programmable Photonics for AI Interconnect Transceivers\"\tPanel session (30 mins).","goal":"","papers":[{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Wim Bogaerts","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Ioanis Tomkos","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2}]},{"sessionid":"5538414","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"11:00-12:00","room":"C2.2 Conference room 2.2","type":"Contributed session","typeColor":"#d9eaf7","category":"SC 01: Novel fibres, fibre devices and amplifiers","title":"Th2-G Enabling fibre based devices and handling","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Peter Ingo Borel","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#870 / Th2-G1","title":"In-Fibre Optical Logic Gate Utilizing Laser-Inscribed Multi-Mode Interference within Multi-Core Fibre","speaker":"Kiyoshi Kamimura","affiliation":"NTT Corporation","authors":"Kiyoshi  Kamimura, Masaki  Wada, Yoko  Yamashita, Takashi  Matsui","start":"11:00","end":"","abstractid":212062,"order":1,"abstract":"Abstract (summary)  We propose the in-fibre logic gate based on laser-inscribed multi-mode interference (MMI) within multi-core fibre to realize core switching by optical phase for the first time. The MMI-based logic gate is experimentally demonstrated, and we show its applicability to 2x4 optical logic circuits.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-870.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Patrice Mégret","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#725 / Th2-G2","title":"8 × 40-channel Gang Connector Using Snap-Beam Connectors in Co-packaged Optics","speaker":"Yuki Fujimaki","affiliation":"Furukawa Electric Co., Ltd.","authors":"Yuki  Fujimaki, Shosuke  Ikeda, Kengo  Watanabe, Tsunetoshi  Saito, Masaki  Kotoku","start":"11:15","end":"","abstractid":211897,"order":2,"abstract":"Abstract (summary)  A low-loss 8 × 40‑channel gang connector using Snap‑Beam connectors has been developed, enabling high‑density simultaneous connection in Co-packaged Optics. Low insertion loss ≤ 0.7 dB and return loss ≥ 36 dB were verified for fibre-to-fibre connections.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-725.pdf"},{"role":"speaker","rolename":"Contributed","code":"#829 / Th2-G3","title":"Efficient, Ultra-flat and Low-noise Parametric Comb Generation using Hybrid Nonlinear Fibre System and Chirped-pulse Nonlinear Loop Mirror","speaker":"Yijia Cai","affiliation":"University College London","authors":"Yijia  Cai, Alexander M.  Heidt, Zhixin  Liu","start":"11:30","end":"","abstractid":212012,"order":3,"abstract":"Abstract (summary)  We address efficiency, spectral flatness and noise-scaling problems in cavity-less frequency comb generation using a hybrid fibre system combining soliton and wave-breaking nonlinearities. We propose chirped-pulse nonlinear loop mirror to efficiently shape pulse and spectra, achieving 3-dB flatness across C-band and sub-3-kHz linewidth over 80nm.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-829.pdf"},{"role":"speaker","rolename":"Contributed","code":"#193 / Th2-G4","title":"Highly Efficient and Ultra-Low Loss AR-HCF Fusion Splicing with Rapid Rotational Alignment","speaker":"Cong Zhang","affiliation":"Guangdong University of Technology","authors":"Wei  He, Cong  Zhang, Lipeng  Feng, Di  Lin, Peng  Li, Lei  Zhang, Jie  Luo, Yuwen  Qin, Songnian  Fu","start":"11:45","end":"","abstractid":210862,"order":4,"abstract":"Abstract (summary)  We propose a discrete-sampling gradient detection algorithm for rapid rotational alignment in anti-resonant hollow-core fiber (AR-HCF) fusion splicing, in order to resolve directional ambiguity, compress the angular search space, and achieve an 0.042 dB average splicing loss with a splicing time less than 55 seconds.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-193.pdf"}]},{"sessionid":"5538408","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"11:00-12:30","room":"E2 Exhibition room 2","type":"Contributed session","typeColor":"#e4dfec","category":"SC 04: Signal processing for optical communication and sensing","title":"Th2-H Faster-than-nyquist, equalization and coding","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Jianming Tang","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#647 / Th2-H1","title":"Maximum Coverage Chase Decoder for Optical Interconnects","speaker":"Alessandro Cardinale","affiliation":"","authors":"Alessandro  Cardinale, Wenqing  Song, Bin  Chen, Alex  Alvarado, Andreas  Burg, Yifei  Shen","start":"11:00","end":"","abstractid":211808,"order":1,"abstract":"Abstract (summary)  We propose a low-complexity Chase decoder for optical interconnects that formulates test pattern selection as a generalized maximum coverage problem. For concatenated RS-BCH and oFEC codes, our decoder achieves the standard Chase decoding performance with 25% and 61.3% fewer test patterns, respectively.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-647.pdf"},{"role":"speaker","rolename":"Contributed","code":"#690 / Th2-H2","title":"Robust Real-Time DSP for a Hybrid Fiber and Photonic-Assisted Sub-THz Wireless Communication","speaker":"Filipp Gostner","affiliation":"","authors":"Filipp  Gostner, Joel  Dittmer, Ahmed  Qamesh, Dario  Pilori, Axel  Tessmann, Sandrine  Wagner, Christian  Koos, Frank  Simon, Sebastian  Randel","start":"11:15","end":"","abstractid":211856,"order":1,"abstract":"Abstract (summary)  We demonstrate a real-time photonic-assisted sub-THz link. Across 10km SSMF and a 1.4m wireless link, the coherent 16-QAM system achieves 6.83Gbit/s. Our fast-acquisition DSP performs real-time, non-data-aided timing recovery, channel equalization, and phase recovery on an FPGA, operating under ±100ppm clock offset and intermitted data.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-690.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Bernhard  Spinnler","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#989 / Th2-H3","title":"Impact of Non-Uniform Constellations on MLSE Demodulation Performance for PCS-16QAM under Bandwidth Limitation","speaker":"Yukinobu Nakajima","affiliation":"Network Innovation Laboratories, NTT, Inc.","authors":"Yukinobu  Nakajima, Shuto  Yamamoto, Masanori  Nakamura, Hiroki  Taniguchi, Etsushi  Yamazaki","start":"11:30","end":"","abstractid":212185,"order":2,"abstract":"Abstract (summary)  We investigated the impact of the prior probability term in MLSE branch metrics and demonstrated a GMI improvement of up to 9% over the case without MLSE by optimizing the prior probability term weight through transmission experiments using PCS-16QAM signals under severe bandwidth limitation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-989.pdf"},{"role":"speaker","rolename":"Contributed","code":"#985 / Th2-H4","title":"Low-Complexity FPGA-Based PR-9QAM Detection for Photonics-Aided 306-GHz FTN Wireless System","speaker":"Yikai Wang","affiliation":"Southeast University","authors":"Yikai  Wang, Min  Zhu, Yuancheng  Cai, Long  Zhang, Junjie  Ding, Jiao  Zhang, Bingchang  Hua, Mingzheng  Lei, Zhigang  Xin, Yiting  Yan, Jianwei  Chen, Jiankang  Li, Xiongwei  Yang, Kaihui  Wang, Jianjun  Yu","start":"11:45","end":"","abstractid":212181,"order":3,"abstract":"Abstract (summary)  This paper employs PR coding for FTN transmission, yielding a PR-9QAM signal and motivating low-complexity CMMA and carrier recovery design. The algorithms are implemented on an FPGA platform and validated in a photonics-aided 306 GHz link with error-free 30 Gbps over 3 m.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-985.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1190 / Th2-H5","title":"30.2-km D-Band Photonics-Assisted Wireless Reception Enabled by FPGA-Based Equalizer-Guided SFO Compensation","speaker":"Sheng  Hu","affiliation":"Fudan University","authors":"Sheng  Hu, Kaihui  Wang, Tianqi  Zheng, Jianyu  Long, Jiali  Chen, Ye  Zhou, Xin  Lu, Hanson  Ma, Chengzhen  Bian, Jianxin  Ren, Bo  Liu","start":"12:00","end":"","abstractid":212396,"order":4,"abstract":"Abstract (summary)   An FPGA-deployed receiver is demonstrated for a 30.2-km photonics-assisted D-band wireless link with equalizer-guided SFO estimation and Farrow-based compensation. Using experimentally captured waveform data loaded into on-board RAM, the FPGA receiver successfully achieves 16-Gbaud QPSK transmission below the 20% SD-FEC threshold.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1190.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1013 / Th2-H6","title":"Demonstration of 169-Gbaud Faster-Than-Nyquist PAM4 Transmission Using Adaptation-Free THP-FFDNN Under 37.9-GHz 3-dB Bandwidth Limitation","speaker":"Yuan Wei","affiliation":"Fudan University","authors":"Yuan  Wei, Chaoxu  Chen, Yuqin  Yuan, Yinjun  Liu, Boyu  Dong, Jialin  He, Junhao  Zhao, Haoyu  Zhang, Li  Yao, Bo  Xu, Yaotian  Zhao, Wei  Chu, Haiwen  Cai, Nan  Chi, Jianyang  Shi, Junwen  Zhang","start":"12:15","end":"","abstractid":212211,"order":5,"abstract":"Abstract (summary)  We propose a THP-FFDNN framework for faster-than-Nyquist PAM4 transmission, which eliminates adaptive updating while requiring only 408 parameters. The proposed scheme is compatible with GPU-based DSP implementation and achieves 169 Gbaud PAM4 under 37.9-GHz 3-dB bandwidth limitation, supporting the lowest spectral compression ratio of 62.5%","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1013.pdf"}]},{"sessionid":"5538492","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"12:30-14:00","room":"","type":"Lunch","typeColor":"black","category":"","title":"Lunch","description":"","goal":"","papers":[]},{"sessionid":"5538757","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"14:00-15:30","room":"A1 Auditorium 1","type":"Contributed session","typeColor":"","category":"","title":"Post-deadline session A","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Pierpaolo Boffi Boffi","affiliation":"POLITECNICO DI MILANO","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1576 / PDP-A-1","title":"First Demonstration Of A Zero Dispersion Hollow-Core Fibre With Telecoms-Grade Loss (0.2 DB/Km) In The C-Band","speaker":"Seyed Mohammad  Abokhamis Mousavi","affiliation":"Microsoft","authors":"Seyed Mohammad  Abokhamis Mousavi, Ghafour  Amouzad Mahdiraji, Yang  Hong, Dong  Wu, Morteza  Kamalian-Kopae, Thejus  Varghese, Muhammad  Rosdi Bin Abu Hassan, Zahra  Kakaei, Naveen Krishna  Baddela, Abubakar Isa  Adamu, Ziwei  Zhai, Kunhao  Ji, Krystian  Wisniowski, Yong  Chen, Ben  Puttnam, Francesco  Poletti","start":"14:00","end":"14:15","abstractid":218911,"order":1,"abstract":"Abstract (summary)  We demonstrate the first optical fibre combining ultralow nonlinearity with zero chromatic dispersion in the C-band at telecom-grade loss (~0.2 dB/km). Enabled by membrane-thickness engineering in a hybrid-window antiresonant hollow-core structure, the fibre unlocks new opportunities for optical communications, for both IM-DD and coherent transmission.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1576.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1569 / PDP-A-2","title":"A Coherent 1 µM Transmission System Using TFLN Modulator, Gain-Flattened YDFAs And Low-Loss Hollow-Core Fiber","speaker":"Ben  Puttnam","affiliation":"","authors":"Yang  Hong, Ziwei  Zhai, Morteza  Kamalian Kopae, Dicky  Chung, Kunhao  Ji, Krystian  Wisniowski, Eric  Numkam Fokoua, Yong  Chen, Baset  Gholizadeh, Mohammed  Mousavi, Alessandro  Aimone, Kwangwoong  Kim, Tam  Huynh, Nicolas  Fontaine, Marco  Petrovich, Stephen  Doran, Jamie  Gaudette, David  Richardson, Francesco  Polletti, Ben  Puttnam","start":"14:15","end":"14:30","abstractid":218904,"order":2,"abstract":"Abstract (summary)  We demonstrate the first full coherent 1 µm hollow-core fibre transmission system using new DNANF with lowest reported 1 μm loss, thin-film lithium-niobate modulator and custom gain-flattened YDFAs to deliver GMI-estimated 53.3 Tb/s over 106.1 km showing a path new spectral window adoption.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1569.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1581 / PDP-A-3","title":"Record Full-C Band Unrepeatered Transmission Over 532-Km HCF Achieving 30.66-Tb/S With ROPA And 15.73-Tb/S Without ROPA","speaker":"Haik Mardoyan","affiliation":"NOKIA BELL LABS","authors":"Haïk  Mardoyan, Rajiv  Boddeda, Carina  Castineiras Carrero, Hans  Bissessur, Peng  Li, Lei  Zhang, Shuhai  Li, Jie  Luo, Amirhossein  Ghazisaeidi, Alexis  Busson, Farana  Hedaraly, Jérémie  Renaudier","start":"14:30","end":"14:45","abstractid":218916,"order":3,"abstract":"Abstract (summary)  We report the first full-C-band unrepeatered transmission over 532-km of hollow-core fiber using high-power DFA and 135 GBd WDM channels, yielding 15.73 Tb/s throughput. Leveraging low loss of the HCF for both signal propagation and remote pumping, we also achieve 30.66-Tb/s net throughput with ROPA.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1581.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1537 / PDP-A-4","title":"Dual-Band, Bi-Directional Long-Haul Transmission In Reduced Outer Diameter Wideband HCF","speaker":"Jiaqian Yang","affiliation":"University College London (UCL)","authors":"Jiaqian  Yang, Yang  Hong, Romulo  Aparecido, Cristobal  Melo, Morteza  Kamalian-Kopae, Baset  Gholizadeh, Eric  Sillekens, Zelin  Gan, Ronit  Sohanpal, Mindaugas  Jarmolovicius, Vitaly  Mikhailov, Jiawei  Luo, Jeffrey  Nicholson, Dmytro  Suslov, Eric  Numkam-Fokoua, Yong  Chen, Lucy  Hooper, Marek  Bidus, Alexander  Boyland, Marco  Petrovich, Stephen  Doran, Robert  Killey, Polina  Bayvel, Jamie  Gaudette, David  Richardson, Benjamin  Puttnam","start":"14:45","end":"15:00","abstractid":218869,"order":4,"abstract":"Abstract (summary)  We demonstrate the first long-haul, bi-directional transmission using high-power bismuth- and erbium-doped fiber amplifiers in a novel recirculating-loop built on reduced-diameter HCF, transmitting 53.9+51.9 Tb/s (GMI) over 2024 km using O+C-bands, and 22.2+21.5 Tb/s (4500 km), 17.2+16.6 Tb/s (6750 km) using C-band only.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1537.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1547 / PDP-A-5","title":"3.83-Tb/S Single-Wavelength Coherent Transmission Enabled By 450-GBaud All-Electronic I/Q Signaling","speaker":"Di CHE","affiliation":"NOKIA BELL LABS","authors":"Di  Che, Xi  Chen, Callum  Deakin, Gregory  Raybon, Kwangwoong  Kim, Ells  Burrows","start":"15:00","end":"15:15","abstractid":218879,"order":5,"abstract":"Abstract (summary)  We report a single-wavelength coherent transmission with 3.83-Tb/s net bit rate over 10-km SSMF. This is enabled by 450-GBaud all-electronic signaling using a pair of 226-GHz digital-band-interleaved DACs driving a thin-film LiNbO3 I/Q modulator.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1547.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1549 / PDP-A-6","title":"IM-DD Net Bit Rate Beyond 800 Gb/S Per Lane With Single-Photodiode Reception Of 440-GBaud PAM","speaker":"Di CHE","affiliation":"NOKIA BELL LABS","authors":"Di  Che, Xi  Chen, Callum  Deakin, Gregory  Raybon, Kwangwoong  Kim, Stefano  Grillanda, Linze  Li, Tianyu  Long, Baile  Chen","start":"15:15","end":"15:30","abstractid":218881,"order":6,"abstract":"Abstract (summary)  We demonstrate single-lane intensity modulation and direct detection with a net bit rate of 827 Gb/s using a single modulator and a single photodiode. A new 3-band digital-band-interleaved receiver covering 221-GHz bandwidth is built on a 512-GSa/s real-time oscilloscope.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1549.pdf"}]},{"sessionid":"5538511","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"14:00-15:30","room":"A2 Auditorium 2","type":"Contributed session","typeColor":"","category":"","title":"Post-deadline session B","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Paola Parolari","affiliation":"Politecnico di Milano","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1575 / PDP-B-1","title":"First Booster-Free Integrated Tunable Laser Achieving 100mw Output Power Over 111nm Tuning Range","speaker":"You Wu","affiliation":"Optical Communication Technologies Lab, Huawei Technologies France","authors":"You  Wu, Youssef  Saghiran, Antonin  Gallet, Nayla  El Dahdah, Sheherazade  Lamkadmi Azouigui, Thanina  Koudia, Trung Hien  Nguyen, Sami  Mumtaz, Hongbo  Xie, Zhaoming  Li, Adam  Esmail, Ian  Lealman, Giovanni Francesco  Cotella, Romain  Brenot, Gabriel  Charlet","start":"14:00","end":"14:15","abstractid":218910,"order":1,"abstract":"Abstract (summary)  We demonstrate a novel hybrid III-V/SiN laser, first to deliver over 20 dBm fiber-coupled output power without a booster-SOA over a record tuning range (111 nm), side-mode-suppression-ratio greater than 60 dB and a linewidth lower than 3 kHz, validated with a 64-QAM sub-system.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1575.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1514 / PDP-B-2","title":"High-Speed Mach-Zehnder Modulator By Sputtered Thin-Film Lithium Niobate","speaker":"Yasuhiro Takagi","affiliation":"TDK corporation","authors":"Hiroki  Hara, Shigeru  Mieda, Katsumi  Kawasaki, Takashi  Kikukawa, Hiroshi  Take, Tetsuya  Mino, Atsushi  Shimura, Yasuhiro  Takagi, Hideaki  Fukuzawa","start":"14:15","end":"14:30","abstractid":218838,"order":2,"abstract":"Abstract (summary)  We successfully demonstrate high-speed data transfer at 192 Gbaud under four-level pulse amplitude modulation (PAM4), achieving a net bit rate of 384 Gbps using a sputtered thin-film lithium niobate (TFLN) Mach–Zehnder modulator. The sapphire substrate plays a key role in enabling this high performance without relying on bulk lithium niobate.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1514.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1558 / PDP-B-3","title":"90-GHz Cascaded Microring Modulators Enabling 4.8-Tb/s Optical Interconnects at 600 Gb/s/λ","speaker":"Pan Cao","affiliation":"Huawei Technologies co., Ltd.","authors":"Pan  Cao, Zhiyuan  Zhou, Huajie  Wan, Zhoutian  Liu, Xu  Wang, Yanxi  Zhang, Ping  Liao, Wen  Zheng, Huijian  Zhang, Zhihan  Sun, Li  Shen, Qi  Tian, Jiangwei  Man, Shuang  Zheng, Minming  Zhang","start":"14:30","end":"14:45","abstractid":218892,"order":3,"abstract":"Abstract (summary)  We demonstrate an 8-channel O-band cascaded MRM transmitter featuring ~90-GHz 3-dB electro-optic bandwidth without electrical peaking. The optimized carrier-depletion junction and low-parasitic electrodes enable a broadband electro-optic response for 200-Gbaud PAM8, achieving a record 600 Gb/s/λ and 4.8-Tb/s aggregate capacity.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1558.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1570 / PDP-B-4","title":"A Monolithically Integrated 100-GHz Optical Receiver Demonstrating 224-GBd PAM-4 Operation","speaker":"Jakob Declercq","affiliation":"Ghent University - imec","authors":"Jakob  Declercq, Lucas  Van Severen, Marijn  Werbrouck, Leandro  Da Silva, Nishant  Singh, Xin  Yin","start":"14:45","end":"15:00","abstractid":218905,"order":4,"abstract":"Abstract (summary)  We demonstrate a C-band optical receiver monolithically integrating a differential TIA and photodiodes in a 250-nm SiGe BiCMOS EPIC platform. The receiver achieves a bandwidth beyond 100GHz and optical-amplifier-free 224-GBd PAM-4 operation using only linear equalization, supporting net 400-Gb/s-per-lane transmission while consuming 162 mW.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1570.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1511 / PDP-B-5","title":"Ultrafast Electro-Absorption Modulators And Fin-Photodiodes In A SiGe Photonics Platform","speaker":"Daniel Steckler","affiliation":"IHP-Leibniz Institut für innovative Mikroelektronik","authors":"Daniel  Steckler, Stefan  Lischke, Yuji  Yamamoto, Anna  Peczek, Kei  Kiyose, Aleksandra  Kroh, Lars  Zimmermann","start":"15:00","end":"15:15","abstractid":218834,"order":5,"abstract":"Abstract (summary)  We present C-band SiGe electro-absorption modulators with an RC-time-constant-estimated 3-dB bandwidth of 192 GHz and a nearly flat measured response up to 110 GHz. Monolithic co-integration with 200-GHz SiGe fin photodiodes provides an unprecedented combination of high-performance devices, paving the way towards 400-GBaud optoelectronic systems.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1511.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1522 / PDP-B-6","title":"180-GBaud OOK Modulation Using A KNN Crystal-Based Electro-Optic Waveguide Modulator","speaker":"Shiyoshi Yokoyama","affiliation":"Kyushu University","authors":"Shiyoshi  Yokoyama, Hiromu  Sato, Guo-Wei  Lu, Takayuki  Okachi, Kazuma  Funahashi, Kazutoshi  Watanabe, Masaya  Shimizu, Yasunori  Tanaka","start":"15:15","end":"15:30","abstractid":218852,"order":6,"abstract":"Abstract (summary)  We demonstrate a KNN crystal-on-insulator Mach–Zehnder interferometer modulator operating in the C-band. The strong Pockels effect enables a low half-wave voltage length product of 0.28 V·cm and 180-Gbaud OOK transmission, highlighting KNN as a promising platform for ultrahigh-speed, low-voltage optical modulation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1522.pdf"}]},{"sessionid":"5538798","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"14:00-15:30","room":"C1.1 Conference room 1.1","type":"Contributed session","typeColor":"","category":"","title":"Post-deadline session C","description":"","goal":"","papers":[{"role":"speaker","rolename":"Contributed","code":"#1510 / PDP-C-1","title":"Optical Fi-Wi QKD Exchange With Monolithic QKD Transmitter","speaker":"Bernhard Schrenk","affiliation":"AIT Austrian Institute of Technology","authors":"Florian  Honz, Winfried  Boxleitner, Mariana  Ferreira-Ramos, Michael  Hentschel, Hannes  Hübel, Bernhard  Schrenk","start":"14:00","end":"14:15","abstractid":218833,"order":1,"abstract":"Abstract (summary)  We show a handheld-inspired end-to-end key exchange over optical-wireless channel and up to 32-km fronthaul link, using a silicon QKD transmitter with on-chip light source operable up to 80°C and 29 WDM channels. We further prove co-existence with a 5-Gb/s Fi-Wi data link.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1510.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Roberto Sabella","affiliation":"Ericsson","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1560 / PDP-C-2","title":"138.6 Gb/S Net-Data Rate Sub-THz Transmission Over 5.5 Km Enabled By Resonant Plasmonic Modulator","speaker":"Samuel Hess","affiliation":"ETH Zurich","authors":"Samuel  Hess, Chenrui  Xu, Boris  Vukovic, Taichiro  Fukui, Hande  Ibili, Maximilian  Bosch, Laurenz  Kulmer, Tobias  Blatter, David  Moor, Stefan M.  Koepfli, Yuriy  Fedoryshyn, Jasmin  Smajic, Juerg  Leuthold","start":"14:15","end":"14:30","abstractid":218894,"order":2,"abstract":"Abstract (summary)  A plasmonic-assisted optical-sub-THz-optical transmission link over a distance of 5.5 km, with net-data rates of 138.6 Gbps at a carrier frequency of 273 GHz is demonstrated. Only linear DSP is used to show a 762.3 Gbps km distance-net-rate product under summer conditions.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1560.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1572 / PDP-C-3","title":"16.4 DB Outage Coupling Gain Using Branch-Point-Aware Adaptive Optics Over A Deployed Free-Space Optical Link Enabled By Remote Digital Holography","speaker":"Quinten  Moonen","affiliation":"Eindhoven University of Technology","authors":"Quinten  Moonen, Vincent  Van Vliet, Menno  Van Den Hout, Eduward  Tangdiongga, Chigo  Okonkwo","start":"14:30","end":"14:45","abstractid":218907,"order":3,"abstract":"Abstract (summary)  We demonstrate for the first time remote digital holographic wavefront sensing over a deployed free-space optical link during a 90-hour measurement campaign. Complex-field recovery enables turbulence estimation and branch-point-aware digital adaptive optics, providing 16.4-dB outage gain in our system over branch-point-unaware reconstruction under strong turbulence.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1572.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1541 / PDP-C-4","title":"Turbulence-Resilient 120-Gbit/S Transmission Using SVD-Based Beamforming Towards Ground-To-LEO Optical Uplinks","speaker":"Yuxiang Duan","affiliation":"University of Southern California","authors":"Yuxiang  Duan, Yixuan  Zhang, Yichen  Li, Abdulrahman  Alhaddad, Zile  Jiang, Yingning  Wang, Ruoyu  Zeng, Wing  Ko, Yue  Zuo, Jacob  Scheuer, Moshe  Tur, Alan E.  Willner","start":"14:45","end":"15:00","abstractid":218873,"order":4,"abstract":"Abstract (summary)  Using singular-value-decomposition (SVD)-based beamforming, we demonstrate turbulence-resilient 120-Gbit/s transmission over a 2.2-m link towards ground-to-LEO uplink scenarios. At 1550 nm, SVD provides >18-dB power enhancement over a Gaussian beam and BERs below 7% FEC threshold. SVD’s tunability is verified across various turbulence realizations.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1541.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1578 / PDP-C-5","title":"First Single-Wavelength Super-Rated 200G DD PON Downstream With 340-Ps/Nm CD Tolerance Enabled By Dual-SSB Transmission","speaker":"Md Mosaddek Hossain  Adib","affiliation":"Nokia Bell Labs","authors":"Md Mosaddek Hossain  Adib, Wouter  Lanneer, Laurens  Breyne, René  Bonk, Christoph  Füllner","start":"15:00","end":"15:15","abstractid":218913,"order":5,"abstract":"Abstract (summary)  We experimentally demonstrate 224‑Gbit/s/λ downstream transmission in a direct‑detection PON system enabled by transmission of a dual single-sideband signal and individual reception of each sideband. We demonstrate a loss budget exceeding 33 dB and a chromatic‑dispersion tolerance beyond 340 ps/nm.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1578.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1529 / PDP-C-6","title":"Optically Integrated 1.12-Tb/S/Wavelength DSP-Free Communication And Vibration Sensing Over 10-Km Hollow-Core Fiber For Scale-Across Datacenter Interconnect","speaker":"Jingchuan Wang","affiliation":"The Hong Kong Polytechnic University","authors":"Jingchuan  Wang, Xi  Chen, Alan Pak Tao  Lau, Chao  Lu, DI  Che","start":"15:15","end":"15:30","abstractid":218860,"order":6,"abstract":"Abstract (summary)  We demonstrate the integration of communication and forward-vibration-sensing in a DSP-free coherent receiver for low-cost, high-reliability scale-across networks. Using 10-km hollow-core fiber and pilot-tone-assisted optical phase-locked loop, we achieve simultaneous proactive sensing and communication with a record distance–rate product of 11.2-Tb/s·km/wavelength, without standard receiver-side DSP.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1529.pdf"}]},{"sessionid":"5538399","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"15:45-16:15","room":"A1 Auditorium 1","type":"Closing","typeColor":"","category":"","title":"Closing","description":"","goal":"","papers":[]}]}</script>
<script>
(function(){
  "use strict";
  var RAW = JSON.parse(document.getElementById('data').textContent);
  var SESSIONS = RAW.sessions;

  // ---- assign a stable day order & short label ----
  var DAY_ORDER = {};
  SESSIONS.forEach(function(s){ if(!(s.date in DAY_ORDER)) DAY_ORDER[s.date]=s.day; });
  function shortDay(d){ return d ? d.split(',')[0] : 'TBD'; }

  // Display-only mapping: any Tutorial/Invited/Contributed combo -> "Technical".
  // (Does not alter the underlying scraped data.)
  var TECH_WORDS={tutorial:1,invited:1,contributed:1,session:1,sessions:1};
  function displayType(t){
    if(!t) return t;
    var words=t.toLowerCase().split(/[^a-z]+/).filter(function(w){return w && w!=='and';});
    return (words.length && words.every(function(w){return TECH_WORDS[w];})) ? 'Technical' : t;
  }
  function displayColor(s){
    return displayType(s.type)==='Technical' ? '#33CCCC' : (s.typeColor||'#3ea6ff');
  }

  // ---- collect facets ----
  var types = {}, cats = {}, rooms = {}, days = {};
  SESSIONS.forEach(function(s){
    if(s.type){var dt=displayType(s.type); types[dt]=(types[dt]||{n:0,c:s.typeColor}); types[dt].n++;}
    if(s.category) cats[s.category]=(cats[s.category]||0)+1;
    if(s.room) rooms[s.room]=(rooms[s.room]||0)+1;
    if(s.date) days[s.date]=s.day;
  });
  if(types['Technical']) types['Technical'].c='#33CCCC';

  var el=function(id){return document.getElementById(id);};
  el('srcinfo').innerHTML='Scraped '+RAW.scraped+' from <a href="'+RAW.source+'" target="_blank">the official site</a> &middot; '
    +SESSIONS.length+' sessions &middot; '+SESSIONS.reduce(function(a,s){return a+s.papers.length;},0)+' presentations';

  // ---- state ----
  var state={q:'',day:'',type:'',cat:'',room:'',view:'sessions',expandAll:false};

  // ---- day chips ----
  var dayList=Object.keys(days).sort(function(a,b){return days[a]-days[b];});
  var df=el('dayfilter');
  addChip(df,'All','',function(){state.day='';render();},true,'day');
  dayList.forEach(function(d){
    addChip(df,shortDay(d),d,function(){state.day=(state.day===d?'':d);render();},false,'day');
  });

  // ---- type chips ----
  var typeList=Object.keys(types).sort();
  var tf=el('typefilter');
  addChip(tf,'All','',function(){state.type='';render();},true,'type');
  typeList.forEach(function(t){
    var c=addChip(tf,t,t,function(){state.type=(state.type===t?'':t);render();},false,'type');
    var dot=document.createElement('span');dot.className='dot';dot.style.background=types[t].c||'#888';
    c.insertBefore(dot,c.firstChild);
  });

  // ---- category + room selects ----
  fillSelect(el('catfilter'),'All committees / tracks',
    Object.keys(cats).sort(),function(v){state.cat=v;render();});
  fillSelect(el('roomfilter'),'All rooms',
    Object.keys(rooms).sort(),function(v){state.room=v;render();});

  // ---- view toggle ----
  Array.prototype.forEach.call(document.querySelectorAll('.viewtoggle button'),function(b){
    b.onclick=function(){
      state.view=b.getAttribute('data-view');
      Array.prototype.forEach.call(document.querySelectorAll('.viewtoggle button'),function(x){x.classList.remove('sel');});
      b.classList.add('sel'); render();
    };
  });
  el('expandall').onclick=function(){state.expandAll=!state.expandAll;
    el('expandall').textContent=state.expandAll?'Collapse all':'Expand all';render();};

  // ---- search box ----
  var q=el('q');
  q.addEventListener('input',function(){state.q=q.value.trim();el('clear').style.display=state.q?'block':'none';render();});
  el('clear').onclick=function(){q.value='';state.q='';el('clear').style.display='none';q.focus();render();};
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();}
    if(e.key==='Escape'&&document.activeElement===q){q.blur();}
  });

  // ---- helpers ----
  function addChip(parent,label,val,fn,sel,group){
    var c=document.createElement('span');c.className='chip'+(sel?' sel':'');
    c.appendChild(document.createTextNode(label));
    c.setAttribute('data-group',group);c.setAttribute('data-val',val);
    c.onclick=function(){fn();syncChips();};parent.appendChild(c);return c;
  }
  function syncChips(){
    Array.prototype.forEach.call(document.querySelectorAll('.chip[data-group]'),function(c){
      var g=c.getAttribute('data-group'),v=c.getAttribute('data-val');
      c.classList.toggle('sel', state[g]===v);
    });
  }
  function fillSelect(sel,allLabel,items,fn){
    var o=document.createElement('option');o.value='';o.textContent=allLabel;sel.appendChild(o);
    items.forEach(function(it){var o=document.createElement('option');o.value=it;o.textContent=it;sel.appendChild(o);});
    sel.onchange=function(){fn(sel.value);};
  }
  function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  function tokenize(q){return q.toLowerCase().split(/\s+/).filter(Boolean);}
  // Session descriptions use tab characters as line separators. HTML collapses
  // them to single spaces, which turns long descriptions (the Hack Your
  // Research programme is 9k chars) into one unbroken block. Convert runs of
  // tabs into real line breaks, after highlighting so <mark> is preserved.
  function descHTML(text,toks){
    return hl(text,toks).replace(/	+/g,'<br>');
  }
  function hl(text,toks){
    var out=esc(text);
    if(!toks.length) return out;
    toks.forEach(function(t){
      if(!t) return;
      var re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
      out=out.replace(re,'\u0001$1\u0002');
    });
    return out.replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>');
  }

  // build a searchable haystack per session (incl. its papers)
  SESSIONS.forEach(function(s){
    // session-heading-only text (title / type / track / room / date / description)
    s._shay=[s.title,s.type,displayType(s.type),s.category,s.room,s.date,s.description].join(' \u241f ').toLowerCase();
    var parts=[s._shay];
    s.papers.forEach(function(p){
      // paper-only text -> used to decide if THIS presentation matches
      p._phay=[p.title,p.speaker,p.affiliation,p.authors,p.code,p.rolename,p.abstract].join(' \u241f ').toLowerCase();
      // combined text (paper + its session) -> used by the flat "All papers" view
      p._hay=p._phay+' \u241f '+s._shay;
      parts.push(p._phay);
    });
    s._hay=parts.join(' \u241f ').toLowerCase();
  });

  function matchAll(hay,toks){return toks.every(function(t){return hay.indexOf(t)>=0;});}

  function sessionPasses(s){
    if(state.day && s.date!==state.day) return false;
    if(state.type && displayType(s.type)!==state.type) return false;
    if(state.cat && s.category!==state.cat) return false;
    if(state.room && s.room!==state.room) return false;
    return true;
  }

  function roleClass(rn){
    rn=(rn||'').toLowerCase();
    if(rn.indexOf('chair')>=0||rn.indexOf('organ')>=0||rn.indexOf('moder')>=0) return 'chair';
    if(rn.indexOf('invited')>=0) return 'inv';
    if(rn.indexOf('tutorial')>=0) return 'tut';
    return '';
  }

  var SITE = RAW.source.split('/site/')[0];

  // Chairs / organizers carry only a name and affiliation - never a title, time
  // or abstract - so collapse them onto one labelled line per role instead of
  // giving each person a full presentation row.
  function tidy(x){return (x||'').replace(/\s+/g,' ').trim();}
  function modsHTML(papers,toks){
    var mods=papers.filter(function(p){return p.role==='moderator';});
    if(!mods.length) return '';
    var order=[], byRole={};
    mods.forEach(function(p){                     // group, keeping first-seen order
      var k=tidy(p.rolename)||'Chair';
      if(!byRole[k]){ byRole[k]=[]; order.push(k); }
      byRole[k].push(p);
    });
    return order.map(function(k){
      var list=byRole[k];
      var label=(list.length>1 && !/s$/i.test(k)) ? k+'s' : k;   // Chair -> Chairs
      var names=list.map(function(p){
        var aff=tidy(p.affiliation);
        return '<span class="mname">'+hl(tidy(p.speaker),toks)
          +(aff?'<span class="maff">, '+hl(aff,toks)+'</span>':'')+'</span>';
      }).join('<span class="msep">&middot;</span>');
      return '<div class="modrow"><span class="mlabel '+roleClass(k)+'">'+esc(label)+'</span>'
        +'<span class="mnames">'+names+'</span></div>';
    }).join('');
  }

  function paperHTML(p,toks){
    var role = p.rolename ? '<span class="prole '+roleClass(p.rolename)+'">'+esc(p.rolename)+'</span>' : '';
    var code = p.code && p.code!=='#0 /' ? '<span class="pcodetag">'+esc(p.code)+'</span>' : '';
    var t = p.title ? '<span class="ptitle">'+hl(p.title,toks)+'</span>' : '';
    var spk = p.speaker ? '<div class="pspk"><span class="nm">'+hl(p.speaker,toks)+'</span>'
      +(p.affiliation?' &middot; '+hl(p.affiliation,toks):'')+'</div>' : '';
    var auth = (p.authors && p.authors!==p.speaker)
      ? '<div class="pauth">'+hl(p.authors,toks)+'</div>' : '';
    var links='';
    if(p.abstract){ links+='<button class="absbtn" type="button">Abstract</button>'; }
    if(p.pdf){ links+='<a class="abslink pdf" target="_blank" href="'+esc(SITE+p.pdf)+'">PDF &#8599;</a>'; }
    var absbox = p.abstract ? '<div class="absbox">'+hl(p.abstract,toks)+'</div>' : '';
    return '<div class="paper" data-abs="'+(p.abstract?'1':'0')+'"><div class="ptime">'+esc(p.start||'')+'</div><div class="pbody">'
      +code+t+role+spk+auth
      +(links?'<div class="plinks">'+links+'</div>':'')
      +absbox+'</div></div>';
  }

  function sessionHTML(s,toks,papers){
    // chairs / organizers collapse into one labelled line above the talks
    var chairs=modsHTML(papers,toks);
    var rest=papers.filter(function(p){return p.role!=='moderator';});
    var color=displayColor(s);
    var typebadge=s.type?'<span class="stype" style="background:'+color+'">'+esc(displayType(s.type))+'</span>':'';
    var cat=s.category?'<div class="scat">'+hl(s.category,toks)+'</div>':'';
    var open=(state.expandAll||state.q||rest.length<=12)&&(rest.length>0||!!chairs||!!s.description);
    var body=(s.description?'<div class="sdesc">'+descHTML(s.description,toks)+'</div>':'')
      +(chairs?'<div class="mods">'+chairs+'</div>':'')
      +rest.map(function(p){return paperHTML(p,toks);}).join('');
    return '<div class="session'+(open?' open':'')+'" style="border-left-color:'+color+'">'
      +'<div class="shead" style="border-left-color:'+color+'">'
      +'<div class="smeta"><div class="stitle">'+hl(s.title||'(untitled)',toks)+'</div>'
      +cat
      +'<div class="sinfo"><span><b>'+esc(shortDay(s.date))+'</b></span>'
      +(s.time?'<span>'+esc(s.time)+'</span>':'')
      +(s.room?'<span>'+hl(s.room,toks)+'</span>':'')+'</div></div>'
      +typebadge
      +(rest.length?'<span class="pcount">'+rest.length+' talk'+(rest.length>1?'s':'')+'</span>':'')
      +'<span class="caret">&#9656;</span></div>'
      +'<div class="papers">'+body+'</div></div>';
  }

  function render(){
    syncChips();
    var toks=tokenize(state.q);
    var res=el('results');
    var shownSessions=0, shownPapers=0;

    if(state.view==='papers'){
      // flat list of matching papers
      var rows=[];
      SESSIONS.forEach(function(s){
        if(!sessionPasses(s)) return;
        s.papers.forEach(function(p){
          if(!p.title) return;
          if(toks.length && !matchAll(p._hay,toks)) return;
          rows.push({s:s,p:p});
        });
      });
      shownPapers=rows.length;
      rows.sort(function(a,b){
        if(a.s.day!==b.s.day) return a.s.day-b.s.day;
        return (a.s.time||'').localeCompare(b.s.time||'')|| (a.p.start||'').localeCompare(b.p.start||'');
      });
      var html='';
      var lastDay=null;
      rows.forEach(function(r){
        if(r.s.date!==lastDay){ if(lastDay!==null) html+='</div>'; html+='<div class="daygroup"><div class="dayhdr">'+esc(r.s.date)+'</div>'; lastDay=r.s.date; }
        var fcolor=displayColor(r.s);
        html+='<div class="session open" style="border-left-color:'+fcolor+'">'
          +'<div class="shead" style="border-left-color:'+fcolor+'">'
          +'<div class="smeta"><div class="sinfo"><span class="scode">'+esc((r.s.title||'').split(' ')[0])+'</span>'
          +'<span>'+esc(shortDay(r.s.date))+' '+esc(r.s.time||'')+'</span>'
          +(r.s.room?'<span>'+esc(r.s.room)+'</span>':'')
          +(r.s.category?'<span>'+esc(r.s.category)+'</span>':'')+'</div></div>'
          +(r.s.type?'<span class="stype" style="background:'+fcolor+'">'+esc(displayType(r.s.type))+'</span>':'')
          +'</div><div class="papers">'+paperHTML(r.p,toks)+'</div></div>';
      });
      if(lastDay!==null) html+='</div>';
      res.innerHTML = rows.length ? html : emptyHTML();
      el('count').textContent=shownPapers+' presentation'+(shownPapers===1?'':'s')+' match';
      return;
    }

    // grouped by session
    var groups={};
    SESSIONS.forEach(function(s){
      if(!sessionPasses(s)) return;
      // apply search: show only the presentations that match; if instead the
      // match is on the session heading itself, show the whole session.
      var keptPapers=s.papers;
      if(toks.length){
        var paperMatches=s.papers.filter(function(p){return matchAll(p._phay,toks);});
        if(paperMatches.length){
          keptPapers=paperMatches;            // only the matching talks
        }else if(matchAll(s._shay,toks)){
          keptPapers=s.papers;                // the session heading is the match
        }else{
          return;                             // no match at all
        }
      }
      shownSessions++;
      shownPapers+=keptPapers.filter(function(p){return p.title;}).length;
      (groups[s.date]=groups[s.date]||[]).push({s:s,papers:keptPapers});
    });

    var order=Object.keys(groups).sort(function(a,b){return (days[a]||0)-(days[b]||0);});
    var html='';
    order.forEach(function(d){
      html+='<div class="daygroup"><div class="dayhdr">'+esc(d)+'</div>';
      groups[d].sort(function(a,b){return (a.s.time||'').localeCompare(b.s.time||'')|| (a.s.room||'').localeCompare(b.s.room||'');});
      groups[d].forEach(function(g){html+=sessionHTML(g.s,toks,g.papers);});
      html+='</div>';
    });
    res.innerHTML = shownSessions ? html : emptyHTML();
    el('count').textContent=shownSessions+' session'+(shownSessions===1?'':'s')+', '+shownPapers+' presentation'+(shownPapers===1?'':'s');

    // click to expand/collapse
    Array.prototype.forEach.call(res.querySelectorAll('.shead'),function(h){
      h.onclick=function(e){if(e.target.classList.contains('abslink'))return;h.parentNode.classList.toggle('open');};
    });
    wireAbstracts(res);
  }

  function wireAbstracts(root){
    Array.prototype.forEach.call(root.querySelectorAll('.absbtn'),function(b){
      b.onclick=function(e){
        e.stopPropagation();
        var box=b.parentNode.parentNode.querySelector('.absbox');
        if(box){var on=box.classList.toggle('show');b.classList.toggle('on',on);}
      };
    });
    // when searching, auto-open abstracts that contain a highlighted match
    if(state.q){
      Array.prototype.forEach.call(root.querySelectorAll('.absbox'),function(box){
        if(box.querySelector('mark')){box.classList.add('show');
          var b=box.parentNode.querySelector('.absbtn'); if(b)b.classList.add('on');}
      });
    }
  }

  function emptyHTML(){
    return '<div class="empty">No results for <b>'+esc(state.q)+'</b>.<br>Try fewer or different words, or clear the filters.</div>';
  }

  render();
  q.focus();
})();
</script>
</body>
</html>
