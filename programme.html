 increments across the channels. Experimental results confirm controlled differential delay and reconfigurable filtering.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1326_1.pdf"}]},{"sessionid":"5538480","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"11:00-12:30","room":"PV-R Multipurpose room","type":"Contributed session","typeColor":"#e4dfec","category":"SC 04: Signal processing for optical communication and sensing","title":"We2-I Advanced signal processing and real-time implementations","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Hae Young Rha","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#52 / We2-I1","title":"Real-Time 100G Burst-Mode Coherent Receiver with Convergence-Free DSP","speaker":"Tao Zeng","affiliation":"(1)\tState Key Laboratory of Optical Communication Technologies and Networks, China Information and Communication Technology Group Corporation","authors":"Tao  Zeng, Yimei  Pan, Chen  Wang, Te  ke, Botao  yang, Ziye  zhong, Ziqing  Liu, Ming  Luo, Ming  Li, Xi  Xiao, Hanbing  Li","start":"11:00","end":"","abstractid":209883,"order":1,"abstract":"Abstract (summary)  We demonstrate a real-time 100G burst-mode coherent receiver with convergence-free DSP eliminating burst-start convergence. Fast impairments are resolved feedforward, while slow effects use pre-initialized channel states with adaptive refinement. Immediate acquisition is achieved under ±100 ppm asynchronous operation, with −30 dBm sensitivity without optical amplification.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-52.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Manabu Arikawa","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#380 / We2-I2","title":"Low-Complexity FPGA Implementation of Rate-Adaptive Hierarchical Distribution Matcher","speaker":"Zulin Liu","affiliation":"Beijing University Of Posts and Telecommunications","authors":"Zulin  Liu, Yan  Li, Yaning  Sun, Pengpeng  Wei, Shuai  Wei, Xiaoting  Sun, Jian  Wu","start":"11:15","end":"","abstractid":211224,"order":2,"abstract":"Abstract (summary)  We propose a modified hierarchical distribution matching architecture that enables flexible transmission rate adjustment with low complexity and fine rate granularity in a rate-adaptive probabilistic shaping system, achieving real-time line rate adjustment from 96 Gb/s to 179.2 Gb/s on a single FPGA.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-380.pdf"},{"role":"speaker","rolename":"Contributed","code":"#476 / We2-I3","title":"Parallel DSP Architecture with Pilot Aggregation for Real-Time MIMO Equalization Enabling Fast Polarization Tracking","speaker":"Syoma Miura","affiliation":"Graduate School of Engineering Science, The University of Osaka","authors":"Syoma  Miura, Yohei  Koganei, Koji  Igarashi","start":"11:30","end":"","abstractid":211476,"order":3,"abstract":"Abstract (summary)  We propose a parallel DSP architecture for MIMO equalization where pilot samples are aggregated into a single parallel channel, enabling fast polarization tracking. FPGA-based evaluation shows that the proposed method significantly reduces circuit resources while achieving delay below 6 ns, demonstrating suitability for real-time implementation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-476.pdf"},{"role":"speaker","rolename":"Contributed","code":"#117 / We2-I4","title":"AI-core Enabled Real-time 2.0-Tbit/s Coherent Transceiver Operating at 234 Gbaud","speaker":"Xuefeng Tang","affiliation":"Huawei Technologies Canada","authors":"Xuefeng  Tang, Shengming  Ma, Zhikui  Yong, Wenyi  Hu, Ge  Gao, Zhiyu  Xiao, Shuangyuan  Wu, Minggang  Si, Zhuhong  Zhang","start":"11:45","end":"","abstractid":210641,"order":4,"abstract":"Abstract (summary)  We demonstrate a real-time coherent transceiver operating at a baud rate of 234 Gbaud. The transceiver incorporates advanced ASIC-implemented DSP algorithms and an integrated AI core, delivering sufficient performance margin to support transmission over a 60-km SSMF link.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-117.pdf"},{"role":"speaker","rolename":"Contributed","code":"#258 / We2-I5","title":"Completely Optical-Filterless Comb-Based Transmitter with a Relaxed Clock Rate for Multi-Tbps Single-Carrier Transmission","speaker":"Hiroshi Yamazaki","affiliation":"NTT, Inc.","authors":"Hiroshi  Yamazaki, Josuke  Ozaki, Yoshihiro  Ogiso, Masanori  Nakamura, Kohki  Shibahara, Takayuki  Kobayashi, Toshikazu  Hashimoto, Yutaka  Miyamoto","start":"12:00","end":"","abstractid":210988,"order":5,"abstract":"Abstract (summary)  We demonstrate a transmitter architecture that optically extends signal bandwidth without any filtering of the comb lines. A digital spectral weaver with half the conventional frequency-division spacing halves the clock rate required for comb generation. Up to 2.9-Tbps single-carrier transmission is achieved with 320-GBaud signaling.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-258.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1020 / We2-I6","title":"First-Ever Burst-Capable Adaptive Optical Signal Processor for Next-Generation PON Upstream Links","speaker":"Giannis Kanakis","affiliation":"","authors":"George  Brestas, Christoph  Füllner, Robert  Borkowski, Maria  Spyropoulou, Dimitris  Apostolopoulos, Giannis  Kanakis, Hercules  Avramopoulos","start":"12:15","end":"","abstractid":212218,"order":6,"abstract":"Abstract (summary)  We experimentally demonstrate the first optical signal processor compatible with burst-mode upstream reception in Passive Optical Networks. The processor integrated in Indium Phosphide enables nanosecond-scale reconfiguration, performs equalization and noise suppression, and may potentially reduce complexity and power consumption of US digital signal processing.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1020.pdf"}]},{"sessionid":"5538491","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"12:30-14:00","room":"","type":"Lunch","typeColor":"black","category":"","title":"Lunch","description":"","goal":"","papers":[]},{"sessionid":"5538614","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"12:30-14:00","room":"C1.4 Conference room 1.4","type":"Special Events","typeColor":"","category":"","title":"WeL-E Women in photonics: \"WIP-BEAM: Women in Photonics-Bridging Excellence and Advancement through Mentorship\"","description":"Panelists:\tLena Wosinska (Chalmers University, Sweden)\tLena Wosinska received her PhD degree in Photonics and Docent degree in Optical Networks from KTH Royal Institute of Technology, Sweden where she established and led a widely recognized research group working on optical networks. At KTH she was a Full Professor of Telecommunication until October 2018. Currently she is a Research Professor with the Chalmers University of Technology, Sweden, where she moved together with her team. Her research broadly concerns optical communications and networks, including fiber access and 5G/6G transport networks, energy and cost efficiency, optical data center networks, photonics in switching, network control, reliability, security, and survivability incl. application of ML/AI. She was involved and had a leading role in several EU projects, as well as coordinating national and international research projects. She has been involved in many expert assignments, including serving in the panels evaluating research project proposals for many funding agencies, guest editorships of leading IEEE, OSA, Elsevier and Springer journals, serving as General Chair and Co-Chair of several IEEE, OSA and SPIE conferences and workshops. She has been an Associate Editor of OSA Journal of Optical Networking and IEEE/OSA Journal of Optical Communications and Networking, Springer Photonic Networks Communication Journal and of Wiley Transactions on Emerging Telecommunications Technologies. Currently she is serving on the Editorial Board of IEEE Communications Magazine. She received IEEE ComSoc ONTC Outstanding Technical Achievement Award 2021 for Pioneering Research in Optical Networks and Jane M. Simmons Memorial Speakership Award 2025 for the numerous contributions to optical networking research and for mentoring and inspiring a generation of leaders in optical networking.\tOlga Vassilieva (Fujitsu, USA)\tOlga Vassilieva received the M.S. degree in physics from Moscow State University, Moscow, Russia, in 1988 and the Ph.D. degree in physics from The University of Texas at Dallas, Dallas, TX, USA, in 1999. She is a research scientist in the Advanced Technology Laboratory at 1Finity Americas, Inc., Dallas, TX, USA. Her research focuses on high bit-rate coherent optical transmission systems, advanced optical modulation formats, techniques for mitigating fiber transmission impairments, and the advantages and practical implementation of hollow-core fiber. Before joining 1Finity Americas, Inc., she held research positions at Fujitsu Network Communications, USA, and Fujitsu Laboratories of America, USA. Dr. Vassilieva is a Senior Member of IEEE and has authored or co-authored numerous scientific papers. She currently serves as Chair of the S3 Subcommittee for OFC 2027 and as an Associate Editor of the Journal of Lightwave Technology. She previously served as a technical program committee member for OFC 2025/2026 and CLEO-PR 2022.\tAnna Tzanakaki (National and Kapodistrian University of Athens, Greece)\tAnna Tzanakaki is a Professor at the National and Kapodistrian University of Athens, Greece where she is leading the “Systems and Networks” Research Group. Previously she was an Associate Professor at the Athens Information Technology (AIT) Center, Greece and an adjunct faculty member of the Information Networking Institute of Carnegie Mellon University, USA. Her research interests include network architectures and design and over the past 10 years has focused on 5G and 6G infrastructures. She has been and is actively participating in a number of EU research projects, has served as the technical coordinator of the 5G PPP projects 5G-PICTURE and 5G-VICTORI, and is currently the Project and Technical coordinator of the EU DEP projects 5G-TACTIC focusing on 5G Security. She is a co-author of over 250 publications and co-inventor of several granted and published patents. She is the recipient of the OPTICA Jane Simmons speakership award 2024 for her contribution to optical and converged network research.","goal":"","papers":[{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Carmen Mas Machuca","affiliation":"University of the Bundeswehr Munich","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Anjali Sharma","affiliation":"University of the Bundeswehr Munich","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"moderator","rolename":"Panelist","code":"#0 /","title":"","speaker":"Lena Wosinska","affiliation":"Chalmers University of Technology","authors":"","start":"","end":"","abstractid":null,"order":3},{"role":"moderator","rolename":"Panelist","code":"#0 /","title":"","speaker":"Olga Vassilieva","affiliation":"1Finity Americas, Inc","authors":"","start":"","end":"","abstractid":null,"order":4},{"role":"moderator","rolename":"Panelist","code":"#0 /","title":"","speaker":"Anna Tzanakaki","affiliation":"National and Kapodistrian University of Athens, Greece","authors":"","start":"","end":"","abstractid":null,"order":5}]},{"sessionid":"5538449","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"14:00-15:30","room":"A1 Auditorium 1","type":"Invited and contributed","typeColor":"#fce5cd","category":"SC 06: Architecture, modelling and performance of optical networks","title":"We3-A Switching architectures in optical networks","description":"","goal":"","papers":[{"role":"speaker","rolename":"Invited","code":"#1407 / We3-A1","title":"Automated Performance Optimization for Data Center Exchange over Open Optical Networks: Challenges and Future Perspectives","speaker":"Toru Mano","affiliation":"NTT, inc.","authors":"Toru  Mano, Hideki  Nishizawa, Yoshiaki  Sone, Koichi  Takasugi","start":"14:00","end":"14:30","abstractid":213016,"order":1,"abstract":"Abstract (summary)  This paper addresses data center exchange optimization over open optical networks under physical-layer uncertainty. A 300-km field experiment showed that a digital-twin framework combining physical models, digital longitudinal monitoring, and optical line system calibration can characterize unknown resources, optimize settings, and enable rapid optical-path provisioning.","pdf":"/static/upload/ow193/events/ev667/abssub/main_15.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Camille Delezoide","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1356 / We3-A2","title":"Evaluating Hyperconnected Optical Core Networks Under Future Traffic Requirements","speaker":"Mirko Nicolás Zitkovich","affiliation":"Universität der Bundeswehr München","authors":"Mirko  Zitkovich, Christofer  Vásquez, Anjali  Sharma, Carmen  Mas-Machuca","start":"14:30","end":"","abstractid":212578,"order":2,"abstract":"Abstract (summary)  As optical core networks are expected to evolve toward hyperconnected topologies, understanding their trade-offs becomes critical. This work evaluates traffic redistribution, fiber deployment, and quality of transmission, showing that hyperconnectivity relieves resource pressure with relatively low signal penalties but increases transponder requirements.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1356.pdf"},{"role":"speaker","rolename":"Contributed","code":"#637 / We3-A3","title":"Optimizing 800G IPoWDM Architectures through Optical Bypass, Thin Transponders and Proprietary Channel Modulation","speaker":"Annalisa Morea","affiliation":"Nokia","authors":"Annalisa  Morea, Thierry  Zami, Bruno  Lavigne, Nicola  Rossi","start":"14:45","end":"","abstractid":211790,"order":3,"abstract":"Abstract (summary)  This work highlights the value of IPoWDM architectures with optical bypass, describing when Thin Transponders as regenerators and 800G ZR+ optical pluggable proprietary mode significantly improve energy efficiency—30% average—while optimizing interface deployment and maximizing traffic across core WDM networks.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-637.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Renato Ambrosone","affiliation":"Politecnico Di Torino","authors":"","start":"","end":"","abstractid":null,"order":3},{"role":"speaker","rolename":"Contributed","code":"#918 / We3-A4","title":"Network-Level Impact of EDFA Gain Fluctuations under Dynamic RWA in High-Symbol-Rate WDM Networks","speaker":"Taisei Sekizuka","affiliation":"Nagoya University","authors":"Taisei  Sekizuka, Shunya  Shimoi, Takuma  Kuno, Hiroshi  Hasegawa, Yojiro  Mori","start":"15:00","end":"","abstractid":212111,"order":4,"abstract":"Abstract (summary)  We investigate EDFA gain fluctuations under dynamic RWA through network simulations, experimental characterisation, and transmission evaluation in high-symbol-rate WDM networks. Results reveal increased intra-link fibre utilisation variation, gain-profile distortion, and accumulated Q-factor degradation, highlighting EDFA gain fluctuations as a non-negligible impairment in such optical networks.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-918.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1056 / We3-A5","title":"Network-Wide Deployment of Pluggable Transceivers with Selective Wavelength Routing and Path-Splitting Regeneration","speaker":"Shunya Shimoi","affiliation":"Nagoya University","authors":"Shunya  Shimoi, Taisei  Sekizuka, Takuma  Kuno, Yojiro  Mori, Kohei  Hosokawa, Shigeyuki  Yanagimachi, Hiroshi  Hasegawa","start":"15:15","end":"","abstractid":212256,"order":5,"abstract":"Abstract (summary)  We propose an architecture for regional and core networks that combines low-loss optical bypass at FXCs with regeneration at selected WXCs, enabling end-to-end connectivity using only ZR+ pluggable transceivers even with their limited transmission reach. Simulations show lower transceiver cost with modest fibre penalty.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1056.pdf"}]},{"sessionid":"5538453","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"14:00-15:00","room":"A2 Auditorium 2","type":"Tutorial","typeColor":"#f4cccc","category":"SC 03: Photonic integrated circuits, assemblies and packaging","title":"We3-B Integration of magneto-optics","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Claudio Porzi","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Tutorial","code":"#1421 / We3-B1","title":"Nonreciprocal integrated magneto-optics: from optical isolators to new applications in communications, sensing, and computing","speaker":"Paolo Pintus","affiliation":"University of Cagliari","authors":"Paolo  Pintus","start":"14:00","end":"15:00","abstractid":213408,"order":1,"abstract":"Abstract (summary)  Magneto-optic materials exhibit the nonreciprocal capability to control the amplitude, phase, and polarization of light with an external magnetic field. In this tutorial, I will highlight recent progress in their integration and explore emerging applications across communications, sensing, and next-generation computing paradigms. ©2026 The Author","pdf":"/static/upload/ow193/events/ev667/abssub/2026_ECOC_Pintus_Tutorial_1.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"António Teixeira","affiliation":"PICadvanced SA","authors":"","start":"","end":"","abstractid":null,"order":2}]},{"sessionid":"5538457","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"14:00-15:30","room":"E1 Exhibition room 1","type":"Invited","typeColor":"#FFCCFF","category":"SC 12: CLEO® Special Session on Emerging Trends in Optics and Photonics","title":"We3-C On-chip light emission and detection","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Daniel Benedikovic","affiliation":"University of Zilina","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#0 /","title":"We3-C1 Coherent and silicon photonics: a marriage for the long and short haul","speaker":"Chris Doerr","affiliation":"","authors":"","start":"14:00","end":"14:30","abstractid":null,"order":1},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Carlos Alonso Ramos","affiliation":"C2N, CNRS","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Invited","code":"#1500 / We3-C2","title":"The Development of Avalanche Photodetectors for Silicon Photonics","speaker":"Andrew Knights","affiliation":"McMaster University","authors":"Greg  Thomas, Feng  Guo, Andrew P.  Knights","start":"14:30","end":"15:00","abstractid":218812,"order":4,"abstract":"Abstract (summary)  Avalanche Photodetection provides an efficient means to maintain a link budget for a photonic system. For silicon photonics there exist multiple device geometries, which are summarised here. We show that in the case of defect mediated detection, elevated temperature operation leads to improved performance.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC Knights APD.pdf"},{"role":"speaker","rolename":"Invited","code":"#1396 / We3-C3","title":"Recent progress on III-V on Si photonic transmitters","speaker":"Joan Ramirez Ramirez","affiliation":"Nokia Bell Labs / III-V Lab","authors":"Joan Manel  Ramirez, Mourad  Azhar, Mokhtar  Korti, Imane  Ben-Mokhtar, Delphine  Neel, Claire  Besancon, Fabrice  Blache, Filipe  Jorge, Stephane  Malhouitre, Karim  Hassan","start":"15:00","end":"","abstractid":212822,"order":5,"abstract":"Abstract (summary)  We demonstrate InP-based high-speed EML-SOA transmitters integrated on silicon photonics using a single heterostructure based on AlGaInAs multi-quantum wells. Devices show a fiber-coupled modulated output power of 2 dBm, a static extinction ratio over 25 dB and a BER below the HD-FEC at 58 Gbps.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Ramirez_v5.pdf"}]},{"sessionid":"5538461","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"14:00-15:30","room":"C1.1 Conference room 1.1","type":"Invited and contributed","typeColor":"#e4dfec","category":"SC 04: Signal processing for optical communication and sensing","title":"We3-D Signal processing for high-speed IMDD","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Manabu Arikawa","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1343 / We3-D1","title":"PAM12 Modulation Coding Options Enabling High-Speed IM/DD Transmission in Bandwidth-Limited Systems","speaker":"Suttikarn Wantee","affiliation":"University of Southampton","authors":"Suttikarn  Wantee, Kyle  Bottrill, Hilmi  Othman, Douglas  Mcculloch, Hao  Liu, Periklis  Petropoulos","start":"14:00","end":"","abstractid":212565,"order":1,"abstract":"Abstract (summary)  We investigate two-dimensional bit-mapping for PAM12 transmission, identifying a valid solution for Gray coding. We experimentally demonstrate its performance in a 203 Gbit/s PAM12 transmission over 2-km single-mode fibre, showing the feasibility of high-order PAM for reduced electrical bandwidth utilisation and improved spectral efficiency.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1343.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Hae Young Rha","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#418 / We3-D2","title":"Resonant Plasmonic Optical DAC for Low-Power IM/DD Links","speaker":"David Moor","affiliation":"ETH Zurich Institute of Electromagnetic Fields (IEF)","authors":"David  Moor, Samuel  Hess, Daniel  Rieben, Annina  Moser, Sonia  Fernandes, Matthew  Garrett, Benedikt  Baeuerle, Wolfgang  Heni, Konstantinos  Moschopoulos, Christos  Christofidis, Moshe  Nazarathy, Ioannis  Tomkos, Juerg  Leuthold","start":"14:15","end":"","abstractid":211305,"order":2,"abstract":"Abstract (summary)  We experimentally demonstrate low-power intensity-modulated links utilizing optical digital-to-analog converters (DACs) based on resonantly enhanced plasmonic devices. By enabling amplitude multiplexing in the optical domain, this approach supports transmission with reduced processing com-plexity, achieving rates up to 336 Gb/s/POL/𝜆.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-418.pdf"},{"role":"speaker","rolename":"Contributed","code":"#579 / We3-D3","title":"Photonic-Electronic Arbitrary-Waveform Generation Enabling 276 GBd Electrical and 260 GBd Optical PAM4 Signaling","speaker":"Daniel Drayss","affiliation":"Karlsruhe Institute of Technology (KIT)","authors":"Daniel  Drayss, Lennart  Schmitz, Dengyang  Fang, David  Winter, Yongchao  Xu, Alexander  Kotz, Yu  Zhang, Yuqi  Zhao, Dominick  Scordo, Haïk  Mardoyan, Jeremie  Renaudier, Mian  Zhang, Wolfgang  Freude, Sebastian  Randel, Christian  Koos","start":"14:30","end":"","abstractid":211712,"order":3,"abstract":"Abstract (summary)  We demonstrate 276 GBd electrical PAM4 signaling using a photonic–electronic arbitrary‑waveform generator (PE‑AWG). We validate the concept in optical signaling experiments with thin‑film lithium‑niobate Mach-Zehnder modulators, achieving PAM4 symbol rates up to 236 GBd in the O‑band and 260 GBd in the C‑band.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-579.pdf"},{"role":"speaker","rolename":"Contributed","code":"#382 / We3-D4","title":"Peak Amplitude Constrained Linear Pre-Equalization Design Method for Intensity Modulation and Direct Detection Systems","speaker":"Wouter Lanneer","affiliation":"Nokia Bell Labs","authors":"Wouter  Lanneer, Christoph  Füllner, Michiel  Verplaetse","start":"14:45","end":"","abstractid":211227,"order":4,"abstract":"Abstract (summary)  We propose a novel design method for linear transmit-side pre-equalization in IM/DD systems that takes DAC peak amplitude constraints directly into account. Experimental 100G PON results demonstrate a loss budget improvement of 4.3 dB for PAM2 compared to conventional methods while utilizing fewer filter taps.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-382-update.pdf"},{"role":"speaker","rolename":"Invited","code":"#323 / We3-D5","title":"Direct Detection with High Electrical Spectral Efficiency","speaker":"Yikai Su","affiliation":"Shanghai Jiao Tong University","authors":"Yikai  Su, Jingchi  Li, Haoshuo  Chen, William  Shieh","start":"15:00","end":"","abstractid":211116,"order":5,"abstract":"Abstract (summary)  Carrier assisted direct detection receiver can reconstruct the optical field of a complex-valued double-sideband signal, thus achieving a high electrical spectral efficiency comparable to that of a coherent homodyne receiver, while eliminating the need for a costly local oscillator laser.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Su.pdf"}]},{"sessionid":"5538465","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"14:00-15:15","room":"C1.4 Conference room 1.4","type":"Invited and contributed","typeColor":"#dce6f1","category":"SC 07: Optical networks for access, mobile X-haul, in-building, and intra-datacentre interconnects","title":"We3-E Innovations in high capacity, short reach links","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Michela Svaluto Moreolo","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#245 / We3-E1","title":"2.4 Tb/s OCS-based Intra-to-Inter Datacentre IM/DD Links Over 54-km MCF Using Sub-pJ/bit Membrane DML Arrays","speaker":"Nikolaos Panteleimon Diamantopoulos","affiliation":"NTT, Inc.","authors":"Nikolaos Panteleimon  Diamantopoulos, Ruben  Luis, Satoshi  Shinada, Daniele  Orsuti, Takuro  Fujii, Hidetaka  Nishi, Tomonari  Sato, Hideaki  Furukawa, Shinji  Matsuo","start":"14:00","end":"","abstractid":210973,"order":1,"abstract":"Abstract (summary)  We demonstrate a high-bandwidth, low-latency, OCS-based WDM+SDM O-band IM/DD link for AI datacentre scale-across networking, spanning SR-to-ER distances without OEO conversion. Net 2.4 Tb/s is achieved over a heterogeneous 54-km MCF link using sub-pJ/bit membrane DML arrays, extending energy-efficient intra-datacentre DML transmitters to metro-DCI reach.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-245.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Oded Raz","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#877 / We3-E2","title":"Single-SMF Bidirectional Up-to-180GBd & 400Gb/s IM-DD Links Utilizing Optoelectronic equalization (OE-EQ) with Direction-, Wavelength- and Baudrate-shared Simple Optics","speaker":"Paikun Zhu","affiliation":"National Institute of Information and Communications Technology","authors":"Paikun  Zhu, Yuki  Yoshida, Satoshi  Shinada, Ken-Ichi  Kitayama","start":"14:15","end":"","abstractid":212069,"order":2,"abstract":"Abstract (summary)  We demonstrate record single-SMF bidirectional IM-DD transmissions of 180GBd/lane 50km, 320Gb/s/lane 30km and 400Gb/s 20km in C-band with standard PAM formats. It is enabled by a bidirectional OE-EQ technique with shared low-complexity optics supporting both directions, different wavelengths & baud-rates.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-877.pdf"},{"role":"speaker","rolename":"Invited","code":"#1404 / We3-E3","title":"Accelerating the Terabit Breakthrough: Defining the Future of Ultra-High-Speed Ethernet","speaker":"John Francis D'Ambrosia","affiliation":"Futurewei, U.S. Subsidiary of Huawei","authors":"John  D'Ambrosia","start":"14:30","end":"","abstractid":213009,"order":3,"abstract":"Abstract (summary)  Ethernet is accelerating to meet the extreme scale‑up and scale‑out demands of AI back‑end fabrics. IEEE 802.3dj’s 200 Gb/s–1.6 Tb/s solutions are already reshaping architectures, and the IEEE 802.3 Working Group is assessing requirements beyond 200 Gb/s to power the next wave of AI systems","pdf":"/static/upload/ow193/events/ev667/abssub/DAmbrosia_Manuscript_ECOC.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1329 / We3-E4","title":"Demonstration and Study of Silicon-Photonics-Based 720-Gbps Dual-polarization IMDD","speaker":"Chris Doerr","affiliation":"","authors":"Ying  Zhao, Christopher  Doerr, Howard  Chan, Fatemeh  Vanani, Makoto  Takeshita","start":"15:00","end":"","abstractid":212551,"order":4,"abstract":"Abstract (summary)  A 720-Gbps dual-polarization (DP) IMDD system including a 180-GBd PAM4 transmitter and a Stokes polarization demultiplexer is demonstrated.  Employed PICs are comprised entirely of silicon-photonics. Demultiplexed eye diagrams are presented for homodyne and heterodyne schemes.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1329.pdf"}]},{"sessionid":"5538469","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"14:00-15:15","room":"C2.1 Conference room 2.1","type":"Contributed session","typeColor":"#c9daf8","category":"SC 09: Free-space optics and optical wireless technologies","title":"We3-F Integrated optical sensing and communications systems","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Amalia Miliou","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#90 / We3-F1","title":"Experimental Demonstration of a Mid-IR Free Space Link for Simultaneous Gas Sensing and Adaptive Communication","speaker":"Wing Ko","affiliation":"University of Southern California","authors":"Yue  Zuo, Zile  Jiang, Abdulrahman  Alhaddad, Wing  Ko, Huibin  Zhou, Yixuan  Zhang, Moshe  Tur, Alan E.  Willner","start":"14:00","end":"","abstractid":210483,"order":1,"abstract":"Abstract (summary)  We demonstrate an OFDM-based mid-IR free-space link at ~3.3 μm for simultaneous multi-gas sensing and coherent communication. We show sensing results with <15% error in gas concentration, and the sensing-informed adaptive loading enables ~60-Gbit/s OFDM transmission.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-90.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Volker Jungnickel","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#941 / We3-F2","title":"Integrated Mid-Infrared Ranging and Free-Space Communication using a Low-Threshold Directed-Modulated QCL","speaker":"Zhidong Lyu","affiliation":"Zhejiang University","authors":"Zhidong  Lyu, Yuhang  Zhang, Yang  Cheng, Zhecheng  Dai, Tianyu  Jiang, Richard  Schatz, Yan-Ting  Sun, Toms  Salgals, Sandis  Spolitis, Yuheng  Cao, Zhuoyan  Zhang, Vjaceslavs  Bobrovs, Lu  Zhang, Xianbin  Yu, Oskars  Ozolins, Baile  Chen, Jun  Wang, Xiaodan  Pang","start":"14:15","end":"","abstractid":212134,"order":2,"abstract":"Abstract (summary)  We report the first system-level MWIR FSO integrated sensing and communication (ISAC) demonstration at 4.52 μm, combining a low-lasing-threshold directly modulated QCL with an uncooled UTC-PD, achieving 4.28 Gb/s data transmission with ~4.0 cm ranging resolution.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-941.pdf"},{"role":"speaker","rolename":"Contributed","code":"#178 / We3-F3","title":"Hz-to-kHz Range Vibration Sensing in a 2.53 Tb/s FSO System","speaker":"Keisuke Matsuda","affiliation":"Mitsubishi Electric Corporation","authors":"Keisuke  Matsuda, Chenrui  Xu, Samuel  Hess, Laurenz  Kulmer, Tobias  Blatter, Taichiro  Fukui, Juerg  Leuthold","start":"14:30","end":"","abstractid":210813,"order":3,"abstract":"Abstract (summary)  Detection of 4 Hz to 2 kHz vibration of a transmitter was demonstrated using forward-transmitted communication signal by measuring the Doppler frequency shift. In an anomaly detection scenario of a tower, abnormal vibration reproduced from field data was detected while transmitting a 2.53 Tb/s capacity.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-178.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1108 / We3-F4","title":"A Silicon Photonic Integrated Quasi-Monostatic Focal-Plane-Array FMCW LiDAR","speaker":"Guillaume Croes","affiliation":"imec","authors":"Guillaume  Croes, Mathias  Prost, Manuel  Reza, Ziduo  Lin, Javier  Perez Santacruz, Pawel  Bembnowicz, Elbert  Bechthum, Brecht  Berteloot, Esteban  Venialgo, Wenjing  Tian, Jac  Romme, Erik  Emmen, Jochem  Govers, Maliheh  Ramezani, Peter  O'Brien, Christian  Bachmann, Joost  Brouckaert, Ruud  Oldenbeuving, Roelof  Jansen, Dongjae  Shin, Peter  Gerets, Huaqing  Qiu, Marcus  Dahlem","start":"14:45","end":"","abstractid":212313,"order":4,"abstract":"Abstract (summary)  We present a solid-state quasi-monostatic FMCW LiDAR realized on a 200-mm silicon photonics platform, integrating a 32 ×16 focal-plane-array transceiver that enables 20 m ranging and imaging of real-world targets with only 200 µW optical emission per pixel.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1108.pdf"},{"role":"speaker","rolename":"Contributed","code":"#232 / We3-F5","title":"158° Wide-FoV Photomultiplier-Assisted Reception for Bent-Pipe Visible-Light Communication","speaker":"Bernhard Schrenk","affiliation":"AIT Austrian Institute of Technology","authors":"Bernhard  Schrenk","start":"15:00","end":"","abstractid":210958,"order":5,"abstract":"Abstract (summary)  A silicon photomultiplier is explored as spatial-diversity receiver. Its wide field-of-view enables end-to-end VLC links between end-points that do not share a direct line-of-sight connection. Towards that, LiDAR point-cloud transmission is shown around an obstructing building.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-232.pdf"}]},{"sessionid":"5538473","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"14:00-15:30","room":"C2.2 Conference room 2.2","type":"Contributed session","typeColor":"#d9ead3","category":"SC 08: Sensing and microwave photonics","title":"We3-G Subsea fiber sensing and advanced interrogation techniques","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Steinar Bjørnstad","affiliation":"Tampnet AS","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1204 / We3-G1","title":"Long-Term Measurements from a North-Atlantic Deep-Ocean Observatory on Dual Telecom Cables","speaker":"Mikael Mazur","affiliation":"Nokia Bell Labs","authors":"Mikael  Mazur, Nicolas K.  Fontaine, Roland  Ryf, Martin  Karrenbach, Valey  Kamalov, Lauren  Dallachiesa, Ethan F.  Williams, Arnar I.  Gunnarsson, Orn  Jonsson, Andre A  Hlynsson, Sigurdur  Hlynsson, Jeewan  Nail, Ajay  Mistry, David  Winter, Haoshuo  Chen, Angel  Ruiz-Angulo, Vala  Hjorleifsdottir, David T.  Neilson","start":"14:00","end":"","abstractid":212410,"order":1,"abstract":"Abstract (summary)  We report one year of continuous data from the IRIS cable and six months from a trans-Atlantic cable. Using per-span interferometry, this >150-sensor deep-ocean observatory successfully captured concurrent seismic signals, Spring-Neap ocean tides, deep-sea turbulence, and long-term drift.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1204.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Ming-Fang Huang","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#543 / We3-G2","title":"Sea-Scan: High-Accuracy, ML-based Dark Vessel Detection and Localisation via Weakly Supervised DAS Monitoring","speaker":"Tian Tian","affiliation":"ADAPT Centre, School of Computer Science and Statistics, Trinity College Dublin","authors":"Tian  Tian, Agastya  Raj, Lara  Flanagan, John  Kennedy, Marco  Ruffini","start":"14:15","end":"","abstractid":211660,"order":2,"abstract":"Abstract (summary)  We present an ML-based vessel detection and localization system, trained with weak supervision from imperfect AIS labels, that achieves a 97.8% detection rate at 1.98% false-trigger rate, successfully identifies dark-vessel events from unlabeled data.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-543.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1185 / We3-G3","title":"SOP Sensing in Hollow-Core Fiber: Forward Sensing using COTS Transponder and Localization with Coherent OTDR","speaker":"Adrish Sahu Sahu","affiliation":"Nokia Bell Labs","authors":"Adrish  Sahu, Rajiv  Boddeda, Arnaud  Dupas, Carina  Castineiras Carrero, Haik  Mardoyan, Sterenn  Guerrier, Matteo  Lonardi, Javier  Errea Moreno, Peng  Li, Shuhaui  Li, Lei  Zhang, Jie  Luo, Daniel  Peterson, Jeremie  Renaudier","start":"14:30","end":"","abstractid":212391,"order":3,"abstract":"Abstract (summary)  We experimentally investigate and compare distributed state‑of‑polarization sensing in support‑tube hollow‑core and standard single‑mode fiber. Despite significantly weaker Rayleigh backscattering and reduced polarization sensitivity in hollow‑core fiber, polarization perturbations remain observable and spatially localizable, demonstrating the feasibility of SOP‑based distributed sensing in hollow‑core fiber.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1185.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1124 / We3-G4","title":"Characterization of a 10.9-km Hollow-Core Fiber with 920-um Resolution Using a 10-kHz-Linewidth Tunable Laser Source","speaker":"Xun Guan","affiliation":"Tsinghua University Shenzhen International Graduate School","authors":"Yufeng  Wang, Xu  Zhang, Zecong  Liu, Rui  Jiang, Zhixue  He, Xinke  Tang, Xun  Guan","start":"14:45","end":"","abstractid":212329,"order":4,"abstract":"Abstract (summary)  Based on the noise model of optical frequency-domain reflectometry (OFDR), our analysis indicates that lower reflection relaxes the linewidth requirement of the tunable laser source (TLS). We experimentally characterize a 10.9-km hollow-core fiber (HCF) with 920-um resolution using a 10-kHz-linewidth TLS. ©2026 The Author(s)","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1124.pdf"},{"role":"speaker","rolename":"Contributed","code":"#794 / We3-G5","title":"Sensitivity Comparison of Microwave-Frequency and Optical Fibre Interferometry Based on State-of-the-Art Components","speaker":"Georgios Aias Karydis","affiliation":"Department of Informatics and Computer Engineering, University of West Attica","authors":"Georgios Aias  Karydis, Marco  Fasano, Paola  Parolari, Pierpaolo  Boffi, Charis  Mesaritakis, Adonis  Bogris","start":"15:00","end":"","abstractid":211977,"order":5,"abstract":"Abstract (summary)  We compare the sensitivity of fibre interferometers to vibrations using microwave oscillators and state-of-the-art lasers over distances up to 70 km. High spectral purity lasers outperform only above 10 Hz, highlighting microwave advantages at low frequencies and the potential of hybrid microwave–optical interferometry systems.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-794.pdf"},{"role":"speaker","rolename":"Contributed","code":"#764 / We3-G6","title":"Multiple FBG Thermometry using a Dual-Comb Interrogator","speaker":"Clara Quevedo-Galán","affiliation":"CEMDATIC - Universidad Politécnica de Madrid","authors":"Clara  Quevedo-Galán, Javier  Madrigal, David  Barrera, José Manuel  G. Tijero, Salvador  Sales, Vicente  Durán, Antonio  Pérez-Serrano","start":"15:15","end":"","abstractid":211940,"order":6,"abstract":"Abstract (summary)  Fiber Bragg grating sensing benefits from dual‑comb interrogation, enabling faster measurements and enhanced resolution. We demonstrate quasi-distributed dual-comb thermometry based on gain-switched multimode lasers. The approach enables the sequential interrogation of multiple FBGs, expanding the spectral coverage of the sensor and achieving 30 mK precision.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-764.pdf"}]},{"sessionid":"5538477","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"14:00-15:15","room":"E2 Exhibition room 2","type":"Contributed session","typeColor":"#d0e0e3","category":"SC 05: Optical transmission systems","title":"We3-H HCF systems","description":"","goal":"","papers":[{"role":"speaker","rolename":"Contributed","code":"#828 / We3-H1","title":"202-km Single-Span 200-GBd C-Band IM/DD Transmission over Hollow-Core Fibre Using a SiN Integrated Recurrent Optical Spectrum Slicer","speaker":"Periklis Petropoulos","affiliation":"Optoelectronics Research Centre, University of Southampton","authors":"Hao  Liu, Yang  Hong, Kostas  Sozos, Baset  Gholizadeh, Ekaterina  Protsenko, Isidora  Teofilovic, Suttikarn  Wantee, Kyle  Bottrill, Morteza  Kamalian-Kopae, Abdallah  Ali, Alexandre  Bazin, Charis  Mesaritakis, Caterina  Vigliar, Francesco  Da Ros, Adonis  Bogris, Jamie  Gaudette, David  J. Richardson, Ben  J. Puttnam, Periklis  Petropoulos","start":"14:00","end":"","abstractid":212011,"order":1,"abstract":"Abstract (summary)  We report single-wavelength (145-GBd PAM4 and 200-GBd OOK) and WDM (20×160-GBd OOK) IM/DD transmission over a 202-km single-span hollow-core fibre with 34.5-dBm launch power, enabled by a silicon nitride optical pre-processor, achieving a record 646.4 Tb/s·km capacity-distance product.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-828.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Fan  Yu","affiliation":"HUAWEI","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1249 / We3-H2","title":"Unrepeatered Transmission of 2x43.2 Tb/s Bidirectional Real Time data over 266 km leveraging Low Loss GTA-ST Hollow Core Fiber with a Single Booster Amplifier","speaker":"Haik Mardoyan","affiliation":"NOKIA BELL LABS","authors":"Haïk  Mardoyan, Rajiv  Boddeda, Carina  Castineiras Carrero, Arnaud  Dupas, Peng  Li, Lei  Zhang, Shuhai  Li, Jie  Luo, Abdelali  El Imadi, Jérémie  Renaudier","start":"14:15","end":"","abstractid":212462,"order":2,"abstract":"Abstract (summary)  We report real-time unrepeatered bidirectional transmission of 2×36 channels at 1.2-Tb/s, achieving a full-duplex total throughput of 86.4-Tb/s on a single fiber over 266-km, enabled by a newly designed low-loss Gap-Tube-Assisted Support-Tube hollow-core fiber and a single high-power booster doped-fiber amplifier.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1249.pdf"},{"role":"speaker","rolename":"Contributed","code":"#863 / We3-H3","title":"15 THz Long-Haul O-band Transmission over Hollow Core Fibre Supported by Wideband Bismuth-Doped Fibre Amplifiers","speaker":"Romulo Aparecido de Paula Junior","affiliation":"University College London","authors":"Romulo  Aparecido De Paula Junior, Jiaqian  Yang, Ronit  Sohanpal, Cristobal  Melo, Mindaugas  Jarmolovicius, Zelin  Gan, Yang  Hong, Morteza  Kamalian-Kopae, Baset  Gholizadeh, Vitaly  Mikhailov, Jiawei  Luo, David  J. Digiovanni, Gabriel  Saavedra, Daniel  J. Elson, Yuta  Wakayama, Ruben  S. Luis, Hideaki  Furukawa, Jamie  Gaudette, David  J. Richardson, Benjamin  J. Puttnam, Eric  Sillekens, Robert  I. Killey, Polina  Bayvel","start":"14:30","end":"","abstractid":212054,"order":3,"abstract":"Abstract (summary)  We demonstrate long-haul, wideband O-band transmission enabled by hollow-core fibre and wideband bismuth-doped fibre amplification. A 60 km recirculating loop enables record single-amplifier-type system throughputs of 95.7, 61.1, and 31.1 Tb/s over 360, 1080, and 3000 km, respectively, across bandwidths of up to 15.3 THz.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-863.pdf"},{"role":"speaker","rolename":"Contributed","code":"#135 / We3-H4","title":"Net 12-Tb/s (30λ×400-Gb/s/λ) IM/DD DWDM Transmission Over 3.2-km Ultra-low Chromatic Dispersion DNANF Covering Full Super C-Band","speaker":"Shouchuan Ma","affiliation":"Pengcheng Laboratory, Tsinghua University","authors":"Shouchuan  Ma, Qibing  Wang, Xu  Zhang, Xingfeng  Li, Shuchao  Mi, Jingbin  Feng, Chao  Li, Wei  Ding, Ke  Li, Lei  Wang, Zhixue  He, Jian  Song, Shaohua  Yu","start":"14:45","end":"","abstractid":210703,"order":4,"abstract":"Abstract (summary)  For the first time, a net 12-Tb/s IM/DD transmission experiment using 30 160-GBaud PAM8 is carried out over a 3.2-km hollow-core double-nested anti-resonant nodeless fibre with ultra-low chromatic dispersion of less than 1.5ps/nm/km in the entire super C-band.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-135.pdf"},{"role":"speaker","rolename":"Contributed","code":"#498 / We3-H5","title":"Full C-Band Net 8.4 Tb/s (40λ×112Gb/s/λ×2dir.) Real-Time DWDM IM/DD Transmission over 22 km AR-HCF","speaker":"Yunhong Liu","affiliation":"Pengcheng Laboratory","authors":"Yunhong  Liu, Mengqi  Wu, Shen  Li, Jitao  Jia, Peng  Sun, Songyuan  Hu, Bing  Yue, Yuru  Tang, Qibing  Wang, Xu  Zhang, Zichen  Liu, Xumeng  Liu, Lei  Wang, Zhixue  He, Chao  Li, Shaohua  Yu","start":"15:00","end":"","abstractid":211545,"order":5,"abstract":"Abstract (summary)  We demonstrate the first real-time DWDM IM/DD transmission over 22km anti-resonate hollow-core fiber loaded by 40λ 100G optical modules at C-band, achieving net capacity of 8.4Tb/s via dual-direction with BERs all below the 7 % HD-FEC threshold of 3.8×10−3.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-498.pdf"}]},{"sessionid":"5538481","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"14:00-15:30","room":"PV-R Multipurpose room","type":"Invited","typeColor":"#d9eaf7","category":"SC 01: Novel fibres, fibre devices and amplifiers","title":"We3-I Hollow-core fibre characterisation and standardisation","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Marco Santagiustina","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#0 /","title":"Rayleigh speckle backscatter measurements of hollow core fiber","speaker":"Nicolas Fontaine","affiliation":"Nokia Bell Labs","authors":"","start":"14:00","end":"14:30","abstractid":null,"order":1},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Alexander Heidt","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Invited","code":"#1089 / We3-I2","title":"Distributed Measurement of Magnitude and Orientation of the Local Birefringence Vector in a 5-Tube NANF","speaker":"Silvia Zampato","affiliation":"University of Padova","authors":"Silvia  Zampato, Marco  Avesani, Gianluca  Guerra, Federica  Baldassi, Austin  Taranta, Luca  Schenato, Seyed Mohammad  Abokhamis Mousavi, Thomas William  Kelly, Hesham  Sakr, Konstantin  Vidiajev, Andrea  Galtarossa, Marco  Santagiustina, Giuseppe  Vallone, Francesco  Poletti, Luca  Palmieri","start":"14:30","end":"","abstractid":212291,"order":2,"abstract":"Abstract (summary)  We present the first complete measurement of the local birefringence vector in a 5-tube NANF. Measurements performed from both sides of a fiber wound on two coils of different diameters show excellent self-consistency and good agreement with numerical simulations.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1089.pdf"},{"role":"speaker","rolename":"Invited","code":"#1398 / We3-I3","title":"Field Deployment Practice, Key Challenges, and Standardization Outlook of Hollow-Core Fibers and Transmission Systems","speaker":"Dong Wang","affiliation":"China Mobile Research Institute","authors":"Dong  Wang, Dawei  Ge, Dechao  Zhang, Lirong  Bai, Mingqing  Zuo, Da  Liu, Han  Li","start":"15:00","end":"","abstractid":212925,"order":3,"abstract":"Abstract (summary)  This paper summarizes field deployment practices and long‑term stability of hollow‑core fibres (HCFs) in real operating environments. It analyses key challenges like gas absorptions and current progress of solutions, and prospects future standardization of HCF and transmission systems.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Dong_invited_v1.1.pdf"}]},{"sessionid":"5538745","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"15:30-16:00","room":"","type":"Coffee break","typeColor":"black","category":"","title":"Afternoon coffee break","description":"","goal":"","papers":[]},{"sessionid":"5538417","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"15:30-17:00","room":"PV-P Multipurpose Poster area","type":"Poster","typeColor":"","category":"","title":"We4-P Poster","description":"","goal":"","papers":[{"role":"speaker","rolename":"Poster","code":"#845 / We4-P1","title":"Multimode Multicore Fiber with 19 Cores for Short Reach Data Center Interconnects","speaker":"Ming-Jun Li","affiliation":"Corning Incorporated","authors":"Joseph  Mccarthy, Seth  Griffin, Licheng  Xiao, Jie  Liu, Aramais  Zakharian, Qi  Wu, Ming-Jun  Li","start":"","end":"","abstractid":212032,"order":1,"abstract":"Abstract (summary)  A multimode multicore fiber with 19 cores was designed and fabricated for short reach datacenter applications using VCSEL or micro-LED arrays. Fiber characteristics such as core refractive index profile, core position accuracy, attenuation, crosstalk are reported.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-845.pdf"},{"role":"speaker","rolename":"Poster","code":"#902 / We4-P2","title":"200 km SSMF Transmission of C+L-Band 800 Gbps Signals Using Bidirectional Distributed Raman Amplification with High Power Incoherent Forward Pumping","speaker":"Daichi Ogata","affiliation":"Furukawa Electric Co., Ltd.","authors":"Daichi  Ogata, Shunya  Hayashi, Shigehiro  Takasaka, Shoichi  Kawabata, Junji  Yoshida, Norihiro  Ohishi, Michihiro  Nakanishi","start":"","end":"","abstractid":212094,"order":2,"abstract":"Abstract (summary)  We demonstrate 201.6km standard SMF single-span transmission of C+L-band 60 channel 100 GBd DP-16QAM signals employing bidirectional distributed Raman amplification. Amplified incoherent forward pumps suppress relative intensity noise transfer to the signals, while forward and backward Raman pumps each operate with sub-1 W power.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-902.pdf"},{"role":"speaker","rolename":"Poster","code":"#911 / We4-P3","title":"Ultra-Large Mode Area All-Solid Antiresonant Fiber with Effective Single Mode Guidance","speaker":"Charu Goel","affiliation":"Temasek Laboratories, Nanyang Technological University","authors":"Kevin  Hean, Debjit  Dutta, Seongwoo  Yoo, Bernard  Dussardier, Zehui  Du, Wonkeun  Chang, Charu  Goel","start":"","end":"","abstractid":212104,"order":3,"abstract":"Abstract (summary)  We demonstrate effectively single-mode guidance in an all-solid antiresonant fiber with an ultra-large mode area exceeding 3000 µm2. The fiber offers strong broadband suppression of higher-order modes over a short propagation length of 1 m, enabling scalable design for high-power lasers.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-911.pdf"},{"role":"speaker","rolename":"Poster","code":"#930 / We4-P4","title":"Experimental Demonstration of 34 OAM Modes Reaching the Third Radial Order in a Weakly Guiding Three-Layer Ring-Core Fiber","speaker":"Quanhao Niu","affiliation":"Huazhong University of Science and Technology","authors":"Quanhao  Niu, Zhouxuan  Tang, Lei  Shen, Lei  Zhang, Jie  Luo, Jian  Wang","start":"","end":"","abstractid":212123,"order":4,"abstract":"Abstract (summary)  We design and fabricate a three-layer weakly guiding ring-core fiber capable of supporting the third-order radial OAM modes, with a total of 34 OAM modes. Experimental characterization shows superior performance of the fabricated fiber with low loss and low crosstalk.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-930.pdf"},{"role":"speaker","rolename":"Poster","code":"#966 / We4-P5","title":"Increased Gain per Unit Length in O-band Bismuth Doped Amplifiers with Trench Assisted Fibre","speaker":"Daniel J. Elson","affiliation":"KDDI Research, Inc.","authors":"Daniel J.  Elson, Aleksandr  Donodin, Vitaly  Mikhailov, Jiawei  Luo, Jeffrey W.  Nicholson, Takehiro  Tsuritani, Yuta  Wakayama","start":"","end":"","abstractid":212161,"order":5,"abstract":"Abstract (summary)  Trench assisted bismuth doped fibre (TA-BDF) is used for O-band amplification. TA-BDF is compared to standard BDF, higher gain per meter and lower noise figure are demonstrated for both forward and backwards pumping configurations. RIN transfer of both doped fibres are compared to SMF.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-966.pdf"},{"role":"speaker","rolename":"Poster","code":"#982 / We4-P6","title":"Characterization of Resonance-Induced PDL in ST-HCF via Mueller Matrix Method and Coherent Transmission","speaker":"Xinyu Hao","affiliation":"Huazhong University of Science and Technology","authors":"Xinyu  Hao, Xuchen  Hua, Youmin  Zhang, Zichen  Qian, Peng  Li, Lei  Zhang, Ruichun  Wang, Li  Deng, Bozhong  Li, Mingming  Zhang, Ming  Tang","start":"","end":"","abstractid":212178,"order":6,"abstract":"Abstract (summary)  PDL in HCFs is mainly induced by asymmetric cladding-resonance-interference leakage mismatch. By analysing the Mueller matrix characterization of a 150-km ST-HCF, 2.54-dB PDL peak is identified @192.2 THz. In transmission experiments, the Q-factor penalty between X/Y polarisations reveal highly correlations with this resonance-induced effect.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-982.pdf"},{"role":"speaker","rolename":"Poster","code":"#1024 / We4-P7","title":"Three-wavelengths fiber optical parametric oscillator tunable from 1296 to 1916 nm","speaker":"Mariia Bastamova","affiliation":"Aston University","authors":"Mariia  Bastamova, Dmitrii  Stoliarov, Nick  Doran, Vladimir  Gordienko","start":"","end":"","abstractid":212222,"order":7,"abstract":"Abstract (summary)  We demonstrate a continuous-wave pumped fiber optical parametric oscillator tunable over the 1296-1916 nm range with output powers of 10-25 dBm. Three waves (signal, idler and residual pump) are available at the output and can be used simultaneously.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1024.pdf"},{"role":"speaker","rolename":"Poster","code":"#1092 / We4-P8","title":"Pluggable-Transceiver-Compatible 4-Core Multi-Core Fibre Cable for High-Density Intra-Data Centre Interconnects","speaker":"Daiki Soma","affiliation":"KDDI Research, Inc.","authors":"Daiki  Soma, Tsubasa  Sasaki, Katsunori  Imamura, Yuta  Wakayama, Takehiro  Tsuritani","start":"","end":"","abstractid":212294,"order":8,"abstract":"Abstract (summary)  We propose a pluggable‑transceiver‑compatible aggregated multi‑core fibre cable for in-tra‑data‑centre optical wiring. By aggregating standard‑cladding four‑core fibres, the proposed design supports 2×400G‑DR4 links while reducing cable cross‑sectional area and weight by more than 86%. Error‑free transmission using commercial pluggable transceivers is confirmed at 1310 nm.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1092.pdf"},{"role":"speaker","rolename":"Poster","code":"#1104 / We4-P9","title":"Inter-core Spontaneous Raman Scattering in a 39-core 3-mode/1-mode Heterogeneous Multi-core Fiber System","speaker":"Hideaki Furukawa","affiliation":"NICT","authors":"Jun  Sakaguchi, Hideaki  Furukawa","start":"","end":"","abstractid":212309,"order":9,"abstract":"Abstract (summary)  We systematically characterize the forward/backward inter-core spontaneous Raman scattering of a 39-core 3-mode/1-mode heterogenous multi-core fiber system. Low forward direction crosstalk is expected for most three-mode cores distant from the 1-mode core, indicating high potential of the system for use in classical-quantum coexisting transmission.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1104.pdf"},{"role":"speaker","rolename":"Poster","code":"#1123 / We4-P10","title":"Parallel Photonic RF Memory Enabled by Hollow-Core Fiber","speaker":"Kai Xu","affiliation":"Huazhong University of Science and Technology","authors":"Kai  Xu, Yukang  Li, Yuan  Gao, Peng  Li, Lei  Zhang, Xiaoyang  Liu, Yu  Xia, Mengfan  Cheng, Qi  Yang, Ming  Tang, Deming  Liu, Jie  Luo, Lei  Deng","start":"","end":"","abstractid":212328,"order":10,"abstract":"Abstract (summary)  We report the first parallel photonic RF memory and its application in radar jamming, enabled by recirculation in an HCF with minimal nonlinearity and latency. The storage capacity reaches record-breaking 1100 loops (serial) and 800 loops (parallel), featuring 24-GHz bandwidth and 33% improved delay resolution.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1123.pdf"},{"role":"speaker","rolename":"Poster","code":"#1193 / We4-P11","title":"Single-Ended Crosstalk Measurement in Field-Deployed Multi-Core Fiber Using Commercial OTDR","speaker":"Deepa Venkitesh","affiliation":"Indian Institute of Technology, Madras","authors":"Abhay  Gokhale, Jonaq Niveer  Sarma, Deepa  Venkitesh","start":"","end":"","abstractid":212399,"order":11,"abstract":"Abstract (summary)  We demonstrate a single‑ended method for measuring inter‑core crosstalk in multi‑core fibers using a single-channel commercial OTDR. The method is validated by comparing with power meter measurements, through simulations and field testbed experiments.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1193.pdf"},{"role":"speaker","rolename":"Poster","code":"#531 / We4-P12","title":"High Δ Single-Mode Polymer Waveguides with Athermal Mode-Field Diameter for Co-Packaged Optics","speaker":"Taiki Yamagishi","affiliation":"Keio University","authors":"Taiki  Yamagishi, Takaaki  Ishigure","start":"","end":"","abstractid":211643,"order":12,"abstract":"Abstract (summary)  We demonstrate athermal polymer waveguides suitable for co‑packaged optics. We measure the temperature dependence of core-cladding index difference using 3D-OWFM on circular cores in polymer waveguides and identify a core/cladding combination with |dΔn/dT| ≅ 10-6 / oC, enabling a stable mode-field diameter up to 100 °C.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-531.pdf"},{"role":"speaker","rolename":"Poster","code":"#582 / We4-P13","title":"Low-Power Consumption and Stable Broadband Optical Frequency Comb Generation in X-Cut Lithium Tantalate","speaker":"Xin Wang","affiliation":"Shanghai Jiao Tong University","authors":"Xin  Wang, Mingkun  Xiao, Min  Sun, Yikai  Su, Xingchen  Ji, Yong  Zhang","start":"","end":"","abstractid":211716,"order":13,"abstract":"Abstract (summary)  We demonstrate controllable switching between Raman and Kerr frequency combs via dispersion and coupling engineering in X-cut lithium tantalate. The Kerr comb exhibits low power consumption, over  450 nm spectral span and hour-scale stable operation without dual-pump excitation or complex thermal control.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-582.pdf"},{"role":"speaker","rolename":"Poster","code":"#589 / We4-P14","title":"Mid-Infrared Optical Parametric Amplification in a Quasi-Phase-Matched Silicon Nitride Waveguide with a Broad Bandwidth of 130 nm","speaker":"Shaoxing Wang","affiliation":"Shanghai Jiao Tong University","authors":"Shaoxing  Wang, Jiangbing  Du, Yuan  Li, Ke  Xu, Zuyuan  He","start":"","end":"","abstractid":211723,"order":14,"abstract":"Abstract (summary)  A 2.5-m-long Si3N4 waveguide (4.74 × 4.31 mm2) featuring sign-alternated dispersion for quasi-phase-matched optical parametric amplifier is demonstrated. It achieves 2-dB/m low attenuation and 130-nm amplification bandwidth, offering robust fabrication tolerance and promising potential for efficient continuous-wave broadband amplification in the mid-infrared regime.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-589.pdf"},{"role":"speaker","rolename":"Poster","code":"#661 / We4-P15","title":"Four-Port Oblique-Coupled Ge-on-Si Photodetector with Improved Bandwidth Retention at High Photocurrent","speaker":"Chao Zhang","affiliation":"The University of Tokyo","authors":"Chao  Zhang, Rui  Tang, Makoto  Okano, Kasidit  Toprasertpong, Mitsuru  Takenaka","start":"","end":"","abstractid":211827,"order":15,"abstract":"Abstract (summary)  We demonstrate four-port oblique-coupled Ge-on-Si photodetector enabling high photocurrent and bandwidth. The device achieves a record-high responsivity–bandwidth product, with 1.04 A/W responsiv-ity and 64.4 mA photocurrent, and maintains 15-5 GHz bandwidth up to 35 mA, improving the trade-off between high-current operation, bandwidth, and responsivity.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-661.pdf"},{"role":"speaker","rolename":"Poster","code":"#699 / We4-P16","title":"Metasurface-based Transmissive 2×2 Polarization Beam Splitter/Combiner for Circular and Linear Polarizations","speaker":"Abdulaziz Elsayed Mohamed  Elfiqi","affiliation":"KDDI Research Inc.","authors":"Abdulaziz  E. Elfiqi, Go  Soma, Shota  Ishimura, Takahiro  Suganuma, Chun  Ren, Hidenori  Takahashi, Takehiro  Tsuritani, Takuo  Tanemura","start":"","end":"","abstractid":211865,"order":16,"abstract":"Abstract (summary)  Transmissive 2-input 2-output polarization beam splitter/combiner based on ultrathin metasurface is demonstrated. Efficient polarization splitting is achieved experimentally for all port combinations over a ~60 nm wavelength range, with the maximum polarization extinction exceeding 17 dB for both linear and circular polarization bases.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-699.pdf"},{"role":"speaker","rolename":"Poster","code":"#795 / We4-P17","title":"Tuneable RF Signal Generation Through Integrated Self-Injection-Locked Gain-Switched Combs","speaker":"Diego Domínguez Castillejo","affiliation":"Tyndall National Institute","authors":"Diego  Dominguez-Castillejo, Lakshmi Narayanan  Venkatasubramani, Gayatri Vasudevan  Rajeswari, Deepa  Prasad, Fatih Bilge  Atar, Martin  Moehrle, Liam  Barry, Brian  Corbett","start":"","end":"","abstractid":211978,"order":17,"abstract":"Abstract (summary)  High frequency tuneable gain-switched combs are demonstrated through a monolithically integrated multi-section laser. Photon-photon resonance extends modulation bandwidth beyond 43.5 GHz, enabling comb generation up to 30 GHz without external injection. Downconverted microwave tones exhibit resolution-limited linewidths below 50 Hz.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-795.pdf"},{"role":"speaker","rolename":"Poster","code":"#831 / We4-P18","title":"Spiking Photonic Nodes based on Two Section InP Semiconductor Lasers on Silicon","speaker":"Charis Mesaritakis","affiliation":"University of West Attica","authors":"Menelaos  Skontranis, Benoit  Charbonnier, Olivier  Girard, Adonis  Bogris, Charis  Mesaritakis","start":"","end":"","abstractid":212014,"order":18,"abstract":"Abstract (summary)  Spiking behaviour of two-section InP quantum-well lasers fabricated on a Silicon-on-Insulator platform is experimentally validated. Dynamic regimes, including integrate-and-fire and resonate-and-fire are achieved through bias variation. Impact of cavity length and absorber ratio are evaluated, providing design guidelines for scalable active neuromorphic photonic integrated circuits.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-831.pdf"},{"role":"speaker","rolename":"Poster","code":"#916 / We4-P19","title":"First Statistical 2,000-hour Reliability and Reflow Compatibility Results of Silicon-Ferroelectric Nematic Glass (Si-FNG) Electro-Optic Modulators","speaker":"Li-Yuan Chiang","affiliation":"Polaris Electro-Optics","authors":"Li-Yuan  Chiang, James  Christensen, Jerome  Jahn, Yi-Chuan  Tsai, Dominic  Quinonez, Chirag  Patel, Pavel  Savechenkov, Ching-Wen  Huang, Pao-Chieh  Huang, Neda  Bathaei, Jerry  Ding, Milad  Mahpeykar, Ta-Ching  Tzu, Morten  Nissov, Cory  Pecinovsky, Gianlorenzo  Masini, Mark  Harrison","start":"","end":"","abstractid":212109,"order":19,"abstract":"Abstract (summary)  We report the first industry-standard (Telcordia) reliability and reflow compatibility assessment of hybrid-integrated Si-FNG modulators. With 167 devices, we demonstrate robust parametric stability and failure-free life over 2,000-hour HTS, 2,000-hour uBDH, 200-cycle TC, and 4-cycle Solder Reflow stresses.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-916.pdf"},{"role":"speaker","rolename":"Poster","code":"#924 / We4-P20","title":"Inverse-Designed Silicon Six-Mode Multiplexer for 1.6T/λ Mode-Division Multiplexing Interconnect with AI-Enhanced Reception","speaker":"Aolong Sun","affiliation":"Fudan University","authors":"Aolong  Sun, Yuqin  Yuan, Jialin  He, An  Yan, Yongzhu  Hu, Junhao  Zhao, Nan  Chi, Junwen  Zhang","start":"","end":"","abstractid":212117,"order":20,"abstract":"Abstract (summary)  We demonstrate a silicon-photonic mode-division multiplexing interconnect employing an inverse-designed six-mode multiplexer with insertion loss below 1.9 dB and crosstalk below −14.6 dB at 1550 nm. A 1.62 Tb/s/λ capacity is realized by transmitting 90-GBaud PAM-8 signals over six modes using a temporal convolutional network.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-924.pdf"},{"role":"speaker","rolename":"Poster","code":"#1067 / We4-P21","title":"Frequency Response Engineering of EO-Equalized Thin-Film Lithium Niobate Modulator Using Capacitive-Loaded Traveling-Wave Electrodes with Two Distinct Periods","speaker":"Yuya Yamaguchi","affiliation":"National Institute of Information and Communications Technology","authors":"Yuya  Yamaguchi, Pham  Tien Dat, Shingo  Takano, Shotaro  Hirata, Yu  Kataoka, Junichiro  Ichikawa, Tetsuya  Fujino, Satoshi  Shinada, Kouichi  Akahane, Naokatsu  Yamamoto, Atsushi  Kanno, Tetsuya  Kawanishi","start":"","end":"","abstractid":212268,"order":21,"abstract":"Abstract (summary)  We demonstrate a thin-film lithium niobate modulator with engineered frequency response using an electro-optic equalizer based on capacitive-loaded traveling-wave electrodes with two distinct loading periods. The device achieves a 1 dB bandwidth exceeding 110 GHz with a half-wave voltage of 2.2 V.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1067.pdf"},{"role":"speaker","rolename":"Poster","code":"#1079 / We4-P22","title":"High-Baud-Rate Data Transmission Through a Non-Volatile Sb2Se3 Phase-Change Switch on Silicon Nitride","speaker":"Iñigo Lopez-Mulet","affiliation":"Nanophotonics Technology Center, Technical University of Valencia","authors":"Iñigo  Lopez-Mulet, Hao  Liu, Xingshi  Yu, Ipsita  Chakraborty, Thalia  Dominguez Bucio, Isaac  Johnson, Jorge  Parra, Pablo  Sanchis, Frederic  Gardes, Periklis  Petropoulos","start":"","end":"","abstractid":212281,"order":22,"abstract":"Abstract (summary)  We experimentally evaluate high-baud-rate transmission through a non-volatile Sb₂Se₃ phase-change optical switch on silicon nitride, supporting up to 200-GBd OOK, 135-GBd PAM4, and 80-GBd PAM8. An up to 2 dB penalty is observed with no phase-state-dependent degradation, confirming compatibility with high-speed, reconfigurable photonic interconnects.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1079.pdf"},{"role":"speaker","rolename":"Poster","code":"#1187 / We4-P23","title":"Compact Slow-Light-Enhanced TFLN Modulator for CWDM4","speaker":"RUIQING HE","affiliation":"Zhejiang University","authors":"Ruiqing  He, Chenlei  Li, Ruitao  Ma, Dongyue  Sun, Hanwen  Li, Zexu  Wang, Yaoxin  Bao, Jin  Xie, Huan  Li, Daoxin  Dai","start":"","end":"","abstractid":212393,"order":23,"abstract":"Abstract (summary)  We present a compact slow‑light‑enhanced TFLN transmitter for CWDM4, enabling an aggregate line rate of 800 Gbps. The device exhibits a reduced modulation length of 2 mm and a modulation efficiency of 1.22 V·cm. In addition, low-loss CWDM operation is provided by integrated cascaded Bragg‑grating filters.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1187.pdf"},{"role":"speaker","rolename":"Poster","code":"#1344 / We4-P24","title":"Co-fabrication of Graphene Modulators and Detectors on Silicon-on-insulator","speaker":"Petros Symeon","affiliation":"University of Cambridge","authors":"Chao  Wen, Alberto  Montanaro, Matteo  Tiberi, Petros  Symeon, Paul  Schreiner, Yang  Li, Lu  Chen, Jincan  Zhang, Callum  Littlejohns, Vito  Sorianello, Andrea  Ferrari","start":"","end":"","abstractid":212566,"order":24,"abstract":"Abstract (summary)  We report co-fabrication of high-speed graphene modulators and photodetectors on silicon on insulator by optimising modulator and photodetector designs under CMOS-BEOL constraints. The resulting platform balances extinction ratio, responsivity and bandwidth, establishing a practical route towards integrated >67GHz SLG optoelectronic transmit/receive systems.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1344.pdf"},{"role":"speaker","rolename":"Poster","code":"#1393 / We4-P25","title":"A 240 Gb/s O-band Silicon Micro-ring Modulator with 3 THz FSR and 110 GHz bandwidth","speaker":"Shuang Zheng","affiliation":"Huazhong university of science and technology","authors":"Zhiyuan  Zhou, Zhihan  Sun, Yuqin  Yuan, Huajie  Wan, Jialin  He, Liyun  Hu, Yantao  Wu, Qi  Tian, Siyang  Liu, Zhen  Li, Changyu  Hu, Hao  Hu, Jun  Liu, Shengjiang  Dai, Junwen  Zhang, Li  Shen, Shuang  Zheng, Minming  Zhang","start":"","end":"","abstractid":212656,"order":25,"abstract":"Abstract (summary)  A 4-µm-radius O-band silicon micro-ring modulator featuring a 3-THz FSR and >110-GHz EO bandwidth is demonstrated. Offering a finesse of 50, it supports 160-Gb/s NRZ and 240-Gb/s PAM4 below the SD-FEC limit, enabling >16-channel high-density WDM.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1393_2.pdf"},{"role":"speaker","rolename":"Poster","code":"#710 / We4-P26","title":"Workload-Aware Passively Biased Short-Electrode MZI for Efficient Vector-Matrix Multiplication in Neural Networks","speaker":"Shi Zhao","affiliation":"National University of Singapore (NUS)","authors":"Shi  Zhao, Chenxuan  Zeng, Jie  Yang, Jin Feng  Leong, Jieming  Pan, Ao  Yan, Tiancheng  Yu, Xiangyu  Zhang, Evgeny  Zamburg, Aaron Voon-Yew  Thean","start":"","end":"","abstractid":211878,"order":26,"abstract":"Abstract (summary)  Exploiting the skewed distribution of neural-network weights, we report a passively biased MZI that reduces phase tuning from π to ~0.16π for efficient VMM. Measured devices validate design targets with good reproducibility, enabling 5.3× footprint reduction, 0.11 pJ/OP and 1079 TOPS/(W·cm²) at <0.1% accuracy drop","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-710.pdf"},{"role":"speaker","rolename":"Poster","code":"#756 / We4-P27","title":"Dual-Pump Pulsed Degenerate Optical Parametric Oscillation in a Silicon Nitride Microresonator with Anomalous Dispersion","speaker":"Kambiz Jamshidi","affiliation":"TU Dresden","authors":"Menglong  He, Nora  Dzieia, Abdou  Shetewy, Kambiz  Jamshidi","start":"","end":"","abstractid":211931,"order":27,"abstract":"Abstract (summary)  We experimentally demonstrate modulated degenerate optical parametric oscillation in an anomalous-dispersion silicon nitride microresonator using an optimized dual-pump scheme, achieving pulsed operations up to 30 MHz with 5.34 dBm optical power and an 18 dB signal-to-noise ratio, establishing its potential for coherent Ising machines.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-756.pdf"},{"role":"speaker","rolename":"Poster","code":"#833 / We4-P28","title":"Integrated Photonic Physical Unclonable Function based on Multi-Resonant Structures in a Hexagonal-Reconfigurable Mesh","speaker":"Nikolaos Tzekas","affiliation":"","authors":"Nikolaos  Tzekas, George- Aias  Karydis, Benoit  Charbonnier, Jose  Capmany, Adonis  Bogris, Charis  Mesaritakis","start":"","end":"","abstractid":212017,"order":28,"abstract":"Abstract (summary)  we propose a physical unclonable function based on a silicon reconfigurable mesh programmed to implement multi-resonant structures. By harnessing manufacturing imperfections as a stochastic source, each device produces unique spectral fingerprints. When combined with a Gabor fuzzy-extractor a probability of cloning of 10-16 is achieved","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-833.pdf"},{"role":"speaker","rolename":"Poster","code":"#837 / We4-P29","title":"Nanosecond Silicon Photonic BiDi Splitter-Switch for Point-to-Multipoint Networks","speaker":"Brian Stern","affiliation":"","authors":"Brian  Stern, Robert  Borkowski, Kovendhan  Vijayan, Kwangwoong  Kim, Jesse  Simsarian","start":"","end":"","abstractid":212023,"order":29,"abstract":"Abstract (summary)  We demonstrate a 1×8 silicon photonic splitter-switch enabling independent switching for upstream and downstream directions in an access network. Nanosecond-scale switching is shown with 1.1 dB loss per Mach-Zehnder stage, showing feasible scaling to higher port count and enabling higher power budgets than with splitters.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-837.pdf"},{"role":"speaker","rolename":"Poster","code":"#868 / We4-P30","title":"Reconfigurable On-Chip Spectrometer with Adaptive Spectral Resolution","speaker":"Huiyu Huang","affiliation":"University of Cambridge","authors":"Wanlu  Zhang, Kangning  Xu, Chunhui  Yao, Huiyu  Huang, Ting  Yan, Richard  Penty, Qixiang  Cheng","start":"","end":"","abstractid":212060,"order":30,"abstract":"Abstract (summary)  In this paper, we present a reconfigurable on-chip spectrometer based on a cascaded Mach–Zehnder interferometer network with programmable optical path differences (0–180 μm). It enables adaptive spectral acquisition across multiple resolution scales within a single device, establishing a new paradigm for reconfigurable on-chip spectroscopy.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-868.pdf"},{"role":"speaker","rolename":"Poster","code":"#891 / We4-P31","title":"Experimental Demonstration of Sub-10 kHz Linewidth Tunable DFB Laser Array Based on Self-Injected Feedback","speaker":"Zhenxing Sun","affiliation":"Nanjing University","authors":"Yue  Zhang, Zijiang  Yang, Zhenxing  Sun, Rulei  Xiao, Xiangfei  Chen","start":"","end":"","abstractid":212083,"order":31,"abstract":"Abstract (summary)  We demonstrate a high-power, narrow-linewidth REC-DFB laser array using SCOW and self-injection feedback. Integrated with PLCs via photonic wire bonding (PWB), the array achieves >100mW power, 12.8nm tuning range, and SMSR >50dB. The Lorentzian linewidth is compressed to <7kHz.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-891.pdf"},{"role":"speaker","rolename":"Poster","code":"#903 / We4-P32","title":"A 1.2 Vpp Driver-free Differential Ge Eelectro-absorption Modulator Enabling 150 Gbps NRZ and 360 Gbps PAM-8 modulation","speaker":"Haiwen Cai","affiliation":"Shanghai Optoelectronics Science and Technology Innovation Center","authors":"Yufei  Liu, Kaisa  Hamulati, Xinran  Zhao, Jun  Li, Yue  Zhou, Haiwen  Cai, Fenghe  Yang, Wei  Chu","start":"","end":"","abstractid":212095,"order":32,"abstract":"Abstract (summary)  A differential Ge Franz-Keldysh EAM with 2.78 dB insertion loss operates at 1.2 Vpp without a driver. It achieves 150 Gbps NRZ and 360 Gbps PAM‑8. The ultra‑low swing enables direct CMOS driving for future LPO/CPO links.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-903.pdf"},{"role":"speaker","rolename":"Poster","code":"#913 / We4-P33","title":"PAM4 448 Gb/s per Lane InP MZM-SOA Array PIC for Next-Generation CPO Applications","speaker":"Anna Tatarczak","affiliation":"Coherent","authors":"Anna  Tatarczak, Michael  Steib, Laszlo  Varga, Alirio  Melgar, Young-Kai  Chen","start":"","end":"","abstractid":212106,"order":33,"abstract":"Abstract (summary)  We demonstrate a monolithic 1310 nm InP Mach–Zehnder modulator and semiconductor optical amplifier array operating at 448 Gb/s per lane with an external laser. After 500 m transmission, a BER of 1.1×10⁻³ is achieved with 25-tap FFE, supporting InP for next-generation co-packaged optics.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-913.pdf"},{"role":"speaker","rolename":"Poster","code":"#1050 / We4-P34","title":"On-Chip Pulse Amplification and Compression Using Silicon Nitride Photonic Integrated Circuits","speaker":"Jie Wang","affiliation":"University of Hong Kong","authors":"Jie  Wang, Yitian  Tong, Zhaoting  Geng, Chuchen  Zhang, Zhenmin  Du, Xuewen  Chen, Jinwen  Lin, Yuhao  Huang, Yunqi  Fu, Yu  Xia, Di  Yu, Hongwei  Chen, Chao  Xiang","start":"","end":"","abstractid":212249,"order":34,"abstract":"Abstract (summary)  We demonstrate on-chip pulse amplification and compression using a silicon-nitride-based erbium-doped waveguide amplifier and a chirped spiral Bragg grating. Our work achieves >50-fold amplification and 32-fold pulse compression, paving the way toward fully integrated high-power ultrashort pulse sources for diverse applications.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1050.pdf"},{"role":"speaker","rolename":"Poster","code":"#1051 / We4-P35","title":"C-band Compact Hybrid-Integrated Multi-port Multi-wavelength Laser Source for DWDM Communication in Optical I/O","speaker":"Wentao Sun","affiliation":"","authors":"Zijiang  Yang, Wentao  Sun, Yue  Zhang, Zhenxing  Sun, Xiangfei  Chen","start":"","end":"","abstractid":212250,"order":35,"abstract":"Abstract (summary)  A C-band compact MP-MWL for optical I/O has been presented. The source architecture comprises an 8-wavelength high-power DFB laser array based on the REC technique, hybrid-integrated with a Si3N4 8×8 MMI via the PWB technique.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1051.pdf"},{"role":"speaker","rolename":"Poster","code":"#1186 / We4-P36","title":"Compact Waveguide-Integrated Graphene Photodetector with >110-GHz Bandwidth for 240-Gbit/s PAM-4 Reception","speaker":"Hejie Peng","affiliation":"Huazhong University of Science and Technology","authors":"Hejie  Peng","start":"","end":"","abstractid":212392,"order":36,"abstract":"Abstract (summary)  We experimentally demonstrate a compact waveguide-integrated graphene photodetector based on a geometry-optimized plasmonic slot waveguide. With an 80 nm slot, 53 nm electrodes, and a 10 μm interaction region, the device exhibits >110 GHz bandwidth and clear 240 Gbit/s PAM-4 reception for ultrafast optical interconnects.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1186.pdf"},{"role":"speaker","rolename":"Poster","code":"#1278 / We4-P37","title":"Fully integrated CWDM Optical Engine with III-V/Si DFB Laser Arrays and Silicon Mach-Zehnder Modulators","speaker":"Zheng Yong","affiliation":"SCINTIL Photonics","authors":"Zheng  Yong,
