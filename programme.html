ulti-layer filters. In 1,200‑km WDM transmission of 128‑GBd 8‑DSC PM‑PCS‑64QAM, Q-penalties within 0.1 dB under 2.5-ps Tx-IQ skew, 3-ps Rx-IQ skew, 2.5-dB Tx-IQ peaking error, and 63‑GHz Rx-IQ imbalanced bandwidth limitation were demonstrated.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-143.pdf"},{"role":"speaker","rolename":"Poster","code":"#150 / Mo4-P-43","title":"High-Fidelity Fiber Longitudinal Power Monitoring via Spatially-Decoupled Sparse Regularization","speaker":"Yan Zuo","affiliation":"State Key Laboratory of Optical Communication Technologies and Networks, China Information Communication Technologies Group Corporation","authors":"Yan  Zuo, Xingrui  Su, Wu  Liu, Ming  Luo, Hanbing  Li","start":"","end":"","abstractid":210725,"order":43,"abstract":"Abstract (summary)  We experimentally demonstrate a non-uniform sparse regularization approach for longitudinal power monitoring. Leveraging spatial decoupling, this method accurately recovers all power discontinuities, including EDFA gains and anomalies. Using limited measurements, it achieves 1-km localization accuracy and an RMSE reduction of 0.41–0.6 dB.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-150.pdf"},{"role":"speaker","rolename":"Poster","code":"#236 / Mo4-P-44","title":"128 Gb/s CAP-16 Transmission Over 100 m OM4 MMF Using Low-Complexity ABCD Linearization of a Directly Modulated VCSEL","speaker":"Yee Hui Low","affiliation":"University of Cambridge","authors":"Yee Hui  Low, Nikos  Bamiedakis, David  Cunningham, Richard  Penty","start":"","end":"","abstractid":210962,"order":44,"abstract":"Abstract (summary)  We demonstrate 128-Gb/s (32-Gbaud) CAP-16 transmission over 100-m OM4 MMF using a low-cost commercial 21-GHz VCSEL and low-complexity ABCD linearization. The method successfully mitigates the VCSEL non-linearity, achieving a ~2x EVM reduction vs conventional FFE. FFE-only implementation fails to support this data rate.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-236.pdf"},{"role":"speaker","rolename":"Poster","code":"#239 / Mo4-P-45","title":"Online Low-Power Time-Varying IQ skew Estimation Scheme for Ultra-High-Speed Coherent Receivers","speaker":"Chengbo Li","affiliation":"ZTE corporation","authors":"Chengbo  Li, Shuai  Wei, Hexun  Jiang, Zhuo  Wang, Yizhao  Chen, Yongben  Wang, Ye  Zhao, Xiang  Li, Hengqi  Liu","start":"","end":"","abstractid":210965,"order":45,"abstract":"Abstract (summary)  We propose to use an online low-power side-path DSP to estimate the IQ skew of ultra-high-speed coherent receivers. Its effectiveness is experimentally verified in a 90 GBaud transmission experiment, with an estimation error of less than 1% of the symbol period.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-239.pdf"},{"role":"speaker","rolename":"Poster","code":"#247 / Mo4-P-46","title":"HCF Gas Line Absorption Mitigation: On the Interplay between Pre-emphasis and SOA Nonlinear Compensation","speaker":"Trung Hien Nguyen","affiliation":"Huawei Technologies France, Optical Communication Technology Lab.","authors":"Trung-Hien  Nguyen, Abel  Lorences-Riesgo, Sami  Mumtaz, Hoang-Long  Nguyen, Haoyang  Qiu, Hao  Chen, Gabriel  Charlet","start":"","end":"","abstractid":210977,"order":46,"abstract":"Abstract (summary)  We experimentally and numerically investigate the interplay between GLA-dip emphasis (GE) and SOA-booster nonlinear compensation in 140 GBaud PCS-64QAM transmission system. Results show that the interplay causes 0.3 dB SNR penalty and the partial-GE is more favorable, providing 0.5 dB SNR gain at 7-dB dip.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-247.pdf"},{"role":"speaker","rolename":"Poster","code":"#256 / Mo4-P-47","title":"Experimental Demonstration of Polar Coded Many-to-one Mapping based Truncated PS-PAM8 with 37-dB power budget","speaker":"Junwei Li","affiliation":"Department of Fundamental Network Technology","authors":"Xiaoshuo  Jia, Junwei  Li, Ning  Wang, Jie  Li, Ming  Luo, Yan  Li, Jian  Wu, Han  Li, Dechao  Zhang","start":"","end":"","abstractid":210986,"order":47,"abstract":"Abstract (summary)  In this paper, a polar coded truncated probabilistic shaped PAM-8 (PTPS-PAM8) operating at 200-Gb/s/lane is proposed and experimentally investigated using the intensity-modulation and coherent-detection structure. Adopting the PTPS-PAM8, a 2-dB ROP sensitivity improvement is obtained over the uniformly-distributed polar-coded PAM8 after 20-km transmission.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-256.pdf"},{"role":"speaker","rolename":"Poster","code":"#360 / Mo4-P-48","title":"On LLR Calculations for Soft-decision Decoding in Next-generation IM-DD Systems with Laser RIN","speaker":"Felipe Villenas Cortez","affiliation":"Eindhoven University of Technology","authors":"Felipe  Villenas, Yunus  Can Gültekin, Alex  Alvarado","start":"","end":"","abstractid":211175,"order":48,"abstract":"Abstract (summary)  We propose a low-complexity LLR approximation for SD decoding in IM-DD systems with relative intensity noise. Our approximation results in no BER performance penalty for a concatenated KP4+Hamming FEC scheme, and outperforms mismatched AWGN-based LLRs.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-360.pdf"},{"role":"speaker","rolename":"Poster","code":"#412 / Mo4-P-49","title":"Quantum-Well Comb DWDM Transmission via Residual Carrier-Based Phase Recovery and EEPN Mitigation","speaker":"YUEYING NIU","affiliation":"Institute of Semiconductors, Chinese Academy of Sciences","authors":"Xiang  Cai, Yueying  Niu, Yixiao  Zhu, Tianchi  Zhong, Defan  Sun, Tianhong  Zhang, Fanghuasong  Lin, Hao  Song, Xiansong  Fang, Xian  Zhou, Dan  Lu, Fan  Zhang","start":"","end":"","abstractid":211295,"order":49,"abstract":"Abstract (summary)  We experimentally demonstrate 8λ×70-GBd 16QAM DWDM transmission over 1280-km SSMF using quantum-well mode-locked laser combs. We employ residual comb line-based phase tracking to address the 9.0-MHz and 54.6-MHz comb linewidths, achieving >6-dB Q2-factor improvement at BTB and 3.6-dB additional gain from EEPN after 1280-km transmission.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-412.pdf"},{"role":"speaker","rolename":"Poster","code":"#427 / Mo4-P-50","title":"Complexity Reduction of SD-FEC by Bayes-Based Simple-Soft-Output MLSE in Coherent Transmission with Chase Decoder","speaker":"Shuto Yamamoto","affiliation":"NTT, Inc.","authors":"Shuto  Yamamoto, Yukinobu  Nakajima, Hiroki  Taniuchi, Masanori  Nakamura, Etsushi  Yamazaki","start":"","end":"","abstractid":211354,"order":50,"abstract":"Abstract (summary)  We evaluate the applicability of Bayes-based simple-soft-output MLSE to coherent transmission systems with LR-FEC and turbo product codes. Experimental results show that the proposed scheme reduces the number of test patterns and the number of iterations in Chase decoding by approximately 50% and 25%, respectively.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-427.pdf"},{"role":"speaker","rolename":"Poster","code":"#496 / Mo4-P-51","title":"224 Gbaud On-Off Keying Optical Link Using O-Band Vertical P–N Junction Ring Resonator Modulator","speaker":"Dan Li","affiliation":"KTH Royal Institute of Technology","authors":"Dan  Li, Armands  Ostrovskis, Yevhenii  Osadchuk, Darja  Cirjulina, Toms  Salgals, Tianyu  Jiang, Francesco  Da Ros, Darko  Zibar, Minkyu  Kim, Peter  De Heyn, Lu  Zhang, Xianbin  Yu, Vjaceslavs  Bobrovs, Xiaodan  Pang, Oskars  Ozolins","start":"","end":"","abstractid":211534,"order":51,"abstract":"Abstract (summary)  An O-band vertical p–n junction ring resonator modulator-based IM/DD link is demonstrated using bi-LSTM equalization. We achieve 224 Gbaud OOK and 140 Gbaud PAM4 over 1 km single-mode fiber with BER below the 6.25% overhead HD-FEC threshold.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-496.pdf"},{"role":"speaker","rolename":"Poster","code":"#533 / Mo4-P-52","title":"Joint Transmitter-Receiver Design for High-Baud-Rate IM/DD Transmission with Low-Resolution DAC over 20-km Hollow-Core Fiber","speaker":"Zixian  Wei","affiliation":"The Hong Kong Polytechnic University","authors":"Yibin  Li, Jingchuan  Wang, Zixian  Wei, Qi  Wu, Li  Wang, Peng  Li, Lei  Zhang, Jie  Luo, Kangping  Zhong, Alan Pak Tao  Lau, Chao  Lu, Changyuan  Yu","start":"","end":"","abstractid":211645,"order":52,"abstract":"Abstract (summary)  We propose a joint transmitter-side VF-DRE and receiver-side NWF and MLSE scheme for high-baud-rate IM/DD transmission with low-resolution DAC. 140-GBaud OOK with 2-bit DAC and 100-GBaud PAM4 with 3-bit DAC are experimentally demonstrated over 20-km hollow-core fiber.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-533.pdf"},{"role":"speaker","rolename":"Poster","code":"#534 / Mo4-P-53","title":"Robust Pilot-Tone-Based Timing Recovery Scheme for Coherent Digital Subcarrier Multiplexing Systems","speaker":"Yanfu Yang","affiliation":"","authors":"Yongchao  Jin, Jiexing  Lin, Siyu  Gong, Qian  Xiang, Qun  Zhang, Chen  Cheng, LinSheng  Fan, Pengxi  Yang, Bang  Yang, Yanfu  Yang","start":"","end":"","abstractid":211646,"order":53,"abstract":"Abstract (summary)  A robust, high-precision, and fast-converging frequency-domain pilot-aided timing recovery scheme for DSCM systems is proposed. By dividing two pilot tones, the scheme achieves FO/PN immunity. Experiments show strong robustness to roll-off and SFO, ensuring stable operation up to 280-ppm SFO.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-534.pdf"},{"role":"speaker","rolename":"Poster","code":"#564 / Mo4-P-54","title":"Low-Complexity FO-Tolerant Frame Synchronisation Using an Amplitude-Weighted Timing Metric and QAM-Based Training Sequence for Low-SNR Coherent Optical Inter-Satellite Links","speaker":"Shoma Tateno","affiliation":"NEC Corporation","authors":"Shoma  Tateno, Hidemi  Noguchi, Kohei  Hosokawa","start":"","end":"","abstractid":211695,"order":54,"abstract":"Abstract (summary)  We propose a high-sensitivity, low-complexity FO-tolerant frame synchronisation scheme for low-SNR coherent optical inter-satellite links based on an amplitude-modulated training sequence and a multiplication-free amplitude-weighted timing metric, reducing the required overhead length by 37.5% and the computational complexity by 36.3% compared to conventional schemes.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-564.pdf"},{"role":"speaker","rolename":"Poster","code":"#569 / Mo4-P-55","title":"Self-Adaptive Silicon Photonic Equalizer for Polarization-Insensitive and Multi-Wavelength 200-Gbps O-Band Interconnects","speaker":"Guofeng Yan","affiliation":"Wuhan National Laboratory for Optoelectronics and School of Optical and Electronic Information","authors":"Guofeng  Yan, Yuanjian  Wan, Bing  Han, Ning  Wang, Xuefeng  Yang, Weidong  Ma, Jian  Wang","start":"","end":"","abstractid":211701,"order":55,"abstract":"Abstract (summary)  We demonstrate a self-adaptive silicon photonic equalizer for polarization-insensitive, multi-wavelength division O-band transmission. The equalizer simultaneously equalizes 2x50-Gbaud PAM4 signals transmitted in a WDM system, improving the received sensitivity about 4 dB.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-569.pdf"},{"role":"speaker","rolename":"Poster","code":"#584 / Mo4-P-56","title":"High spatial resolution and large strain measurement in long-distance OFDR","speaker":"Yaxi YAN","affiliation":"The HK Polytechnic University","authors":"Shuai  Qu, Xiaoying  Zhang, Qi  Wu, Yaxi  Yan, Alan Pak Tao  Lau, Chao  Lu","start":"","end":"","abstractid":211718,"order":56,"abstract":"Abstract (summary)  We present a distance-domain gating method that simultaneously achieves long sensing distance, high spatial resolution and wide strain measurement range. Strain range of 8000με is achieved over a 54m fiber with a 1.9mm spatial resolution.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-584.pdf"},{"role":"speaker","rolename":"Poster","code":"#35 / Mo4-P-57","title":"Nonlinear Distortion of Semiconductor Optical Amplifiers as a Source of Equalization Enhanced Phase Noise","speaker":"Chuandong Li","affiliation":"Huawei Technologies Canada","authors":"Meng  Qiu, Ying  Gao, Xuefeng  Tang, Chuandong  Li","start":"","end":"","abstractid":208659,"order":57,"abstract":"Abstract (summary)  We demonstrate the interaction between nonlinear phase distortion induced by semiconductor optical amplifiers (SOA) and digital equalization via both simulations and experiments. Properties of the resulting equalization enhanced phase noise (EEPN) are also compared with the well-studied EEPN caused by laser phase noise.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-35.pdf"},{"role":"speaker","rolename":"Poster","code":"#42 / Mo4-P-58","title":"375 km, Unrepeatered Transmission Using a Erbium-Doped, Tellurite Fiber Based, 69 nm bandwidth, ROPA","speaker":"Julian  Schneck","affiliation":"Institute of electrical and optical communications","authors":"Julian  Schneck, Ruben S.  Luis, Daniele  Orsuti, Stefano  Gaiani, Wolfgang  Vogel, Pierpaolo  Boffi, Georg  Rademacher, Hideaki  Furukawa","start":"","end":"","abstractid":209760,"order":58,"abstract":"Abstract (summary)   We use a 69 nm bandwidth ROPA based on an erbium-doped tellurite glass fiber, combined with bidirectional distributed Raman amplification, to transmit 333 x 24.5 Gbaud channels over 375 km with a minimum span loss of 56 dB, achieving a total throughput of 40.9 Tb/s.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-42.pdf"},{"role":"speaker","rolename":"Poster","code":"#168 / Mo4-P-59","title":"Impact of Kerr Nonlinearity within High Power Optical Amplifiers on HCF Transmission","speaker":"Olga Vassilieva","affiliation":"1Finity Americas, Inc","authors":"Olga  Vassilieva, Inwoong  Kim, Hiroyuki  Irie, Takeshi  Hoshida, Yu  Tanaka, Paparao  Palacharla","start":"","end":"","abstractid":210787,"order":59,"abstract":"Abstract (summary)  We quantify Kerr nonlinearity generated within C-band high-power EDFAs for long HCF links. We show that EDFA doped-fiber nonlinearity is the main contributor to system impairments, limiting allowable output power to below 32 dBm when the EDF length exceeds 10 m.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-168.pdf"},{"role":"speaker","rolename":"Poster","code":"#321 / Mo4-P-60","title":"Characterization of Various Impairments in Coherent Optical Transmitters Using Spectrum Analyser Only","speaker":"Jingnan Li","affiliation":"Fujitsu Research & Development Center Co., Ltd.","authors":"Jingnan  Li, Xiaofei  Su, Tong  Ye, Hisao  Nakashima, Takeshi  Hoshida, Yasuhiko  Aoki, Zhenning  Tao, Yojiro  Mori, Hiroshi  Hasegawa","start":"","end":"","abstractid":211114,"order":60,"abstract":"Abstract (summary)  Using probability-maintained multi-notch sequences and equally spaced multi-tone signals, various impairments in EDFA-embedded coherent transmitters including nonlinear distortion, additive electrical noise, and ASE noise are decoupled via spectrum-analyser-based measurements. The system's error vector magnitude is predicted with 0.4-dB accuracy based on the measured noise-to-signal ratio.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-321.pdf"},{"role":"speaker","rolename":"Poster","code":"#324 / Mo4-P-61","title":"Cycle-Slip Resilient High-Precision Transmitter IQ Skew Estimation for Ultra-High Baud-Rate Digital Subcarrier Multiplexing Transmission","speaker":"Huanyu Le","affiliation":"Guangdong University of Technology","authors":"Huanyu  Le, Meng  Xiang, Junjiang  Xiang, Gai  Zhou, Hexun  Jiang, Yongben  Wang, Shuai  Wei, Songnian  Fu, Yuwen  Qin","start":"","end":"","abstractid":211117,"order":61,"abstract":"Abstract (summary)  We propose a cycle-slip resilient high-precision transmitter IQ skew estimation scheme based on a designated training sequence. The 120-GBaud DP-16QAM digital subcarrier multiplexing (DSM) experimental transmission verifies its effective suppression of phase-extraction cycle slips, improving IQ skew estimation accuracy from 0.3 ps to below 0.1 ps.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-324.pdf"},{"role":"speaker","rolename":"Poster","code":"#398 / Mo4-P-62","title":"In-Service Inter-Segment Skew Calibration Using a Built-in Low-Speed Coherent Detection Monitor","speaker":"Tong Ye","affiliation":"Fujitsu Research & Development Center Co. Ltd.","authors":"Tong  Ye, Xiaofei  Su, Jingnan  Li, Yohei  Sobu, Hisao  Nakashima, Takeshi  Hoshida, Yasuhiko  Aoki, Zhenning  Tao","start":"","end":"","abstractid":211277,"order":62,"abstract":"Abstract (summary)  We propose a power-efficient in-service skew calibration method for the transmitters with segmented modulators, utilizing a modulated local oscillator and low-speed coherent detection monitor. Experimental results demonstrate an accurate skew calibration with a maximum error within ±0.025 UI over a ±0.2 UI skew range.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-398.pdf"},{"role":"speaker","rolename":"Poster","code":"#495 / Mo4-P-63","title":"On the Optimum Energy-per-bit Launch Power in Coherent Hollow-core Fibre Transmission Systems","speaker":"Ronit Sohanpal","affiliation":"","authors":"Ronit  Sohanpal, Eric  Sillekens, Mindaugas  Jarmolovicius, Robert  Killey, Polina  Bayvel","start":"","end":"","abstractid":211526,"order":63,"abstract":"Abstract (summary)  We investigate the optimum energy per bit in hollow-core-fibre transmission systems. We show that a 1000 km C-band link can achieve a 41.5% reduction in total power consumption when operating at the minimum energy-per-bit launch power with only 2.2% throughput penalty.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-495.pdf"},{"role":"speaker","rolename":"Poster","code":"#522 / Mo4-P-64","title":"Driverless Net 3.2 Tbps (8×448 Gbps) PAM4 Transmission at 500m Using a Chirped Differential MZM DR8 PIC on TFLN","speaker":"Charles St-Arnault","affiliation":"McGill University","authors":"Charles  St-Arnault, Derek  Kita, Ross  Dickson, Bruce  Beggs, Naim  Ben-Hamida, Christian  Reimer, David  Plant","start":"","end":"","abstractid":211605,"order":64,"abstract":"Abstract (summary)  We report a novel ultra-compact chirped differential electrode layout on TFLN reducing VπL by 1.33x on a DR8 PIC enabling driverless 3.2 Tbps (8×448 Gbps) PAM4 with compliant TDECQ under the HD-FEC.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-522.pdf"},{"role":"speaker","rolename":"Poster","code":"#530 / Mo4-P-65","title":"Link Diagnosis Enabled by Longitudinal Noise Monitoring","speaker":"Junho Chang","affiliation":"Huawei Technologies Canada","authors":"Choloong  Hahn, Qingyi  Guo, Junho  Chang, Zhiping  Jiang","start":"","end":"","abstractid":211636,"order":65,"abstract":"Abstract (summary)  We show that a longitudinal noise monitoring scheme utilizing coherent receiver DSP comprehensively monitors link health. By experimentally demonstrating dynamic SNR monitoring during channel-drop transients and the localization of abnormal noise increases, we establish an effective, spatially resolved diagnostic tool.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-530.pdf"},{"role":"speaker","rolename":"Poster","code":"#576 / Mo4-P-66","title":"Longitudinal Power Monitoring in S+C+L Transmission with Forward and Backward Distributed Raman Amplification","speaker":"Runa Kaneko","affiliation":"NTT Network Innovation Laboratories","authors":"Runa  Kaneko, Takeo  Sasai, Masanori  Nakamura, Kosuke  Kimura, Hiroto  Kawakami, Takayuki  Kobayashi, Yutaka  Miyamoto, Etsushi  Yamazaki, Fukutaro  Hamaoka","start":"","end":"","abstractid":211708,"order":66,"abstract":"Abstract (summary)  We demonstrate longitudinal power monitoring in S+C+L transmission with bidirectional distributed Raman amplification (DRA) for the first time. Measurements over five 80-km spans spatially resolve the effects of DRA and inter-channel stimulated Raman scattering (ISRS) on power evolution, revealing spatial features inaccessible to end-to-end monitoring.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-576.pdf"},{"role":"speaker","rolename":"Poster","code":"#673 / Mo4-P-67","title":"KZ-Based Spectral Modeling of Nonlinear Interference with Data-Driven PSD Estimation","speaker":"Saber Rahbarfam","affiliation":"University of Toronto","authors":"Saber  Rahbarfam, Frank R.  Kschischang","start":"","end":"","abstractid":211839,"order":67,"abstract":"Abstract (summary)  Accurate modeling of nonlinear interference in optical fiber systems is investigated using Kolmogorov–Zakharov modeling and learning-based PSD estimation. KZ outperforms GN in accuracy and effective complexity. A linear regression model maps spectra to NLI PSD, enabling improved performance prediction in practical systems.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-673.pdf"},{"role":"speaker","rolename":"Poster","code":"#762 / Mo4-P-68","title":"Real-Time MDM Transmission Trial Using 800G OTN Transceivers over Field-Deployed FMF","speaker":"Chengbin Long","affiliation":"Peking University","authors":"Chengbin  Long, Gang  Qiao, Yu  Yang, Tonghui  Ji, Lulu  Liu, Lipeng  Feng, Anxu  Zhang, Honglin  Ji, Shangcheng  Wang, Zhaopeng  Xu, Yuyang  Gao, Jinyi  Yu, Lei  Shen, Lei  Zhang, Jie  Luo, Xu  Zhang, Zhixue  He, Yongqi  He, Zhangyuan  Chen, Hongbin  Li, Weisheng  Hu, Shaohua  Yu, Juhao  Li","start":"","end":"","abstractid":211937,"order":68,"abstract":"Abstract (summary)  Through effective suppression of modal crosstalk including adopting bidirectional transmission and only selecting LP01 and LP02 modes as active channels, we demonstrate real-time MDM-WDM transmission over 80-km field-deployed FMF using commercial 800G DP-16QAM OTN transceivers.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-762.pdf"},{"role":"speaker","rolename":"Poster","code":"#772 / Mo4-P-69","title":"Power Consumption Analysis of Terrestrial Systems with the Same Fiber Capacity","speaker":"John Downie","affiliation":"Corning Incorporated","authors":"John  Downie, Viacheslav  Ivanov, Lidia  Galdino, Colin  Wallace","start":"","end":"","abstractid":211951,"order":69,"abstract":"Abstract (summary)  We analyze the relative power consumption of terrestrial long-haul systems constructed with different fiber types and optimized span lengths producing the same cable capacity.  Advanced fibers with C-band amplifiers have the lowest power consumption and carbon footprint, saving up to 40% over conventional fiber.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-772.pdf"},{"role":"speaker","rolename":"Poster","code":"#91 / Mo4-P-70","title":"Hollow-Core and Standard Single-Mode Fiber Hybrid Optical Networks: A Multi-Topology Investigation of Protection Switching","speaker":"Zhiping Jiang","affiliation":"","authors":"Md Ghulam  Saber, Zhiping  Jiang","start":"","end":"","abstractid":210490,"order":70,"abstract":"Abstract (summary)  We study cross-fiber protection switching in hybrid hollow-core and single-mode networks. At 50% deployment, CD steps reach 4,000-22,000 ps/nm with 1.6-3.1 dB penalties, causing 38-59% modulation downgrades. CO2-absorption degrades 9-26 of 64 L-band channels. Higher HCF fractions generally reduce all impairments across six network topologies.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-91.pdf"},{"role":"speaker","rolename":"Poster","code":"#213 / Mo4-P-71","title":"SRS-Immune Fiber Attenuation Monitoring via Full-Band Power Aggregation in C+L Band Systems","speaker":"Chuxuan Yu","affiliation":"Tencent","authors":"Chuxuan  Yu, Minggang  Chen, Lei  Liu, Fangchao  Li, Yu  Wang, Zekun  He, Yachen  Wang, Xianneng  Zou","start":"","end":"","abstractid":210939,"order":71,"abstract":"Abstract (summary)  We propose a full-band power aggregation method for real-time fiber attenuation monitoring in C+L band systems to overcome stimulated Raman scattering (SRS) interference in single-channel monitoring. Validation on 237 production spans reduces the false alarm rate from 24.9% to 0% at a 3.5dB attenuation variation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-213.pdf"},{"role":"speaker","rolename":"Poster","code":"#219 / Mo4-P-72","title":"Time-Error-Constrained Bidirectional Provisioning for Synchronization Services in Dynamic Elastic Optical Networks","speaker":"Yixin Wang","affiliation":"BUPT","authors":"Haojie  Wang, Yixin  Wang, Yongli  Zhao, Jie  Zhang","start":"","end":"","abstractid":210945,"order":72,"abstract":"Abstract (summary)  Bidirectional slot mismatch in dynamic EONs induces chromatic-dispersion time errors that can invalidate synchronization services. We derive a path-dependent reverse-slot admissibility bound for bidirectional provisioning. On COST239, it lowers blocking versus timing-unaware and strict same-slot baselines while keeping admitted synchronization services within a 3-ns budget.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-219.pdf"},{"role":"speaker","rolename":"Poster","code":"#246 / Mo4-P-73","title":"Inter-Port Crosstalk Reduction in Single Multi-Input-Port WSS-Based ROADM Architectures Using Interleaved Port Allocation","speaker":"Masahiko Jinno","affiliation":"Keio University","authors":"Masahiko  Jinno, Ryunosuke  Sasaki, Emre Maleeq Bin Mohd  Rashdan, Takashi  Miyamura, Satoru  Okamoto, Naoaki  Yamanaka","start":"","end":"","abstractid":210975,"order":73,"abstract":"Abstract (summary)  We analyse joint-switching-induced inter-port crosstalk (XT) in single multi-input-port WSS-based ROADM architectures. We propose an interleaved port allocation scheme that suppresses XT without additional hardware and validate it experimentally, demonstrating considerable XT reduc-tion while preserving the simplicity and cost advantages of the single-WSS architecture.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-246.pdf"},{"role":"speaker","rolename":"Poster","code":"#302 / Mo4-P-74","title":"Benchmarking of Switching Technologies under Various Traffic Distributions in Pan-European and US WDM Core Networks","speaker":"Thierry Zami","affiliation":"Alcatel Submarine Network","authors":"Thierry  Zami, Ihtesham  Khan, Jesse  Simsarian","start":"","end":"","abstractid":211063,"order":74,"abstract":"Abstract (summary)  We review the conditions of network topology and traffic distribution under which pure fiber switching can accommodate a total capacity close to wavelength switching for a North American and a Pan-European WDM networks","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-302.pdf"},{"role":"speaker","rolename":"Poster","code":"#307 / Mo4-P-75","title":"Impact of Statistical LCoS-induced PDL in WDM Networks Equipped with Multirail Amplifiers and 800ZR+ Interfaces","speaker":"Nicola Rossi","affiliation":"Alcatel Submarine Networks","authors":"Nicola  Rossi, Thierry  Zami, Bruno  Lavigne","start":"","end":"","abstractid":211088,"order":75,"abstract":"Abstract (summary)  This study quantifies the benefit on both the OSNR penalty and the network capacity of accounting realistically statistical PDL insertions vs. fixed reasonable worst-case values in the context of modern optical networks equipped with multirail amplifiers featuring integrated spectral equalizers","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-307.pdf"},{"role":"speaker","rolename":"Poster","code":"#556 / Mo4-P-76","title":"SMART Optical Network Integrating PTMP Sensing, 10×1-Tb/s Metro Superchannel, and Fixed-Mobile Access","speaker":"Yixiao Zhu","affiliation":"Shanghai Jiao Tong University","authors":"Yixiao  Zhu, Chenbo  Zhang, Xiang  Cai, Yi  Zou, Yutong  Pan, Tianhong  Zhang, Jingchi  Li, Xiaopeng  Xie, Fan  Zhang, Weisheng  Hu","start":"","end":"","abstractid":211681,"order":76,"abstract":"Abstract (summary)  We present SMART (Sensing-Metro-Access-RoF-Transport) optical network integrating, for the first time, point-to-multipoint multi-event forward sensing with sub-28-m resolution, 10×1-Tb/s metro superchannel, co-wavelength access of super-rated 200G coherent PON with 35-dB power budget (ITU-T E2-class) and 1.05-Tb/s CPRI-equivalent rate 16384-QAM RoF.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-556.pdf"},{"role":"speaker","rolename":"Poster","code":"#629 / Mo4-P-77","title":"CATS: Constraint-Aware Topology Scheduling Mechanism for Efficient LLM Training in O/E Hybrid Switching Networks","speaker":"Liang  Gao","affiliation":"BUPT","authors":"Liang  Gao, Yakun  Hu, Shikui  Shen, Bowen  Han, Jiameng  Pan, Wei  Chen, Wenzhe  Li, Zelin  Wang, Bingli  Guo, Siyi  Liao, Xiongyan  Tang, Shanguo  Huang, Xuwei  Xue","start":"","end":"","abstractid":211782,"order":77,"abstract":"Abstract (summary)  We propose Constraint-Aware Topology Scheduling (CATS) mechanism to overcome the indiscriminate scheduling exclusively based on traffic volume in O/E hybrid networks. CATS strategically offloads the constraint-induced traffic to the contention-free, zero-jitter optical paths, accelerating LLM training average time by 0.49%–9.16% and boosting TFLOPS by 0.61%–9.12%","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-629.pdf"},{"role":"speaker","rolename":"Poster","code":"#86 / Mo4-P-78","title":"Distributed LLM Training over Passive Optical Networks: Performance Impact of Dynamic Bandwidth Allocation","speaker":"Xiaonan Xu","affiliation":"Nokia Bell Labs","authors":"Xiaonan  Xu, Haoshuo  Chen, Sarvesh  Bidkar, Kovendhan  Vijayan, Robert  Borkowski, Roland  Ryf, Jesse  Simsarian, Nicolas  Fontaine, Mikael  Mazur, Lauren  Dallachiesa, David  Neilson","start":"","end":"","abstractid":210452,"order":78,"abstract":"Abstract (summary)  We implement data-parallel LLM training on a two-node 25GS-PON testbed and evaluate AllReduce performance under varying delay tolerance and bandwidth configurations. Results show that higher delay tolerance increases communication latency, demonstrating that properly configured PONs can feasibly support small- and medium-scale distributed training workloads.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-86.pdf"},{"role":"speaker","rolename":"Poster","code":"#154 / Mo4-P-79","title":"Mixed DD and Coherent Receivers for VHSP using Digital CD Pre-Compensated PAM-2","speaker":"Dario Pilori","affiliation":"Politecnico di Torino","authors":"Dario  Pilori, Hanane  Kharbich, Gabriella  Bosco, Giuseppe  Rizzelli, Valter  Ferrero, Giuseppe  Talli, Ivan  Cano, Roberto  Gaudino","start":"","end":"","abstractid":210741,"order":79,"abstract":"Abstract (summary)  In the ongoing research towards next-generation Very High Speed PON, we propose and experimentally investigate the combination of Digital Chromatic Dispersion Pre-Compensation (DCPC) PAM-2 transmission with coexisting mixed receivers: DD for PON up to 20km and coherent detection for extended reach up to 40+km.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-154.pdf"},{"role":"speaker","rolename":"Poster","code":"#182 / Mo4-P-80","title":"An Integrated 150 Gb/s NRZ Heterodyne Detection RX Supporting 20km SMF with Simple FFE for VHSP PON","speaker":"Gertjan Coudyzer","affiliation":"","authors":"Cheng  Wang, Gertjan  Coudyzer, Ye  Gu, Shengpu  Niu, Jing  Zhang, Xin  Yin","start":"","end":"","abstractid":210823,"order":80,"abstract":"Abstract (summary)  An integrated NRZ modulation heterodyne detection RX is demonstrated for VHSP PON. Analog signal processing for chromatic dispersion suppression and demodulation is implemented. 150Gb/s NRZ is detected with -22(B2B)/-16dBm(20km SMF) OMA at 1320/1295nm, using 0.5 dBm LO and  7/11-tap FFE.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-182.pdf"},{"role":"speaker","rolename":"Poster","code":"#200 / Mo4-P-81","title":"Receiver-Informed Transmitter for 200Gbps C-Band Direct-Detection PON With FFE-Free ONU","speaker":"Safiya Dabwan","affiliation":"","authors":"Safiya  Dabwan, Geraldo  Gomes, Stylianos  Sygletos","start":"","end":"","abstractid":210876,"order":81,"abstract":"Abstract (summary)  We introduce and numerically demonstrate receiver-informed transmitter (RITX) waveform design for 200 Gb/s PAM-4 C-band direct-detection PON. Using 50 GHz optoelectronics, RITX achieves N1/E1 loss classes with FFE-Free ONU, enabling 40 km reach and 48.1%/66.7% network-wide complexity savings at 1:64/1:128 splits.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-200.pdf"},{"role":"speaker","rolename":"Poster","code":"#276 / Mo4-P-82","title":"Passive Optical Networks Systems with Co-Propagating Distributed Acoustic Sensing","speaker":"Jeremy Potet","affiliation":"Orange Research","authors":"Gael  Simon, Jérémy  Potet, Fabienne  Saliou, Philippe  Chanclou, Maël  Bideau, Remi  Gavrilovic, Robert Clayton  Harisson, Bachir  Sleiman, Alex  Chedid, Gaetan  Calbris","start":"","end":"","abstractid":211018,"order":82,"abstract":"Abstract (summary)  We study the impact of distributed acoustic sensing on PONs. We show that wavelength isolation is required, and how Raman scattering can impact the downstream G-PON. We also provide guiding rules to mitigate DAS impact on PONs.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-276.pdf"},{"role":"speaker","rolename":"Poster","code":"#280 / Mo4-P-83","title":"Wi-Fi Transmission Over In-building FTTR Networks Using Sigma-Delta Modulation","speaker":"Sophie Thiele","affiliation":"","authors":"Sophie  Thiele, Christian  Bluemm, Stefano  Calabrò, Stephan  Pachnicke","start":"","end":"","abstractid":211028,"order":83,"abstract":"Abstract (summary)  Sigma-delta, unlike analog radio over fiber, enables robust Wi-Fi FTTR transmission with standard SFP+ modules not optimized for linear drive. Furthermore, a 27.5% reduction in required optical bandwidth is achieved for a 160 MHz 256‑QAM signal by reducing the oversampling rate through amplitude clipping.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-280.pdf"},{"role":"speaker","rolename":"Poster","code":"#346 / Mo4-P-84","title":"Multipath Interference Mitigation Based on Low-Complexity Adaptive High-Pass Filtering in Data Centre IM/DD Systems with OCS","speaker":"Ning Deng","affiliation":"","authors":"H. N.  Parajuli, Tonghui  Ji, Xinping  Wang, Ning  Deng, Shikui  Shen, Jing  Xu","start":"","end":"","abstractid":211146,"order":84,"abstract":"Abstract (summary)  We propose a low-complexity MPI mitigation scheme using adaptive high-pass filtering for data centre IM/DD systems. Experimental results demonstrate 4 dB improvement in SIR tolerance and 3.5 dB receiver sensitivity gain at HD-FEC threshold for a 56.88 Gbps PAM-4 signal in an OCS-integrated IM/DD link.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-346.pdf"},{"role":"speaker","rolename":"Poster","code":"#397 / Mo4-P-85","title":"First Demonstration of Novel Combo-ONUs for Cost-Effective Evolution from XGS-PON to 50G-PON","speaker":"Frank Effenberger","affiliation":"Futurewei","authors":"Yuanqiu  Luo, Ning  Wang, Junwei  Li, Frank  Effenberger, Dekun  Liu, Dechao  Zhang","start":"","end":"","abstractid":211276,"order":85,"abstract":"Abstract (summary)  We demonstrate the first 50G/XGS Combo-ONU deployment for PON evolution. It integrates XGS-PON and 50G-PON links. The business modeling and field trial results demonstrate reduced migration cost, operational flexibility, and enhanced system features for operators.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-397.pdf"},{"role":"speaker","rolename":"Poster","code":"#486 / Mo4-P-86","title":"Experimental Evaluation of PAM2-SSB and PAM2-SSB+DCPC for a 2×100Gb/s/λ Very High Speed PON Downstream","speaker":"Lorenzo Andrenacci","affiliation":"Huawei Technologies Düsseldorf GmbH","authors":"Lorenzo  Andrenacci, Giuseppe  Caruso, Hanane  Kharbich, Giuseppe  Rizzelli, Ivan  Cano, Valter  Ferrero, Giuseppe  Talli, Gabriella  Bosco, Roberto  Gaudino","start":"","end":"","abstractid":211497,"order":86,"abstract":"Abstract (summary)  We experimentally demonstrate a digitally-generated PAM2-SSB modulation with direct-detection receiver. The results show that, even with limited DSP complexity, the CD tolerance can be enhanced to ensure coexistence with previous PON technologies while still supporting Class N1 power-budget. Further improvement is obtained by adding DCPC.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-486.pdf"},{"role":"speaker","rolename":"Poster","code":"#513 / Mo4-P-87","title":"400 Gbit/s IM/DD PON with >30 dB Power Budget Enabled by Quantum-Dot SOA Amplified Remote Node","speaker":"Ahmed Galib Reza","affiliation":"Dublin City University","authors":"Ahmed Galib  Reza, Janina  Rautert, Vladimir S.  Mikhrin, Alexey  Gubenko, Liam P.  Barry","start":"","end":"","abstractid":211575,"order":87,"abstract":"Abstract (summary)  We demonstrate 4×100 Gbit/s NRZ-OOK transmissions with 200 GHz channel spacing for next-generation 400G PON. By employing an InAs/GaAs quantum-dot SOA-amplified remote node, we achieve an optical power budget beyond N1 class after 20 km at the HD-LDPC BER limit, using a T-spaced FFE.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-513.pdf"},{"role":"speaker","rolename":"Poster","code":"#36 / Mo4-P-88","title":"Environmental Sensing on XGS-PON OLT Using Upstream Burst Window Alignment","speaker":"Borja Vidal","affiliation":"Universitat Politecnica de Valencia","authors":"Julio  Montalvo, Robert  Borkowski, Sandip  Das, Daniel  Cortés, Borja  Vidal","start":"","end":"","abstractid":209632,"order":88,"abstract":"Abstract (summary)  We demonstrate PON integrated sensing and communication (ISAC) for fiber ambient temperature estimation and continuous monitoring. Using operational XGS‑PON we measure change in fiber RTT at OLT using burst-mode upstream alignment. Experimental results in a climatic chamber show 0.63°C temperature RMS error over 4-km-long fiber.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-36.pdf"},{"role":"speaker","rolename":"Poster","code":"#77 / Mo4-P-89","title":"Low-Tech SOP Sensing over FTTH for Seismic Monitoring in Campi Flegrei: Benchmarking Against Interferometry and φ-OTDR","speaker":"Emanuele Virgillito","affiliation":"Politecnico di Torino","authors":"Emanuele  Virgillito, Federico  Notarstefano, André  Herrero, Gilda  Currenti, Francesca  Bianco, Miriana  Corsaro, Michele  Prestifilippo, Rudi  Bratovich, Raffaele  Corsini, Simone  Donadello, Cecilia  Clivati, Francesco  Di Lena, Davide  Calonico, Marianna  Hovsepyan, Francesco  Carpentieri, Vittorio  Curri","start":"","end":"","abstractid":210397,"order":89,"abstract":"Abstract (summary)  We demonstrate, for the first time, PBS-based low-tech SOP sensing for seamless seismic monitoring using in-service FTTH infrastructure in the highly seismic area of Campi Flegrei. The approach detects earthquakes down to magnitude 1.9 and is positively benchmarked against consolidated interferometric phase and φ-OTDR techniques.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-77.pdf"},{"role":"speaker","rolename":"Poster","code":"#137 / Mo4-P-90","title":"252 Gbit/s, Polarization-multiplexed 128 QAM Fully Coherent Transmission over 10 km SMF and 40 m Wirelessly at 125 GHz","speaker":"Tomoki Joichi","affiliation":"Tohoku University","authors":"Tomoki  Joichi, Arata  Watanabe, Yusei  Sakuma, Keisuke  Kasai, Toshihiko  Hirooka, Masato  Yoshida, Masataka  Nakazawa","start":"","end":"","abstractid":210706,"order":90,"abstract":"Abstract (summary)  We report a 252-Gbit/s polarization-division-multiplexed (PDM) fully coherent transmission in the 125 GHz band. By employing frequency-domain-equalization that compensates for both imperfect frequency responses and IQ imbalance, PDM 18 Gbaud 128 QAM signals are successfully transmitted over a 10 km SMF and 40 m wirelessly.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-137.pdf"},{"role":"speaker","rolename":"Poster","code":"#174 / Mo4-P-91","title":"Cost-Effective 50-km DAS Using a 200-kHz-Linewidth ECL with FDM Dual-Pulse Phase Noise Compensation","speaker":"Jingchi Cheng","affiliation":"Xidian University","authors":"Jingchi  Cheng, Zichen  Qian, Can  Zhao, Zhihuai  Yang, Jing  Jiang, Quan  Sun, Tao  Shang, Ming  Tang","start":"","end":"","abstractid":210801,"order":91,"abstract":"Abstract (summary)  We demonstrate a cost-effective 50-km DAS resilient to phase noise and fading. Leveraging a frequency-division-multiplexed dual-pulse delay-beat scheme, we achieve a strain sensitivity of 234 pε/√HzpεHz using a 200-kHz-linewidth ECL, and the performance using a 10-kHz-linewidth ECL is comparable to that of a 100-Hz-linewidth NLL.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-174.pdf"},{"role":"speaker","rolename":"Poster","code":"#319 / Mo4-P-92","title":"Detection, Localization and Tracking of Underwater Acoustic Sources via A Passive Fiber Optic Hydrophone Array","speaker":"Sarper Ozharar","affiliation":"NEC Laboratories America","authors":"Sarper  Ozharar, Yaowen  Li, Yue  Tian, Yangmin  Ding, Ting  Wang","start":"","end":"","abstractid":211112,"order":92,"abstract":"Abstract (summary)  A fiber optic hydrophone array comprising four passive fiber mandrels, interrogated by a distributed acoustic sensing system was deployed in a lake for field testing. Several stationary and moving underwater acoustic sources were localized, continuously tracked, and their acoustic signals were enhanced by beamforming techniques.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-319.pdf"},{"role":"speaker","rolename":"Poster","code":"#373 / Mo4-P-93","title":"Comparison of Sigma-Delta-Over-Fiber and Analog Radio-Over-Fiber mm-wave Links With Optical Up-Conversion","speaker":"Frida Karin Olofsson","affiliation":"Chalmers University of Technology","authors":"Frida  Olofsson, Christina  Lim, Ka-Lun  Lee, Magnus  Karlsson, Lise  Aabel, Christian  Fager","start":"","end":"","abstractid":211201,"order":93,"abstract":"Abstract (summary)  Radio-over-fiber with central frequency up-conversion is promising for phase-coherent D-MIMO transmission, but extension to mm-wave requires impractically high sampling rates. We employ optical up-conversion to relax this constraint and compare ARoF and SDoF, showing SDoF performs better below 300 MBd.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-373.pdf"},{"role":"speaker","rolename":"Poster","code":"#376 / Mo4-P-94","title":"Breaking the Manual Alignment Barrier: First Demonstration of an Automatically Aligned Kilometer-Scale 100-Gb/s Photonic THz Wireless Link in 300-GHz Band","speaker":"Minkyu Sung","affiliation":"Electronics and Telecommunications Research Institute","authors":"Minkyu  Sung, Sang-Rok  Moon, Sooyeon  Kim, Sungmin  Cho, Seung-Hwan  Kim, Heuk  Park, Joon Ki  Lee, Seung-Hyun  Cho","start":"","end":"","abstractid":211207,"order":94,"abstract":"Abstract (summary)  We demonstrate the first automatically aligned km-scale 100-Gb/s photonic THz wireless link under realistic rooftop-to-rooftop deployment conditions. Sensor-assisted coarse acquisition and power feedback fine alignment achieve 25-GBaud 16-QAM transmission over a 1.1-km line-of-sight path at 300 GHz with a BER of 1.5×10-2.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-376.pdf"},{"role":"speaker","rolename":"Poster","code":"#517 / Mo4-P-95","title":"Low-Penalty Joint Communication and Acoustic Sensing using P43 Polyphase Code","speaker":"Vishal Chandraprakash Rai","affiliation":"Adtran Networks SE","authors":"Vishal Chandraprakash  Rai, André  Sandmann, Florian  Azendorf, Bernhard  Schmauss","start":"","end":"","abstractid":211593,"order":95,"abstract":"Abstract (summary)  Polyphase coding is investigated for distributed acoustic sensing in joint communication-sensing systems. A P43 code is evaluated using CC-OTDR and compared to linear frequency-modulated probes. Experiments demonstrate an additional 17.4 dB crosstalk suppression, while inducing only a 0.09 dB OSNR penalty on co-propagating DP-16QAM signals.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-517.pdf"},{"role":"speaker","rolename":"Poster","code":"#541 / Mo4-P-96","title":"Joint High-Speed Communications, Safety Power Delivery and Temperature Sensing over Multicore Fibers","speaker":"Javier Barco Alvarez","affiliation":"UNIVERSIDAD CARLOS III DE MADRID","authors":"Javier  Barco Alvárez, Carmen  Vázquez","start":"","end":"","abstractid":211657,"order":96,"abstract":"Abstract (summary)  We report the first measurement of temperature variations induced by PoF using FBGs. Tests on a 7-core MCF with 25.67 Gbps 5G-NR ARoF and 25 Gbps NRZ transmission, delivering 360 mW at 2km, show that 2W PoF increases core temperature by 16 ±1 ºC","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-541.pdf"},{"role":"speaker","rolename":"Poster","code":"#608 / Mo4-P-97","title":"Field Trial of Distributed Acoustic Fiber and 6G Radio Sensing Fusion for Enhanced Localization Accuracy in an Industrial Environment","speaker":"Michael Straub","affiliation":"Nokia Bell Labs","authors":"Michael  Straub, Sandip  Das, Artjom  Grudnitsky, Rolf  Fuchs, Victoria  Palhares, Sterenn  Guerrier","start":"","end":"","abstractid":211752,"order":97,"abstract":"Abstract (summary)  We propose, analyse, and experimentally verify the effectiveness of combining radio and optical sensing for enhanced localization accuracy. First use cases to jointly sense within an industrial environment were demonstrated and analysed during a Field Trial at the research campus of Arena2026 in Stuttgart, Germany.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-608.pdf"},{"role":"speaker","rolename":"Poster","code":"#612 / Mo4-P-98","title":"RF Interference Suppression with Synthesis of Field-Programmable Microwave Photonic Filters Based on Hexagonal Meshes","speaker":"Qiuzhuo Deng","affiliation":"Zhejiang University","authors":"Can  Wang, Qiuzhuo  Deng, Guanyu  Chen, Yuheng  Cao, Borja  Vidal, Xiaodan  Pang, Hongtao  Lin, Lu  Zhang, Xianbin  Yu","start":"","end":"","abstractid":211761,"order":98,"abstract":"Abstract (summary)  We demonstrate the synthesis of a field-programmable microwave photonic filter (MPF) on a 5×5 hexagonal mesh for RF interference suppression. Strong anti-interference ability of the synthesized integrated MPF architecture is validated with a 4 Gbps QPSK RF signal, achieving an EVM improvement of >40%.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-612.pdf"},{"role":"speaker","rolename":"Poster","code":"#733 / Mo4-P-99","title":"External Modulation of an RF Signal Enhanced by Mutual Optical Injection Locking","speaker":"Leonardo Rama","affiliation":"","authors":"Leonardo  Rama, Carla  Rodrigues, João  Santos, Diogo  Vaz, Francisco  Rodrigues, Tiago  Varum, Rogério  Nogueira, Miguel  Drummond, António  Teixeira","start":"","end":"","abstractid":211905,"order":99,"abstract":"Abstract (summary)  We demonstrate a novel external modulation scheme that increases the modulation efficiency for RF signals. It uses an EAM placed between two mutually injection-locked DFB lasers. Driving the EAM at the relaxation frequency of DFB lasers provides a modulation gain of 14 dB.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-733.pdf"},{"role":"speaker","rolename":"Poster","code":"#800 / Mo4-P-100","title":"Field Demonstrations of Operational Strain Modal Analysis of a Historic Suspension Bridge Using Installed Telecom Fibres","speaker":"Bo Fan","affiliation":"","authors":"Bo  Fan, Haozhe  Rui, Mathew  Purnell, Wei  Jin, Xingwen  Yi, Roger  Giddings, Md Saifuddin  Faruk, Jianming  Tang","start":"","end":"","abstractid":211983,"order":100,"abstract":"Abstract (summary)  We demonstrate operational strain modal analysis of the Menai suspension bridge using installed telecom fibre and distributed acoustic sensing. Using enhanced frequency-domain decomposition, we extract key structural health indicators, including natural frequencies, mode shapes, and damping ratios, providing a cost-effective, continuous, and robust SHM solution.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-800.pdf"},{"role":"speaker","rolename":"Poster","code":"#825 / Mo4-P-101","title":"A New Optical Fiber-Based Sensor for Concentrated Solar Flux Monitoring in Concentrated Solar Power Plants","speaker":"Alejandro Carballar","affiliation":"E.T.S. Ingeniería - Universidad de Sevilla","authors":"Javier  García-Borja, Alejandro  Carballar, Ricardo  Conceição, José  González-Aguilar, Alexander  Thies","start":"","end":"","abstractid":212008,"order":101,"abstract":"Abstract (summary)  This paper presents the proof of concept of a novel optical fiber-based sensor to measure concentrated solar flux up to 1 MW/m2 in Concentrated Solar Power (CSP) applications. The proposal constitutes an efficient, passive, robust and low-maintenance alternative to traditional radiometers.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-825.pdf"},{"role":"speaker","rolename":"Poster","code":"#74 / Mo4-P-102","title":"A Field Demonstration of Cross Lake Free Space Optical Communication for 10GPON Backhaul","speaker":"Buzheng Wei","affiliation":"China Unicom","authors":"Buzheng  Wei, He  Zhang, Changzheng  Zhou, Zhongyi  Feng, Shikui  Shen, Guangquan  Wang, Zelin  Wang, Feng  Xu, Xiongyan  Tang, Yantao  Zhou, Liang  Zhao, Yuetang  Yang, Zhuchen  Liu, Mingjiao  Yu, LIning  Lin","start":"","end":"","abstractid":210372,"order":102,"abstract":"Abstract (summary)  This paper demonstrates a field trial in PON network utilizing a custom-designed FSO system cross an 1.3km lake environment. Operating at C-band without OA and FEC, the system achieves consecutive 6 hours of error-free 10Gbps transmission, validating FSO as an alternative solution for operator backhaul.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-74.pdf"},{"role":"speaker","rolename":"Poster","code":"#102 / Mo4-P-103","title":"Geometric-Configuration Modulation: A Novel Free-Space Optical Communication Paradigm for D/r0 ~ 5 Turbulence Resistance","speaker":"Yu-Ming Bai","affiliation":"Tsinghua University","authors":"Yu-Ming  Bai, Ming-Han  Ding, Yu-Xuan  Liu, Jun-Lin  Li","start":"","end":"","abstractid":210573,"order":103,"abstract":"Abstract (summary)  We propose Geometric-Configuration Modulation (GM), a novel AO-free FSO paradigm utilizing multi-source geometric configuration encoding and active correlative decoding. GM demonstrates exceptional resistance to strong atmospheric turbulence (D/r0~5.0) over a 1.2 m link in preliminary experiments. ©2026 The Author(s)","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-102.pdf"},{"role":"speaker","rolename":"Poster","code":"#233 / Mo4-P-104","title":"Experimental Demonstration of Dual-Polarization PAM3 for Visible-Light Underwater Optical Wireless Communication","speaker":"Masanori Hanawa","affiliation":"University of Yamanashi","authors":"Masanori  Hanawa, Ekkaphol  Khansalee, Md Ashiqur  Rahman, Ryoko  Yoshino","start":"","end":"","abstractid":210959,"order":104,"abstract":"Abstract (summary)  We experimentally demonstrate dual-polarization PAM3 as a 3 bit/s/Hz IM/DD scheme for visible-light underwater optical wireless communication. Polarization-axis mismatch between transmitter and receiver deformed square-like constellation maps into rhombic ones, causing BER floor; affine compensation was effective for ρ ≤ 20° but not at 30°.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-233.pdf"},{"role":"speaker","rolename":"Poster","code":"#396 / Mo4-P-105","title":"High Sensitivity and High Speed SiPM Array Based Optical Wireless Receiver","speaker":"Jingyu Hou","affiliation":"University of Cambridge","authors":"Jingyu  Hou, Wajahat  Ali, Richard  Penty, Michael  Crisp","start":"","end":"","abstractid":211269,"order":105,"abstract":"Abstract (summary)  1×2 SiPM receiver arrays are experimentally demonstrated in high-speed optical wireless links. 9.5 Gbps transmission is achieved using a 2× 10010 SiPM array, while the required irradiance at 8 Gbps is reduced by 6.25× compared to a single 10010 SiPM receiver.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-396.pdf"},{"role":"speaker","rolename":"Poster","code":"#408 / Mo4-P-106","title":"Enhancing Turbulence Resilience in Free-Space Optical Communications Using Germanium-Silicon Photodiode Array Interfaced with Multi-Core Fiber via Vertical Grating Couplers","speaker":"Yuan-Zeng Lin","affiliation":"","authors":"Yuan-Zeng  Lin, Yu-Han  Lin, Cheng-Si  Weng, Hsiang-Yi  Kuo, Shin-Yu  Lee, Chi-Wai  Chow","start":"","end":"","abstractid":211288,"order":106,"abstract":"Abstract (summary)  We demonstrate a free-space-optical-communication (FSOC) with enhanced atmospheric-turbulence resilience using germanium-silicon (GeSi) photodiode-array interfaced with multi-core-fiber (MCF) via vertical-grating-couplers (VGC). Experimental results show the proposed scheme significantly improves FSOC performance under different turbulence conditions.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-408.pdf"},{"role":"speaker","rolename":"Poster","code":"#453 / Mo4-P-107","title":"A Novel Integrated Multi-Gb/s Optical Wireless Communication and Sub-μm Particle Sensing System for IoT Applications","speaker":"Tiankuo  Jiao","affiliation":"University of Cambridge","authors":"Tiankuo  Jiao, Hossein  Kazemi, Yifan  Huang, Harald  Haas","start":"","end":"","abstractid":211419,"order":107,"abstract":"Abstract (summary)  A proof-of-concept optical wireless integrated sensing and communication (OW-ISAC) system is proposed, demonstrating 0.5–10 μm particulate matter (PM) detection and 7.3 Gb/s optical wireless communication (OWC) at hard decision forward error correction (HD-FEC) bit error ratio (BER), using a single laser diode (LD).","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-453.pdf"},{"role":"speaker","rolename":"Poster","code":"#560 / Mo4-P-108","title":"Optical Hotspot for Adaptive Pencil-/Wide-Beam Formation for Fiber-Wireless Connectivity with Integrated User Localization","speaker":"Florian Honz","affiliation":"AIT Austrian Institute of Technology","authors":"Florian  Honz, Bernhard  Schrenk","start":"","end":"","abstractid":211690,"order":108,"abstract":"Abstract (summary)  We propose an optical hotspot for adaptive pencil-/wide-beam formation, enabling user localization and the establishment of an optical fiber-wireless connection by means of tunable optics. We confirm stable optical wireless operation over a free-space link reach of 107 m.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-560.pdf"},{"role":"speaker","rolename":"Poster","code":"#741 / Mo4-P-109","title":"Compact VCSEL–Metasurface OAM Transmitter with SIMO Processing for Optical Wireless Interconnects","speaker":"Rizwana  Ahmad","affiliation":"University of Cambridge,","authors":"Rizwana  Ahmad, Arttu  Nieminen, Humeyra  Caglayan, Harald  Haas","start":"","end":"","abstractid":211914,"order":109,"abstract":"Abstract (summary)  Optical wireless interconnects require compact transmitters and robust detection. We demonstrate a VCSEL–metasurface OAM link with SIMO processing for short-reach interconnects. At the FEC threshold, ZF achieves 3.84 Gbps (no turbulence) and 1.96 Gbps (D/r0 = 0.2), outperforming MRC, confirming interference-limited operation under considered receiver.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-741.pdf"},{"role":"speaker","rolename":"Poster","code":"#159 / Mo4-P-110","title":"AI-Driven Detection and Localization of Optical Filtering Soft Failures via Digital Twin","speaker":"Andrea Rosso","affiliation":"Politecnico di Torino","authors":"Andrea  Rosso, Enrico  Miotto, Rocco  D'Ingillo, Vittorio  Curri","start":"","end":"","abstractid":210756,"order":110,"abstract":"Abstract (summary)  We propose a digital twin-assisted neural network for detecting, localizing, and characterizing soft failures in optical filters. Leveraging optical channel monitor and transceiver metrics, the method achieves high accuracy enabling scalable monitoring in complex optical networks.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-159.pdf"},{"role":"speaker","rolename":"Poster","code":"#501 / Mo4-P-111","title":"Experimental Demonstration of Compilation-oriented AI Agent for Autonomous PON Slice Provisioning","speaker":"Chansung Park","affiliation":"Electronics and Telecommunications Research Institute","authors":"Chansung  Park, Yongwook  Ra, HwanSeok  Chung","start":"","end":"","abstractid":211550,"order":111,"abstract":"Abstract (summary)  We demonstrate a compilation-oriented AI agent for autonomous PON slicing. By aggregating multi-source evidence into a shared specification, the AI agent enables model-agnostic improvements in provisioning reliability and token efficiency. Experiments on a 25G PON testbed demonstrate consistent dual-slice provisioning performance across multiple LLMs.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-501.pdf"},{"role":"speaker","rolename":"Poster","code":"#587 / Mo4-P-112","title":"Wavelength and Polarization Diversity OTDR for Highly Accurate Fiber Faults Identification","speaker":"Hongcheng Wu","affiliation":"Tsinghua Shenzhen International Graduate School, Tsinghua University","authors":"Hongcheng  Wu, Desheng  Li, Zecong  Liu, Kangping  Zhong, Faisal  Khan","start":"","end":"","abstractid":211721,"order":112,"abstract":"Abstract (summary)  We experimentally demonstrate a wavelength- and polarization-diversity OTDR for fiber faults identification in data-center networks. Our system accurately distinguishes fiber faults beyond conventional OTDR capabilities. Six critical fault types are emulated, and the proposed OTDR architecture, aided by ML, demonstrates over 99% faults identification accuracy.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-587.pdf"},{"role":"speaker","rolename":"Poster","code":"#645 / Mo4-P-113","title":"Bridging the 6G Gap: Scaling Sustainable ROADM-Based IP-over-WDM via DSCM-Enabled Point-to-Multipoint Designs","speaker":"David Larrabeiti","affiliation":"Universidad Carlos III de Madrid","authors":"Matin  Rafiei Forooshani, Farhad  Arpanaei, Hamzeh  Beyranvand, Mahdi  Ranjbar Zefreh, Juan Pedro  Fernández-Palacios, Alfonso  Sánchez-Macián, José Alberto  Hernández, David  Larrabeiti","start":"","end":"","abstractid":211806,"order":113,"abstract":"Abstract (summary)  This study compares transponder-based, Point-to-Point, and DSCM-based Point-to-Multipoint  (PtMP) access-metro architectures. Findings demonstrate that PtMP IPoWDM significantly optimizes  efficiency across diverse geotypes, slashing CAPEX by 92.0% and power by 99.2% compared to  traditional benchmarks over a ten-year horizon.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-645.pdf"},{"role":"speaker","rolename":"Poster","code":"#692 / Mo4-P-114","title":"Demonstration of Full-network Level Digital Twin for QoT Estimation in Field-deployed ROADM Networks","speaker":"Anxu Zhang","affiliation":"State Key Laboratory of Optical Fiber and Cable Manufacture Technology, China Telecom Research Institute","authors":"Xiaotian  Jiang, Xiaoli  Huo, Chaolun  Chen, Guoyong  Zhao, Xianghao  Cheng, Xin  Qin, Yisong  Wang, Yuqing  Han, Zheqing  Lv, Yuyang  Liu, Yadong  Gong, Anxu  Zhang, Junjie  Li","start":"","end":"","abstractid":211858,"order":114,"abstract":"Abstract (summary)  We propose and demonstrate a full-network level digital twin framework for QoT estimation in China Telecom's field-deployed ROADM networks, achieving mean aboslute errors of 0.53 dBm power and 0.68 dB OSNR for 95% test samples across all frequencies and loading rates.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-692.pdf"},{"role":"speaker","rolename":"Poster","code":"#695 / Mo4-P-115","title":"Max-Flow-Based OCS Reconfiguration Scheduling for Full-Stack Distributed LLM Training Acceleration in Optical AIDC","speaker":"Dianxuan Fu","affiliation":"Shanghai Jiao Tong University","authors":"Dianxuan  Fu, Xingyu  Liu, Qile  Liu, Jiaqiu  Li, Yihao  Zhang, Qizhi  Qiu, Xiaomin  Liu, Weisheng  Hu, Qunbi  Zhuge","start":"","end":"","abstractid":211861,"order":115,"abstract":"Abstract (summary)  We propose a max-flow-based OCS reconfiguration scheduling framework on our full-stack scale-out AIDC platform to accelerate LLM training. The proposed method reduces iteration time by up to 65.58% and improves All-Gather flow completion time by up to 15.36× under heuristically pruned GPU grouping.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-695.pdf"},{"role":"speaker","rolename":"Poster","code":"#771 / Mo4-P-116","title":"Integrated Sensing and Communication for Real-Time Detection and Localization in Live Production Metro Networks","speaker":"Gulmina Malik","affiliation":"Politecnico di Torino","authors":"Gulmina  Malik, Renato  Ambrosone, Muhammad Umar  Masood, Ahtisham  Ali, Mashboob  Cheruvakkadu Mohamed, Stefano  Straullu, Sai  Kishore Bhyri, Gabriele  maria Galimberti, Antonio  Napoli, João  Pedro, Walid  Wakim, Vittorio  Curri","start":"","end":"","abstractid":211950,"order":116,"abstract":"Abstract (summary)  We present an integrated SOP-based sensing framework for real-time detection and localization of fiber disturbances in a 31 km live production metro network. The ML classifier achieved 96.2% accuracy, while bidirectional measurements enabled median localization errors below 23 m, supporting controller-assisted alarms and maintenance operations.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-771.pdf"},{"role":"speaker","rolename":"Poster","code":"#97 / Mo4-P-117","title":"Highly Indistinguishable Dual-Channel Integrated Microring Single-Photon Source","speaker":"Baojie Hou","affiliation":"zhejiang university","authors":"Baojie  Hou, Donghui  Chen, Haoran  Ma, Zichao  Zhao, Qishen  Liang, Xinyu  Wang, Bin  Zhang, Yawen  Tu, Yongdi  Zhang, Bangmin  Gong, Tingge  Dai, Yuehai  Wang, Huihui  Zhu, Jianyi  Yang","start":"","end":"","abstractid":210550,"order":117,"abstract":"Abstract (summary)  Here, we propose a highly indistinguishable dual-channel integrated microring single-photon source based on bidirectional pumping. It achieves spectral purities of 96.13% and 96.96% in the two directions, respectively, alongside a 95.89% two-photon interference visibility.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-97.pdf"},{"role":"speaker","rolename":"Poster","code":"#99 / Mo4-P-118","title":"Throttling Protocol for Quantum Links","speaker":"Ludovic Noirie","affiliation":"Nokia Bell Labs","authors":"Ludovic  Noirie, Rémi  Varloot","start":"","end":"","abstractid":210554,"order":118,"abstract":"Abstract (summary)  We propose a new throttling mechanism for quantum link control in entanglement-based quantum networks. Using Markov chain modeling, we demonstrate Bell pair delivery stabilization, enabling an easier consumption by the upper layers of the quantum network protocol stack.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-99.pdf"},{"role":"speaker","rolename":"Poster","code":"#289 / Mo4-P-119","title":"Performance Statistics and Joint Optimization of CV-QKD and Classical Traffic in Dynamically Allocated Optical Networks","speaker":"Lucas Alves Zischler","affiliation":"University of L'Aquila","authors":"Lucas  Alves Zischler, Amirhossein  Ghazisaeidi, Antonio  Mecozzi, Cristian  Antonelli","start":"","end":"","abstractid":211043,"order":119,"abstract":"Abstract (summary)  We analyze the performance of classical and quantum CV-QKD systems, operating under dynamic classical traffic, assessing how classical signal statistics affects QKD performances. Furthermore, for channel-dynamics compensation, we introduce a novel gradient-descent-based approach for real-time optimization of quantum and classical throughput.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-289.pdf"},{"role":"speaker","rolename":"Poster","code":"#363 / Mo4-P-120","title":"Seamless Integration of Practical Quantum Key Distribution in Future Passive Optical Networks via Adaptive Scheduling","speaker":"Alessandro Gagliano","affiliation":"Politecnico di Milano","authors":"Alessandro  Gagliano, Francesco  Fumagalli, Alberto  Gatto, Pierpaolo  Boffi, Paolo  Martelli, Paola  Parolari","start":"","end":"","abstractid":211179,"order":120,"abstract":"Abstract (summary)  We investigate upstream DV-QKD in future passive optical networks under the finite-key regime, demonstrating that adaptive scheduling enables interference-reduced quantum-transmission windows and improves secret key rate, reach and scalability, especially in coexistence with XG-PON systems.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-363.pdf"},{"role":"speaker","rolename":"Poster","code":"#434 / Mo4-P-121","title":"Performance Comparison of QKD Key Relaying Strategies Across Diverse Network Topologies","speaker":"María Álvarez Roa","affiliation":"Eindhoven University of Technology","authors":"María  Álvarez Roa, Sebastian  Verschoor, Simon  Rommel","start":"","end":"","abstractid":211369,"order":121,"abstract":"Abstract (summary)  By evaluating across diverse network topologies, we provide a comparison of on-demand relaying and key flooding strategies for QKD using the key request success rate metric. Results show that key flooding outperforms on-demand relaying in sparse, low-connectivity networks, while on-demand relaying benefits from higher connectivity.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-434.pdf"},{"role":"speaker","rolename":"Poster","code":"#491 / Mo4-P-122","title":"Quantum Time Synchronization in Star Networks","speaker":"Brian Joseph Rollick","affiliation":"CableLabs","authors":"Brian  Rollick, Bernardo  Huberman, Zhensheng  Jia","start":"","end":"","abstractid":211517,"order":122,"abstract":"Abstract (summary)  We demonstrate scalable multi-user clock synchronization using time-correlated photon pairs generated via spontaneous parametric downconversion in a star network. Pairwise offsets are extracted from second-order correlations, while triangle closure provides a consistency metric. Measurements show sub-200 ps agreement, with Kalman tracking of offset and skew.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-491.pdf"},{"role":"speaker","rolename":"Poster","code":"#520 / Mo4-P-123","title":"Joint Spectral Characterization of a Bright, Tunable, Continuous Wave Photon-Pair Source at Telecom Wavelengths","speaker":"Stijn Scheijen","affiliation":"Technische Universiteit Eindhoven","authors":"Stijn  Scheijen, Thomas  Rieser, Liudmila  Silanteva, Menno  Van Den Hout, Chigo  Okonkwo, Thomas  Bradley","start":"","end":"","abstractid":211599,"order":123,"abstract":"Abstract (summary)  We demonstrate a tunable fiber-coupled photon-pair source spanning λ = 1490 – 1630 nm with high internal spectral brightness (∼4.6·107 pairs/s/mW/nm). Using pulse carving, we measure the joint spectral intensity and achieve tunable spectral correlations via narrow-band filtering, enabling correlation control for quantum networking applications.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-520.pdf"},{"role":"speaker","rolename":"Poster","code":"#596 / Mo4-P-125","title":"Optical Fuses and Isolation using 1D Grating Couplers against QKD Trojan Horse Attacks","speaker":"Zoe CM Davidson","affiliation":"BT","authors":"Zoe  Davidson, Callum  Jones, Nathan  Moses, Siddarth  Joshi","start":"","end":"","abstractid":211735,"order":125,"abstract":"Abstract (summary)  The security of chip-based quantum key distribution (QKD) systems must be secured against high-power laser attacks. We test 1D grating coupler optical fuses as passive countermeasures. We find a heating-induced limit in back-reflections in addition to the damage threshold and discuss implications for QKD.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-596.pdf"},{"role":"speaker","rolename":"Poster","code":"#599 / Mo4-P-126","title":"Adaptive Noise-Resistant Threshold Estimation for Quantum Zero-Knowledge Authentication","speaker":"Livia Giacomin","affiliation":"Politecnico di Milano","authors":"Livia  Giacomin, Alessandro  Gagliano, Alberto  Gatto, Paolo  Martelli","start":"","end":"","abstractid":211739,"order":126,"abstract":"Abstract (summary)  As quantum communications advance, user authentication becomes essential. This work studies a quantum identity authentication protocol under realistic noise, deriving a suitable threshold for Quantum Bit Error Rate verification and proposing an adaptive strategy that improves robustness and addresses information leakage across repeated authentication attempts.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-599.pdf"},{"role":"speaker","rolename":"Poster","code":"#601 / Mo4-P-127","title":"Fully Automated Software-Defined Switched Quantum Key Distribution Network Enhanced with PUF Authentication","speaker":"Nikolaos Makris","affiliation":"National Kapodistrian University of Athens","authors":"Nikolaos  Makris, Persefoni  Konteli, Evgenia N.  Sassalou, Stylianos A.  Kazazis, Alkinoos  Papageorgopoulos, Stefanos  Vasileiadis, Konstantinos  Tsimvrakidis, Symeon  Tsintzos, Georgios M.  Nikolopoulos, George T.  Kanellos","start":"","end":"","abstractid":211741,"order":127,"abstract":"Abstract (summary)  We demonstrate a fully automated 4-node switched-QKD network using PUF-based authentication orchestrated by a central SDN controller, enabling scalable and dynamic operation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-601.pdf"},{"role":"speaker","rolename":"Poster","code":"#658 / Mo4-P-128","title":"Secure 100-Gbit/s Real-time Spatially Multiplexed Quantum Random Number Generation Based on Vacuum Fluctuations","speaker":"Ken Tanizawa","affiliation":"Tamagawa University","authors":"Ken  Tanizawa, Kentaro  Kato, Fumio  Futami","start":"","end":"","abstractid":211824,"order":128,"abstract":"Abstract (summary)  We demonstrate high-speed unpredictable random number generation using a single laser diode and parallel homodyne detectors. A spatially multiplexed setup with eight channels mitigates the trade-off between security and generation rate and achieves real-time 100-Gbit/s operation with a low security parameter of 5 × 10−30.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-658.pdf"},{"role":"speaker","rolename":"Poster","code":"#188 / Mo4-P-129","title":"Frequency-Domain Locking of a Pulsed Microring Single-Photon Source via Low-Frequency Pump Transmission Extraction","speaker":"Baojie Hou","affiliation":"zhejiang university","authors":"Baojie  Hou, Zichao  Zhao, Haoran  Ma, Qishen  Liang, Xinyu  Wang, Lingzhi  Yuan, Zichen  Guo, Bin  Zhang, Yueyang  Liu, Zhujun  Wei, Yuehai  Wang, Huihui  Zhu, Tingge  Dai, Jianyi  Yang","start":"","end":"","abstractid":210841,"order":129,"abstract":"Abstract (summary)  Here, we report frequency-domain locking of a pulsed microring single-photon source by extracting the transmission spectrum derivative via low-frequency modulation. The generated zero-crossing error signal effectively compensates for resonance drift, enabling long-term, highly stable system operation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-188.pdf"},{"role":"speaker","rolename":"Poster","code":"#399 / Mo4-P-130","title":"Practical Design of High-Density Bend Waveguide Array for Co-Packaged Fan-Out Routing","speaker":"Masaki Matsumoto","affiliation":"Shinko Electric Industries Co., Ltd.","authors":"Masaki  Matsumoto, Yuji  Furuta, Tatsuaki  Denda, Noritaka  Katagiri","start":"","end":"","abstractid":211278,"order":130,"abstract":"Abstract (summary)  An optimised bend array under limited NA constraints reduces the minimum radius of curvature by 21% at 0.3 dB/turn and achieves −36 dB crosstalk (L/S= 2.5/40μm), enabling dense FO routing of 576 channels within a 15.0 mm length without major changes to existing package designs.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-399.pdf"},{"role":"speaker","rolename":"Poster","code":"#740 / Mo4-P-131","title":"Lens-free on-chip vibrometer with millimetre working distance","speaker":"Manuel Jesús Montilla-Gallardo","affiliation":"","authors":"Robert  Halir, Manuel Jesús  Montilla-Gallardo, Miguel  Barona-Ruiz, Ayesha  Arshad, Laureano  Moreno Pozas, José  De Oliva Rubio, Alejandro  Ortega Moñux","start":"","end":"","abstractid":211913,"order":131,"abstract":"Abstract (summary)  On-chip vibration sensors usually rely on bulk optics to deliver the sensing beam to the moving target, thereby limiting integration. We show that large optical antennas enable target distances of ~5mm while achieving measurement resolutions of 12nm, without using any bulk optics.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-740.pdf"},{"role":"speaker","rolename":"Poster","code":"#790 / Mo4-P-132","title":"High-Extinction-Ratio Integrated Polarizer Based on a Subwavelength Grating Bent Waveguide","speaker":"Hachim Lahbib","affiliation":"Centre de Nanociences et de Nanotechnologies, CNRS, Université Paris-Saclay","authors":"Hachim  Lahbib, Zindine  Mokeddem, Gervasio  D’anzieri, Sarra  Salhi, Samson  Edmond, Loïc  Lanco, Daniele  Melati","start":"","end":"","abstractid":211972,"order":132,"abstract":"Abstract (summary)  Silicon photonic devices show markedly different behaviors for TE and TM polarized modes, making polarization management critical. We experimentally demonstrate a TE-pass polarizer based on subwavelength-waveguide cut-off engineering and bend-assisted filtering, experimentally achieving an extinction ratio of 28 dB and insertion losses of −0.22 dB.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-790.pdf"},{"role":"speaker","rolename":"Poster","code":"#858 / Mo4-P-133","title":"Software-reconfigurable wavelength-tunable dual optical frequency comb based on externally-injected gain-switched lasers","speaker":"Minghao Wei","affiliation":"Dublin City University","authors":"Minghao  Wei, Alejandro  Rosado, Conor  Mcardle, Prince M.  Anandarajah","start":"","end":"","abstractid":212048,"order":133,"abstract":"Abstract (summary)  We demonstrate a software-reconfigurable wavelength-tunable dual optical frequency comb based on externally injected gain-switched lasers, achieving >30 nm contiguous tunability with minimum step of 2 pm. The system operates without wavelength-dependent re-optimisation while maintaining consistent DOFC performance across the tuning range, enabling broadband sensing","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-858.pdf"},{"role":"speaker","rolename":"Poster","code":"#906 / Mo4-P-134","title":"Efficient Fiber-Chip Optical Coupling in Silicon Nitride Photonics Using Amorphous Silicon Grating Overlays","speaker":"Daniel Benedikovic","affiliation":"University of Zilina","authors":"Daniel  Benedikovic, Adam  Petrovic, William  Fraser, Radovan  Korcek, Jens  Schmid, Pavel  Cheben, Thalia  Dominguez Bucio, Frederic  Gardes, Winnie  Ye","start":"","end":"","abstractid":212099,"order":134,"abstract":"Abstract (summary)  We demonstrate α-Si/Si3N4 surface grating couplers with -1.6 dB experimental coupling loss. Inverse-designed multi-band couplers show −2 dB loss at O- and C-band wavelengths with -30 dB crosstalk. This enables compact and scalable fibre-chip interfaces for high-capacity optical communication and advanced photonic integrated circuits. Benedikovic","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-906.pdf"}]},{"sessionid":"5538366","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"16:45-18:15","room":"A1 Auditorium 1","type":"Tutorial and contributed session","typeColor":"#d9ead3","category":"SC 08: Sensing and microwave photonics","title":"Mo5-A Distributed optical sensing: from physics to network deployment","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Sonia Martín López","affiliation":"Consejo Superior de Investigadores Científicas","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Tutorial","code":"#1402 / Mo5-A1","title":"Distributed Optical Fibre Sensing: Where Elegant Physics Gives Rise to Smart Systems","speaker":"Luc Thévenaz","affiliation":"EPFL Ecole Poytechnique Fédérale de Lausanne","authors":"Luc  Thévenaz","start":"16:45","end":"17:45","abstractid":212981,"order":1,"abstract":"Abstract (summary)  Distributed optical fibre sensing exploits Rayleigh, Brillouin and Raman scattering in silica fibres to measure physical quantities such as temperature and strain with spatial resolution. Each scattering mechanism offers distinct advantages and trade-offs. Operating principles, performance limits, and future prospects, notably hollow-core fibres, are reviewed.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Tutorial_Thevenaz.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"María del Rosario Fernández-Ruíz","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#455 / Mo5-A2","title":"Rayleigh Fingerprint-Based DAS over a 688-km Repeatered Link with Co-Propagating 15-Tb/s WDM Transmission","speaker":"Daniele Orsuti","affiliation":"University of Padova","authors":"Daniele  Orsuti, Luca  Palmieri, Ruben  S. Luís, Robson  A. Colares, Jun  Sakaguchi, Martina  Cappelletti, Luca  Schenato, Marco  Santagiustina, Darli  A. A. Mello, Andrea  Galtarossa, Hideaki  Furukawa","start":"17:45","end":"","abstractid":211421,"order":2,"abstract":"Abstract (summary)  We report the first demonstration of distributed acoustic sensing based on cross-correlation of the fiber’s Rayleigh fingerprint over >600 km using 500-MHz bandwidth pulses. The link includes 90 km of field fiber for seismic monitoring.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-455.pdf"},{"role":"speaker","rolename":"Contributed","code":"#122 / Mo5-A3","title":"Performance of L-band DAS on Live Traffic Fiber Compared to C-band DAS Over Dark Fiber","speaker":"Jan Kristoffer Brenne","affiliation":"Alcatel Submarine Networks Norway AS","authors":"Kurosh  Bozorgebrahimi, Jan Kristoffer  Brenne","start":"18:00","end":"","abstractid":210655,"order":3,"abstract":"Abstract (summary)  We present field-trial results with L-band DAS deployed in coexistence with C-band DWDM channels carrying live production traffic. We monitored the quality of DAS and optical communication channels during the test and uncompromised performance was achieved for both compared to sensing on dedicated dark fiber.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-122.pdf"}]},{"sessionid":"5538368","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"16:45-18:15","room":"A2 Auditorium 2","type":"Invited and contributed","typeColor":"#d9eaf7","category":"SC 01: Novel fibres, fibre devices and amplifiers","title":"Mo5-B Hollow-core fibre design","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Leslie Rusch","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#1427 / Mo5-B1","title":"Hollow Core Fibres: From Visionary Concept to Multi Problem Solution","speaker":"Francesco Poletti","affiliation":"Optoelectronics Research Centre, University of Southampton","authors":"Francesco  Poletti","start":"16:45","end":"","abstractid":214598,"order":1,"abstract":"Abstract (summary)  Hollow-core fibres have evolved from early photonic bandgap concepts to modern antireso-nant nested designs, overcoming loss, bandwidth, and scalability challenges. Here we briefly trace this progress, highlighting recent DNANF advances achieving sub-silica loss, long spans, and multi-band operation","pdf":"/static/upload/ow193/events/ev667/abssub/Poletti ECOC 2026.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Tom Bradley","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"sp
