 Florian  Denis-Le Coarer, Xiaodong  Liu, Torrey  Thiessen, Jason  Mak, Alok  Das, Elory  Da Benta, John  Goward, Kevin  Froberger, Apolline  Puaud, Sharon  Hsu, Benton  Qiu, Charles  St-Arnault, David  Plant, Sylvie  Menezo","start":"","end":"","abstractid":212494,"order":37,"abstract":"Abstract (summary)  We report on an O band 4-CWDM transmitter consisting of a single Silicon chip comprising heterogeneous DFB lasers, Si MZMs and monitoring Ge-PDs. The Tx chip is wire bonded to a 56 Gbaud PAM4 commercial driver. 64Gbaud PAM4 eye diagrams are reported.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1278.pdf"},{"role":"speaker","rolename":"Poster","code":"#1349 / We4-P38","title":"High-Connectivity, Low-Latency Optical Perceptron Enabled by Time-Multiplexing and All-Optical Nonlinearity","speaker":"Hao Sun","affiliation":"Institut National de la Recherche Scientifique, Centre Énergie Matériaux Télécommunication (INRS-EMT)","authors":"Hao  Sun, Xinyi  Zhu, José  Azaña","start":"","end":"","abstractid":212571,"order":38,"abstract":"Abstract (summary)  We experimentally demonstrate an end-to-end optical single-layer perceptron (SLP). This computing engine combines stable optical temporal interference with all-optical nonlinearity, enabling 8,100 connections and low latency of ~670 ns. The optical SLP successfully recognizes 90 distinct binary patterns with an accuracy of 100%.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1349.pdf"},{"role":"speaker","rolename":"Poster","code":"#591 / We4-P39","title":"Accelerating Convergence of Longitudinal Power Profile Estimation based on Adaptive Tikhonov regularization","speaker":"Junjiang Xiang","affiliation":"School of Information Engineering, Guangdong Provincial Key Laboratory of Information Photonics Technology, and Key Laboratory of Photonic Technology for Integrated Sensing and Communica-tion, Ministry of Education of China, Guangdong University of Technology, Guangzhou, 510006, China,","authors":"Junjiang  Xiang, Zhuoting  Chen, Chao  Li, Gai  Zhou, Meng  Xiang, Zhixue  He, Songnian  Fu, Yuwen  Qin","start":"","end":"","abstractid":211725,"order":39,"abstract":"Abstract (summary)  We propose adaptive Tikhonov regularization for accelerating convergence of longitudinal power profile estimation. Only single-shot execution can secure an estimation error of 0.13dB over the anomaly loss range of 0.74~3.4dB, when the 120Gbaud DP-QPSK signals with 14dBm launch power are transmitted over 3×50km G.654.E fiber.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-591.pdf"},{"role":"speaker","rolename":"Poster","code":"#651 / We4-P40","title":"Improved Chase–Pyndiah Decoding for Product Codes with Scaled Messages","speaker":"Laurent Schmalen","affiliation":"","authors":"Sisi  Miao, Mert  Birincioglu, Laurent  Schmalen","start":"","end":"","abstractid":211814,"order":40,"abstract":"Abstract (summary)  We propose an enhanced Chase–Pyndiah decoder that scales extrinsic messages based on decoder confidence of the component decoder, achieving a 0.1 dB gain over the original with negligible complexity increase.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-651.pdf"},{"role":"speaker","rolename":"Poster","code":"#683 / We4-P41","title":"Subcarrier Channel Polarization-Based Low-Complexity FEC for 16-QAM SDM Digital Subcarrier Multiplexing System","speaker":"Hao Shi","affiliation":"Pengcheng Laboratory","authors":"Hao  Shi, Jian  Zhao, Lingguo  Cao, Xue  Zhao, Shunfeng  Wang, Jianwei  Tang, Gao  Ye, Linsheng  Fan, Zhongliang  Sun, Zhaopeng  Xu, Junpeng  Liang, Zhixue  He, Jinlong  Wei","start":"","end":"","abstractid":211849,"order":41,"abstract":"Abstract (summary)   We experimentally demonstrate the first subcarrier channel polarization low-complexity FEC encoded 1.92Tb/s 16-QAM-DSCM signal transmission over a 50-km four-core fiber, achieving a 4.2-dB OSNR gain and 80% decoding-complexity reduction at the KP4-FEC threshold compared to conventional FEC scheme.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-683.pdf"},{"role":"speaker","rolename":"Poster","code":"#686 / We4-P42","title":"Simulation-to-Experiment Transfer Learning for Nonlinear Equalization in Long-Haul Raman-Amplified Coherent Systems","speaker":"Georgios Moustakas","affiliation":"University of West Attica","authors":"Georgios  Moustakas, Stavros  Deligiannidis, Xiaoshuo  Jia, Xiaona  Zhang, Yaning  Sun, Ming  Luo, Yan  Li, Jian  Wu, Peristera  Baziana, Charis  Mesaritakis, Adonis  Bogris","start":"","end":"","abstractid":211852,"order":42,"abstract":"Abstract (summary)  This paper employs transfer learning to train a machine learning equalizer for Raman-amplified systems using limited experimental data. Pre-training on simulated synthetic data allows the model to achieve performance comparable to, or exceeding, optimized digital back propagation, effectively mitigating nonlinear impairments over long-haul distances.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-686.pdf"},{"role":"speaker","rolename":"Poster","code":"#708 / We4-P43","title":"Optimized Spatio-temporal Spike Encoding for Low-power Spiking Neural Network Equalizers in IM/DD Systems","speaker":"Shuangxu Li","affiliation":"Huawei Technologies Duesseldorf GmbH","authors":"Shuangxu  Li, Stefano  Calabrò","start":"","end":"","abstractid":211875,"order":43,"abstract":"Abstract (summary)   A convolutional neural network spike encoder paired with a spiking neural network equalizer is proposed for an IM/DD link. It achieves a 1.7 dB gain over a linear equalizer while reducing spike activity by 80%, offering a low-complexity, low-power solution for neuromorphic hardware.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-708.pdf"},{"role":"speaker","rolename":"Poster","code":"#779 / We4-P44","title":"Pilot Symbol-Aided Timing Error Correction for Equalization-Enhanced Phase Noise and Clock Timing Jitter Compensation","speaker":"Ahmed Medra","affiliation":"","authors":"Ahmed  Medra, Amirhossein  Mohammadian, Chuandong  Li","start":"","end":"","abstractid":211958,"order":44,"abstract":"Abstract (summary)  We propose a novel pilot symbol-aided timing error correction algorithm designed to mitigate impairments from equalization-enhanced phase noise (EEPN) and clock timing jitter. The proposed architecture employs a hybrid feedback loop for analog-to-digital converter (ADC) clock refinement and a feed-forward path for digital timing correction.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-779.pdf"},{"role":"speaker","rolename":"Poster","code":"#832 / We4-P45","title":"Joint Probabilistic and Geometric Constellation Shaping for Complexity-Constrained Direct Detection Optical Systems","speaker":"Rodrigo Andres Cardoso Rodrigues Fischer","affiliation":"Karlsruhe Institute of Technology","authors":"Rodrigo  Fischer, Shrinivas  Chimmalgi, Andrej  Rode, Laurent  Schmalen","start":"","end":"","abstractid":212016,"order":45,"abstract":"Abstract (summary)  We evaluate joint probabilistic and geometric constellation shaping via reinforcement learning for complexity-constrained joint equalization and demodulation of direct detection optical signals. We demonstrate the proposed technique in a simulated 56 GBd, 2.2 km C-band direct-detection system, demonstrating its effectiveness for complexity-constrained receivers.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-832.pdf"},{"role":"speaker","rolename":"Poster","code":"#899 / We4-P46","title":"Order-Dependent Characterisation and Cutdown of Volterra Kernels in NL-MLSE for Net 400-Gb/s O-Band PAM-6 IM-DD","speaker":"Hiroki Taniguchi","affiliation":"NTT, Inc.","authors":"Hiroki  Taniguchi, Shuto  Yamamoto, Yukinobu  Nakajima, Masanori  Nakamura, Etsushi  Yamazaki","start":"","end":"","abstractid":212091,"order":46,"abstract":"Abstract (summary)  Volterra NL-MLSE kernels of 1st and 2nd/3rd order play distinct roles: 1st-order tracks CD while 2nd/3rd-order capture CD-invariant device nonlinearity. This decoupling enables independent channel modelling. Cutdown to 15 kernels (73%) preserves −6 to +8 ps/nm CD tolerance at 182 GBd PAM-6 without BER penalty.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-899.pdf"},{"role":"speaker","rolename":"Poster","code":"#942 / We4-P47","title":"Semantic Holographic-Type Co-frequency Co-time Full duplex Communication Over a 100 km Single-span Hollow Core Fiber","speaker":"Anxu Zhang","affiliation":"China Telecom Research Institute, State Key Laboratory of Optical Fiber and Cable Manufacture Technology","authors":"Anxu  Zhang, Xiangyong  Dong, Yan  Ma, Wei  Zhang, Yueqiu  Mu, Lipeng  Feng, Xiaoli  Huo, Junjie  Li, Zhenming  Yu, Kun  Xu","start":"","end":"","abstractid":212135,"order":47,"abstract":"Abstract (summary)  We demonstrate the first semantic holographic-type co-frequency co-time full duplex (HT-CCFD) communication system over 100 km hollow-core fiber. The semantic scheme achieves 73.3 dB PSNR, outperforming 16QAM and QPSK by 5 dB and 8 dB, respectively, while maintaining reliable transmission at low received optical power.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-942.pdf"},{"role":"speaker","rolename":"Poster","code":"#970 / We4-P48","title":"Pruning-Assisted Model Adaptation for Real-Time Neural Network Equalization in Photonic-Aided Wireless Transmission","speaker":"Sheng  Hu","affiliation":"Fudan University","authors":"Jie  Zhang, Sheng  Hu, Qihang  Wang, Chenzhen  Bian, Kaihui  Wang, Jianjun  Yu, Wen  Zhou","start":"","end":"","abstractid":212165,"order":48,"abstract":"Abstract (summary)  We propose an updatable real-time neural-network equalizer using iterative magnitude pruning and transfer fine-tuning, validated in a 300 m, 3.75 Gbaud DMT-64QAM experiment. Compared with the best dense network, it cuts complexity by 89% with nearly unchanged performance under a 2 m channel offset.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-970.pdf"},{"role":"speaker","rolename":"Poster","code":"#996 / We4-P49","title":"Polarization-Multiplexed Coexistence of 100 Gb/s MultiCAP Transmission and DD-COTDR Distributed Sensing","speaker":"Natalia Herguedas","affiliation":"Universidad de Zaragoza","authors":"Pascual  Sevillano, Natalia  Herguedas, David  Izquierdo, Ramón  Cajal-Pérez, Ignacio  Garcés","start":"","end":"","abstractid":212192,"order":49,"abstract":"Abstract (summary)  We demonstrate co-propagation 100 Gb/s MultiCAP communication and DD-COTDR sensing over 25km of SMF- Using orthogonal polarization multiplexing and spectral guard band tailoring, interference is mitigated. A trade-off between sensing SNR and BER is identified, enabling operation below the FEC threshold under practical coexistence conditions","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-996.pdf"},{"role":"speaker","rolename":"Poster","code":"#1052 / We4-P50","title":"A Closed-Form Solution for Fiber Anomaly Detection in C+L-Band Systems Based on Stimulated Raman Scattering","speaker":"Zihao Cui","affiliation":"Beijing University of Posts and Telecommunications","authors":"Zihao  Cui, Shengnan  Li, Xiao  Luo, Min  Zhang, Danshi  Wang","start":"","end":"","abstractid":212251,"order":50,"abstract":"Abstract (summary)  We propose an SRS-based closed-form method for fiber anomaly localization in C+L-band systems. A PSO-based refinement enhances robustness under dynamic conditions. Experiments demonstrate <1.5 km average localization error with low complexity and rapid calculation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1052.pdf"},{"role":"speaker","rolename":"Poster","code":"#1053 / We4-P51","title":"Dual-Polarization Optical Coherent Transmitters IQ Impairment In-service Monitoring Using a Single Low-Bandwidth PD","speaker":"Xiuquan Cui","affiliation":"","authors":"Xiuquan  Cui, Lingguo  Cao, Linsheng  Fan, Hao  Shi, Jianwei  Tang, Yingxiang  Jia, Zhongliang  Sun, Junpeng  Liang, Shunfeng  Wang, Ke  Xu, Zhixue  He, Jinlong  Wei","start":"","end":"","abstractid":212252,"order":51,"abstract":"Abstract (summary)  We propose an enhanced Wiener-Hammerstein model-based framework to monitor dual polarization optical coherent transmitter IQ impairments via a single low-bandwidth photodetector. Experimental results demonstrate an IQ skew estimation error of 0.3ps(2.3ps) for the RLS(LMS) algorithm,with RLS achieving an order-of-magnitude faster convergence than LMS.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1053.pdf"},{"role":"speaker","rolename":"Poster","code":"#1062 / We4-P52","title":"Blind dispersion slope estimation for high-symbol-rate coherent systems","speaker":"Juan Lautaro Moreno Morrone","affiliation":"Fraunhofer Heinrich Hertz Institute","authors":"Juan  L.  Moreno Morrone, Laurenz  Ebner, Robert  Emmerich, Colja  Schubert, Johannes K.  Fischer, Ronald  Freund","start":"","end":"","abstractid":212262,"order":52,"abstract":"Abstract (summary)  We propose a two-stage scanning method for chromatic dispersion estimation in high symbol-rate coherent systems, including accumulated dispersion slope. The performance is evaluated by simulations at a symbol rate of 240 GBd and experimental emulation of up to 70.8 ps/nm2 dispersion slope at 160 GBd.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1062.pdf"},{"role":"speaker","rolename":"Poster","code":"#1182 / We4-P53","title":"Field-Trial Validation of EKF Embedded Real-Valued MIMO Equalization for Transmitter Impairment Mitigation","speaker":"Yingyu Chen","affiliation":"Sun Yat-sen University","authors":"Yingyu  Chen, Hanyu  Gao, Ruqi  Chen, Ying  Yu, Yifan  Zhang, Zhaohui  Li","start":"","end":"","abstractid":212387,"order":53,"abstract":"Abstract (summary)  We experimentally validate a real-valued MIMO equalizer embedding  EKF phase estimator for transmitter impairment mitigation over a  70-km submarine multicore fiber link. The proposed method maintains Q-penalties below 0.5-dB under 10-ps IQ skew and 2.5-dB gain imbalance with improved frequency offset tolerance up to 50-MHz.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1182.pdf"},{"role":"speaker","rolename":"Poster","code":"#1194 / We4-P54","title":"Split-Sideband Digital Subcarrier Multiplexing for IQ-Impairment Compensation without Inter-Subcarrier MIMO","speaker":"Takuma Kuno","affiliation":"Nagoya University","authors":"Takuma  Kuno, Taisei  Sekizuka, Yojiro  Mori, Hiroshi  Hasegawa","start":"","end":"","abstractid":212400,"order":54,"abstract":"Abstract (summary)  We propose a split-sideband DSCM architecture that eliminates the need for a high-dimensional inter-subcarrier joint MIMO equaliser. Experiments with two 50-Gbaud DP-16-QAM subcarriers, corresponding to an aggregate symbol rate of 100 Gbaud, show performance comparable to that of inter-subcarrier MIMO while using a lower-dimensional equaliser.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1194.pdf"},{"role":"speaker","rolename":"Poster","code":"#1239 / We4-P55","title":"High-Precision SOP-based Event Localization Using Coherent WDM Polarisation Localisation (CWPL) Technique","speaker":"Rafael Andrade Vieira","affiliation":"Aston University","authors":"Rafael  Vieira, Geraldo  Gomes, Stepan  Bogdanov, Hani  Kbashi, Pedro  Freire, Sergei  Turitsyn, Antonio  Mecozzi","start":"","end":"","abstractid":212452,"order":55,"abstract":"Abstract (summary)  Source localization of SOP transients via CWPL is demonstrated for the first time. By exploiting the correlation between error standard deviation and Δλ, we selectively average measurements from 12 channels, achieving a standard error of the mean of 930 m over a 10000 km link.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1239.pdf"},{"role":"speaker","rolename":"Poster","code":"#1244 / We4-P56","title":"Joint Subcarrier Phase Recovery for Nonlinearity Mitigation","speaker":"Marco Secondini","affiliation":"Scuola Superiore Sant'Anna","authors":"Marco  Secondini, Stella  Civelli","start":"","end":"","abstractid":212457,"order":56,"abstract":"Abstract (summary)    We propose a low-complexity phase recovery scheme that simultaneously mitigates laser phase noise and fiber nonlinearity across several subcarriers. In a long single-span link with Raman amplification, the scheme achieves 0.9 dB gain with 99 real multiplications per complex symbol.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1244.pdf"},{"role":"speaker","rolename":"Poster","code":"#1285 / We4-P57","title":"Accurate Multi-perturbation Localization in Optical Fibers with Polarization-based Forward Sensing","speaker":"Rick M. Butler","affiliation":"","authors":"Lampros  Lanaras, Rick M.  Butler, Christian  Häger, Alex  Alvarado","start":"","end":"","abstractid":212501,"order":57,"abstract":"Abstract (summary)  We present a method to accurately localize multiple perturbations from fiber outputs. We cross-correlate received polarizations between two wavelengths, apply peak detection, and interpolate peaks to boost accuracy. We localize five simultaneous perturbations in a 10 GSa/s numerical fiber model with 3.5 m median error.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1285.pdf"},{"role":"speaker","rolename":"Poster","code":"#1310 / We4-P58","title":"Frequency Domain Timing Recovery for Baud-rate Sampled Coherent Receivers","speaker":"Serge Afouda","affiliation":"Huawei Technologies France","authors":"Serge  Afouda, Trung-Hien  Nguyen, Sami  Mumtaz, Gabriel  Charlet","start":"","end":"","abstractid":212529,"order":58,"abstract":"Abstract (summary)  We propose a generalized roll-off factor independent timing error detector (TED) cost function suitable for frequency-domain DSP working at 1-sample/symbol (1-sps). We numerically and experimentally investigate the effectiveness of proposed TED, an alternative to conventional Godard-TED, in 123.6-Gbaud DP-16QAM transmission systems with only 1-sps Rx-DSP.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1310.pdf"},{"role":"speaker","rolename":"Poster","code":"#1331 / We4-P59","title":"Feedforward and Iterative Phase Noise Compensation for Channels with Chromatic Dispersion","speaker":"Alex Jäger","affiliation":"Technical University of Munich","authors":"Alex  Jäger, Gerhard  Kramer","start":"","end":"","abstractid":212553,"order":59,"abstract":"Abstract (summary)  Equalization-enhanced phase noise is avoided by applying phase noise compensation (PNC) before chromatic dispersion compensation. Feedforward and iterative PNC algorithms based on expectation propagation are proposed. Both achieve information rates close to channels without phase noise for 100 GBaud 64-QAM and 10,000 km of fiber.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1331.pdf"},{"role":"speaker","rolename":"Poster","code":"#781 / We4-P60","title":"Error-Propagation-Aware Transmitter Compliance Metric for Next-generation Optical Interconnects with MLSE Receivers","speaker":"Yongxin Sun","affiliation":"Shanghai Jiao Tong University","authors":"Yongxin  Sun, Haiyun  Xin, Leyan  Fei, Yicheng  Xu, Yixiao  Zhu, Weisheng  Hu, Qunbi  Zhuge","start":"","end":"","abstractid":211960,"order":60,"abstract":"Abstract (summary)  We propose an error-propagation-aware MLSE TDECQ based on an analytical Zig-zag model for next-generation optical interconnects. Experimental results in 112-Gb/s PAM-4 systems demonstrate near-unity correlation (slope=1.024, R2=0.994) with actual receiver sensitivity across diverse impairments, ensuring reliable transmitter compliance testing.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-781.pdf"},{"role":"speaker","rolename":"Poster","code":"#808 / We4-P61","title":"O-band 3.2 Tb/s Kerr Microcomb Coherent Transmission for Short-Reach DCI Links","speaker":"Robert Emmerich","affiliation":"Fraunhofer HHI","authors":"Aleksandr  Donodin, Lou  Kanger, Daniel J.  Elson, Vitaly  Mikhailov, Robert  Emmerich, Dmitrii  Stoliarov, Mustafa  Kangul, Jean-Etienne  Tremblay, Eline  Cavadore, Sergey  Koptyaev, Jiawei  Luo, Ruben S.  Luis, Hideaki  Furukawa, Colja  Schubert, Ronald  Freund, David  Digiovanni, Yuta  Wakayama, Takehiro  Tsuritani, John  Jost, Maxim  Karpov, Sergei K.  Turitsyn","start":"","end":"","abstractid":211991,"order":61,"abstract":"Abstract (summary)  We report the first demonstration of an O-band Kerr comb laser in coherent transmission, achieving 3.2 Tb/s aggregate rate (GMI) over 25 km using eight comb lines from a single source.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-808.pdf"},{"role":"speaker","rolename":"Poster","code":"#852 / We4-P62","title":"One Terahertz Full-Field Digital Back-Propagation over 3000 km","speaker":"Eric Sillekens","affiliation":"UCL (University College London)","authors":"Eric  Sillekens, Ruben  Luis, Giammarco  Di Sciullo, Robert  Emmerich, Carlo  Centofanti, Daniele  Orsuti, Robson  Colares, Mindaugas  Jarmolovicius, Ronit  Sohanpal, Darli  Melo, Luca  Palmieri, Ronald  Freund, Colja  Schubert, Cristian  Antonelli, Robert  Killey, Polina  Bayvel, Hideaki  Furukawa","start":"","end":"","abstractid":212042,"order":62,"abstract":"Abstract (summary)  We implement full-field digital back-propagation with a 1-THz receiver using 20 synchronous frequency-adjacent coherent receivers with digital stitching and a frequency-comb local oscillator. Relative to electronic dispersion compensation, per-channel DBP and full-field DBP achieve throughput gains of 2.2% and 5.4%, respectively.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-852.pdf"},{"role":"speaker","rolename":"Poster","code":"#866 / We4-P63","title":"Evaluating the Viability of Long-haul O-Band Transmission over G.654.C Fibre","speaker":"Romulo Aparecido de Paula Junior","affiliation":"University College London","authors":"Romulo  Aparecido De Paula Junior, Jiaqian  Yang, Cristobal  Melo, Eric  Sillekens, Ronit  Sohanpal, Mindaugas  Jarmolovicius, Zelin  Gan, Vitaly  Mikhailov, Jiawei  Luo, David  J. Digiovanni, Ruben  S. Luis, Hideaki  Furukawa, John  D. Downie, Lidia  Galdino, Daniel  J. Elson, Yuta  Wakayama, Gabriel  Saavedra, Robert  I. Killey, Polina  Bayvel","start":"","end":"","abstractid":212058,"order":63,"abstract":"Abstract (summary)  We demonstrate the first long-haul, 15.9 THz, WDM O-band transmission using G.654.E-compliant fibre, achieving 55.5 Tb/s (GMI) over 704 km despite its high cutoff wavelength. Ultra-low fibre loss enables a single lumped amplification scheme to achieve an information rate highly competitive with state-of-the-art single-band systems.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-866.pdf"},{"role":"speaker","rolename":"Poster","code":"#887 / We4-P64","title":"Experimental Evaluation of Optical-Analog-Optical Wavelength Converter Penalty Metric for Quality of Transmission Estimation","speaker":"J. Kenji Clark","affiliation":"NEC Corp.","authors":"J. Kenji  Clark, Yuna  Nakamura, Toshifumi  Nakamura, Hiroki  Mori, Junnosuke  Hiyama, Mayuri  Nakagawa, Takeshi  Seki, Rie  Hayashi, Morihiko  Ota, Kohei  Hosokawa, Wakako  Maeda, Toshihiko  Tamura, Emmanuel  Le Taillandier De Gabory","start":"","end":"","abstractid":212079,"order":64,"abstract":"Abstract (summary)  Noise added by an optical-analog-optical wavelength converter is shown to have a gaussian-like distribution, represented by a signal-to-noise ratio (SNR) of wavelength conversion. Using this metric, SNR estimation with 0.8 dB accuracy of a 300 Gbps signal transmitted 400 km and wavelength converted is demonstrated.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-887.pdf"},{"role":"speaker","rolename":"Poster","code":"#933 / We4-P65","title":"Open-Loop Calibration of Frequency-Dependent Sub-DAC Mismatch in Time-Interleaved DACs","speaker":"Chenjin Li","affiliation":"University of Electronic Science and Technology of China","authors":"Chenjin  Li, Hong  Lin, Junyuan  Nie, Xuecheng  Ren, Shen  Wang, Jing  Zhang, Kun  Qiu","start":"","end":"","abstractid":212126,"order":65,"abstract":"Abstract (summary)  We propose an open-loop calibration algorithm for time-interleaved DACs by decomposing mismatches into frequency-independent components and frequency-dependent residuals. Experiments on a 92 GSa/s device with four sub-DACs show that post-compensation suppresses interleaving spurs to the noise floor. A pre-compensated PAM-16 achieves a 44% BER reduction.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-933.pdf"},{"role":"speaker","rolename":"Poster","code":"#1039 / We4-P66","title":"Experimental Investigation of U-band Transmission over 20 km of Anti-Resonant Hollow-Core Fiber Using Bismuth doped Fiber Amplifier","speaker":"Carina  Castineiras Carrero","affiliation":"NOKIA Bell Labs","authors":"Carina  Castineiras Carrero, Rajiv  Boddeda, Haïk  Mardoyan, Amirhossein  Ghazisaeidi, Peng  Li, Shuhai  li, Lei  Zhang, Jie  luo, Jérémie  Renaudier","start":"","end":"","abstractid":212238,"order":66,"abstract":"Abstract (summary)  U-band transmission over 20 km hollow-core fiber (HCF) is experimentally investigated to assess its potential for high-capacity transmission systems. Using Bismuth doped Fiber Amplifier, we show the transmission of 16-QAM and 64-QAM signals,","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1039.pdf"},{"role":"speaker","rolename":"Poster","code":"#1214 / We4-P67","title":"Experimental Study of Burst Error Induced by Relative Intensity Noise in Raman Amplified Repeaterless Systems","speaker":"Abir  Hraghi","affiliation":"Huawei Technologies France - Paris Research Center - Optical Communication Technology Lab","authors":"Abir  Hraghi, Gegei  Yu, Flavio  Andre.sampaio, Loig  Godard, Chenyu  Sun, Qiu  Haoyang, Abel  Lorences.riesgo, Gabriel  Charlet","start":"","end":"","abstractid":212425,"order":67,"abstract":"Abstract (summary)  We experimentally investigate the burst-error penalty caused by RIN-transfer noise in forward-Raman-amplified transmission systems, observing 0.6 dB larger SNR fluctuations when having 10 dB Raman gain. Our modelling results confirm that RIN-transfer burst penalty should be accounted for when estimating the performance of forward Raman.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1214.pdf"},{"role":"speaker","rolename":"Poster","code":"#1220 / We4-P68","title":"Breaking the Complexity Barrier of Volterra Equalization via End-to-End Sparse Compression and Recovery in 106-Gb/s PAM4 IM/DD Links","speaker":"Govind Sharan Yadav","affiliation":"Institute of Communications Engineering, National Tsing Hua University","authors":"Govind Sharan  Yadav, Benedictus Yohanes Bagus  Widhianto, Sheng-Yuan  Zheng, Chun-Yen  Chuang, Kai-Ming  Feng, Jyehong  Chen, Young-Kai  Chen","start":"","end":"","abstractid":212431,"order":68,"abstract":"Abstract (summary)  We propose and experimentally validate a novel SLQF-VE for nonlinear distortion compensation in 106-Gb/s PAM4 IM/DD over 6-km SMF. It achieves ~90% complexity reduction at KP4-FEC and ~97% at HD-FEC at −4 dBm ROP, outperforming baseline and sparse VEs, with quantization-aware fine-tuning enabling low-precision operation","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1220.pdf"},{"role":"speaker","rolename":"Poster","code":"#1261 / We4-P69","title":"EEPN-Aware Phase-Gradient MIMO Equalization for Robust Short-Reach Coherent Transmission","speaker":"Fan Zhang","affiliation":"Peking University","authors":"Tianhong  Zhang, Yutong  Pan, Yixiao  Zhu, Xiang  Cai, Fan  Zhang","start":"","end":"","abstractid":212474,"order":69,"abstract":"Abstract (summary)  We propose EEPN-aware phase-gradient MIMO (PG-MIMO), which augments conventional 2-sps MIMO with a phase-gradient-modulated branch to model phase-memory-induced perturbations. In 80-GBaud, 80-km DP-16QAM transmission, PG-MIMO reduces BER by 46.6% and improves Q2 by 0.71 dB.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1261.pdf"},{"role":"speaker","rolename":"Poster","code":"#1269 / We4-P70","title":"GPU-Accelerated Optimisation of Symmetric Bidirectional Ultrawideband Coherent Transmission Under Launch Power Constraints","speaker":"Mindaugas Jarmolovicius","affiliation":"University College London","authors":"Mindaugas  Jarmolovicius, Eric  Sillekens, Polina  Bayvel, Robert  Killey","start":"","end":"","abstractid":212483,"order":70,"abstract":"Abstract (summary)  We optimise bidirectional OESCL-band coherent transmission under total fibre power constraints using a GPU-accelerated boundary-value Raman solver and launch-power optimisation. While no gain is observed without power constraints, for a 18-dBm limit 3-span transmission reversing the O-band direction increases aggregate capacity by up to 24.5%","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1269.pdf"},{"role":"speaker","rolename":"Poster","code":"#1320 / We4-P71","title":"On the Nonlinear Impairments Induced by High-Power Doped Fiber Amplifiers in HCF Transmission Systems","speaker":"Leonardo Sorensen Braga","affiliation":"Nokia Bell Labs","authors":"Leonardo  Sorensen Braga, Amirhossein  Ghazisaeidi","start":"","end":"","abstractid":212542,"order":71,"abstract":"Abstract (summary)  We numerically demonstrate that the nonlinearities in high-power EDFAs induced by signal signal interactions in WDM systems are not negligible and may become a limiting factor in future HCF systems and may be captured by the existing EGN models.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1320.pdf"},{"role":"speaker","rolename":"Poster","code":"#956 / We4-P72","title":"DRL-Based Joint RSA and Reconfiguration Using Integrated Graph-Based GNN and State-Adaptive Reward","speaker":"Takafumi Tanaka","affiliation":"NTT","authors":"Takafumi  Tanaka","start":"","end":"","abstractid":212150,"order":72,"abstract":"Abstract (summary)  We propose a novel multi-agent DRL framework for joint RSA and optical path reconfiguration, featuring a GNN with a unified graph schema and a state-adaptive reward. Simulations demonstrate over 40% blocking probability reduction compared to conventional approaches, validating the importance of joint planning","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-956.pdf"},{"role":"speaker","rolename":"Poster","code":"#1002 / We4-P73","title":"A Novel Minimum Latency Transport Framework by Satellite-Terrestrial Cross-Physical-Layer Hybrid Transmission","speaker":"Yuto Kaida","affiliation":"Tokyo Denki University","authors":"Yuto  Kaida, Akira  Hirano, Taiga  Suzuki, Yusuke  Hirota, Sugang  Xu, Yoshinari  Awaji, Hideaki  Furukawa","start":"","end":"","abstractid":212200,"order":73,"abstract":"Abstract (summary)  We propose a two-level minimum latency framework for Starlink-like LEO transport: OTN-like hit-less switching suppresses handover-related latency penalty, while hybrid multi-path FEC with Systematic-on-LEO and CRC early completion enables low-latency loss recovery, with larger gains under smaller path-delay gaps or higher loss.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1002.pdf"},{"role":"speaker","rolename":"Poster","code":"#1061 / We4-P74","title":"AI-EON for Self-Adaptive Multi-Task Computing Power Access and Its Field Trial","speaker":"Jiang Sun","affiliation":"China Mobile Research Institute","authors":"Wang  Dong, Jiang  Sun, Mingqing  Zuo, Guanghui  Sun, Shan  Cao, Bin  Qi, Dawei  Ge, Dechao  Zhang, Han  Li","start":"","end":"","abstractid":212261,"order":74,"abstract":"Abstract (summary)  A scale-across AI-powered elastic optical network is proposed for self-adaptive multi-task computing power access, and is validated in a field 640 km 3,000-GPU dual-node training with <2% efficiency degradation using 800G OTN and 272×272-port OCS.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1061.pdf"},{"role":"speaker","rolename":"Poster","code":"#1122 / We4-P75","title":"Securing 5G/6G Networks Applying Moving Target Defense over Elastic Optical Networks","speaker":"Anna Tzanakaki","affiliation":"National and Kapodistrian University of Athens, Greece","authors":"Alexandros Ioannis  Manolopoulos, Viktoria Maria  Alevizaki, Markos  Anastasopoulos, Anna  Tzanakaki","start":"","end":"","abstractid":212327,"order":75,"abstract":"Abstract (summary)  This work proposes a Moving Target Defense framework using Live Virtual Machine Migration over Elastic Optical Networks to enhance 6G security. Optimized migrations and Markov-based evaluation demonstrate reduced attack success and improved network resilience.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1122.pdf"},{"role":"speaker","rolename":"Poster","code":"#1183 / We4-P76","title":"Maximum Achievable Burst Size in All-Optical Satellite Networks","speaker":"Sleman Mouammar","affiliation":"Technische Universität Braunschweig,","authors":"Thomas  Röthig, Sleman  Mouammar, Ítalo  Brasileiro, Soheil  Hosseini, Admela  Jukan","start":"","end":"","abstractid":212389,"order":76,"abstract":"Abstract (summary)  We analyze the maximum burst size achievable in all-optical satellite networks across different constellations. With a 100 Gbps uplink capacity, a WDM-based optical burst switching network supports burst sizes of up to 500 MB in high-altitude LEO constellations and 600 MB in low-altitude LEO constellations.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1183.pdf"},{"role":"speaker","rolename":"Poster","code":"#1198 / We4-P77","title":"Experimental Demonstration of Fabric Resilience Using a 4 × 4 Dual-Microring Optical Switch for AI Data Centers","speaker":"Bin Zhang","affiliation":"Zhejiang University","authors":"Bin  Zhang, Qishen  Liang, Baojie  Hou, Huihui  Zhu, Tao  Zou, Junhui  Shi, Zichao  Zhao, Haoran  Ma, Hui  Yu, Yuehai  Wang, Jianyi  Yang","start":"","end":"","abstractid":212404,"order":77,"abstract":"Abstract (summary)  We demonstrate an optically connected network architecture with fault recovery for building ML training clusters, enabled by a nonblocking optical switch based on dual-microring resonators. We present experiments on our HPC/ML testbed leveraging the optical programmable network to automatically failover from hardware or software failures.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1198.pdf"},{"role":"speaker","rolename":"Poster","code":"#1217 / We4-P78","title":"Data-Efficient Few-Shot Modeling of EDFA Gain for QoT Estimation Using Machine Learning","speaker":"Abdelrahmane  Moawad","affiliation":"Fraunhofer - HHI","authors":"Abdelrahmane  Moawad, Vignesh  Karunakaran, Robert  Emmerich, Sharon  Yeh, Achim  Autenrieth, Behnam  Shariati, Johannes Karl  Fischer, Thomas  Bauschert, Ronald  Freund","start":"","end":"","abstractid":212428,"order":78,"abstract":"Abstract (summary)  We compare few-shot EDFA gain modeling using transfer learning and physics-informed gaussian process regression, enabling data-efficient cross-vendor adaptation under extreme scarcity and achieving sub-0.1 dB mean absolute error for gain prediction.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1217.pdf"},{"role":"speaker","rolename":"Poster","code":"#1271 / We4-P79","title":"Experimental Investigation of Optical Fiber Amplifier Based All-Optical Relays for Inter-Satellite Optical Networks","speaker":"Satoshi Shinada","affiliation":"National Institute of Information and Communications Technology","authors":"Satoshi  Shinada, Hideaki  Kotake, Toshimasa  Umezawa, Yusuke  Hirota, Shoichiro  Oda","start":"","end":"","abstractid":212485,"order":79,"abstract":"Abstract (summary)  The transmission performance of all‑optical relays employing watt‑class optical fiber amplifiers was experimentally investigated. Although the large link losses assumed for inter‑satellite optical links cause significant OSNR degradation, all‑optical relaying of WDM signals over distances exceeding 10,000 km is shown to be feasible.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1271.pdf"},{"role":"speaker","rolename":"Poster","code":"#1363 / We4-P80","title":"A Comparative Study on Linear and Nonlinear SNR Estimation Using Neural Networks","speaker":"Vinod Bajaj","affiliation":"Nokia Bell-Labs","authors":"Vinod  Bajaj, Henrique Watanabe  Silvestre, Petros  Ramantanis, Patricia  Layec","start":"","end":"","abstractid":212585,"order":80,"abstract":"Abstract (summary)  We compare spectral correlation-based features against well-explored amplitude noise covariance and phase noise correlation-based features for linear and nonlinear SNR estimation using neural networks. Simulation results indicate errors reduced by > 30% when spectral correlation-based features are included.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1363.pdf"},{"role":"speaker","rolename":"Poster","code":"#529 / We4-P81","title":"50 Gbps 25km SSMF Quasi-Coherent Transmission for C-band Optical Access, Mobile Fronthaul and Edge AI Networks","speaker":"Natalia Herguedas","affiliation":"Universidad de Zaragoza","authors":"Natalia  Herguedas, Jose A.  Altabas, Ramon  Cajal-Pérez, Lorenza  Amati, Michele  Squartecchia, Pascual  Sevillano, David  Izquierdo, Miguel R.  Carro-Temboury, Onur  Düzgöl, Rakshick  Shrinivas, Tom K.  Johansen, Ignacio  Garces, Jesper B.  Jensen","start":"","end":"","abstractid":211627,"order":81,"abstract":"Abstract (summary)  Quasi-coherent reception of 50/53.125 Gbps C-band multiCAP/PAM4 signals after 25/10 km SSMF transmission. The PAM4 signal was received error free after real-time FEC decoding. The QC-receiver is implemented in a Silicon Photonics PIC. Applications include mobile fronthaul, edge AI, SMPTE ST2110 video and access networks.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-529.pdf"},{"role":"speaker","rolename":"Poster","code":"#570 / We4-P82","title":"Synchronization Reliability Analysis and Real-Time Verification for Burst-Mode 200G Coherent PON","speaker":"Xiaoshuo Jia","affiliation":"China Mobile Research Institute","authors":"Dechao  Zhang, Xiaoshuo  Jia, Junwei  Li, Ning  Wang, Zhicheng  Ye, Qiguang  Feng, Hongchen  Yu, Yanzhao  Lu, Han  Li","start":"","end":"","abstractid":211702,"order":82,"abstract":"Abstract (summary)  A real-time burst-mode synchronization emulator is demonstrated using 10 FPGAs for 200G coherent PON upstream, executing 1e15 trials. A theoretical model for reliability evaluation is proposed and validated. Results confirm high synchronization reliability could be achieved over 20-km fibre with specially designed preambles.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-570.pdf"},{"role":"speaker","rolename":"Poster","code":"#628 / We4-P83","title":"Field Trial of a 50G HS-PON architecture supporting 1×16 All-Photonic Gateway and Time Sensitive Network Traffic","speaker":"Margarita Fylaktaki","affiliation":"Aristotle University of Thessaloniki","authors":"Maria  Vargemidou, Chris  Vagionas, Marios  Gatzianas, Fabienne  Saliou, Erwan  Deleurme, Hawraa  Atwi, Margarita  Fylaktaki, Savvas I.  Raptis, George  Kalfas, Philippe  Chanclou, Nikos  Pleros, Amalia  Miliou","start":"","end":"","abstractid":211781,"order":83,"abstract":"Abstract (summary)  The first field trial of a Next Generation Central Office featuring a 1×16 all-photonic gateway comprising a C-/O-band glass diplexer-array and MEMS-based optical switch is reported, flexibly provisioning multiple traffic-classes of a 50G HS-PON and 10G C-band high-precision Time-Sensitive Network traffic at 1.6 km-long drop-fibers.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-628.pdf"},{"role":"speaker","rolename":"Poster","code":"#669 / We4-P84","title":"Flexible Coherent PON using LUT-Based Channel-Adaptive Modulation","speaker":"Jie Li","affiliation":"State Key Laboratory of optical communication technology and network, China Information Communication Technologies Group Corporation","authors":"Jie  Li, Zebang  Pi, Xiang  Li, Ming  Li, Hanbing  Li, Ming  Luo","start":"","end":"","abstractid":211835,"order":84,"abstract":"Abstract (summary)  We propose a LUT-based GS-FCLS-PON scheme and experimentally demonstrate it in a TFDM system with flexible rates ranging from 100 Gb/s to 600 Gb/s. Both the sensitivity and dynamic range are improved using the proposed scheme.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-669.pdf"},{"role":"speaker","rolename":"Poster","code":"#724 / We4-P85","title":"Impact of Burst Traffic in Upstream Converged Coherent Metro-Access Networks","speaker":"Safana Al Zoubi","affiliation":"Politecnico di Torino","authors":"Safana  Alzoubi, Giuseppe  Rizzelli, Roberto  Gaudino","start":"","end":"","abstractid":211896,"order":85,"abstract":"Abstract (summary)  For future all-optical metro-access networks using PON upstream burst mode transmission, we experimentally investigate on the resulting EDFAs gain transient and its impact on the “regular” DWDM coherent metro wavelengths, focusing specifically on typical 125 microsecond frame time-constants and evaluating the post-FEC OSNR penalty.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-724.pdf"},{"role":"speaker","rolename":"Poster","code":"#726 / We4-P86","title":"Traffic-Aware Dynamic Spectral Allocation in AWGR-Based AI Datacenter Scale-Out Fabrics","speaker":"Miroslaw Klinkowski","affiliation":"National Institute of Telecommunications","authors":"Miroslaw  Klinkowski, Ioannis  Tomkos","start":"","end":"","abstractid":211898,"order":86,"abstract":"Abstract (summary)  We evaluate dynamic spectral subcarrier (SC) allocation in arrayed-waveguide grating router (AWGR)-based AI datacenter (AI-DC) fabrics under realistic traffic characteristics. Gains over static allocation arise with temporal misalignments, while near-synchronous incast limits benefits. Performance depends on control responsiveness and spectral resource dimensioning.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-726.pdf"},{"role":"speaker","rolename":"Poster","code":"#757 / We4-P87","title":"When LLM Meets PON: Distributed Edge Inference Framework and Scheduling over TDM-PON","speaker":"Jiawei Zhang","affiliation":"Beijing University of Posts and Telecommunications","authors":"Junfeng  Lu, Zhiqun  Gu, Jiawei  Zhang","start":"","end":"","abstractid":211932,"order":87,"abstract":"Abstract (summary)  We propose a distributed edge inference framework for LLMs over TDM-PON, with a joint computation-communication scheduling scheme eliminating the DBA polling cycles via delay budgeting and phase-aware bandwidth reservation. The performance is evaluated by time per output token and jitter under edge inference workloads.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-757.pdf"},{"role":"speaker","rolename":"Poster","code":"#765 / We4-P88","title":"Dual-Channel 60 GBaud PON System Signal Equalization Using Micro-Ring Resonators-Based Reservoir Computing","speaker":"Mohammad  Seifi Laleh","affiliation":"Kiel University","authors":"Mohammad  Seifi Laleh, Sebastian  Kühl, Lukas  Fonk, Silas  Oettinghaus, Stephan  Pachnicke","start":"","end":"","abstractid":211941,"order":88,"abstract":"Abstract (summary)  Based on simulations, a silicon photonic reservoir computer using cascaded add-drop micro-ring resonators successfully performs joint signal equalization and dual-channel demultiplexing for 60-GBd PAM-4 PONs. This integrated processor is cost-effective, improves BER and extends transmission reach over conventional DSP-based FFE.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-765.pdf"},{"role":"speaker","rolename":"Poster","code":"#814 / We4-P89","title":"Experimental Assessments of O-band 32x32x8λ Wavelength Cross-connect Switch at 100Gbpsλ for Data Center Networks","speaker":"Boyang Zheng","affiliation":"Eindhoven University of Technology","authors":"Boyang  Zheng, Robert  Palmer, Giuseppe  Talli, Nicola  Calabretta","start":"","end":"","abstractid":211997,"order":89,"abstract":"Abstract (summary)  We experimentally demonstrate an O-band 32×32×8λ WCS architecture for optical interconnections. By exploiting SOA switch/amplification with transmitter optimization and receiver-side sparse Volterra equalization, OSNR and nonlinear impairments are mitigated. Results show <6dB fiber-to-fiber loss, cross-talk <-35dB, total system power penalty <4.3dB, and 6.5dB link-budget.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-814.pdf"},{"role":"speaker","rolename":"Poster","code":"#958 / We4-P90","title":"240-Gb/s Bipolar Dual-Polarization IM Coherent PON with 10-ns Preamble and 38-dB Power Budget Using 9-MHz DFB Laser","speaker":"Dangui Huang","affiliation":"State Key Laboratory of Photonics and Communications, Shanghai Jiao Tong University","authors":"Dangui  Huang, Yixiao  Zhu, Yutong  Pan, Tianhong  Zhang, Ziheng  Zhang, Guangying  Yang, Lina  Man, Yikun  Zhang, Wenhao  Wang, Ning  Zhang, Fan  Zhang, Weisheng  Hu","start":"","end":"","abstractid":212153,"order":90,"abstract":"Abstract (summary)  We demonstrate bipolar dual-polarization intensity-modulation coherent PON leveraging sensitivity gain over unipolar modulation while mitigating frequency offset and phase noise with 9-MHz DFB laser. We use 10-ns short preamble to recover 240-Gb/s signal over 20-km SSMF at 38-dB power budget, supporting flexible rates of 120~300-Gb/s.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-958.pdf"},{"role":"speaker","rolename":"Poster","code":"#1008 / We4-P91","title":"Low-Complexity Hierarchical Polar Quantization for CPRI-Based Radio-over-Fibre Systems","speaker":"Hongliang Li","affiliation":"","authors":"Hongliang  Li, Paul  Townsend, Xing  Ouyang","start":"","end":"","abstractid":212206,"order":91,"abstract":"Abstract (summary)  We propose a low-complexity, memory-efficient optimized polar quantization scheme with cross-ring continuous mapping for RoF systems. A 117 Gb/s/λ signal is transmitted over 40-km S-SMF, achieving ~8-dB SNR gain compared with conventional square-domain quantization under equivalent fronthaul capacity.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1008.pdf"},{"role":"speaker","rolename":"Poster","code":"#840 / We4-P92","title":"Early-Warning Fiber Event Classification Operating over Commercial Single- and Dual-polarization Sources Using Stokes-Parameter Features and Lightweight Machine Learning","speaker":"Devika Dass","affiliation":"TRINITY COLLEGE DUBLIN","authors":"Devika  Dass, Leyla  Sadighi, Steinar  Bjørnstad, Marco  Ruffini","start":"","end":"","abstractid":212026,"order":92,"abstract":"Abstract (summary)  We present an SOP-based scheme for early-warning classification of 4-physical fiber-events (twisting/vibration/bending/tapping) over 20km field-fiber. Using a polarimeter monitoring different sources: single-polarized (SP)-unmodulated, SP-modulated, and dual-polarized (DP)-modulated sources, we achieve classification accuracies of 99.7%, 100%, and 94.5%, respectively, without requiring a dedicated sensing wavelength.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-840.pdf"},{"role":"speaker","rolename":"Poster","code":"#841 / We4-P93","title":"Cross-Modal Contrastive Learning Between Coherent Telemetry and Distributed Brillouin Sensing for Fiber Perturbation Analysis","speaker":"Petr Munster","affiliation":"","authors":"Fehmida  Usmani, Jan  Bukovsky, Petr  Dejdar, Wadood Ur Rehman  Ranjha, Petr  Munster, Tomas  Horvath, Adrian  Tomasov, Marija  Furdek","start":"","end":"","abstractid":212027,"order":93,"abstract":"Abstract (summary)  We propose a contrastive learning (CL) framework for sensing of otherwise non explicitly represented environmental perturbations from coherent receivers’ telemetry data. Through alignment with Brillouin sensing data in latent space as ground truth, ∼96% CL accuracy in temperature-bin retrieval from telemetry data is experimentally demonstrated.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-841.pdf"},{"role":"speaker","rolename":"Poster","code":"#871 / We4-P94","title":"A Widely Tunable ASE-Driven Optoelectronic Oscillator","speaker":"Zhuoran Wang","affiliation":"McGill University","authors":"Zhuoran  Wang, Santiago  Bernal, David  Plant, Lawrence  Chen","start":"","end":"","abstractid":212063,"order":94,"abstract":"Abstract (summary)  We experimentally demonstrated a single-mode ASE-driven optoelectronic oscillator tunable up to 25 GHz. Single-mode oscillation is enabled by cascaded zero-dispersion loops, while wide tunability is achieved through balanced photodetection for baseband suppression and chirp-like slicing for mitigating filter amplitude degradation induced by third-order dispersion.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-871.pdf"},{"role":"speaker","rolename":"Poster","code":"#888 / We4-P95","title":"Ultra-low Phase Noise 58-GHz Optoelectronic Oscillator Driven by a Narrow-Linewidth Quantum Dot DFB Laser","speaker":"Atsushi Matsumoto","affiliation":"National Institute of Information and Communications Technology (NICT)","authors":"Atsushi  Matsumoto, Toshimasa  Umezawa, Shinya  Nakajima, Kouichi  Akahane, Naokatsu  Yamamoto, Satoshi  Shinada","start":"","end":"","abstractid":212080,"order":95,"abstract":"Abstract (summary)  We demonstrate a 58.2 GHz optoelectronic oscillator using a narrow-linewidth quantum-dot DFB (QD-DFB) laser. Compared to a conventional MQW-DFB laser, the QD-DFB significantly reduces phase noise to -102.5 dBc/Hz at 10 kHz offset, achieving a 19 dB improvement with a 100 m fiber loop.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-888.pdf"},{"role":"speaker","rolename":"Poster","code":"#917 / We4-P96","title":"A Hardware-Efficient FMCW-Based Point-to-Multipoint Forward Sensing Scheme Compatible with Existing PON Infrastructures","speaker":"Yi Zou","affiliation":"","authors":"Yi  Zou, Chenbo  zhang, Yixiao  Zhu, Xu  Liu, Jingjing  Lin, Jiachuan  Yang, Weiwei  Hu, Weisheng  Hu, Zhangyuan  Chen, Xiaopeng  Xie","start":"","end":"","abstractid":212110,"order":96,"abstract":"Abstract (summary)  We propose a hardware-efficient FMCW-based P2MP sensing scheme seamlessly compatible with existing PON infrastructures. By introducing only passive components, namely an MZI and an ODL, at each ONU, we achieve simultaneous and unambiguous interrogation of all branches with a localization accuracy better than 10 m.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-917.pdf"},{"role":"speaker","rolename":"Poster","code":"#1030 / We4-P97","title":"Hybridization of sensing technologies to detect fibre distribution cabinets and environmental variations in a terrestrial fibre link to improve deployed fibre localization","speaker":"Tjorven Hilbert","affiliation":"","authors":"Tjorven  Hilbert, Florian  Azendorf, Tobias  Philipp, Annika  Dochhan, Stephan  Pachnicke","start":"","end":"","abstractid":212228,"order":97,"abstract":"Abstract (summary)  In this work, we used multi-modal sensing and monitoring approaches to find reference points within a communication fibre network. These points were identified by their spectral signature in the range of 1-15 Hz and their Brillouin frequency shift variations in the range of 5-30 MHz.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1030.pdf"},{"role":"speaker","rolename":"Poster","code":"#1032 / We4-P98","title":"Fully Distributed Fiber-Optic Sensing Enabled by Kalman Filtering","speaker":"Juan Manuel Marin Mosquera","affiliation":"Technical University of Denmark","authors":"Juan M.  Marin, Roman  Ermakov, Florian  Azendorf, André  Sandmann, Francesco  Da Ros, Darko  Zibar","start":"","end":"","abstractid":212231,"order":98,"abstract":"Abstract (summary)  Signal fading creates points along the fiber where phase cannot be extracted, so they are conventionally discarded. Instead, we propose a Kalman-based solution for ϕ-OTDR full-fiber monitoring. Experiments demonstrate phase and temperature estimation with approximately 15 times better spatial density than if removing these points.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1032.pdf"},{"role":"speaker","rolename":"Poster","code":"#1088 / We4-P99","title":"High-Bandwidth Branch-Ambiguity-Free Probing for Single-Wavelength DAS in PON","speaker":"Geyang Wang","affiliation":"The Chinese University of Hong Kong,","authors":"Geyang  Wang, Pallab K.  Choudhury, Lian-Kuan  Chen, Élie  Awwad","start":"","end":"","abstractid":212290,"order":99,"abstract":"Abstract (summary)  We propose and validate new probing sequences achieving the bandwidth-branch-distance bound of a single-wavelength DAS over PON. Results show up to 300% improvement in acoustic bandwidth or 100% improvement in sensing distance compared to state-of-the-art schemes, resolving simultaneously branch ambiguity in event detection over drop-fibers.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1088.pdf"},{"role":"speaker","rolename":"Poster","code":"#1113 / We4-P100","title":"Monolithic Silicon Photonic Processor for Reconfigurable Radar Jamming with Asymmetric False-Target Clusters","speaker":"Senyu Zhang","affiliation":"Huazhong University of Science and Technology (HUST)","authors":"Senyu  Zhang, Wei  Luo, Yunlong  Li, Shuang  Zheng, Minming  Zhang","start":"","end":"","abstractid":212318,"order":100,"abstract":"Abstract (summary)  We demonstrate a 2.5 × 5.5 mm² monolithic silicon photonic processor for reconfigurable radar jamming with >20 GHz bandwidth. A gated-modulation scheme generates asymmetric false-target clusters with tunable centroid offsets from −0.55 to +0.6 μs, enabling reconfigurable asymmetric deceptive jamming.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1113.pdf"},{"role":"speaker","rolename":"Poster","code":"#1207 / We4-P101","title":"Compact Hybrid-Integrated 8-Port Optical Heterodyne Source for Wideband Gap-Free Terahertz Generation via Photonic Wire Bonding","speaker":"Wentao Sun","affiliation":"","authors":"Wentao  Sun, Zijiang  Yang, Zhenxing  Sun, Zhuoying  Wang, Rulei  Xiao, Xiangfei  Chen","start":"","end":"","abstractid":212414,"order":101,"abstract":"Abstract (summary)  We demonstrate a compact hybrid-integrated 8-port optical heterodyne source for wideband THz generation via photonic wire bonding. Gap-free continuous beat frequency tuning from 0.08 to 0.83THz is achieved with high output power (>70mW) and narrow linewidth (∼165kHz).","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1207.pdf"},{"role":"speaker","rolename":"Poster","code":"#1222 / We4-P102","title":"Distributed Sensing on a 110-kV Overhead-Line Maintenance Operation on an Operational Optical Ground Wire","speaker":"Konstantinos Alexoudis","affiliation":"Adtran Networks SE","authors":"Konstantinos  Alexoudis, Torm  Järvelill, Hendrik  Kerm, Kaida  Kaeval, Florian  Azendorf, Vincent  Sleiffer, Jasper  Müller, Chigo  Okonkwo, Tom  Bradley","start":"","end":"","abstractid":212434,"order":102,"abstract":"Abstract (summary)  We demonstrate dual-modal distributed sensing on an operational 110-kV OPGW during crane maintenance. DAS resolves meter-scale lifting events and matches impulsive events to phone audio, while DTSS quantifies post-reclamping residual strain up to ∼398 μϵ, enabling maintenance verification  and asset monitoring in transmission grids.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1222.pdf"},{"role":"speaker","rolename":"Poster","code":"#1225 / We4-P103","title":"Pre-Delayed Laser Modulation for Remote Radio Beam Steering","speaker":"Rodrigo Otoniel Méndez Canú","affiliation":"Universitat Politècnica de Catalunya - BarcelonaTech","authors":"Rodrigo  Méndez, Victor  Polo, Martí  Raurich, Àlex  Navarro, María C.  Santos","start":"","end":"","abstractid":212437,"order":103,"abstract":"Abstract (summary)  We demonstrate remote radio beam steering up to 11◦ over a 10 km fiber fronthaul and a 2 m free-space link at 7.5 GHz, using four pre-delayed, individually modulated DFB lasers whose wavelengths are mapped to the horn antennas of a phased array.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1225.pdf"},{"role":"speaker","rolename":"Poster","code":"#1357 / We4-P104","title":"Silicon-based Microwave Photonics Notch Filter for Millimeter-Wave Frequency Bands","speaker":"Claudio Porzi","affiliation":"","authors":"Claudio  Porzi, Antonio  Malacarne, Mirco  Scaffardi, Paolo  Ghelfi, Antonella  Bogoni","start":"","end":"","abstractid":212579,"order":104,"abstract":"Abstract (summary)  A microwave photonic notch filter based on on-chip modified Michelson interferometer in silicon on insulator technology is presented. The filter features a large rejection ratio exceeding 40 dB, positive RF gain, and unprecedented continuous tuning range over nearly 60 GHz, only limited by available equipment.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1357.pdf"},{"role":"speaker","rolename":"Poster","code":"#1358 / We4-P105","title":"Interpretable and Data-Efficient Fiber Disturbance Classification from SOP Dynamics Using Semantic Knowledge and Adaptive Retrieval","speaker":"Khouloud Abdelli","affiliation":"Nokia Bell Labs","authors":"Khouloud  Abdelli","start":"","end":"","abstractid":212580,"order":105,"abstract":"Abstract (summary)  We present a data-efficient framework for fiber disturbance classification from state-of-polarization (SOP) measurements. Physically grounded semantic descriptors enable interpretable zero-shot inference, while adaptive retrieval resolves class ambiguity. Experiments on a 2600-km WDM system achieve 95% accuracy, outperforming supervised methods in robustness.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1358.pdf"},{"role":"speaker","rolename":"Poster","code":"#777 / We4-P106","title":"Experimental Investigation of System Outage in Spatial Diversity FSO Links Using Data-Aided and Non-Data-Aided DSP","speaker":"Abraham Johst","affiliation":"Fraunhofer Institute for Telecommunications, Heinrich-Hertz-Institut, HHI","authors":"Abraham  Johst, Aymeric  Arnould, Lutz  Molle, Nicolas  Perlot, Ronald  Freund, Georg  Rademacher, Markus  Nölle","start":"","end":"","abstractid":211956,"order":106,"abstract":"Abstract (summary)  We experimentally investigate the suitability of data-aided and non-data-aided DSP for spatial diversity FSO reception with digital combining. Measurements over a 3.2-km, 32-GBd free-space link are used to emulate variable diversity order and quantify the impact of low-SNR receiver branches on the system outage probability.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-777.pdf"},{"role":"speaker","rolename":"Poster","code":"#857 / We4-P107","title":"Real-Time Event-Based Optical Camera Communication at 80 kbit/s over a 320 m Outdoor Link with 120° Field-of-View","speaker":"Francesco Nardo","affiliation":"Airbus Space and Defense GmbH","authors":"Francesco  Nardo, Peter  Krötz, Ricardo  Barrios, Sebastian  Randel","start":"","end":"","abstractid":212047,"order":107,"abstract":"Abstract (summary)  We demonstrate an event-based optical camera communication system using a 120° field-of-view sensor. In daylight, three transmitting nodes achieve an aggregate 240 kbit/s, with individual links reaching 106 kbit/s at 1m and 80 kbit/s at 320m. Our results, establish a new baseline for event-OCC.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-857.pdf"},{"role":"speaker","rolename":"Poster","code":"#859 / We4-P108","title":"10 Gb/s Fiber-Coupled and 2 Meter Free-Space Optical Link using an APD array and an Imaging Receiver","speaker":"Atiyeh Pouralizadeh Gelehpordesari","affiliation":"Fraunhofer HHI","authors":"Atiyeh  Pouralizadeh, Yazan  Saleh, Giulio  Boniello, Christoph  Kottke, Anselm  Ebmeyer, Max Julius  Bode, Lennert  Bober, Ronald  Freund, Volker  Jungnickel","start":"","end":"","abstractid":212050,"order":108,"abstract":"Abstract (summary)  We demonstrate in a fiber-coupled setup using a manufactured silicon APD-array with a peak data rate of 10Gb/s. In a VCSEL-based free-space optical link, the APD array acts as an imaging receiver, achieving 5.6-7Gb/s over wireless distances to 2 meters while preserving full angular diversity.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-859.pdf"},{"role":"speaker","rolename":"Poster","code":"#912 / We4-P109","title":"Mitigating Outages in a 4.6-km FSO Link via Mode-Diverse Reception: An Experimentally Validated Digital Twin Approach","speaker":"Jonas Krimmer","affiliation":"Karlsruhe Institute of Technology","authors":"Jonas  Krimmer, Vincent  Van Vliet, Menno  Van Den Hout, Eduward  Tangdiongga, Chigo  Okonkwo, Sebastian  Randel","start":"","end":"","abstractid":212105,"order":109,"abstract":"Abstract (summary)  Terrestrial coherent FSO requires mitigating turbulence-induced coupling losses. We experimentally validate a \"Digital Twin\" channel model against fading statistics from a 4.6-km link. Combining long-term scintillometer data with mode-diverse receiver simulations, we demonstrate that a 6-mode receiver reduces turbulence-induced outage probabilities to 2.02e-5.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-912.pdf"},{"role":"speaker","rolename":"Poster","code":"#1064 / We4-P110","title":"Fully Monolithic Pseudo-Random Phase Modulated Coherent LiDAR Transceiver","speaker":"Pablo López-Querol","affiliation":"Universidad Politécnica de Madrid","authors":"Pablo  López-Querol, Diego  Domínguez-Castillejo, Clara  Quevedo-Galán, Antonio  Pérez-Serrano","start":"","end":"","abstractid":212264,"order":110,"abstract":"Abstract (summary)  A fully monolithic coherent LiDAR transceiver is demonstrated on a generic indium phosphide platform. The photonic integrated circuit combines a narrow-linewidth laser, a phase modulator, and a 120° hybrid coherent receiver. Ranging capability is validated through in-fibre distance measurements over 500 m","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1064.pdf"},{"role":"speaker","rolename":"Poster","code":"#1066 / We4-P111","title":"Channel-Predictive and Content-Aware Satellite-to-Ground Semantic Optical Communication System","speaker":"Wei Zhang","affiliation":"State Key Laboratory of Information Photonics and Optical Communications, Beijing University of Posts and Telecommunications","authors":"Wei  Zhang, Zhenming  Yu, Hongyu  Huang, Xiangyong  Dong, Yan  Ma, Xiang  Wang, Wenbo  Ding, Kun  Xu","start":"","end":"","abstractid":212267,"order":111,"abstract":"Abstract (summary)  We proposed a channel-predictive, content-aware semantic optical communication system for satellite-to-ground links. The framework enables adaptive transmission under dynamic atmospheric turbulence, achieving both strong noise resilience and high-fidelity image transmission. Experiments demonstrate a 3 dB receiver sensitivity improvement.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1066.pdf"},{"role":"speaker","rolename":"Poster","code":"#1094 / We4-P112","title":"Analysis of Nonlinear Distortions in High Power EDFAs for Coherent Optical Satellite Communications","speaker":"Ricardo Vagante Cotrim","affiliation":"Instituto de Telecomunicações, Department of Electrical and Computer Engineering, University of Coimbra","authors":"Ricardo  Cotrim, Diogo  Malheiro, Paulo  Monteiro, Fernando  Guiomar, Gil  Fernandes, Maria  Medeiros","start":"","end":"","abstractid":212298,"order":112,"abstract":"Abstract (summary)  Scaling ground-to-satellite free-space optical links to tens of watts introduces Kerr-nonlinearities that limit system capacity. We analyze the interplay between EDFA and patch-cord nonlinearities, showing that a multi-section EDFA structure effectively mitigates amplifier-induced impairments, while patch-cord nonlinearities emerge as the dominant limitation for longer links.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1094.pdf"},{"role":"speaker","rolename":"Poster","code":"#1105 / We4-P113","title":"Digital Twin-Driven Space Risk-Aware Intelligent Routing for LEO-Satellite Optical Networks","speaker":"Lei Shi","affiliation":"Zhengzhou University","authors":"Lei  Shi, Yanyan  Xie, Ruijie  Zhu, Bingli  Guo, Shanguo  Huang","start":"","end":"","abstractid":212310,"order":113,"abstract":"Abstract (summary)  We propose risk-aware routing for LEO optical networks via asynchronous digital twin feedback, modeling multi-stage debris clouds and sun outage risks from synchronized observations. A reinforcement learning agent modulates link costs for routing optimization, improving service success rate by 30.42% over baselines.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1105.pdf"},{"role":"speaker","rolename":"Poster","code":"#1362 / We4-P114","title":"FMCW LiDAR Demonstrator using an Integrated Silicon Photonics IQ Modulator and Dynamic Target Emulation","speaker":"Gijs van Elzakker","affiliation":"IMEC The Netherlands","authors":"Gijs  Van Elzakker, Xuebing  Zhang, Javier  Perez Santacruz, Aboobackkar  Sidhique, Esteban  Venialgo, Govind  Wanjalkar, Xin  Yin, Dongjae  Shin","start":"","end":"","abstractid":212584,"order":114,"abstract":"Abstract (summary)  An integrated silicon photonics IQ modulator is used in an FMCW LiDAR demonstrator. With a tunable coupler to connect I and Q branches, we show the importance of sideband suppression for the detection of dynamic targets, which are emulated using an acousto-optic modulator.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1362.pdf"},{"role":"speaker","rolename":"Poster","code":"#938 / We4-P115","title":"Two-Stage Rollback-Aware Recovery for Cross-Datacenter Training under Failure-Induced Optical-Link Capacity Degradation","speaker":"Zheng Yang","affiliation":"Beijing University of Posts and Telecommunications","authors":"Zheng  Yang, Jun  Dai, Xiaorun  Wang, Xingde  Li, Kexiong  Fang, Tianli  Wang, Yuyang  Liu, Zhiqun  Gu, Jiawei  Zhang","start":"","end":"","abstractid":212131,"order":115,"abstract":"Abstract (summary)  Bandwidth degradation caused by failures disrupts cross-datacenter training. We propose a two-stage recovery strategy using minimum sustainable bandwidth to preserve rollback-aware training value. At 40% residual capacity, it preserves over 2x the value of rigid-priority protection and cuts weighted slowdown by 25% versus equal sharing.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-938.pdf"},{"role":"speaker","rolename":"Poster","code":"#1081 / We4-P116","title":"Energy-Efficient FSO Reconfiguration under User Mobility in Hybrid Fiber-IAB Backhaul","speaker":"Piotr Tobiasz Lechowicz","affiliation":"Chalmers University of Technology","authors":"Piotr  Lechowicz, Charitha  Madapatha, Carlos  Natalino, Tommy  Svensson, Paolo  Monti","start":"","end":"","abstractid":212283,"order":116,"abstract":"Abstract (summary)  User mobility creates stochastic, time-varying backhaul demand that static capacity provisioning cannot match. We propose a closed-loop, load-aware hysteresis controller for hybrid fiber-IAB-FSO backhaul and show that energy drops faster than coverage: 8% to 44% energy savings cost only 0.9% to 6.7% coverage.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1081.pdf"},{"role":"speaker","rolename":"Poster","code":"#1172 / We4-P117","title":"A Physics-Guided Learning Framework for Compound Soft-Failure Identification from Single-Failure Training Data","speaker":"Yun Wang","affiliation":"the School of Optical and Electronic Information, Huazhong University of Science and Technology","authors":"Yun  Wang, Keyuan  Yang, Guangye  Cheng, Yu  Yang, Changjian  Ke","start":"","end":"","abstractid":212377,"order":117,"abstract":"Abstract (summary)  We propose a physics-guided learning framework for compound soft-failure identification in optical communication links using only single-failure training data, achieving 92.8% accuracy and strong generalization to unseen failure combinations through physical spectrum synthesis and decision fusion.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1172.pdf"},{"role":"speaker","rolename":"Poster","code":"#1279 / We4-P118","title":"Descriptor-Conditioned Multi-Agent Small Language Models for On-Premises Optical Network Control","speaker":"Takahito Tanimura","affiliation":"Hitachi Ltd.","authors":"Takahito  Tanimura, Nobuhiko  Kikuchi","start":"","end":"","abstractid":212495,"order":118,"abstract":"Abstract (summary)  Secure optical network control requires local processing, but locally deployable SLMs remain limited in capability. We propose text-defined SLM teams sharing a backbone and diversified by deterministic Text-to-LoRA parameter modulation. In fiber launch-power control, the proposed method achieves higher GOSNR than single-agent and prompt-only baselines.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1279.pdf"},{"role":"speaker","rolename":"Poster","code":"#662 / We4-P119","title":"Demonstration of Novel Key-Rate and Trust Aware Routing Scheme for Maximum QKD Link Utilization in Integrated Quantum-Communication Network","speaker":"Xinyu Chen","affiliation":"China Mobile Research Insititute","authors":"Xinyu  Chen, Liuyan  Han, Longfei  Dai, Qixuan  Huang, Haohua  Wang, Minxue  Wang, Dechao  Zhang, Han  Li","start":"","end":"","abstractid":211828,"order":119,"abstract":"Abstract (summary)  We propose a key-rate and trust aware routing scheme maximizing QKD link utilization in integrated quantum-communication networks. Demonstrated for the first time via simulation and experiment, 8.61% utilization improvement, stable key pools, and trusted relays are achieved, overcoming barriers to scalable QKD under limited resources.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-662.pdf"},{"role":"speaker","rolename":"Poster","code":"#798 / We4-P121","title":"Dynamic tracking-enabled indoor free-space BBM92 access for mobile quantum users","speaker":"Shan Jiang","affiliation":"","authors":"Shan  Jiang, Ruizhi  Yang, Jianxiong  Tan, James  Tai, Rui  Wang, Dimitra  Simeonidou","start":"","end":"","abstractid":211981,"order":121,"abstract":"Abstract (summary)  Wedemonstrate a tracking-assisted indoor free-space optical entanglement distribution system for mobile quantum access. Over 3.4-10.1m FSO links, QBER remains below 10.58% with SKR up to 208 bps under ambient light. Results confirm stable end-to-end entanglement delivery under mobility and alignment variations.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-798.pdf"},{"role":"speaker","rolename":"Poster","code":"#1026 / We4-P122","title":"A Practical Countermeasure Against Attacks Exploiting Detection Efficiency Mismatch in High-Speed Quantum Key Distribution","speaker":"Ben Taylor","affiliation":"","authors":"Ben  Taylor","start":"","end":"","abstractid":212224,"order":122,"abstract":"Abstract (summary)  We demonstrate a practical countermeasure against quantum hacking strategies on quantum key distribution (QKD) systems exploiting detection efficiency mismatch, where the receiver’s detectors do not exhibit identical responses to incoming photons. This countermeasure enables almost complete recovery of the GHz-clocked system’s ideal secret key rate.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1026.pdf"},{"role":"speaker","rolename":"Poster","code":"#1084 / We4-P123","title":"Optimizing Resource Allocation and Scheduling in Quantum Networks","speaker":"Oumayma Bouchmal","affiliation":"Delft University of Technology","authors":"Oumayma  Bouchmal, Jake  Smith, Stephanie  Wehner","start":"","end":"","abstractid":212286,"order":123,"abstract":"Abstract (summary)  We propose a scheduling framework for resource allocation in quantum networks to maximize served demands. Evaluating ILP, EDF, and simulated annealing across 200 scenarios shows ILP achieves offline optimality, EDF enables fast real-time operation, while simulated annealing offers negligible performance benefit at higher computational cost","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1084.pdf"},{"role":"speaker","rolename":"Poster","code":"#1099 / We4-P124","title":"Optimization of CV-QKD Under Practical Constraints","speaker":"Konrad Banaszek","affiliation":"","authors":"Svitlana  Matsenko, Amirhossein  Ghazisaeidi, Marcin  jarzyna, Konrad  banaszek, Darko  Zibar","start":"","end":"","abstractid":212304,"order":124,"abstract":"Abstract (summary)  Using reinforcement learning, we optimize for practical hardware constraints, including limited FIR filter taps at the transmitter and receiver, mean photon number and finite DAC/ADC resolution. Under these realistic conditions, the proposed approach achieves significant performance improvements.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1099.pdf"},{"role":"speaker","rolename":"Poster","code":"#1118 / We4-P125","title":"Experimental Demonstration of C-Band DWDM Multi-Classical Multi-QKD Coexistence with Pretrained Rapid QBER Evaluation","speaker":"Qianhui Guo","affiliation":"Beijing University of Posts and Telecommunications","authors":"Qianhui  Guo, Xun  Zhu, Shang  Gao, Zikun  Zhang, Yanlu  Huang, Liyan  Wu, Mingyang  Guo, Shangya  Han, Kai  Jin, Zhikai  Lu, Zhipeng  Wang, Kun  Xu, Yanni  Ou","start":"","end":"","abstractid":212323,"order":125,"abstract":"Abstract (summary)  We experimentally demonstrated a 20-km DWDM system comprising 4-QKD-channels coexisting with 6-classical-channels, investigated the heterogeneous impairments experienced by different QKD users under multi-channel combinations, and proposed a pretrained rapid QBER estimator to adaptive QKD parameters optimisation, increasing the total DV-QKD SKR by 28.25% to 127.64-kbps.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1118.pdf"},{"role":"speaker","rolename":"Poster","code":"#1130 / We4-P126","title":"Fiber-Coupled Negative Feedback Avalanche Diode Module for Single-Photon Detection in the Optical O-Band","speaker":"Muhammed Fatih Akal","affiliation":"Fraunhofer Heinrich Hertz Institute","authors":"Muhammed Fatih  Akal, Elisa  Collin, Pascal  Rustige, Patrick  Runge","start":"","end":"","abstractid":212335,"order":126,"abstract":"Abstract (summary)  We present a fiber-coupled negative feedback avalanche diode (NFAD) module, characterized in free-running mode with active hold-off circuitry, demonstrating a dark count rate below 100 Hz for 20% single-photon detection efficiency at 1301 nm and 233 K.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1130.pdf"},{"role":"speaker","rolename":"Poster","code":"#1191 / We4-P127","title":"Key-Aware Shared Wavelength Management for Coexisting Quantum and Classical Optical Networks","speaker":"Wenjie Huang","affiliation":"","authors":"Wenjie  Huang, Xiaosong  Yu, Jingjing  Liu, Avishek  Nag, Yongli  Zhao, Jie  Zhang","start":"","end":"","abstractid":212397,"order":127,"abstract":"Abstract (summary)  We propose a key-aware shared wavelength management (KA-SWM) algorithm for CV-QKD and classical service coexistence over SDN-enabled WDM networks. A dual-threshold mechanism dynamically expands and recycles quantum channels based on real-time key pool status, achieving up to 79.62% relative improvement in service success probability.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1191.pdf"},{"role":"speaker","rolename":"Poster","code":"#1268 / We4-P128","title":"Passive Polarization-Insensitive QKD Receiver Module in a Standard CFP2 Form Factor","speaker":"Chun Ju Youn","affiliation":"","authors":"Junsang  Oh, Joong-Seon  Choe, Byung-Seok  Choi, Ju Hee  Baek, Kyongchun  Lim, Chun Ju  Youn","start":"","end":"","abstractid":212482,"order":128,"abstract":"Abstract (summary)  We report the first passive polarization-insensitive QKD receiver implemented in a CFP2 module through hybrid QPIC integration. The proposed self-compensating configuration removes active polarization control while enabling high integration density, offering a scalable route toward compact and commercial quantum communication systems.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1268.pdf"},{"role":"speaker","rolename":"Poster","code":"#1040 / We4-P129","title":"Characterization of Coherence From Spontaneous to Stimulated Four-Wave Mixing in Si3N4 Microresonators","speaker":"Francesca Fama","affiliation":"Istituto Nazionale di Ricerca Metrologica (INRiM)","authors":"Francesca  Famà, Stefano  Dello Russo, Stefano Gregorio  Giaccari, Salvatore  Virzì, Lorenzo  Lucia, Cecilia  Clivati, Chiara  Gionco, Mario  Siciliani De Cumis, Stefano  Condio, Simone  Donadello, Gianluca  Bertaina, Alice  Meda, Erik  Cerrato, Marco  Gramegna, Marco  Genovese, Filippo  Levi, Ivo Pietro  Degiovanni, Davide  Calonico","start":"","end":"","abstractid":212239,"order":129,"abstract":"Abstract (summary)  We experimentally characterize spectral coherence in four-wave mixing using high-Q silicon nitride microresonators. Employing time-correlation and phase-sensitive techniques, we follow the expected extension of the coherence time from cavity- to pump- limited regimes, providing a method for characterizing tunable quantum sources, useful for quantum communication.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1040.pdf"},{"role":"speaker","rolename":"Poster","code":"#1055 / We4-P130","title":"Octave-spanning Supercontinuum Generation with Optimized Ultralong-Ultrafast Fiber Lasers","speaker":"Laura  Hernández-Martín","affiliation":"Instituto de Óptica Daza de Valdés (CSIC)","authors":"Laura  Hernández Martín, Inés  Cáceres-Pablo, Pedro  Corredera, Juan Diego  Ania-Castañón","start":"","end":"","abstractid":212254,"order":130,"abstract":"Abstract (summary)  Pulsed supercontinuum generation centered at 1550 nm with a-30 dB bandwidth in excess of 1000 nm is generated from optimized ultralong ultrafast ring fibre sources with intra-cavity polarization and gain control, using commercially available HNLF.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1055.pdf"},{"role":"speaker","rolename":"Poster","code":"#1167 / We4-P131","title":"Silicon Nitride Microring Resonator for Broadband Near-Infrared to Telecom Wavelength Conversion","speaker":"Chandan Upadhyay","affiliation":"","authors":"Chandan  Upadhyay, Abdou  Shetewy, Menglong  He, Kambiz  Jamshidi","start":"","end":"","abstractid":212372,"order":131,"abstract":"Abstract (summary)  A silicon nitride pulley microring resonator is designed for broadband 780-to-1550 nm frequency conversion via four-wave mixing Bragg-scattering. Measured loaded Q-factors of 0.52×106 (780 nm) and 0.48×106 (1550 nm) yield a simulated on-chip conversion efficiency of -4.6 dB at 50 mW pump powers  each.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1167.pdf"},{"role":"speaker","rolename":"Poster","code":"#1219 / We4-P132","title":"Measuring Nanometer-Scale Process Variation in Lithography Using Image-Based Anomaly Detection","speaker":"Yanick Douven","affiliation":"Nobleo Technology","authors":"Yanick  Douven, Stefan  Van Der Palen, Philip  Schrinner, Rik  Wetzels, Ronald  Dekker","start":"","end":"","abstractid":212430,"order":132,"abstract":"Abstract (summary)  This work evaluates image-based anomaly detection as a fast, low-cost method to estimate nanometer-scale lithography variation from optical microscope images. A reference-trained model is applied to parameter-sweep structures and validated with SEM, showing that process-induced fill-factor-shifts, corresponding to 20 nm can be detected and quantified.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1219.pdf"},{"role":"speaker","rolename":"Poster","code":"#1250 / We4-P133","title":"A Fourier Neural Operator Surrogate Model for 3D Diffusion in Photonic Glass Core Substrates","speaker":"Dennis Choy","affiliation":"Technische Universität Berlin","authors":"Dennis  Choy, Tom  Chojne, Maurice  Haffner, Julian  Schwietering","start":"","end":"","abstractid":212463,"order":133,"abstract":"Abstract (summary)  Three-dimensional diffusion simulation in glass core substrates is computationally expensive. We present a Fourier Neural Operator surrogate that maps 2D masks to 3D diffusion fields. On heldout data, it achieves 0.0236 normalized RMSE with 140 ms inference, enabling rapid design-space exploration.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1250.pdf"}]},{"sessionid":"5538450"
