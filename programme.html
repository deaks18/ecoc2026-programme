<!DOCTYPE html>

<head>

<title>ECOC 2026 — Searchable Programme</title>
<style>
  :root{
    --bg:#0f1720; --panel:#161f2b; --panel2:#1d2836; --line:#2a3646;
    --txt:#e8eef6; --muted:#9fb0c3; --accent:#3ea6ff; --accent2:#7ee787;
    --chip:#233145; --chipsel:#2f6feb; --hl:#ffd94d;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg,#0f1720 0%,#0f1720f2 100%);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(6px);
    padding:14px 20px 12px;
  }
  .titlerow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:12.5px}
  .searchwrap{position:relative;margin-top:12px}
  #q{
    width:100%; padding:12px 40px 12px 42px; font-size:16px;
    background:var(--panel); color:var(--txt);
    border:1px solid var(--line); border-radius:var(--radius); outline:none;
  }
  #q:focus{border-color:var(--accent)}
  .searchwrap .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
  #clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:var(--chip);border:none;color:var(--muted);border-radius:8px;
    padding:4px 9px;cursor:pointer;font-size:13px;display:none}
  #clear:hover{color:var(--txt)}

  .filters{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .flabel{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;min-width:64px}
  .chip{
    background:var(--chip);border:1px solid transparent;color:var(--txt);
    padding:5px 11px;border-radius:999px;cursor:pointer;font-size:13px;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;
  }
  .chip .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .chip:hover{border-color:var(--line)}
  .chip.sel{background:var(--chipsel);border-color:var(--chipsel);color:#fff;font-weight:600}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .count{color:var(--muted);font-size:13px}
  .viewtoggle{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
  .viewtoggle button{background:transparent;border:none;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px}
  .viewtoggle button.sel{background:var(--chipsel);color:#fff}
  .selwrap{position:relative}
  select{
    background:var(--panel);color:var(--txt);border:1px solid var(--line);
    border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer;max-width:280px;
  }

  main{max-width:1100px;margin:0 auto;padding:18px 20px 80px}

  .daygroup{margin-bottom:26px}
  .dayhdr{
    position:sticky; top:0; z-index:5;
    font-size:14px;font-weight:700;color:var(--accent2);
    padding:8px 4px;border-bottom:1px solid var(--line);margin-bottom:12px;
  }

  .session{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:12px;overflow:hidden;
  }
  .shead{
    display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer;
    border-left:5px solid var(--accent);
  }
  .shead:hover{background:var(--panel2)}
  .smeta{flex:1;min-width:0}
  .stitle{font-weight:650;font-size:15px}
  .scode{color:var(--accent);font-weight:700;margin-right:6px}
  .sinfo{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
  .sinfo b{color:var(--txt);font-weight:600}
  .stype{font-size:11px;padding:2px 8px;border-radius:999px;color:#08121d;font-weight:700;white-space:nowrap;align-self:flex-start}
  .scat{color:var(--muted);font-size:12px;margin-top:3px;font-style:italic}
  .pcount{color:var(--muted);font-size:12px;white-space:nowrap;align-self:center}
  .caret{color:var(--muted);transition:transform .15s;align-self:center}
  .session.open .caret{transform:rotate(90deg)}

  .papers{display:none;border-top:1px solid var(--line)}
  .session.open .papers{display:block}
  .sdesc{padding:12px 14px;color:#c3d0de;font-size:13.5px;line-height:1.55;
    border-bottom:1px solid var(--line)}
  /* chairs / organizers: one line per role, not one row per person */
  .mods{padding:10px 14px 10px 22px;border-bottom:1px solid #202b3a}
  .modrow{display:flex;gap:9px;align-items:baseline;margin-bottom:5px}
  .modrow:last-child{margin-bottom:0}
  .mlabel{flex:none;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
    color:#08121d;background:var(--accent2);padding:1px 6px;border-radius:5px;font-weight:700}
  .mlabel.chair{background:#8fb7ff}
  .mnames{font-size:13px;line-height:1.6}
  .maff{color:var(--muted);font-size:12px}
  .msep{color:#3d4b5e;margin:0 8px}

  .paper{display:flex;gap:12px;padding:11px 14px 11px 22px;border-top:1px solid #202b3a}
  .paper:first-child{border-top:none}
  .ptime{color:var(--muted);font-size:12.5px;min-width:52px;font-variant-numeric:tabular-nums}
  .pbody{flex:1;min-width:0}
  .pcodetag{color:var(--accent);font-size:12px;font-weight:700;margin-right:6px}
  .prole{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#08121d;background:var(--accent2);
    padding:1px 6px;border-radius:5px;margin-left:6px;font-weight:700;vertical-align:middle}
  .prole.inv{background:#f0a}
  .prole.tut{background:#ffb454}
  .prole.chair{background:#8fb7ff}
  .ptitle{font-weight:600}
  .pspk{color:var(--muted);font-size:13px;margin-top:2px}
  .pspk .nm{color:var(--txt);font-weight:600}
  .pauth{color:var(--muted);font-size:12.5px;margin-top:2px}
  .plinks{margin-top:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .absbtn{background:var(--chip);border:1px solid var(--line);color:var(--txt);
    font-size:12px;padding:3px 10px;border-radius:7px;cursor:pointer}
  .absbtn:hover{border-color:var(--accent)}
  .absbtn.on{background:var(--chipsel);border-color:var(--chipsel);color:#fff}
  .abslink{font-size:12px}
  .abslink.pdf{background:var(--chip);border:1px solid var(--line);padding:3px 10px;border-radius:7px;color:var(--txt)}
  .abslink.pdf:hover{border-color:var(--accent);text-decoration:none}
  .absbox{display:none;margin-top:8px;padding:10px 12px;background:var(--panel2);
    border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:13.5px;line-height:1.55}
  .absbox.show{display:block}

  mark{background:var(--hl);color:#08121d;border-radius:3px;padding:0 2px}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}
  kbd{background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px}
  /* A tall header + position:sticky pins it over the whole page, making
     content below unreachable. On narrow or short viewports let it scroll away. */
  @media(max-width:760px),(max-height:620px){
    header{position:static}
  }
  @media(max-width:640px){
    h1{font-size:16px}
    header{padding:10px 14px 10px}
    .chip{padding:4px 9px;font-size:12.5px}
    .flabel{font-size:10.5px}
    main{padding:14px 14px 80px}
    .flabel{min-width:100%;margin-bottom:-2px}
    .paper{padding-left:14px}
    .ptime{min-width:46px}
  }
</style>
</head>

o speed up innovation in integrated photonics?","description":"Abstract:\tIntegrated photonics is approaching a critical inflection point where the main barrier to large-scale adoption is no longer device performance, but workflow maturity. In contrast to microelectronics — where highly developed modeling, standardized PDKs, and tightly integrated design-to-packaging flows enable first-time-right silicon — photonics still lacks the predictive accuracy, tool integration, and accessibility needed for rapid prototyping and fast iteration. This workshop will explore how to mature photonic workflows toward microelectronics-like streamlining, with a focus on multi-physics modeling, electronic–photonic co-design, scalable packaging, and the emerging role of programmable photonics as a path to faster validation, reconfigurability, and system-level optimization.","goal":"","papers":[{"role":"speaker","rolename":"","code":"#0 /","title":"Bringing photonic and electronic design together. \tXu Wang (Cadence)","speaker":"","affiliation":"","authors":"","start":"11:00","end":"11:15","abstractid":null,"order":1},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Oded Raz","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"","code":"#0 /","title":"Photonic circuit design for manufacturing and yield. Pierre Wahl (Luceda Photonics)","speaker":"","affiliation":"","authors":"","start":"11:15","end":"11:30","abstractid":null,"order":2},{"role":"speaker","rolename":"","code":"#0 /","title":"Programmable Photonics for photonic system prototyping. Wim Bogaerts (Ghent University - imec)","speaker":"","affiliation":"","authors":"","start":"11:30","end":"11:45","abstractid":null,"order":3},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Wim Bogaerts","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":3},{"role":"speaker","rolename":"","code":"#0 /","tit ","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#0 /","title":"Mo3-A1 The role of programmable photonics in ai data centers","speaker":"Daniel Pérez","affiliation":"","authors":"","start":"14:00","end":"","abstractid":null,"order":1},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Oded Raz","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1350 / Mo3-A2","title":"Demonstration of Ultra-high Link Budget, Low Cost/Latency Distributed AI Scale-across Network enabled by C-band 3.2-Tb/s/lane IM-DD Transmission over 20-km AR-HCF","speaker":"Jingchuan Wang","affiliation":"The Hong Kong Polytechnic University","authors":"Jingchuan  Wang, Yibin  Li, Peng  Li, Lei  Zhang, Jie  Luo, Kangping  Zhong, Changyuan  Yu, Alan Pak Tao  Lau, Chao  Lu","start":"14:30","end":"","abstractid":212572,"order":2,"abstract":"Abstract (summary)  We demonstrate a C-band 32λ × 50-GBaud PAM4 transmission over 20-km HCF. We achieve a record link budget over 50-dB, showing that HCF-enabled IM-DD technology is strong candidate for AI scale-across scenarios requiring low-latency, low-cost, and zero packet loss.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1350.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1153 / Mo3-A3","title":"Is DSP-free Pluggable Optical Module More Suitable for Optical Circuit Switching?","speaker":"Han Wang","affiliation":"KDDI Research, Inc.","authors":"Chenxiao  Zhang, Han  Wang, Ceng  Wang, Daiki  Soma, Yuta  Wakayama, Ryo  Inohara, Takehiro  Tsuritani","start":"14:45","end":"","abstractid":212358,"order":3,"abstract":"Abstract (summary)   This paper presents the first comprehensive analysis of an LPO + OCS GPU network, from the optical to the application layer, including the impact of OCS reconfiguration. Stable 72-hour LLM pre-training was successfully demonstrated on this architecture.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1153.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1306 / Mo3-A4","title":"Dynamic RU-DU Reconfiguration in 6G Access Networks Using Fast Controlled Photonic Switches with 400G ZR+ Optics","speaker":"Assad Bahari","affiliation":"Eindhoven University of Technology","authors":"Assad  Bahari, Ali  Mefleh, Nicola  Calabretta","start":"15:00","end":"","abstractid":212524,"order":4,"abstract":"Abstract (summary)  We demonstrate a novel 6G access network for dynamic RU-DU reconfiguration combining fast-controlled SOA-based photonics with 400G ZR+ optics. Cross-layer coordination achieves 206 μs end-to-end reconfiguration latency, with scalable performance across multiple nodes and < 3.8 dB penalty at pre-FEC 10-2 BER.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1306.pdf"},{"role":"speaker","rolename":"Contributed","code":"#555 / Mo3-A5","title":"Large-Scale Deployment of LPO in AI Clusters","speaker":"Qin Chen","affiliation":"Alibaba Cloud, Alibaba Group","authors":"Qin  Chen, Chunxiao  Wang, Rui  Lu, Zhiping  Yao, Fangbo  Zhu, Peng  Wang, Zhicheng  Wang, Liang  Chen, Anbin  Wang, Yun  Bao, Yiyuan  Huang","start":"15:15","end":"","abstractid":211680,"order":5,"abstract":"Abstract (summary)  We present the large-scale deployment of 400G DR4 LPO modules in AI clusters, reporting statistical data on system conditions, link performance, and reliability from over 25.8 million device-hours of field operation, proving the long-term reliability of LPO technology","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-555.pdf"}]},{"sessionid":"5538367","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"14:00-15:30","room":"A2 Auditorium 2","type":"Tutorial and contributed session","typeColor":"#d9eaf7","category":"SC 01: Novel fibres, fibre devices and amplifiers","title":"Mo3-B Hollow-core  fibre fabrication and deployment","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Tom Bradley","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Tutorial","code":"#1426 / Mo3-B1","title":"Breaking the Loss Barrier: Hollow-Core Fibers from Physical Limits to Mass Production","speaker":"Yingying Wang","affiliation":"Jinan University","authors":"Yingying  Wang, Shoufei  Gao, Yifan  Xiong, Yizhi  Sun, Wei  Ding","start":"14:00","end":"","abstractid":214562,"order":1,"abstract":"Abstract (summary)  This tutorial reviews anti-resonant hollow-core fibers, from structure evolutions and loss reduction to manufacturable long-draw production,  and discuss application-oriented trade-offs from intra-data-center links to long-haul networks.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_tutorial_1.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Leslie Rusch","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#366 / Mo3-B2","title":"Rate of Water Ingress into Hollow-Core Fibre by Capillary Action","speaker":"Samuel Arome Osioke Agah","affiliation":"Optoelectronics Research Centre, University of Southampton","authors":"Samuel  Agah, Chiang Ping  Saw, Peter  Horak, Natalie  Wheeler","start":"15:00","end":"","abstractid":211191,"order":2,"abstract":"Abstract (summary)  We investigate water ingress into a double-nested antiresonant nodeless fibre by capillary action, using two independent methods. We find that different parts of the fibre fill at different rates and that ingress is 2-4 times slower than into a cylindrical capillary of identical core diameter.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-366.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1136 / Mo3-B3","title":"Dynamic Response of Antiresonant Hollow-Core Fibre Drawing to Pressure Perturbations","speaker":"Greg Jasion","affiliation":"Optoelectronics Research Centre, University of Southampton","authors":"Ali  Shakiba, Seyed Mohammad  Abokhamis Mousavi, Leonard  Budd, Seyed Reza  Sandoghchi, Naveen Krishna  Baddela, Francesco  Poletti, Gregory T.  Jasion","start":"15:15","end":"","abstractid":212341,"order":3,"abstract":"Abstract (summary)  A transient thermo-viscous model for drawing antiresonant hollow-core fibre is presented and experimentally validated. Core and capillary pressure perturbations drive distinct geometric responses, with inter-capillary gap showing the largest sensitivity. Low-frequency disturbances induce the strongest modulation, providing guidance for stable pressure control during fabrication.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1136.pdf"}]},{"sessionid":"5538369","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"14:00-15:30","room":"E1 Exhibition room 1","type":"Invited and contributed","typeColor":"#e2efda","category":"SC 02: Discrete photonic devices and technologies","title":"Mo3-C Lasers and sources","description":"","goal":"","papers":[{"role":"speaker","rolename":"Contributed","code":"#113 / Mo3-C1","title":"Semiconductor Optical Amplifier for WDM and High-Power Applications","speaker":"Stanislav Rocas","affiliation":"Innolume GmbH","authors":"Stanislav  Rocas, Evgenii  Vostrikov, Vasilii  Belykh, Sergey  Poltavtsev, Julia  Gebel, Artem  Zhabotinskii, Vladimir  Mikhrin, Boris  Kim, Sergey  Mikhrin, Janina  Rautert, Alexey  Gubenko, Alexey  Kovsh","start":"14:00","end":"","abstractid":210617,"order":1,"abstract":"Abstract (summary)  Two different types of quantum-dot O-band semiconductor optical amplifiers are demonstrated using a single epitaxial structure. By varying the device length, both low-noise WDM amplification and near watt-class output power are achieved, enabling linear and high-power operation within a single technology.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-113.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Selina Farwell","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#492 / Mo3-C2","title":"High Power ASE Source Module with Innovative Architecture","speaker":"You Wu","affiliation":"Optical Communication Technologies Lab, Huawei Technologies France","authors":"Antonin  Gallet, You  Wu, Nayla  El Dahdah, Sheherazade  Lamkadmi Azouigui, Romain  Brenot","start":"14:15","end":"","abstractid":211520,"order":2,"abstract":"Abstract (summary)  We propose a 50nm and 70mW white source module  with innovative design based on a single Semiconductor Optical Amplifier (SOA) with an optical circulator. By combining it with a high power SOA amplifier, we obtain 430 mW in-fiber power.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-492.pdf"},{"role":"speaker","rolename":"Invited","code":"#1429 / Mo3-C3","title":"Rare-earth ion doped on-chip amplifiers in the Al2O3 platform","speaker":"Sonia  M Garcia Blanco","affiliation":"UNIVERSITY OF TWENTE/ ALUVIA Photonics","authors":"Bjorn  Jongebloed, Kai  Wang, Carlos  Osornio Martinez, Dawson  Bonneville, Abeer  Mashlah, Meindert  Dijkstra, Sonia M.  García-Blanco","start":"14:30","end":"","abstractid":214651,"order":3,"abstract":"Abstract (summary)  Reactive sputtering of rare-earth-ion-doped Al₂O₃ enables scalable on-chip optical amplification across multiple wavelength bands. Monolithic integration with passive photonic platforms, combined with low nonlinearities and high-power handling, supports applications in telecommunications, datacom, sensing, and quantum photonics. Recent progress using erbium, thulium, and neodymium is reviewed.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_GarciaBlanco_final.pdf"},{"role":"speaker","rolename":"Contributed","code":"#430 / Mo3-C4","title":"Compact Widely Tunable InP Laser with 10 kHz Linewidth","speaker":"Maximilian Kähler","affiliation":"Fraunhofer Heinrich Hertz Institute","authors":"Victor  Leissling, Maximilian  Kähler","start":"15:00","end":"","abstractid":211361,"order":3,"abstract":"Abstract (summary)  We demonstrate a monolithic InP laser foundry-fabricated on a multi-project wafer that employs two passive parallel ring resonators, targeting coherent interconnects. It achieves 10 kHz intrinsic linewidth, 46 nm tuning range, >35 dB SMSR and 6 mW on-chip output power within a 0.8 mm² footprint.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-430.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1023 / Mo3-C5","title":"Over 400-mW O-band Monolithic MOPA Laser Array Based on REC Technology for CPO/OIO","speaker":"Zhenxing Sun","affiliation":"Nanjing University","authors":"Zhenxing  Sun, Rulei  Xiao, Yuechun  Shi, Pengfei  Xu, Yan  Wang, Xiangfei  Chen","start":"15:15","end":"","abstractid":212221,"order":4,"abstract":"Abstract (summary)  We propose and demonstrate a MOPA array with precise wavelength spacing based on the REC technique. The MOPA laser array achieves an output power exceeding 400 mW when operating at 50°C, providing an excellent high-power light source solution for CPO/ OIO technologies.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1023.pdf"}]},{"sessionid":"5538371","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"14:00-15:30","room":"C1.1 Conference room 1.1","type":"Invited and contributed","typeColor":"#ead1dc","category":"SC 11: Quantum communications, physical layer security, and optical quantum technologies","title":"Mo3-D Integrated quantum photonics (I)","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Takeshi Umeki","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1043 / Mo3-D1","title":"Practical Real-time CV-QKD with a Chip-scale Receiver","speaker":"Igor Servello","affiliation":"KEEQuant GmbH","authors":"Igor  Servello, Peter  Gleissner, Fabian  Loesch, Imran  Khan","start":"14:00","end":"","abstractid":212242,"order":1,"abstract":"Abstract (summary)  Scalable hardware and real-time operation are key requirements for field-deployable QKD. We demonstrate an automated CV-QKD system featuring a miniaturized receiver, built on chip-scale telecom laser and integrated coherent receiver. This system enables real-time key generation over 26 km and 52 km links.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1043.pdf"},{"role":"speaker","rolename":"Contributed","code":"#377 / Mo3-D2","title":"High-Speed Squeezed-State CV-QKD Over 10 km Fiber With a CMOS-Compatible Electronic-Photonic Integrated Receiver","speaker":"Sarah Bastiaens","affiliation":"Ghent University","authors":"Sarah  Bastiaens, Huy Quang  Nguyen, Aboobackkar  Sidhique, Simone  Cammarata, Ulrik Lund  Andersen, Adnan Adil Ebrahim  Hajomer, Tobias  Gehring, Xin  Yin","start":"14:15","end":"","abstractid":211211,"order":2,"abstract":"Abstract (summary)  The bandwidth limitations of squeezed-state CV-QKD are addressed by implementing a photonic–electronic integrated receiver with a CMOS transimpedance amplifier and a broadband single-pass squeezer. A 8.45 Mbit/s asymptotic key rate is achieved over 10 km with 500 MBaud signaling rate, demonstrating scalable high-speed squeezed-state CV-QKD.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-377.pdf"},{"role":"speaker","rolename":"Contributed","code":"#739 / Mo3-D3","title":"Time-Bin BB84 QKD System Using Indium Phosphide and Silicon Nitride Photonic Integrated Circuits","speaker":"Denis Fatkhiev","affiliation":"Eindhoven University of Technology","authors":"Denis  Fatkhiev, Alexander  Grebenchukov, João  Dos Reis Frazão, Gleb  Nazarikov, Chigo  Okonkwo, Idelfonso  Tafur Monroy","start":"14:30","end":"","abstractid":211912,"order":3,"abstract":"Abstract (summary)  We demonstrate a dual-chip InP-SiN photonic QKD system with on-chip pulse generation and reconfigurable decoding, implementing time-bin BB84 with finite-key security against coherent attacks. The system sustains a QBER below 4% and delivers secret keys at kbps rates over 150–250 km of fiber.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-739.pdf"},{"role":"speaker","rolename":"Contributed","code":"#435 / Mo3-D4","title":"Silicon-Native QKD Transmitter for Bidirectional Quantum/Classical Co-Existence in High-Speed PON","speaker":"Florian Honz","affiliation":"AIT Austrian Institute of Technology","authors":"Florian  Honz, Winfried  Boxleitner, Michael  Hentschel, Valeria  Saggio, Bernhard  Schrenk","start":"14:45","end":"","abstractid":211371,"order":4,"abstract":"Abstract (summary)  We prove secure-key generation over passive optical network plants for co-existing C- / O-band quantum/classical channels utilizing an all-silicon QKD transmitter, involving a 2×16 power split while being able to tolerate bidirectional classical launch levels up to 0 dBm.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-435.pdf"},{"role":"speaker","rolename":"Invited","code":"#1412 / Mo3-D5","title":"Thin-film lithium niobate for quantum photonics: perspectives and challenges","speaker":"Yunhong Ding","affiliation":"DTU Electro, Technical University of Denmark","authors":"Yunhong  Ding, Innokentiy  Zhdanov, Leif K.  Oxenløwe","start":"15:00","end":"","abstractid":213034,"order":5,"abstract":"Abstract (summary)  Thin-film lithium niobate (TFLN) photonics has recently emerged as an appealing platform for quantum photonics thanks to its low-loss characteristics, large electro-optic and nonlinear coefficients, and broad transparency window. Here, we discuss the latest developments, promising directions, and challenges for future TFLN quantum photonics research.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Thin-film lithium niobate for quantum photonics - perspectives and challenges_final.pdf"}]},{"sessionid":"5538373","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"14:00-15:30","room":"C1.4 Conference room 1.4","type":"Invited and contributed","typeColor":"#fce5cd","category":"SC 06: Architecture, modelling and performance of optical networks","title":"Mo3-E Optical non-terrestrian networks","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Carmen Mas Machuca","affiliation":"University of the Bundeswehr Munich","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#317 / Mo3-E1","title":"Demonstration of WDM, QoT-Aware Rate Adaptation and Add/Drop Operation in Inter-satellite All-optical Networks","speaker":"Shoichiro Oda","affiliation":"NICT","authors":"Shoichiro  Oda, Anthony  Brasi, Yusuke  Hirota, Hideaki  Kotake, Satoshi  Shinada, Hideaki  Furukawa","start":"14:00","end":"","abstractid":211110,"order":1,"abstract":"Abstract (summary)  Using a seven-node inter-satellite all-optical network (ISAON) testbed driven by Starlink TLE data, we demonstrate WDM, QoT-aware rate adaptation, and WXC add/drop under realistic time-varying inter-satellite loss emulation. Under HPA-limited power, four-channel WDM reaches 800 Gb/s. WDM-capable QoT estimation enables upgrades with ≤1.4 dB error.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-317.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Fatima  Gunning","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#322 / Mo3-E1","title":"Adaptive Lightpath-Correlation Refinement for Efficient QoT-Aware Routing in Transparent Satellite Optical Networks","speaker":"Katsuaki Higashimori","affiliation":"NTT Inc.","authors":"Katsuaki  Higashimori, Shimpei  Shimizu, Akira  Kawai, Takuya  Ohara","start":"14:15","end":"","abstractid":211115,"order":2,"abstract":"Abstract (summary)  We propose a method for efficiently routing lightpaths by adaptively switching their QoT and objective policies in transparent satellite WDM networks under stringent and time-varying transmission conditions. The method demonstrates equivalent network performance while dramatically reducing more than 70% power and 98% computation time.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-322.pdf"},{"role":"speaker","rolename":"Invited","code":"#387 / Mo3-E3","title":"Intelligent Empowerment of Optical-Computation Synergy: Signal Processing and Resource Management for Multi-Band Optical Networks","speaker":"Rentao   Gu","affiliation":"Beijing University of Posts and Telecommunications","authors":"Rentao  Gu, Jiaxin  Liu, Feng  Mei, Xiaoxuan  Gao, Yunxuan  Li, Xinyue  Li, Yuefeng  Ji","start":"14:30","end":"","abstractid":211234,"order":3,"abstract":"Abstract (summary)  This paper presents an AI-driven control architecture for optical-computation synergy in AI data center interconnection. Multi-band optical networks provide interconnect support, while AI enhances signal processing and resource management, further strengthening support for computing. We review recent advances and outline future integrated multi-agent control.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC2026-Rentao GuInvited.pdf"},{"role":"speaker","rolename":"Contributed","code":"#818 / Mo3-E4","title":"Experimental Data-driven Forward and Inverse SOA WDM Gain and SNR Modelling using Gaussian Process Regression","speaker":"Alan Yuan","affiliation":"University of Cambridge","authors":"Alan  Yuan, Calum  Harvey, Xiaoyan  Ye, Seb  Savory","start":"15:00","end":"","abstractid":212001,"order":4,"abstract":"Abstract (summary)  We experimentally demonstrate data-driven Gaussian process regression for SOA modelling in a worst-case WDM system, with 0.1dB gain and 0.23dB SNR mean absolute error. Inverse modelling is demonstrated for estimating the required SOA injection current, temperature, and input channel powers to achieve channel-specific SNR targets.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-818.pdf"}]},{"sessionid":"5538375","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"14:00-15:30","room":"C2.1 Conference room 2.1","type":"Invited and contributed","typeColor":"#e4dfec","category":"SC 04: Signal processing for optical communication and sensing","title":"Mo3-F DSP for high spectral efficiency and SDM","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Sjoerd Van Der Heide","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#81 / Mo3-F1","title":"Turbo Equalization with Duobinary Precoding for High-speed Bandwidth-limited IM/DD Transmission Systems","speaker":"Tianyuan Kong","affiliation":"Huawei Technologies Duesseldorf GmbH, Munich Research Center","authors":"Tianyuan  Kong, Nebojsa  Stojanovic, Tom  Wettlin, Emna  Ben Yacoub, Balazs  Matuz, Xianbo  Dai, Marvin  Xhemrishi, Stefano  Calabrò, Maxim  Kuschnerov, Stephan  Pachnicke","start":"14:00","end":"","abstractid":210429,"order":1,"abstract":"Abstract (summary)  We propose turbo equalization with duobinary-BCJR detection to mitigate error floors and boost performance of weak inner codes in bandwidth-limited channels. Simulations and experiments demonstrate significant SNR gains and error floor elimination using duobinary precoding. Analytical limits confirm advantages for high-speed optical links.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-81.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Andrea Carnio","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#638 / Mo3-F2","title":"Reduced-Complexity Partial MIMO Equalization for Real-Time GPU-based 10-Mode Transmission over 26 km GI-FMF","speaker":"Ruby Stella Bravo Ospina","affiliation":"Nokia Bell Labs","authors":"Ruby Stella  Bravo Ospina, David  Winter, Roland  Ryf, Nicolas  Fontaine, Lauren  Dallachiesa, Pierre  Sillard, Marianne  Bigot, Frank  Achten, David  Neilson, Mikael  Mazur","start":"14:15","end":"","abstractid":211791,"order":2,"abstract":"Abstract (summary)  We investigate partial MIMO equalization in real-time 10-mode transmission over 26 km of FMF and demonstrate that the technique successfully tracks channel dynamics over time, enabling flexible performance-complexity reduction trade-offs in MG-selective FMF transmission.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-638.pdf"},{"role":"speaker","rolename":"Contributed","code":"#631 / Mo3-F3","title":"Non-Data-Aided SDM MIMO Equalization for Randomly-Coupled Multi-Core Fibers with a Tap-Correlation Avoidance CMA","speaker":"Pamir Oezsuna","affiliation":"Fraunhofer HHI","authors":"Pamir  Oezsuna, Aymeric  Arnould, Ronald  Freund, Georg  Rademacher","start":"14:30","end":"","abstractid":211784,"order":3,"abstract":"Abstract (summary)  We propose the tap-correlation avoidance (TCA-)CMA, a low-complexity, non-data-aided MIMO equalizer for RC-MCFs, preventing singularities by penalizing tap-weight correlations. Simulations using 32 GBd 16-QAM signals show singularity-free convergence up to 600 ps total delay spread for 3-, 4-core fibers and 300 ps for 7-core fiber.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-631.pdf"},{"role":"speaker","rolename":"Contributed","code":"#983 / Mo3-F4","title":"Simple Direct Estimation of Link SMD and MDL for MIMO-DSP Design in Ultra-Wideband Coupled-Core Fiber Transmission","speaker":"Akira Kawai","affiliation":"NTT, Inc.","authors":"Akira  Kawai, Kohki  Shibahara, Ryota  Imada, Taiji  Sakamoto, Kazuhide  Nakajima, Takayuki  Kobayashi, Yutaka  Miyamoto","start":"14:45","end":"","abstractid":212179,"order":4,"abstract":"Abstract (summary)  We propose a simple optical setup for estimating SMD and MDL in coupled-core fibers over a 150-nm bandwidth without full MIMO-DSP characterization. The method is validated by measurements on 4- and 12-core fibers and by C+L-band WDM MIMO transmission over a field-installed 12-core link.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-983.pdf"},{"role":"speaker","rolename":"Invited","code":"#50 / Mo3-F5","title":"Advances in High-Spectral-Efficiency Formats: Modulation and Coding","speaker":"Hussam George Batshon","affiliation":"Nokia Bell Labs","authors":"Hussam  Batshon, Gregory  Raybon, Di  Che, Xi  Chen","start":"15:00","end":"","abstractid":209861,"order":5,"abstract":"Abstract (summary)  Probabilistic amplitude shaping, increasingly adopted in coherent systems, relies on bit-metric decoding that introduces residual demapping loss. This paper shows that single parity-check coded probabilistic shaping reduces this loss via iterative demapping, achieving up to 0.9 dB SNR gain experimentally confirmed in long-haul WDM transmission.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC2026v3 - Hussam Batshon - Invited.pdf"}]},{"sessionid":"5538377","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"14:00-15:30","room":"C2.2 Conference room 2.2","type":"Invited and contributed","typeColor":"#d0e0e3","category":"SC 05: Optical transmission systems","title":"Mo3-G Submarine and unrepeatered systems","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"René-Jean Essiambre","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#0 /","title":"Mo3-G1 Technologies and challenges for beyond petabit submarine cable","speaker":"Pascal Pecci","affiliation":"","authors":"","start":"14:00","end":"14:30","abstractid":null,"order":1},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Adolfo Cartaxo","affiliation":"Instituto de Telecomunicações","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#167 / Mo3-G2","title":"Algorithmically-Optimized Real-Time 18 Tb/s Throughput over a 16,608 km Trans-Pacific Subsea Link","speaker":"Marc Stephens","affiliation":"Ciena Corp","authors":"Marc  Stephens, Zach  Dunnigan, Colin  Meaklim, Michael  Hubbard, Franco  Santillo, Darwin  Evans, David  Karam, Periyathambi  Kalaiyarasan, Thayso  Guimaraes, Priyanth  Mehta, Esther  Hooi, Elizabeth  Rivera-Hartling, Philippe  Perrier","start":"14:30","end":"","abstractid":210785,"order":2,"abstract":"Abstract (summary)  We report 18 Tb/s throughput across a 16,608 km trans-Pacific subsea link using an algorithmically-optimized channel plan, for a record 298.9 Pb/s·km. Bidirectional SNR margins were 0.18–0.75 dB for all 28 channels. Additionally, an 800 Gb/s (173 GBd) signal reached 4.57 bits/s/Hz spectral efficiency","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-167.pdf"},{"role":"speaker","rolename":"Contributed","code":"#594 / Mo3-G4","title":"Few-Mode Fibre for Noise Transfer Mitigation in Co-Raman Amplified Unrepeatered Transmission","speaker":"Alexis Busson","affiliation":"Alcatel Submarine Networks","authors":"Alexis  Busson, Marion  Quenu, Julien  Courty, Bastien  Renot, Hans  Bissessur","start":"14:45","end":"","abstractid":211732,"order":3,"abstract":"Abstract (summary)  We present a real-time Unrepeatered experiment using a short section of Few-Mode Fibre at the transmitter side to mitigate non-linear degradation due to Co-Raman amplification. We demonstrate an improvement up to 0.4 dB of Q factor margin compared to classical fibre with large effective area.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-594.pdf"},{"role":"speaker","rolename":"Contributed","code":"#507 / Mo3-G5","title":"Impact of RIN Transfer and Pump-Induced XPM on Coherent Transmission with Forward-Pumped-Raman Amplification","speaker":"Kosuke Kimura","affiliation":"NTT Inc.","authors":"Kosuke  Kimura, Shimpei  Shimizu, Masanori  Nakamura, Fukutaro  Hamaoka, Takayuki  Kobayashi, Yutaka  Miyamoto","start":"15:00","end":"","abstractid":211561,"order":4,"abstract":"Abstract (summary)  We propose a numerical framework for estimating the impact of pump-to-signal RIN transfer and pump-induced XPM on QoT under forward-Raman pumping. Numerical estimates show reasonable agreement with experiments in single-channel and WDM configurations. The results indicate that pump-induced XPM is more significant than RIN transfer","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-507.pdf"},{"role":"speaker","rolename":"Contributed","code":"#309 / Mo3-G6","title":"Real-time 52.8 Tb/s (26.4Tb/s/core) Unrepeatered Transmission over 303.4km of Uncoupled 2-core MCF","speaker":"BENYUAN  ZHU","affiliation":"Lightera Labs","authors":"BENYUAN  Zhu, Matthias  Stegmaier, Tommy  Geisler, Peter  Borel, Bera  Palsdottir, Philippe  Jenneve, Hongbin  Zhang","start":"15:15","end":"","abstractid":211095,"order":5,"abstract":"Abstract (summary)  We demonstrate real-time unrepeatered transmission of 52.8 Tb/s over 303.4 km uncoupled 2-core MCF using commercial pluggable modules and ultra-low loss SCUBA2X fibre (0.147 dB/km). We achieve 26.4 Tb/s per core (33×800Gb/s/core) and show no measurable inter-core crosstalk penalty in both unidirectional and bidirectional operations.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-309.pdf"}]},{"sessionid":"5538379","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"14:00-15:30","room":"E2 Exhibition room 2","type":"Invited and contributed","typeColor":"#FFCCFF","category":"SC 12: CLEO® Special Session on Emerging Trends in Optics and Photonics","title":"Mo3-H New approaches for linear and nonlinear functionalities","description":"","goal":"","papers":[{"role":"speaker","rolename":"Contributed","code":"#1159 / Mo3-H1","title":"Frequency Comb Generation in Single-Mode Silicon Microresonators at 1550 nm in Normal Dispersion Regime","speaker":"Abdou Shetewy","affiliation":"TU Dresden","authors":"Abdou  Shetewy, Weizhong  Zhang, Menglong  He, Ryan  Hamerly, Kambiz  Jamshidi","start":"14:00","end":"","abstractid":212364,"order":1,"abstract":"Abstract (summary)  We demonstrate frequency comb generation in a single-mode silicon microring resonator under normal dispersion at 1550 nm. Using a dual-pump configuration (2.5 mW and 27 µW) and an 11 V bias, seven comb lines spanning 3.74 THz are observed, indicating stable and coherent oscillation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1159.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Jens Schmid Schmid","affiliation":"National Research Council Canada","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Laurent Vivien","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#736 / Mo3-H2","title":"Large-aperture Optical Antenna with Vertical Emission in Silicon-on-Insulator","speaker":"Elio Godoy Lorite","affiliation":"University  of Malaga","authors":"Elio  Godoy Lorite, Laureano  Moreno Pozas, Robert  Halir, J. Gonzalo  Wangüemert Pérez, Alejandro  Ortega Moñux, Iñigo  Molina Fernández","start":"14:15","end":"","abstractid":211908,"order":2,"abstract":"Abstract (summary)  Vertically emitting optical antennas with large mode-fields diameters are key for free space optics and atomic spectroscopy, but have not been yet reported in silicon-on-insulator. We present a novel vertically radiating antenna with a mode-field diameter of 200µm by 320µm with measured 48% efficiency.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-736.pdf"},{"role":"speaker","rolename":"Invited","code":"#1485 / Mo3-H3","title":"Sputtered AlN buffer layer for low loss crystalline AlN on sapphire integrated photonics","speaker":"Camille-Sophie Brès","affiliation":"","authors":"Camille-Sophie  Brès, Samuele  Brunetta, Samantha  Sbarra, Jean-François  Carlin, Nicolas  Grandjean, Raphaël  Butté","start":"14:30","end":"","abstractid":217323,"order":3,"abstract":"Abstract (summary)  To fully exploit the broad transparency window of crystalline AlN through nonlinear optics, both dispersion engineering and low optical losses are required. We present thick regrown AlN waveguides enabling three-octave supercontinuum generation and show how a sputtered AlN buffer suppresses void-induced scattering, establishing a pathway toward low-loss visible-to-mid-infrared integrated photonics. ©2026 The Author(s)","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Bres_Invited_Final.pdf"},{"role":"speaker","rolename":"Invited","code":"#1423 / Mo3-H4","title":"Harnessing Nonlinear and Optomechanical Phenomena in Silicon Nanostructures","speaker":"Carlos Alonso Ramos","affiliation":"C2N, CNRS","authors":"Carlos  Alonso Ramos","start":"15:00","end":"","abstractid":213547,"order":4,"abstract":"Abstract (summary)  Subwavelength silicon nanostructures enable precise control of light and optomechanical interactions in integrated devices. We review our recent advances in mid-infrared silicon photonics and the optimization of Brillouin interactions in non-suspended optomechanical cavities. ©2026 The Author(s)","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Ramos.pdf"}]},{"sessionid":"5538381","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"14:00-15:30","room":"PV-R Multipurpose room","type":"Symposia","typeColor":"","category":"","title":"Mo3-I Winning interconnects for AI: scale-up & scale-out technology paths","description":"AI/ML growth is driving a surge in interconnect bandwidth as models and datasets scale and workloads become increasingly token-centric—reshaping system design. Modern systems have converged on a two-tier hierarchy: scale-up fabrics that tightly couple XPU, memory, and switching into a coherent “virtual XPU,” and scale-out networks that connect many scale-up fabrics across the data centre.\t14:00 - 15:30:\tOrganisers: Daniel Kuchta (Nvidia), Lidia Galdino (Corning), Connie Chang-Hasnain (Berxel), Julie Raulin (Adtran), Paul Gunning (British Telecom)\tRyan Yu, TeraHop - \"Open Optical Solutions for AI Scale Up\"\tPeter Ossieur, IMEC - \"Closing the final centimeter: < 1pJ/bit connectivity through heterogeneously integrated Silicon Photonics and advanced 3D assembly techniques\"\tPeter O'Brien, Tyndall National Institute - \"Co-Packaging on Glass Substrates: Design, Materials, Processes, Equipment, and Scaling\"\tSylvie Menezo, Scintil - \"Single-chip DWDM external DFB laser source with integrated wavelength monitoring and locking for scalable interconnects\"\tChris Wu, Corning - \"Fiber Bundle Connector Solutions for VCSEL-Based Optical Scale-Up Interconnects\"\tWilliam Fegadolli, Nokia - \"Optics and host co-optimization towards the AI Supercycle\"","goal":"","papers":[{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Daniel Michael Kuchta","affiliation":"Nvidia Corp.","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Lidia Galdino","affiliation":"Corning,UK","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Constance Jui-Hua Chang-Hasnain","affiliation":"Berxel Photonics, USA","authors":"","start":"","end":"","abstractid":null,"order":3},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Julie Raulin","affiliation":"Adtran, Germany","authors":"","start":"","end":"","abstractid":null,"order":4},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Paul Gunning","affiliation":"BT Group, UK","authors":"","start":"","end":"","abstractid":null,"order":5}]},{"sessionid":"5538713","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"15:30-16:00","room":"","type":"Coffee break","typeColor":"black","category":"","title":"Afternoon coffee break","description":"","goal":"","papers":[]},{"sessionid":"5538365","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"15:30-16:45","room":"PV-P Multipurpose Poster area","type":"Poster","typeColor":"","category":"","title":"Mo4-P Poster","description":"","goal":"","papers":[{"role":"speaker","rolename":"Poster","code":"#43 / Mo4-P-1","title":"Simultaneous Rotational Alignment of Multi-Core Fiber Ribbons for Scalable Interconnection","speaker":"Katsuyoshi Sakaime","affiliation":"National Institute of Information and Communications Technology (NICT)","authors":"Katsuyoshi  Sakaime, Ryo  Nagase, Hideaki  Furukawa","start":"","end":"","abstractid":209765,"order":1,"abstract":"Abstract (summary)  We propose a simultaneous rotational alignment method for multi-core fibre ribbons, enabling scalable interconnection with reduced assembly time. Multiple fibres are aligned and selectively fixed during collective rotation using a dedicated jig. We experimentally demonstrate an average rotational misalignment of 0.83°.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-43.pdf"},{"role":"speaker","rolename":"Poster","code":"#166 / Mo4-P-2","title":"Two-Pump Distributed Parametric Amplification of 25x 32Gbaud 16-QAM Channels over 25 km SSMF with ~20dB Gain","speaker":"Munira B. Mostafa","affiliation":"","authors":"Munira B.  Mostafa, Shekhar  Saxena, Mariia  Bastamova, Daniel J.  Elson, Mikhailov  Vitaly, Robert  Emmerich, Ruben S.  Luis, Jiawei  luo, Hideaki  Furukawa, Colja  Schubert, Ronald  Freund, David J.  Digiovanni, Yuta  Wakayama, Ian  Phillips, Aleksandr  Donodin, Andrew D.  Ellis, Vladimir  Gordienko","start":"","end":"","abstractid":210776,"order":2,"abstract":"Abstract (summary)  We demonstrate distributed fiber optic parametric amplification of 25x 16-QAM 32Gbaud channels over 25 km of G.652.D in the O-band with GMI-estimated throughput of 3.148Tbps and on/off gain of ~20dB by employing two ~125mW pumps.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-166.pdf"},{"role":"speaker","rolename":"Poster","code":"#176 / Mo4-P-3","title":"Generation and Modulation of Second-order Nonlinearity in the Microfibre","speaker":"Yuxin Ma","affiliation":"Northwestern Polytechnical University","authors":"Yuxin  Ma, Biqiang  Jiang","start":"","end":"","abstractid":210805,"order":3,"abstract":"Abstract (summary)  We demonstrate optical fibre schemes assisted with low-dimensional materials to implement second-order nonlinear processes. The functionalized fibre devices have achieved tunable and broadband second harmonic and sum-frequency generation under low peak-power CW lasers, facilitating applications in nonlinear fibre optics.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-176.pdf"},{"role":"speaker","rolename":"Poster","code":"#272 / Mo4-P-4","title":"Enhanced Radiation Hardness of High-Hydroxyl Fluorine-Doped Silica Optical Fibers","speaker":"Youngwoong Kim","affiliation":"Korea Atomic Energy Research Insititute","authors":"Youngwoong  Kim, Jongyeol  Kim, Gukbeen  Ryu, Wookjin  Jeong, Younggwan  Hwang, Dae Seung  Moon, Chang Hyun  Jung","start":"","end":"","abstractid":211010,"order":4,"abstract":"Abstract (summary)  We developed high-hydroxyl (OH) fluorine-doped silica optical fibers and evaluated their radiation response at 1550 nm under γ-ray irradiation. The developed fiber exhibits significantly reduced radiation-induced attenuation and improved saturation behavior compared with conventional radiation-hardened fibers, demonstrating synergistic benefits of combined fluorine and OH incorporation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-272.pdf"},{"role":"speaker","rolename":"Poster","code":"#304 / Mo4-P-5","title":"Virtual Draw of Arbitrary Geometry Hollow Core Fibres, a 3D Finite Element Approach","speaker":"Mohammadreza Najafigamasaei","affiliation":"","authors":"Mohammadreza  Najafigamasaei, Ali  Shakiba, Ron  Fatobene Ando, Francesco  Poletti, Gregory  T. Jasion","start":"","end":"","abstractid":211067,"order":5,"abstract":"Abstract (summary)  A novel 3D finite-element Computational Fluid Design tool is developed to study the fabrication of anti-resonant hollow-core fibres from preforms with arbitrary geometries. To showcase its unique capabilities, we study the draw of elliptical tubes and of hollow-core fibres with elliptical capillaries.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-304.pdf"},{"role":"speaker","rolename":"Poster","code":"#306 / Mo4-P-6","title":"Discrete-Raman-Amplification in the U+X-Band (1610-1690nm) Utilizing Twin EDFA ASE Peaks (1535nm and 1565nm) for Forward Pumping with Reduced Noise Generation","speaker":"Youichi Akasaka","affiliation":"1Finity Americas Inc.","authors":"Youichi  Akasaka, Inwoong  Kim, Paparao  Palacharla","start":"","end":"","abstractid":211073,"order":6,"abstract":"Abstract (summary)  U+X band discrete Raman amplification covering 1610nm to 1690nm is demonstrated using twin peaks of C-band EDFA ASE at 1535nm and 1565nm, made by 4m EDF and 13m EDF, respectively. Forward pumping with incoherent ASE achieved a 1dB Lower noise compared to backward pumping.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-306.pdf"},{"role":"speaker","rolename":"Poster","code":"#355 / Mo4-P-7","title":"Refractive-index profile dependence of an LPFG-based mode scrambler for broadband and low-loss MDL compensation","speaker":"Taro Iwaya","affiliation":"NTT, Inc.","authors":"Taro  Iwaya, Masaki  Wada, Taiji  Sakamoto, Takashi  Matsui, Takanori  Sato, Kunimasa  Saitoh, Kazuhide  Nakajima","start":"","end":"","abstractid":211161,"order":7,"abstract":"Abstract (summary)  A dual-step-index (DSI) core reduces the insertion loss increase associated with mode-coupling efficiency for LPFG-type 2-LP mode scramblers. An LPFG-based mode-scrambler utilizing DSI-core fibre was numerically and experimentally demonstrated, achieving < 0.5 dB insertion loss and broadband mode-dependent-loss compensation over the C+L band.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-355.pdf"},{"role":"speaker","rolename":"Poster","code":"#361 / Mo4-P-8","title":"High-Density Cable Employing 160 μm Reduced-Cladding 4-Core Multi-Core Fibre for Data Centre Applications","speaker":"Hiroki Takehana","affiliation":"Fujikura","authors":"Hiroki  Takehana, Ryota  Kaji, Shota  Kajikawa, Katsuhiro  Takenaga, Takuya  Oda, Noriaki  Yamashita, Hironori  Sato, Yusuke  Tsujimoto, Kentaro  Ichii","start":"","end":"","abstractid":211177,"order":8,"abstract":"Abstract (summary)  A high-density 288-fibre cable was fabricated employing reduced-cladding 100/160 μm, 4-core, multi-core fibres (MCFs) for intra-/inter-data centre links (lengths <10 km). The cable suppressed the microbending loss and maintained practical crosstalk and temperature stability levels, demonstrating the feasibility of reduced-cladding MCF cabling for practical deployment.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-361.pdf"},{"role":"speaker","rolename":"Poster","code":"#505 / Mo4-P-9","title":"Core-Pitch Conversion Technique for Randomly Coupled Multi-Core Fibre Links by Cladding Mode Coupling","speaker":"Kazuhiro Kikuchi","affiliation":"NTT, Inc. Access Network Service Systems Labpratories","authors":"Kazuhiro  Kikuchi, Ryota  Imada, Taiji  Sakamoto, Takashi  Matsui, Kazuhide  Nakajima","start":"","end":"","abstractid":211559,"order":9,"abstract":"Abstract (summary)  We propose a core-pitch conversion technique using only a simple spliced-taper structure of randomly coupled multi-core fibres (RC-MCF). We demonstrate up to 20-µm core-pitch conversion with loss below 0.9 dB and low mode-dependent loss, which can connect RC-MCF transmission line and smaller-core-pitch amplifier.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-505.pdf"},{"role":"speaker","rolename":"Poster","code":"#670 / Mo4-P-10","title":"Novel Photonic Lantern with Higher Order Radial Mode Suppression","speaker":"SERGIO LEON SAVAL","affiliation":"","authors":"Jin  Wei, Sergio  Leon Saval","start":"15:30","end":"","abstractid":211836,"order":10,"abstract":"Abstract (summary)  We present the design and fabrication of a novel 6-core photonic lantern to suppress the LP02 mode, by omitting its central core. The device was characterised by off-axis digital holography achieving  an average 27.41 dB suppression (versus 32 dB simulated) with -0.19 dB throughput loss.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-670.pdf"},{"role":"speaker","rolename":"Poster","code":"#769 / Mo4-P-11","title":"Machine Learning in Hollow Core Fiber Design","speaker":"Leslie A. Rusch","affiliation":"","authors":"Rania Antar Eltaieb  Abouelela, Sophie  Larochelle, Leslie A.  Rusch","start":"","end":"","abstractid":211947,"order":11,"abstract":"Abstract (summary)  We generate numerous high-performance designs using neural networks predicting confinement loss in nested anti-resonant nodeless fibers. These designs provide meaningful statistics to identify a high-fidelity figure of merit, aiding future complex designs with multiple metrics.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-769.pdf"},{"role":"speaker","rolename":"Poster","code":"#54 / Mo4-P-12","title":"Monolithically Integrated 2 × 226 Gbps Dual-Wavelength EML with a Passive MZI-based Optical Multiplexer","speaker":"Kenichi Terao","affiliation":"Mitsubishi Electric","authors":"Kenichi  Terao, Toshiya  Tsuji, Takaya  Morikawa, Satoshi  Nishikawa, Yoshimichi  Morita, Akihito  Ono, Tadashi  Takase","start":"","end":"","abstractid":209888,"order":12,"abstract":"Abstract (summary)  We developed dual-wavelength integrated EMLs with a passive Mach‑Zehnder optical multiplexer requiring no phase‑tuning electrodes. The emission wavelengths are spaced for CWDM, and each supports 226 Gbps operation (113‑Gbaud PAM4). Measured insertion losses were 1.8 dB at 1311 nm and 4.3 dB at 1331 nm.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-54.pdf"},{"role":"speaker","rolename":"Poster","code":"#64 / Mo4-P-13","title":"Demonstration of Higher-Order Tensor Contraction via Optical Nonlinear Wave Mixing","speaker":"Wing Ko","affiliation":"University of Southern California","authors":"Wing  Ko, Abdulrahman  Alhaddad, Muralekrishnan  Ramakrishnan, Yichen  Li, Yixuan  Zhang, Yue  Zuo, Zile  Jiang, Huibin  Zhou, Moshe  Tur, Jonathan  Habif, Alan  Willner","start":"","end":"","abstractid":209977,"order":13,"abstract":"Abstract (summary)  We demonstrate direct optical higher-order tensor contraction using nonlinear wave mixing in a periodically poled lithium niobate waveguide. The system performs the contraction of three order-3 tensors over three pairs of indices at 5 GHz with ~4-bit precision.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-64.pdf"},{"role":"speaker","rolename":"Poster","code":"#93 / Mo4-P-14","title":"E-band InP-on-Si Tunable Laser via Micro-Transfer Printing","speaker":"Dongbo Wang","affiliation":"Ghent University","authors":"Dongbo  Wang, Emadreza  Soltanian, Senbiao  Qin, Nicolas  Vaissiere, Delphine  Néel, Joan  Ramirez, Jean  Decobert, Bart  Kuyken, Jing  Zhang, Gunther  Roelkens","start":"","end":"","abstractid":210533,"order":14,"abstract":"Abstract (summary)  We demonstrate a widely tunable E-band InP-on-Si laser heterogeneously integrated using micro-transfer printing. The laser achieves a tuning range of 41 nm (1398–1439 nm), with a side-mode suppression ratio above 45 dB and 3 mW output power in the silicon waveguide.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-93.pdf"},{"role":"speaker","rolename":"Poster","code":"#115 / Mo4-P-15","title":"O-band InP Mach-Zehnder Modulator for 400 Gb/s per Lane in a Generic Pure-Play Foundry","speaker":"David Barcons","affiliation":"SMART Photonics B.V.","authors":"David  Barcons Ruiz, Alireza  Shamsafar, Alfredo  Mameli, Luc  Augustin","start":"","end":"","abstractid":210627,"order":15,"abstract":"Abstract (summary)  To address increasing datacenter requirements of 400 Gb/s per lane we present an InP Mach-Zehnder modulator with measured electro-optic bandwidth above 67 GHz and Vπ of 2.6-3.4 V for an interaction length of just 0.8 mm. Our physics-based model predicts operation beyond 110 GHz.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-115.pdf"},{"role":"speaker","rolename":"Poster","code":"#129 / Mo4-P-16","title":"Low-Loss Subwavelength Grating-Based Waveguide Crossings in Silicon Nitride at 1550 nm","speaker":"Polyxeni Kolka","affiliation":"Optoelectronics Research Centre, University of Southampton","authors":"Polyxeni  Kolka, Martin  Skënderas, Libe  Arzubiaga Totorika, Ying  Tran, Lifeng  Bao, Elliot  Sandell, Glen  Churchill, Hao  Liu, Kyle  R. H. Bottrill, Frederic  Gardes, James  Gates, Periklis  Petropoulos","start":"","end":"","abstractid":210682,"order":16,"abstract":"Abstract (summary)  We design, fabricate, and characterise subwavelength grating waveguide crossings in SiN for 1550 nm operation. Using cascaded structures, we measure state-of-the-art 0.052 dB/crossing loss with <−47 dB crosstalk. These results enable dense, low-loss routing for telecom PICs, surpassing prior SiN crossings.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-129.pdf"},{"role":"speaker","rolename":"Poster","code":"#300 / Mo4-P-17","title":"Single-Drive Flat-Top Near-Visible Electro-Optic Frequency Comb Generation in Lithium Tantalate","speaker":"Fei Huang","affiliation":"Zhejiang University","authors":"Fei  Huang, Haoran  Li, Xinyan  Fu, Jingyan  Guo, Yuanchen  Chen, Hongzhi  Xiong, Zejie  Yu, Daoxin  Dai","start":"","end":"","abstractid":211058,"order":17,"abstract":"Abstract (summary)  We demonstrate a single-drive flat-top electro-optic comb generator at 798 nm in thin-film lithium tantalate. The device generates 49 comb lines, with a 5 dB bandwidth comprising 25 lines at an 18 GHz microwave drive.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-300.pdf"},{"role":"speaker","rolename":"Poster","code":"#329 / Mo4-P-18","title":"Hybrid Integrated Tunable Laser with SiN Ring Resonators for Wide Wavelength Tuning and Locking","speaker":"Jong-Hoi KIim","affiliation":"Electronics and Telecommunications Research Institute (ETRI)","authors":"Jong-Hoi  Kim, Jang-Uk  Shin, Sang-Ho  Park, Young-Tak  han, Dong-Hoon  Lee, Dongchoon  lee, Sangjun  Cha","start":"","end":"","abstractid":211122,"order":18,"abstract":"Abstract (summary)  We demonstrate a hybrid integrated tunable external cavity laser utilizing SiN micro-ring resonators for tuning and locking of wavelengths, achieving a tuning range of 82 nm, an output power exceeding 16 dBm, and a SMSR over 56 dB.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-329.pdf"},{"role":"speaker","rolename":"Poster","code":"#333 / Mo4-P-19","title":"A 500 Gbps Ultra-Compact Silicon Photonic Mach-Zehnder Modulator with >110 GHz Bandwidth","speaker":"Qian Liu","affiliation":"University of Chinese Academy of Sciences","authors":"Qian  Liu, Liqun  Wei, Chao  Cheng, Shenlei  Bao, Wenfu  Zhang, Binhao  Wang","start":"","end":"","abstractid":211127,"order":19,"abstract":"Abstract (summary)  We demonstrate a 500 Gbps silicon modulator with a length of 300 µm, integrating chirped phase-shifted grating and electro-optic frequency-domain equalization. The device achieves a tuning efficiency of 66 pm/V and an electro-optic bandwidth exceeding 110 GHz.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-333.pdf"},{"role":"speaker","rolename":"Poster","code":"#348 / Mo4-P-20","title":"Silicon Photonics Mode-Selective 3-dB Power Splitters","speaker":"Sora Izumisawa","affiliation":"Graduate School of Information Science and Technology, Hokkaido University","authors":"Sora  Izumisawa, Takanori  Sato, Kunimasa  Saitoh","start":"","end":"","abstractid":211149,"order":20,"abstract":"Abstract (summary)  Silicon mode-selective 3-dB power splitters based on multimode interference are experimentally demonstrated. They selectively split the TE0 or TE1 mode, allowing the other to pass. Furthermore, AI-based layout correction improves the power imbalance by up to 2.63 dB.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-348.pdf"},{"role":"speaker","rolename":"Poster","code":"#420 / Mo4-P-21","title":"High-bandwidth and High-efficiency MOS Mach-Zehnder Modulator based on InGaAsP Membrane/Si Waveguide with Capacitively-loaded Travelling-wave Electrodes","speaker":"Naotaka Kasuya","affiliation":"Sumitomo Electric Industries, Ltd.","authors":"Naotaka  Kasuya, Kento  Komatsu, Hajime  Tanaka, Naoko  Inoue, Takehiko  Kikuchi, Takuya  Mitarai, Shun  Kimura, Naoki  Fujiwara, Nobuhiko  Nishiyama, Mitsuru  Takenaka, Hideki  Yagi","start":"","end":"","abstractid":211317,"order":21,"abstract":"Abstract (summary)  We demonstrate InGaAsP/Si MOS Mach–Zehnder (MZ) modulators with capacitively-loaded travelling-wave electrodes. With a reduced RC constant, VpL-bandwidth trade-off is significantly improved, achieving bandwidth exceeding 60 GHz with VpL ~ 0.5 Vcm, representing the highest reported bandwidth for MOS MZ modulators on Si photonics platforms.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-420.pdf"},{"role":"speaker","rolename":"Poster","code":"#424 / Mo4-P-22","title":"80 GHz C+L Band Germanium Photodetector via Microheater","speaker":"Bingyan Zhang","affiliation":"Harbin Institute of Technology (Shenzhen)","authors":"Bingyan  Zhang, Yuxiang  Yin, Yihang  Li, Yi  Wang, Yeyu  Tong, Jiangbing  Du, Ke  Xu","start":"","end":"","abstractid":211332,"order":22,"abstract":"Abstract (summary)  A germanium photodetector integrated with microheater is demonstrated for operation in C+L band. The detector has a measured dark current of 30 nA and responsivity of 0.76 A/W at 1625 nm. The bandwidth is 80 GHz supporting 96 Gbps NRZ signalling at 1600 nm.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-424.pdf"},{"role":"speaker","rolename":"Poster","code":"#426 / Mo4-P-23","title":"Broadband Vernier-Programmable Thin-Film Lithium Niobate Triple-Ring Electro-Optic Modulator for High-Speed Optical Interconnects","speaker":"Tiancheng Yu","affiliation":"","authors":"Tiancheng  Yu, Ao  Yan, Jie  Yang, Jin Feng  Leong, Chenxuan  Zeng, Tianyi  Wang, Shi  Zhao, Jieming  Pan, Sonu  Hooda, Evgeny  Zamburg, Aaron  Thean","start":"","end":"","abstractid":211350,"order":23,"abstract":"Abstract (summary)  We demonstrate a broadband Vernier-programmable triple-ring lithium niobate electro-optic modulator that overcomes single-ring high-frequency efficiency roll-off through supermode coupling. DC bias enables 19.4-GHz tuning of the peak RF operating frequency. The extracted response indicates a sideband-to-carrier ratio from -1.4 to -2.7 dB over this range.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-426.pdf"},{"role":"speaker","rolename":"Poster","code":"#431 / Mo4-P-24","title":"A 112 Gbps and Direct-drive Silicon Microdisk Modulator","speaker":"Jian Li","affiliation":"","authors":"Jian  Li, Yunhao  Zhang, Bowen  Zhang, Yihang  Li, Haowen  Shu, Ke  Li, Lei  Wang, Yi  Wang, Yan  Cai, Ke  Xu","start":"","end":"","abstractid":211364,"order":24,"abstract":"Abstract (summary)  We present a silicon microdisk modulator with 30 GHz electro-optic bandwidth and 0.57 V·cm modulation efficiency. For the first time, the silicon microdisk modulator can be directly driven with 0.8 Vpp swing for 112 Gbps four-level pulse amplitude modulation","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-431.pdf"},{"role":"speaker","rolename":"Poster","code":"#94 / Mo4-P-25","title":"Wafer-scale process-decoupled spectral stabilization in SiN CWDM (de)multiplexer","speaker":"YUNG-JR HUNG","affiliation":"National Sun Yat-sen University","authors":"Chih-Hsien  Chen, Yung-Jr  Hung","start":"","end":"","abstractid":210545,"order":25,"abstract":"Abstract (summary)  We demonstrate wafer-scale process decoupling and spectral stabilization in SiN CWDM photonics using sensitivity-engineered cascaded MZIs. Independent extraction of linewidth and thickness variations enables a Δλ/Δw-compensated design achieving -1.92 ± 0.95 nm wavelength shift with <2 dB insertion loss across a 12-inch wafer.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-94.pdf"},{"role":"speaker","rolename":"Poster","code":"#216 / Mo4-P-26","title":"High-Power Multi-Wavelength Hybrid Integrated Laser Array for Co-Packaged Optics","speaker":"Lei Liu","affiliation":"POET Technologies","authors":"Lei  Liu, Brian  Pile, Simon  Boothroyd, Jing  Yang, Lucas  Soldano, Enrico  Guevarra, Lin  Wang, James  Lee, Jinyu  Mo, Suresh  Venkatesan","start":"","end":"","abstractid":210942,"order":26,"abstract":"Abstract (summary)  A four-channel L-band hybrid laser array is demonstrated using an InP gain-chip array integrated on a CMOS-compatible optical interposer. Single-mode operation with >50 dB SMSR and 400 GHz spacing is achieved without active wavelength tuning. Each channel delivers over 20 dBm at 50 °C.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-216.pdf"},{"role":"speaker","rolename":"Poster","code":"#264 / Mo4-P-27","title":"C+L Band Tunable External Cavity Laser Array Integrated using Photonic Wire Bonding","speaker":"Youssef Saghiran","affiliation":"","authors":"Youssef  Saghiran, Sheherazade  Lamkadmi Azouigui, Nayla  El Dahdah, Antonin  Gallet, You  Wu, Hongbo  Xie, Zhaoming  Li, Matteo  Bregoli, Tarek  Eldahrawy, Romain  Brenot, Gabriel  Charlet","start":"","end":"","abstractid":210997,"order":27,"abstract":"Abstract (summary)  We report on an 8-channel external cavity-based TLS integrated using PWB between a RSOA array and a SiN circuit array. We demonstrate a wide tunability over C+L band, output power>16 dBm, SMSR>60 dB and intrinsic linewidth<10KHz.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-264.pdf"},{"role":"speaker","rolename":"Poster","code":"#335 / Mo4-P-28","title":"Multi-mode Microring Spectrometer without Photodetector","speaker":"Yuchen Yin","affiliation":"Shanghai Jiao Tong University","authors":"Yuchen  Yin, Chaojun  Xu, Jinlong  Xiang, Youlve  Chen, Zhenyu  Zhao, Yaotian  Zhao, Yikai  Su, Xuhan  Guo","start":"","end":"","abstractid":211131,"order":28,"abstract":"Abstract (summary)  We demonstrate a multi-mode microring resonator spectrometer assisted with two-photon absorption, achieving a 40 pm resolution across 50 nm bandwidth and record-high channel‑number‑to‑footprint ratio of 2.8 × 10⁶ mm-2. Without any external photodetector, this fully integrated spectrometer demonstrates excellent capability in on-chip optical sensing applications.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-335.pdf"},{"role":"speaker","rolename":"Poster","code":"#378 / Mo4-P-29","title":"High-Density High-Throughput WDM Optical Transmitter Based on Lithium-niobate-on-insulator Platform","speaker":"Cheng Zeng","affiliation":"Huazhong University of Science and Technology","authors":"Yiqi  Dai, Guanglian  Cheng, Aolong  Sun, Yuqin  Yuan, Hanming  Yuan, Chijun  Li, Yuankang  Huang, Geng  Chen, Siyu  Lu, Chenglin  Shang, Jinsong  Xia, Nan  Chi, Shuang  Zheng, Junwen  Zhang, Cheng  Zeng, Li  Shen","start":"","end":"","abstractid":211216,"order":29,"abstract":"Abstract (summary)  We propose an ultra-compact Bragg microcavity modulator on LNOI platform, with a length of ~100μm, a measured 3-dB electro-optic bandwidth >110GHz and a modulation efficiency of ~6.6pm/V. It supports high-speed transmission of 140Gbit/s OOK and 180Gbit/s PAM4, enabling a 720Gbit/s four-channel transmitter.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-378.pdf"},{"role":"speaker","rolename":"Poster","code":"#416 / Mo4-P-30","title":"A 3.2 Tbps 2.5D Integrated Silicon Photonic Transmitter for Co-packaged Optics","speaker":"Shuxiao  Wang","affiliation":"Shanghai Institute of Microsystem and Information Technology","authors":"Shuxiao  Wang, Dehua  Dai, Huanwen  Zhang, Kai  Zhang, Jingyu  Wei, Han  Lu, Jianmin  Zhang, Dongyu  Zhang, Kelaiti  Xiao, Yan  Cai","start":"","end":"","abstractid":211303,"order":30,"abstract":"Abstract (summary)  We demonstrate a 3.2 Tbps 2.5D integrated silicon photonic transmitter supporting a date transmission of 200 Gbps PAM4 modulation per channel. Full-link operation is experimentally validated, achieving 4.01 pj/bit energy efficiency at a total power consumption of 12.83W, highlighting its potential for co-packaged optics.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-416.pdf"},{"role":"speaker","rolename":"Poster","code":"#423 / Mo4-P-31","title":"O-, E- and S-band Silicon Photonics Wavelength Cross-Connect Switch with Waveguide Bragg Gratings","speaker":"Kazuhiro Ikeda","affiliation":"National Institute of Advanced Industrial Science and Technology","authors":"Kazuhiro  Ikeda, Ryotaro  Konoike, Keijiro  Suzuki","start":"","end":"","abstractid":211328,"order":31,"abstract":"Abstract (summary)  We demonstrate an extended multiband operation over 300 nm using an improved wavelength cross-connect switch circuit in 2x2 and 32-ch scale, fully exploiting the potential available wavelength range of wavelength-selective couplers with waveguide sidewall gratings.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-423.pdf"},{"role":"speaker","rolename":"Poster","code":"#470 / Mo4-P-32","title":"An All-Silicon Coherent Optical Receiver Beyond 100 GBd Using a Traveling-Wave SiGe BiCMOS TIA","speaker":"Jakob Declercq","affiliation":"Ghent University - imec","authors":"Jakob  Declercq, Axl  Bomhals, Jonas  De Busscher, Aboobackkar  Sidhique, Bart  Moeneclaey, Johan  Bauwelinck, Xin  Yin","start":"","end":"","abstractid":211465,"order":32,"abstract":"Abstract (summary)  We demonstrate a coherent optical receiver integrating a silicon-photonic front-end with a 55-nm SiGe BiCMOS traveling-wave TIA. The receiver achieves 44-GHz bandwidth and supports single-polarization QPSK up to 140 GBd and 16-QAM up to 112 GBd.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-470.pdf"},{"role":"speaker","rolename":"Poster","code":"#532 / Mo4-P-33","title":"Integrated Diffractive Slab Photonic Processor for Real-Time RF Spectrum Sensing and Matched Filtering","speaker":"Shen ZIchao","affiliation":"National Key Laboratory of Microwave Imaging Aerospace Information Research Institute Chinese Academy of Sciences Beijing 100190, China","authors":"Zichao  Shen, Wei  Zhou, Weichao  Ma, Wangzhe  Li","start":"","end":"","abstractid":211644,"order":33,"abstract":"Abstract (summary)  We demonstrate a silicon-nitride diffractive slab photonic processor for real-time RF spectrum sensing and matched filtering. A 24-point, 9.12-GHz one-shot processor achieves 380-MHz resolution and 3-ns-scale response, while frequency stitching improves matched-filtering resolution to 47.5~MHz and yields >20-dB sidelobe suppression in pulse compression.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-532.pdf"},{"role":"speaker","rolename":"Poster","code":"#592 / Mo4-P-34","title":"Highly Efficient Broadband Thin-Film Lithium Niobate MZM for 1μm Optical Communications","speaker":"Alessandro Aimone","affiliation":"Nokia Bell Labs","authors":"Alessandro  Aimone, Philipp  Thomas, Takahiro  Suganuma, Xi  Chen, Kwangwoong  Kim, Tam  Huynh, Nicolas  Fontaine","start":"","end":"","abstractid":211730,"order":34,"abstract":"Abstract (summary)  We demonstrate the first compact 1µm TFLN modulator with Vpi = 4.2 V (VpiL = 1.1 V‧cm) and electro-optical bandwidth > 110 GHz. We successfully demonstrate data modulation up to 145 GHz electro-optic bandwidth by upconverting a 20 GBd signal combined with single-ended heterodyne detection.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-592.pdf"},{"role":"speaker","rolename":"Poster","code":"#656 / Mo4-P-35","title":"212.5 Gbps SerDes-Driven Optical Engines Based on SiPh and TFLN Platforms","speaker":"Wei Chu","affiliation":"Shanghai Optoelectronics Science and Technology Innovation Center","authors":"Aoxue  Wang, Yuchen  Yin, Yaotian  Zhao, Erse  Jia, Xiao  Hu, Chaojun  Xu, Yiran  Wei, Bo  Xu, Fangchen  Hu, Jianyang  Shi, Xuhan  Guo, Haiwen  Cai, Wei  Chu","start":"","end":"","abstractid":211822,"order":35,"abstract":"Abstract (summary)  We demonstrate a 212.5 Gbps SerDes-based LRO interconnect to compare SiPh and TFLN engines. We employ EIC-PIC analog peaking to overcome SiPh bandwidth limits. Conversely, while a SerDes direct-drive architecture improves TFLN’s energy efficiency, it restricts signal integrity. This paper highlights these trade-offs.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-656.pdf"},{"role":"speaker","rolename":"Poster","code":"#682 / Mo4-P-36","title":"Agile Wavelength-Switchable Self-Injection-Locked Narrow Linewidth DBR Laser for Coherent Wavelength Routing","speaker":"Fang Wei","affiliation":"Shanghai Optoelectronics Science and Technology Innovation Center","authors":"Xiangyue  Li, Qingshuai  Su, Fang  Wei, Hexi  Han, Chen  Chen, Yi  Yan, Wei  Chu, Haiwen  Cai","start":"","end":"","abstractid":211848,"order":36,"abstract":"Abstract (summary)  We propose a hybrid self-injection-locked DBR laser with a Si3N4 micro-ring external cavity for coherent wavelength routing. Enabled by optical feedback over C-band ITU channels, it achieves 89 ns switching, stable wavelength locking, and a 2.5 kHz linewidth for high-speed optical switching.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-682.pdf"},{"role":"speaker","rolename":"Poster","code":"#694 / Mo4-P-37","title":"A 4-λ × 32-Gb/s Silicon Micro-Ring-Resonator-Based DWDM Receiver with On-Chip Temperature Controller","speaker":"Jae-Ho Lee","affiliation":"Yonsei University","authors":"Jae-Ho  Lee, Seung-Jae  Yang, Yongjin  Ji, Xu  Wang, Dong-Hyeon  Kim, Hyun-Kyu  Kim, Woo-Young  Choi","start":"","end":"","abstractid":211860,"order":37,"abstract":"Abstract (summary)  We demonstrate a 4-λ x 32-Gb/s silicon MRR-based DWDM receiver with an on-chip temperature controller, automatically aligning and locking each MRR resonance wavelength to its target wavelength. Its operation is confirmed by electronic-photonic co-simulation using the Cadence design environment and experimentally verified under thermal stress.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-694.pdf"},{"role":"speaker","rolename":"Poster","code":"#31 / Mo4-P-38","title":"Machine Learning-Assisted Digital Predistortion for Mask Margin Recovery in EML Transmitters","speaker":"Cengizhan Kaya","affiliation":"Technical University of Munich","authors":"Cengizhan  Kaya, Giuseppe  Caruso, Patrick  Schulte, Stefano  Calabrò","start":"","end":"","abstractid":207623,"order":38,"abstract":"Abstract (summary)  We demonstrate that machine learning-assisted digital predistortion effectively recovers eye-mask margin in EML transmitters biased in nonlinear region. Experimental results at 25GBd show a 13% margin improvement over the first order hold interpolation, while filter- and lookup-table-based approximations achieve comparable performance.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-31.pdf"},{"role":"speaker","rolename":"Poster","code":"#41 / Mo4-P-39","title":"A Novel Low-Complexity Clock Recovery for Non-Integer Oversampling Coherent Optical Transmission","speaker":"Yukun Zhang","affiliation":"Chongqing University Of Posts And Telecommunications","authors":"YuKun  Zhang, XiaoXue  Gong, WeiGang  Hou, Lei  Guo","start":"","end":"","abstractid":209749,"order":39,"abstract":"Abstract (summary)  Non-integer oversampling technique has been widely adopted in high-speed coherent optical transmission. We propose a novel low-complexity clock recovery algorithm for recovering the clock of non-integer oversampled signals. Compared to conventional methods, the novel clock recovery algorithm reduces the number of real multiplications by 93%","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-41.pdf"},{"role":"speaker","rolename":"Poster","code":"#46 / Mo4-P-40","title":"Enabling High-Reliability Link Monitoring in In-Vehicle PONs via Correlation OTDR","speaker":"Wu Liu","affiliation":"China Information Communication Technologies Group Corporation","authors":"Zhaojun  Xu, Wu  Liu, Yaoyang  zhang, Ming  luo, Hanbing  Li, Wenjun  Han, Wenyong  Luo","start":"","end":"","abstractid":209773,"order":40,"abstract":"Abstract (summary)  We propose an in-vehicle PON monitoring scheme based on correlation OTDR. By incorporating in-band communication, the scheme achieves centimeter-level spatial resolution while enabling the detection of nanosecond-level outages and sub-0.2 dB power fluctuations.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-46.pdf"},{"role":"speaker","rolename":"Poster","code":"#142 / Mo4-P-41","title":"Real-Time FPGA Implementation and Verification of OSA-Aided SBC-BCH FEC for 100G Coherent Optical Access Network","speaker":"In-Ki Hwang","affiliation":"ETRI","authors":"In-Ki  Hwang, Hun-Sik  Kang, Joon Ki  Lee","start":"","end":"","abstractid":210711,"order":41,"abstract":"Abstract (summary)  We present the first real-time FPGA implementation of an OSA-aided SBC-BCH FEC for 100G coherent optical networks. Featuring a 7.6μs round-trip latency, it achieves a 2.5×10⁻¹⁰ post-FEC BER at 8.6×10⁻³ pre-FEC BER, confirming stable operation with a PTBC-based coherent DSP.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-142.pdf"},{"role":"speaker","rolename":"Poster","code":"#143 / Mo4-P-42","title":"In-Service Transceiver Calibration for Digital Subcarrier Signals with Synthesising IQ Imbalance via Offloaded Multi-layer Filters","speaker":"Masaki Sato","affiliation":"NEC Corporation","authors":"Masaki  Sato, Manabu  Arikawa, Junichiro  Matsui, Kohei  Hosokawa","start":"","end":"","abstractid":210712,"order":42,"abstract":"Abstract (summary)  We proposed Tx/Rx-IQ imbalance calibration for digital-subcarrier signals using synthesised responses from m
