scher, Ronald  Freund","start":"","end":"","abstractid":216313,"order":7,"abstract":"Abstract (summary)  We demonstrate a Digital Twin (DT) data space enabling policy-governed exchange of Internet Engineering Task Force (IETF)-defined DT components across organizations. The demo showcases interoperable and real-time cross-organizational DT workflows using heterogeneous optical network environments.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1466.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1450 / Tu2-Ex8","title":"AI-Enabled Autonomous Service Migration for Proactive SLA Assurance in Optical Access and Transport Networks","speaker":"Hesam Rahimi","affiliation":"Huawei Technologies, Canada","authors":"Hesam  Rahimi, Lluis  Gifre, Ricard  Vilalta, Waleed  Akbar, Raul  Muñoz, Pablo  Armingol, Oscar  González, Juan Pedro  Fernández-Palacios, Henry  Yu, Christopher  Janz, Yi  Lin, Liang  Zhang, Håkon  Lønsethagen","start":"","end":"","abstractid":215811,"order":8,"abstract":"Abstract (summary)  We demonstrate a fully autonomous Network-as-a-Service platform where an AI-assisted orchestrator proactively migrates the services between best-effort and deterministic performance across end-to-end F5G-Advanced access and transport segments to ensure SLA compliance for real-time immersive applications.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1450.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1461 / Tu2-Ex9","title":"Failure Detection and Recovery of IP Virtual Network Slice using P2MP DSCM Pluggable Transceivers for Xhaul Networks Controlled by Multi-layer SDN Control Framework","speaker":"Waleed Akbar","affiliation":"CTTC","authors":"Waleed  Akbar, Margita  Radovic, Marc  Lawson, Pablo  Armingol Robles, Nikos  Psaromanolakis, Apostolos  Prassas, Hussein  Zaid, Carsten  Schmidt-Langhorst, Andrea  Sgambelluri, Nicola  Sambo, Lluis  Gifre, Ricard  Vilalta, Oscar  Gonzalez De Dios, Juan  Pedro Fernandez-Palacios Gimenez, Colja  Schubert, Ronald  Freund, Raul  Munoz","start":"","end":"","abstractid":216294,"order":9,"abstract":"Abstract (summary)  This demonstration showcases autonomous failure detection and recovery for Xhaul IP virtual network slices over P2MP DSCM pluggable, where optical controller detects failure, while the multi-layer SDN framework coordinates the slice migration to backup path.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1461.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1468 / Tu2-Ex10","title":"OpticalClaw: An Interactive Agentic Digital Twin for Optical Communication System Design and Optimization","speaker":"TianChi Zhong","affiliation":"Peking University","authors":"Zhiming  Sun, Tianchi  Zhong, Xiang  Cai, Runzhe  Fan, Hua  Shu, Lingyuan  Li, Sidi  Fu, Xian  Zhou, Fan  Zhang","start":"","end":"","abstractid":216446,"order":10,"abstract":"Abstract (summary)  OpticalClaw is a remote interactive agent for optical-link design. It embeds a high-fidelity waveform-level digital twin, enabling natural-language link construction, simulation, result analysis, and iterative parameter optimization in a closed loop.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1468.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1455 / Tu2-Ex11","title":"Demonstration of a Telemetry-Assisted QoS-Aware Scheduler over SOA-Based Time-Slotted Optical Metro-Access Networks","speaker":"Sadegh Ghasrizadeh","affiliation":"Universitat Politècnica de Catalunya, Barcelona Tech - UPC","authors":"Sadegh  Ghasrizadeh, Henrique  Freire Santana, Nicola  Calabretta, Nelson  Costa, Luis  Velasco","start":"","end":"","abstractid":215916,"order":11,"abstract":"Abstract (summary)  We demonstrate a telemetry-assisted QoS-aware scheduler controlling an SOA-based time-slotted optical metro-access network. Cyclic plans consider real-time telemetry measuring the state of the queues in the access nodes and the priority of 6G traffic flows.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1455.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1449 / Tu2-Ex12","title":"Demonstration of Joint Communication, Sensing & Monitoring with Unified Management on a 4-Core Multi-Core Fiber","speaker":"Tom Jürgensen","affiliation":"Kiel University (CAU)","authors":"Tom  Jürgensen, Abdelrahmane  Moawad, Sasipim  Srivallapanondh, Stefan  Kremling, Johannes  Fischer, Antonio  Napoli, Annika  Dochhan, Stephan  Pachnicke","start":"","end":"","abstractid":215731,"order":12,"abstract":"Abstract (summary)  We experimentally demonstrate a 4-core multi-core fiber SDM system, enabling simultaneous bidirectional coherent transmission, IM/DD transmission, integrated longitudinal power monitoring, distributed acoustic sensing, and unified control-plane operation across communication, monitoring, and sensing functions.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1449.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1438 / Tu2-Ex13","title":"ML-Aided Transponder-Native SOP Sensing for Proactive Restoration in Live Metro Data Center Xchange","speaker":"Renato Ambrosone","affiliation":"Politecnico Di Torino","authors":"Renato  Ambrosone, Miquel  Masanas, Daniil  Kholodov, Gulmina  Malik, Riccardo  Schips, Stefano  Straullu, Matteo  Colantonio, Gloria  Vuagnin, Paolo  Bolletta, Francesco  Aquilino, Antonino  Nespola, Emanuele  Virgillito, Antonio  Napoli, Vittorio  Curri","start":"","end":"","abstractid":215369,"order":13,"abstract":"Abstract (summary)  We demonstrate transponder-native SOP sensing over a live metro DCX spectrum service. Coherent transponder telemetry feeds a Kafka-based ML pipeline that classifies fiber disturbances and triggers real ROADM restoration without external polarimeters.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1438.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1447 / Tu2-Ex14","title":"Autonomous Link Restoration and Capacity Management in Open Optical Networks for Connected Mobility Services","speaker":"Luca Vettori","affiliation":"","authors":"Luca  Vettori, Ricardo  Martínez, Ramon  Casellas, Francisco Javier  Vílchez, Josep Ramon  Casas, Pablo  García-Gómez, Adrià  Subirana Pérez, Raül  Muñoz, Santiago  Royo, José Antonio  Lázaro, Josep M.  Fabrega","start":"","end":"","abstractid":215707,"order":14,"abstract":"Abstract (summary)  This demonstration integrates sensing with programmable packet-optical infrastructure. We showcase autonomous capacity upgrades and network restoration to maintain high-performance connectivity for demanding mobility applications when using real-world data from a sensorized vehicle platform prototype.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_EWOC_DEMO_new (1).pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1482 / Tu2-Ex15","title":"Telemetry-Driven Scale-Across over On-Demand Optical Slices in Federated Data Centres","speaker":"Aristotelis Kretsis","affiliation":"","authors":"Aristotelis  Kretsis, Polyzois  Soumplis, Renato  Ambrosone, Alessio  Giorgetti, Ramon  Casellas, Riccardo  Schips, Vittorio  Curri, Pablo Armingol Robles, Oscar Gonzalez De Dios, Antonio Buendia Lopez, Enrique  Fernandez, Antonino  Nespola, Emmanouel  Varvarigos","start":"","end":"","abstractid":216641,"order":15,"abstract":"Abstract (summary)  We demonstrate telemetry-driven scale-across of distributed workloads over on-demand optical slices between geo-distributed data centres on a disaggregated multi-vendor testbed. Analytics anticipate SLA pressure across compute- and network-bound phases and trigger QoT-validated slice adaptation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1482.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1476 / Tu2-Ex16","title":"Experimental Demonstration of AI in Performance Optimization of Short-Reach Optical Interconnects","speaker":"Ramin Solaimani","affiliation":"","authors":"Ramin  Solaimani, Stella  Civelli, Dario  Cellini, Marco  Secondini, Li  Zhang, Asfand  Nizamani, Enrico  Forestieri, Pantea  Nadimi Goki, Fabio  Cavaliere, Luca  Potì","start":"","end":"","abstractid":216511,"order":16,"abstract":"Abstract (summary)  We demonstrate a unified platform that compares AI-assisted optimization strategies for short-reach IM/DD interconnects (transmitter pre-distortion, neural-network and look-up-table receivers, and end-to-end learning) through live simulations and remotely operated laboratory experiments with real-time performance visualization.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1476.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1442 / Tu2-Ex17","title":"Preventing Data Hallucinations in Agentic AI for Optical Network Troubleshooting","speaker":"Jeremias Dötterl","affiliation":"Adtran GmbH","authors":"Jeremias  Dötterl, Martin  Kuipers","start":"","end":"","abstractid":215505,"order":17,"abstract":"Abstract (summary)  An agentic AI system for automated troubleshooting in optical communication networks is demonstrated that integrates data references into the agent architecture to prevent data hallucinations, improving the interpretability and trustworthiness of root-cause identification and reasoning.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1442.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1473 / Tu2-Ex18","title":"Nanoseconds Reconfigurable Optical Switching Platform Based on REC-DFB Laser Arrays and AWGR","speaker":"Dongxu Zhang","affiliation":"Beijing Philinks Technology Co., Ltd.","authors":"Xianchen  Wu, Dongxu  Zhang, Maosen  Zhang, Yakun  Hu, Shicheng  Zhang, Bingli  Guo, Wenzhe  Li, Shikui  Shen, Guangquan  Wang, Guojun  Yuan, Shanguo  Huang, Xuwei  Xue","start":"","end":"","abstractid":216466,"order":18,"abstract":"Abstract (summary)  We demonstrate a nanosecond reconfigurable optical switching platform combining REC-DFB laser arrays, AWGR routing, FPGA-based scheduling, and visualized traffic steering to show destination-dependent wavelength selection and dynamic optical path reconfiguration in a four-node prototype.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1473.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1446 / Tu2-Ex19","title":"Exploiting Observability in Optical Networks for AI-driven Real-time Soft Failure Detection and Continual Learning","speaker":"Andrea Sgambelluri","affiliation":"Scuola Superiore Sant'Anna","authors":"Andrea  Sgambelluri, Emilio  Paolini, Giulio  Bottari, Filippo  Ponzini, Luca  Valcarenghi, Piero  Castoldi, Paola  Iovanna","start":"","end":"","abstractid":215677,"order":19,"abstract":"Abstract (summary)   We propose an observability-enabled AI framework using telemetry for degradation management. The proposed autoencoder-based solution detects anomalies, localizes the soft-failures, automates re-action, and supports continual learning, for automatic model retraining while the network is evolving.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26_DEMO_Ericsson_final.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1480 / Tu2-Ex20","title":"LLM-Orchestrated Optical-Fibre ISAC Platform for Sensing-Event Monitoring and Selective Network Response","speaker":"Peiyun Ge","affiliation":"University of Bristol","authors":"Wanxin  Zhao, Sen  Shen, Peiyun  Ge, Jing  Han, Yiran  Teng, Zhuojun  Cai, Lixia  Xi, Shuangyi  Yan, Dimitra  Simeonidou","start":"","end":"","abstractid":216580,"order":20,"abstract":"Abstract (summary)  We propose an LLM-driven integrated communication-and-sensing system for automated QoT monitoring, sensing-event interpretation, vibration localization, and adaptive network response. Our use case demonstrates real-time vibration-event classification and localization for proactive link-risk assessment.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1480.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1459 / Tu2-Ex21","title":"240 Gbit/s Coherent PON Demo with Simplified ONU Design Using Uncalibrated Lasers and Coexistence with Legacy PONs","speaker":"Md Mosaddek Hossain  Adib","affiliation":"Nokia Bell Labs","authors":"Md Mosaddek Hossain  Adib, Michael  Straub, Wouter  Lanneer, Sandip  Das, Rene  Bonk, Christoph  Fuellner","start":"","end":"","abstractid":216143,"order":21,"abstract":"Abstract (summary)  We demonstrate in‑service alignment of a wavelength‑uncalibrated LO laser in a proof‑of‑concept coherent PON setup, enabling a 240 Gbit/s downstream link. Coexistence with legacy PON validates a potential migration path toward future high‑capacity access networks.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1459.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1456 / Tu2-Ex22","title":"Modular & Hybrid Physical-Digital Twin for Optical-Mobile Networking","speaker":"Valentin Lucas Brienza","affiliation":"Universidad de la República","authors":"Valentin  Brienza, Lucas  Ingles, Claudina  Rattaro, Luiz  Anet Neto, Michel  Morvan, Alberto  Castro, Loutfi  Nuaymi","start":"","end":"","abstractid":215968,"order":22,"abstract":"Abstract (summary)  We demonstrate a modular optical-mobile testbed combining commercial G-PON equipment, an OMNeT++/INET optical DWDM network simulator, and open-source 5G/O-RAN components. Its interchangeable physical, simulated, and emulated segments support researcher-defined fixed-mobile convergence experiments.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1456.pdf"}]},{"sessionid":"5538493","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"12:30-14:00","room":"","type":"Lunch","typeColor":"black","category":"","title":"Lunch","description":"","goal":"","papers":[]},{"sessionid":"5538419","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"14:00-15:30","room":"A1 Auditorium 1","type":"Tutorial and contributed session","typeColor":"#e4dfec","category":"SC 04: Signal processing for optical communication and sensing","title":"Tu3-A AI and advanced processing for optical communication systems","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Adonis Bogris","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Fernando Guiomar","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Tutorial","code":"#0 /","title":"Tu3-A1 Communication engineering in the age of AI","speaker":"Darko Zibar","affiliation":"Technical University of Denmark","authors":"","start":"14:00","end":"15:00","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#332 / Tu3-A2","title":"24×432-Gbps/λ All-Optical Equalization for DSP-Free Optical Interconnects","speaker":"Benshan Wang","affiliation":"The Chinese University of Hong Kong","authors":"Benshan  Wang, Qiarong  Xiao, Dongliang  Wang, Yihao  Chen, Tengji  Xu, Li  Fan, Shaojie  Liu, Chaoran  Huang","start":"15:00","end":"","abstractid":211125,"order":3,"abstract":"Abstract (summary)  We demonstrate an integrated all-optical signal processor (OSP), enabling WDM transmission of 24-channels at 432-Gbps/λ over 2-km SMF across the whole C-band. The OSP simultaneously equalizes fiber-dispersion and transceiver-bandwidth-limit with <50-mW power and <75-ps latency, offering a disruptive solution for energy-efficient and low-latency optical interconnects.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-332.pdf"},{"role":"speaker","rolename":"Contributed","code":"#58 / Tu3-A3","title":"220-GBd optical coherent waveform generation using temporal unitary transforms","speaker":"Callum Deakin","affiliation":"Nokia Bell Labs","authors":"Callum  Deakin, Xi  Chen, Di  Che","start":"15:15","end":"","abstractid":209917,"order":4,"abstract":"Abstract (summary)  We use temporal unitary transforms to generate 16-QAM up to 220 GBd using only 50-GHz electrical bandwidth. The technique is theoretically lossless and can generate arbitrary optical waveforms beyond the bandwidth of the constituent modulators.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-58.pdf"}]},{"sessionid":"5538422","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"14:00-15:30","room":"A2 Auditorium 2","type":"Tutorial and Invited","typeColor":"#FFCCFF","category":"SC 12: CLEO® Special Session on Emerging Trends in Optics and Photonics","title":"Tu3-B Light propagation and manipulation from short to long distance","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Pavel Cheben","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#1403 / Tu3-B1","title":"Metamaterial Integrated Photonics for Light Coupling, Beam Steering and Spectral Filtering","speaker":"Jens Schmid Schmid","affiliation":"National Research Council Canada","authors":"Jens  Schmid, Pavel  Cheben, Jianhao  Zhang, Radovan  Korcek, Ross  Cheriton, Dan-Xia  Xu, Shurui  Wang, Martin  Vachon, Rubin  Ma, Robert  Halir, Gonzalo  Wanguemert-Perez, Alejandro  Ortega-Monux, Inigo  Molina-Fernandez, Alejandro  Sanchez-Postigo, Jose-Manuel  Luque-Gonzalez, Alejandro  Fernandez-Hinestrosa, Daniele  Melati, Carlos  Alonso-Ramos, Laurent  Vivien, Winnie  Ye","start":"14:00","end":"14:30","abstractid":213003,"order":1,"abstract":"Abstract (summary)  In this paper we provide an overview of recent developments in metamaterial integrated optics including efficient grating couplers on silicon nitride, optical antennas and phased arrays, as well as polarization-independent Bragg filters.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Metamaterials_JSchmid.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Daniel Benedikovic","affiliation":"University of Zilina","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Tutorial","code":"#1397 / Tu3-B2","title":"Hollow Core Photonic Crystal Fibre: Perfect Light Pipe?","speaker":"PHILIP ST. JOHN RUSSELL","affiliation":"Hangzhou Institute of Optics and Fine Mechanics","authors":"Philip  Russell","start":"14:30","end":"","abstractid":212837,"order":2,"abstract":"Abstract (summary)  In the tutorial I plan to briefly review the history of hollow-core PCF, explore its many applications, and outline how “glancing incidence optics” has revolutionised hollow-core fibre design.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC-2026-tutorial.pdf"}]},{"sessionid":"5538425","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"14:00-15:00","room":"E1 Exhibition room 1","type":"Contributed session","typeColor":"#d9ead3","category":"SC 08: Sensing and microwave photonics","title":"Tu3-C Microwave photonics and sensing","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Miguel Drummond","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1142 / Tu3-C1","title":"280-Gbps Rx-DSP-Free Coherent Analog-RoF Fronthaul Enabled by Hybrid Optical-Electrical Frequency Combs","speaker":"Yiming Wen","affiliation":"Huazhong University of Science and Technology","authors":"Yiming  Wen, Xiangyu  Xie, Chuanming  Huang, Rui  Xue, Kai  Xu, Yu  Xia, Mengfan  Cheng, Qi  Yang, Deming  Liu, Lei  Deng","start":"14:00","end":"","abstractid":212347,"order":1,"abstract":"Abstract (summary)  We demonstrate an Rx-DSP-free coherent A-RoF fronthaul using hybrid optical-electrical frequency combs to enable self-heterodyne detection and pre-equalization, mitigating laser phase noise and transmitter impairments. 5 channels of 14-GBaud 16-QAM signals with 22-GHz carrier frequency are successfully transmitted over a 10-km fiber link.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1142.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Guy Torfs","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#926 / Tu3-C2","title":"Acoustic Imaging for 2D Tracking of Surface Vessels Using  Distributed Acoustic Sensing on Submarine Optical Fibres","speaker":"Marcelo A. Soto","affiliation":"Universidad Tecnica Federico Santa Maria","authors":"Felipe  Mejías, Sebastián  San Martín, Gonzalo  Carrasco, Matías  Zañartu, Marcelo A.  Soto","start":"14:15","end":"","abstractid":212119,"order":2,"abstract":"Abstract (summary)  This paper presents a beamforming-based method using fibre-optic distributed acoustic sensing to map acoustic energy in two dimensions around submarine telecom fibres. The method enables near-field 2D localisation via beamforming and tracking through Kalman filtering of moving marine vessels, including regions without direct fibre deployment.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-926.pdf"},{"role":"speaker","rolename":"Contributed","code":"#719 / Tu3-C3","title":"Optical path difference measurements using symmetric dual-comb interferometry","speaker":"Alonso Romero Barrueco","affiliation":"Universidad de Alcalá","authors":"Alonso  Romero Barrueco, Julia  Mateu-Comas, Miguel  Soriano-Amat, Clara  Quevedo-Galán, Sonia  Matin-Lopez, Miguel  Gonzalez-Herraez, María R.  Fernández-Ruiz","start":"14:30","end":"","abstractid":211888,"order":3,"abstract":"Abstract (summary)  We present a common-path dual-comb technique for long-distance fiber ranging, addressing coherence and ambiguity limitations. Spectral phase retrieval combined with multi-Nyquist-zone pro-cessing enables measurements up to 102 km with 5.6 mm resolution.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-719.pdf"},{"role":"speaker","rolename":"Contributed","code":"#991 / Tu3-C4","title":"Quantitative Evaluation of Localised Fibre Loss in Multicore Fibre Systems Using Coherent OTDR","speaker":"Kosuke Komatsu","affiliation":"KDDI Research, Inc.","authors":"Kosuke  Komatsu, Kodai  Ishida, Shohei  Beppu, Daiki  Soma, Seiya  Sumita, Taiki  Fukushima, Hidenori  Takahashi, Ryo  Inohara, Yuta  Wakayama, Takehiro  Tsuritani","start":"14:45","end":"","abstractid":212187,"order":4,"abstract":"Abstract (summary)  We quantitatively evaluate localised fibre loss in two-core fibre systems using coherent OTDR. Better than ±1-dB agreement with power meter measurements is confirmed for two distinct configurations, with and without high-loss loopbacks. Operational advantages and disadvantages of each configuration are also clarified.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-991.pdf"}]},{"sessionid":"5538427","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"14:00-15:30","room":"C1.1 Conference room 1.1","type":"Contributed session","typeColor":"#f4cccc","category":"SC 03: Photonic integrated circuits, assemblies and packaging","title":"Tu3-D Integrated modulators","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Marianna Pantouvaki","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#696 / Tu3-D1","title":"400-Gb/s PAM4 Operation of an InP-on-Si Membrane EA Modulator Sub-Assembly with 1.0-V Differential Swing Voltage","speaker":"Kensho Nishizaki","affiliation":"Furukawa Electric Co., Ltd.","authors":"Kensho  Nishizaki, Kazuya  Nagashima, Takashi  Mogi, Tatsurou  Hiraki, Takuro  Fujii, Takuma  Aihara, Yoshiho  Maeda, Yusaku  Takai, Sho  Yoneyama, Tatsuya  Kimoto, Hideyuki  Nasu, Masaki  Kotoku, Tomonari  Sato, Shinji  Matsuo","start":"14:00","end":"","abstractid":211862,"order":1,"abstract":"Abstract (summary)  We demonstrate a 400-Gb/s PAM4 operation of a differential drive membrane electro-absorption modulator (EAM) sub-assembly with 1.0-V differential amplitude. 3-dB electro-optic bandwidth of >110 GHz is realized owing to a low capacitance 150-µm-long EAM flip-chip-bonded ceramic substrate as well as an integrated 80-ohm differential termination.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-696.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Sylvie Menezo","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#218 / Tu3-D2","title":"Flip-chip Integrated Differential Drive EML with Dual Modulator Structure with AC-coupling for 226 Gb/s","speaker":"Kei Masuyama","affiliation":"Mitsubishi Electric Corporation","authors":"Kei  Masuyama, Mizuki  Shirao, Shinya  Okuda, Seiu  Higashide, Kishin  Matsumori, Nobuo  Ohata","start":"14:15","end":"","abstractid":210944,"order":2,"abstract":"Abstract (summary)  We report a flip-chip-mounted EML with a dual-EAM structure on an interposer, together with differential termination and an AC-coupling capacitor. The device exhibits >60 GHz 3-dB electro-optic bandwidth and 226 Gb/s back-to-back operation at 113-GBaud PAM4 with 2.8-dB TDECQ.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-218.pdf"},{"role":"speaker","rolename":"Contributed","code":"#275 / Tu3-D3","title":"A Mach–Zehnder Modulator Exceeding 110 GHz in a 300 mm Silicon Photonic Platform towards 400 Gbps/lane Transmission","speaker":"Haiwen Cai","affiliation":"Shanghai Optoelectronics Science and Technology Innovation Center","authors":"Erse  Jia, Yanxiang  Lu, Xinran  Zhao, Jun  Li, Haiwen  Cai, Fenghe  Yang, Wei  Chu","start":"14:30","end":"","abstractid":211017,"order":3,"abstract":"Abstract (summary)  A 420 Gbps PAM-8 Mach-Zehnder modulator with a compact footprint of 500 μm is demonstrated in a 300 mm silicon photonic platform, achieving an insertion loss of 5.6 dB, an electro-optic bandwidth exceeding 110 GHz, and a modulation efficiency of 0.49 V∙cm around 1310 nm.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-275.pdf"},{"role":"speaker","rolename":"Contributed","code":"#238 / Tu3-D4","title":"Energy-Efficient Optical Chiplet Link with Heterogeneously Integrated Membrane EA-DFB Laser Achieving 1.55 pJ/bit at 64-Gbit/s PAM-4","speaker":"Suguru Yamaoka","affiliation":"NTT Inc.","authors":"Suguru  Yamaoka, Tatsurou  Hiraki, Tadashi  Minotani, Yoshiya  Shikama, Tomomasa  Kiyozawa, Tomoya  Taguchi, Takuma  Aihara, Yoshiho  Maeda, Takuro  Fujii, Yuichi  Tsujita, Tomonari  Sato, Shinji  Matsuo","start":"14:45","end":"","abstractid":210964,"order":4,"abstract":"Abstract (summary)  We demonstrate a transmitter chiplet integrating a low-capacitance InGaAsP electro-absorption modulator and a membrane InGaAsP laser on a Si platform, co-integrated with an electronic IC through flip-chip bonding. Together with a Ge receiver chiplet, a 1.55-pJ/bit optical link at 64-Gbit/s PAM-4 is achieved.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-238.pdf"},{"role":"speaker","rolename":"Contributed","code":"#527 / Tu3-D5","title":"Zero-Post-Processing Micro-Transfer-Printed Heterogeneous Si/TFLN Mach-Zehnder Modulators with >67-GHz Bandwidth","speaker":"Toshiya Murai","affiliation":"National Institute of Advanced Industrial Science and Technology (AIST)","authors":"Toshiya  Murai, Rai  Kou, Yohei  Yamashita, Kazumasa  Takabayashi, Masahiko  Imai, Kohei  Meisaichi, Shuntaro  Makino, Noritsugu  Yamamoto","start":"15:00","end":"","abstractid":211613,"order":5,"abstract":"Abstract (summary)  We micro-transfer-print fully pre-fabricated thin-film lithium niobate modulators, incorporating RF CPW electrodes and SiO2 cladding, onto a silicon platform using a Mo sacrificial layer. Eliminating post-printing fabrication, the 3-mm-long device achieves a 3-dB bandwidth exceeding 67 GHz, enabling scalable integration.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-527.pdf"},{"role":"speaker","rolename":"Contributed","code":"#931 / Tu3-D6","title":"A 150-GBaud PAM2, 120-GBaud PAM4 Monolithic Transmitter Integrating a Silicon-Photonic Mach–Zehnder Modulator and a CMOS Driver","speaker":"Jiaqin Fang","affiliation":"Department of Electrical Computer Engineering, The University of British Columbia","authors":"Jiaqin  Fang, Jiacong  Ke, Erwan  Weckenmann, Wei  Shi, Sudip  Shekhar","start":"15:15","end":"","abstractid":212124,"order":6,"abstract":"Abstract (summary)  We demonstrate a monolithically integrated optical transmitter consisting of a 46-GHz silicon photonic Mach-Zehnder modulator and a CMOS-SOI driver with on-chip continuous-time linear equalization. The measured E/O bandwidth is 70 GHz, with BERs below HD-FEC at 240-Gb/s PAM4 and 150-Gb/s PAM2.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-931.pdf"}]},{"sessionid":"5538430","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"14:00-15:30","room":"C1.4 Conference room 1.4","type":"Invited and contributed","typeColor":"#dae3f3","category":"SC 10: Control and management of optical networks","title":"Tu3-E Digital twin and autonomous network intelligence","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Raul Muñoz","affiliation":"CTTC","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1015 / Tu3-E1","title":"A Robust Scalable Markov Chain Monte Carlo Approach for a Probabilistic Digital Twin of Optical Networks","speaker":"Davide Rinaldi","affiliation":"Nokia Bell Labs","authors":"Davide  Rinaldi, Petros  Ramantanis, Antonio  Massaro, Armen  Aghasaryan","start":"14:00","end":"","abstractid":212213,"order":1,"abstract":"Abstract (summary)  We propose a method of refining the optical network parameters joint probability distribution, leveraging live measurements and integrating a differentiable reimplementation of GNPy into a Bayesian inference framework. We illustrate the benefits of our approach in terms of robustness and quality of the predicted distributions.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1015.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Behnam Shariati","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1044 / Tu3-E2","title":"Experimental Demonstration of Autonomous Class Aware Optimization via Digital Twin Aided Optical Network Agent","speaker":"Marc Lawson","affiliation":"Scuola Superiore Sant'Anna","authors":"Marc  Lawson, Ambashri  Purkayastha, Camille  Delezoide, Andrea  Sgambelluri, Fabien  Boitier, Nicola  Sambo, Patricia  Layec","start":"14:15","end":"","abstractid":212243,"order":2,"abstract":"Abstract (summary)  We demonstrate a Digital Twin-aided multi-agent LLM for autonomous class-aware optical network management on a network testbed. The system detects soft failures and autonomously adapts modulation format per service class requirements, ensuring marginless channel quality with minimal human intervention.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1044.pdf"},{"role":"speaker","rolename":"Invited","code":"#1431 / Tu3-E3","title":"ROADM and AI: a Perfect Symbiosis for Autonomous Optical Networks","speaker":"Annalisa Morea","affiliation":"Nokia","authors":"Annalisa  Morea, Giuseppe  Dicorato, Matteo  Lonardi, Paul  Momtahan","start":"14:30","end":"15:00","abstractid":214764,"order":3,"abstract":"Abstract (summary)  This article examines how AI is reshaping optical transport networks by driving architectural innovations to meet surging data center interconnect demands, while simultaneously enabling intelligent, agentic network automation frameworks that optimize operations, reduce costs, and deliver measurable business outcomes.","pdf":"/static/upload/ow193/events/ev667/abssub/MOREAInvited_ROADMandAI_4.pdf"},{"role":"speaker","rolename":"Contributed","code":"#844 / Tu3-E4","title":"Collaborative Measurement-Driven Digital Twin with Data Extrapolation for DRL-assisted Optical Networks","speaker":"Yiran Teng","affiliation":"University of Bristol","authors":"Yiran  Teng, Ruizhi  Yang, Sen  Shen, Yuelin  Liu, Wanxin  Zhao, Ali  Mehrpooya, Vaigai  Yokar, Rui  Wang, Shuangyi  Yan, Dimitra  Simeonidou","start":"15:00","end":"","abstractid":212030,"order":4,"abstract":"Abstract (summary)  We present a measurement-driven digital twin framework that integrates multiple lab-based emulations with AI-based extrapolation, offering a practical approach to data-driven digital twin construction. Using 5% measured data, it achieves below 0.05 dB error and enables DRL-based spectrum allocation with 0.4 dB Q-factor improvement.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-844.pdf"},{"role":"speaker","rolename":"Contributed","code":"#791 / Tu3-E5","title":"Experimental Demonstration of a Digital-Twin-Based Risk Map for Proactive Management of Fiber Flapping in a Mesh Network","speaker":"Chenyu Sun","affiliation":"Sorbonne Université","authors":"Chenyu  Sun, Yilong  Chen, Photios A.  Stavrou, Yvan  Pointurier, Gabriel  Charlet","start":"15:15","end":"","abstractid":211973,"order":5,"abstract":"Abstract (summary)  We experimentally demonstrate a digital-twin-based framework simulates “what-if” fiber flapping and power dips across a mesh optical network, generates risk maps, and recommends proactive adjustments of inline amplifier gain or booster launch power profile to pre-compensate potential degradations, enhancing end-to-end SNR margin and network resilience.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-791.pdf"}]},{"sessionid":"5538434","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"14:00-15:30","room":"C2.1 Conference room 2.1","type":"Symposia","typeColor":"","category":"","title":"Tu3-F AI for 6G and 6G for AI","description":"The use of AI in society is exploding and quickly changing how businesses and public functions operate. It’s speculated that Generative AI could drive a 10x traffic growth in 6G mobile networks. This workshop will outline the background of such predictions.\tOrganisers: Stefan Dahlfort (Ericsson), Oskars Ozolinš (RTU), Philippe Chanclou (Orange)\tSession 1: 14:00 – 15:30\t14:00 - 15:00\tOperator section – Moderator: Philippe Chanclou, Orange, France \tPhilippe Chanclou, “6G revolution or evolution?” Orange, France\tStefan Melin, \"Towards 6G: Intelligent Optical Networks and Autonomous Transport Architectures\" Telia Company, Sweden\tDr. Hirofumi Sasaki, NTT, Japan\tLieven Levrau, “Coevolution of RAN and Optical Transport”, IOWN, Nokia, Belgium\tPanel Operators\t15:00 - 15:15\tVendor section – Moderator: Stefan Dahlfort, MOPA, Ericsson, Sweden\t15:15-15:30\tAngelo Centonza, 3GPP RAN3 Vice Chairman, Ericsson, Spain;","goal":"","papers":[{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Stefan Dahlfort","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Oskars Ozolinš","affiliation":"Riga Technical University","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Philippe Chanclou","affiliation":"Orange","authors":"","start":"","end":"","abstractid":null,"order":3}]},{"sessionid":"5538436","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"14:00-15:30","room":"C2.2 Conference room 2.2","type":"Invited and contributed","typeColor":"#c9daf8","category":"SC 09: Free-space optics and optical wireless technologies","title":"Tu3-G Turbulence-resilient underwater optical wireless links","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Eduward Tangdiongga","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#0 /","title":"Tu3-G1 Optical wireless communications - progress and challenges","speaker":"Ampalavanapillai  Nirmalathas","affiliation":"","authors":"","start":"14:00","end":"14:30","abstractid":null,"order":1},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Anaëlle Maho","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#655 / Tu3-G2","title":"Blind Turbulence Mitigation Based on Ultra-Low-Latency Energy-Efficient Photonic Computing Processor: A Field Trial for Real-Time Underwater Links with 6D-AUV","speaker":"Geyang Wang","affiliation":"The Chinese University of Hong Kong,","authors":"Geyang  Wang, Yuxin  Wang, Jiacheng  ruan, Weipeng  Zhang, Joshua C.  Lederman, Caiming  Sun, Bhavin J.  shatri, Lian-Kuan  Chen, Paul R.  Prucnal","start":"14:30","end":"","abstractid":211820,"order":2,"abstract":"Abstract (summary)  We demonstrate a CSI-free blind turbulence-whitening equalizer (BTWE) using a novel compact modulation-and-weighting microring resonator-based photonic computing processor. Through 6D-AUV underwater field trials, photonic BTWE achieved orders-of-magnitude lower latency and energy consumption compared to advanced DSP with ~50% data-rate enhancement, successfully mitigating turbulence-induced power fluctuations.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-655.pdf"},{"role":"speaker","rolename":"Contributed","code":"#562 / Tu3-G3","title":"Turbulence-Resilient Self-Aligned Bidirectional Optical Wireless Using Optical Phase Conjugation","speaker":"Zhaoming Wang","affiliation":"University of Oxford","authors":"Zhaoming  Wang, Abderrahmen  Trichili, Grahame  Faulkner, James  Farmer, Dominic  O'Brien","start":"14:45","end":"","abstractid":211693,"order":3,"abstract":"Abstract (summary)  We demonstrate a bi-directional OWC link in which an optical phase-conjugate uplink provides automatic alignment and turbulence compensation, enabling a reverse high-speed downlink that achieves a 10.1-Gb/s peak throughput while sustaining Gb/s-class transmission over an optical power equivalent distance of 80 m.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-562.pdf"},{"role":"speaker","rolename":"Contributed","code":"#674 / Tu3-G4","title":"Downlink-Assisted Uplink Beam Steering in an Asymmetric Underwater Optical Attocell for Turbulence-Resilient Links","speaker":"Takahiro Kodama","affiliation":"Kagawa University","authors":"Haruto  Miyamoto, Daiki  Kuzuhara, Kiichiro  Kuwahara, Kaho  Mitani, Komei  Maekawa, Takahiro  Kodama","start":"15:00","end":"","abstractid":211840,"order":4,"abstract":"Abstract (summary)  An asymmetric underwater optical attocell is proposed to mitigate the coverage-efficiency trade-off in underwater wireless optical communication. Downlink diffusive beams enable extended cell formation, while uplink beam steering exploits positional information. Experiments demonstrate turbulence-resilient coverage and stable communication throughout the attocell for mobile nodes.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-674.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1251 / Tu3-G5","title":"Underwater WDM-VLC Systems Enabled by Ultrafast Perovskite Superlattice and SiPMs Receiver Array","speaker":"Zengyi Xu","affiliation":"Fudan University","authors":"Zengyi  Xu, Zhiwu  Chen, Zhe  Feng, Zhuoran  Hu, Yunkai  Wang, Peng  Yang, Congcong  Wang, Jingzhou  Li, Nan  Chi","start":"15:15","end":"","abstractid":212464,"order":4,"abstract":"Abstract (summary)  We proposed an underwater WDM-VLC system, combining a multi-wavelength laser transmitter and a large area receiver with ultrafast fluorescent antenna (FA) and SiPM array. The system achieves 117.6 Gbps⋅mm2capacity-area product in the 1.2 m tap water channel.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1251.pdf"}]},{"sessionid":"5538439","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"14:00-15:30","room":"E2 Exhibition room 2","type":"Invited and contributed","typeColor":"#d0e0e3","category":"SC 05: Optical transmission systems","title":"Tu3-H Long-haul HCF systems","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Jeremie Renaudier","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#1018 / Tu3-H1","title":"Hollow-Core Fibre Transmission Systems: From Metro to Long-Haul Applications","speaker":"Yang Hong","affiliation":"Microsoft Azure Fiber","authors":"Yang  Hong, Abdallah  Ali, Morteza  Kamalian-Kopae, Baset  Gholizadeh, Shahab Bakhtiari  Gorajoobi, James  Hooley, Simon  Bawn, Eric Numkam  Fokoua, Yong  Chen, Colin  Wallace, Jamie  Gaudette, David  Richardson, Benjamin  Puttnam","start":"14:00","end":"14:30","abstractid":212216,"order":1,"abstract":"Abstract (summary)  We review recent advances in high‑capacity optical transmission that exploit the unique beneficial properties of hollow‑core fibres (HCFs). Single‑span metro, multi‑span long‑distance, and long‑haul transmission scenarios are discussed, together with opportunities and challenges towards future HCF‑based transmission systems.","pdf":"/static/upload/ow193/events/ev667/abssub/1018 - Hollow-Core Fiber Transmission Systems From Metro to Long-Haul Applications.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Adolfo Cartaxo","affiliation":"Instituto de Telecomunicações","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1233 / Tu3-H2","title":"Impact of Gas Line Absorption in Long-Haul transmission of 134 GBd Signals in C-Band over Low Loss and Low IMI HCF","speaker":"Rajiv Boddeda","affiliation":"Nokia Bell Labs","authors":"Rajiv  Boddeda, Carina  Castineiras Carrero, Haïk  Mardoyan, Amirhossein  Ghazisaeidi, Ruby  S. B. Ospina, Peng  Li, Shuhai  Li, Lei  Zhang, Jie  Luo, Jeremie  Renaudier","start":"14:30","end":"","abstractid":212445,"order":2,"abstract":"Abstract (summary)  We report on the C-band WDM transmission of 134-GBd channels using DP-16QAM and DP-64QAM over long-haul distances. Using a recirculating loop comprising of a single span made of 266-km of GTA‑ST‑HCF, we show the impact of gas line absorption on SC and MC modulation schemes.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1233.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1181 / Tu3-H3","title":"On the Impact of Gas-Line Absorption in Long-Haul C+L-Band Hollow-Core Fibre Transmission","speaker":"Zelin Gan","affiliation":"University College London","authors":"Zelin  Gan, Eric  Sillekens, Jiaqian  Yang, Ronit  Sohanpal, Mindaugas  Jarmolovicius, Romulo  Aparecido, Robert  Killey, Polina  Bayvel","start":"14:45","end":"","abstractid":212386,"order":3,"abstract":"Abstract (summary)  We numerically investigate gas-line absorption in hollow-core fibre C+L-band transmission. Results show limited C-band but severe L-band performance degradation. Ideal suppression enables a 1.5× higher L-band throughput, reaching 59.1 Tb/s over 1000~km, while reducing repeater number by up to 3.3×.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1181.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1001 / Tu3-H4","title":"Demonstration of Full C-band 400G ZR Transmission over 3-Span 427.97-km Hollow-Core Fibre","speaker":"Yang Hong","affiliation":"Microsoft Azure Fiber","authors":"Yang  Hong, Baset  Gholizadeh, James  Hooley, Abdallah  Ali, Morteza  Kamalian-Kopae, Colin  Wallace, Jamie  Gaudette, David  Richardson, Benjamin  Puttnam","start":"15:00","end":"","abstractid":212199,"order":4,"abstract":"Abstract (summary)  We experimentally demonstrate 400G ZR transmission over record reach thanks to the ultra-low nonlinearity and low-and-flat chromatic dispersion of hollow-core fibre (HCF). Using 34.5-dBm launch powers, real-time full C-band 400G ZR transmission over 3 spans with a maximum 427.97-km reach is demonstrated.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1001.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1287 / Tu3-H5","title":"Fundamental Quantum Limits of Power-Constrained Multi-Span Fiber-Optic Transmission: HCF vs Conventional Fibers","speaker":"Karol Lukanowski","affiliation":"University of Warsaw","authors":"Karol  lukanowski, Amirhossein  Ghazisaeidi, Marcin  Jarzyna, Konrad  Banaszek","start":"15:15","end":"","abstractid":212503,"order":5,"abstract":"Abstract (summary)  We explore fundamental quantum limits on the system capacity of multi-span HCF and standard silica-based fiber links in the power-constrained regime, comparing phase-sensitive and phase-insensitive amplifiers and Shannon vs Gordon-Holevo capacity.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1287.pdf"}]},{"sessionid":"5538442","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"14:00-15:30","room":"PV-R Multipurpose room","type":"Invited and contributed","typeColor":"#ead1dc","category":"SC 11: Quantum communications, physical layer security, and optical quantum technologies","title":"Tu3-I Quantum state transmission and manipulation","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Konrad Banaszek","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#593 / Tu3-I1","title":"Air-to-Ground Transmission of Time-Encoded Qubits with Single-Mode Fiber Coupling for Terrestrial Network Compatibility","speaker":"Adam Widomski","affiliation":"Fraunhofer-Institute for Telecommunication, Heinrich-Hertz-Institut, HHI","authors":"Adam  Widomski, Stephanie  Renneke, Jan  Krause, Sheng-Hsuan  Huang, Till  Dolejsky, Carlo  Riester, Markus  Rothe, Ingo  Gebhart, Nino  Walenta, Ronald  Freund","start":"14:00","end":"","abstractid":211731,"order":1,"abstract":"Abstract (summary)  We present a demonstration of time-encoded quantum bit transmission over an air-to-ground link between a mobile airborne transmitter and an optical ground station. Our results pave the way to wards constructing secure and flexible hybrid Quantum Key Distribution links beyond currently available fiber-optic topologies.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-593.pdf"},{"role":"speaker","rolename":"Contributed","code":"#830 / Tu3-I2","title":"Quantum Readout based on Silicon Photonic Integrated Circuits for Enhanced Authentication Security","speaker":"Charis Mesaritakis","affiliation":"University of West Attica","authors":"Charis  Mesaritakis, George  Sarantoglou, Nikolaos  Tzekas, George  Moustakas, George-Aias  Karydis, Veronika  Kaminski, Ekaterina  Protsenko, Kamil  Gradkowski, Alexandre  Bazin, Caterina  Vigliar, Adonis  Bogris","start":"14:15","end":"","abstractid":212013,"order":2,"abstract":"Abstract (summary)  In this work, we present a quantum-driven physical unclonable function based on a silicon nitride photonic integrated chip, offering enhanced authentication security against eavesdropping. The maximally mixed state property conceals the hardware fingerprint, while a cloning probability as low as 10^-14 provides secure authentication","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-830.pdf"},{"role":"speaker","rolename":"Invited","code":"#1424 / Tu3-I3","title":"Quantum Advantage with Continuous Variable Systems","speaker":"Ulrik  Lund Andersen","affiliation":"Technical University of Denmark","authors":"Ulrik Lund  Andersen","start":"14:30","end":"15:00","abstractid":213594,"order":3,"abstract":"Abstract (summary)  In this talk, I will present our efforts to leverage CV optical quantum systems for achieving quantum advantage in learning, communication, and computation. Highlights include demonstrations of massive quantum advantage in quantum learning, progress toward quantum computational advantage, and recent advances in practical CVQKD.","pdf":"/static/upload/ow193/events/ev667/abssub/Abstract ECOC 2026.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1333 / Tu3-I4","title":"Measurement-Based Quantum Kernel Method for Data Classification on a Reprogrammable Silicon Photonic Device","speaker":"Veronika Raschendorfer","affiliation":"Denmark's Technical University - Electro","authors":"Veronika  Raschendorfer, Anton  Alnor Christensen, Zinner  Nikolaj Thomas, Francesco  Da Ros, Caterina  Vigliar","start":"15:00","end":"","abstractid":212555,"order":4,"abstract":"Abstract (summary)  We demonstrate a measurement-based quantum kernel estimation protocol on a reprogrammable silicon photonic chip. Using path-encoded four-qubit graph states, we achieve 90% classification accuracy. This provides a scalable, noise-resilient framework for quantum machine learning ©2026 The Author(s)","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1333.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1115 / Tu3-I5","title":"Experimental Quantification of Layered Error Suppression in Fiber-Interconnected Quantum Data Centers","speaker":"Seyed Navid Elyasi","affiliation":"University of Bristol","authors":"Seyed Navid  Elyasi, Sima  Bahrani, Rui  Wang, Dimitra  Simeonidou, Paolo  Monti, Rui  Lin","start":"15:15","end":"","abstractid":212320,"order":5,"abstract":"Abstract (summary)  We perform experiments to quantify error suppression in fiber-connected superconducting QPUs using combined error mitigation techniques, demonstrating over 20% improvement in operational fidelity across interconnected quantum processing units under realistic noise conditions.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1115.pdf"}]},{"sessionid":"5538723","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"15:30-16:00","room":"","type":"Coffee break","typeColor":"black","category":"","title":"Afternoon coffee break","description":"","goal":"","papers":[]},{"sessionid":"5538420","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"16:00-17:30","room":"A1 Auditorium 1","type":"Tutorial and Invited","typeColor":"#dce6f1","category":"SC 07: Optical networks for access, mobile X-haul, in-building, and intra-datacentre interconnects","title":"Tu4-A Access network evolution","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Rene Bonk","affiliation":"Nokia","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#211 / Tu4-A1","title":"Optical Access Network Evolution and Transformation Enabled by AI","speaker":"Fan Xu","affiliation":"","authors":"Fan  Xu, Zongzhao  Zheng, Zhicheng  Ye, Xiang  Wang, Yan  Zeng, Dekun  Liu, Yanzhao  Lu, Xuming  Wu","start":"16:00","end":"16:30","abstractid":210937,"order":1,"abstract":"Abstract (summary)  Artificial intelligence has emerged as a key enabler to address challenges such as capacity demand, dynamic resource allocation, and intelligent management through data-drive optimiza tion and adaptive control in Optical Access Network. This paper reviews major aspects and dis cusses future directions for AI-driven OAN.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_AI-FAN_0411.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Paola Parolari","affiliation":"Politecnico di Milano","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Tutorial","code":"#467 / Tu4-A2","title":"25 Years of PON standardization Tracking the Evolution of Technology and its Market","speaker":"Frank Effenberger","affiliation":"Futurewei","authors":"Frank  Effenberger","start":"16:30","end":"","abstractid":211455,"order":2,"abstract":"Abstract (summary)  Passive optical networks have a long history of standardization that has tracked both the progress of the technology and the development of the broadband market. The goal is to find a good cost-performance trade-off. This paper reviews the major themes of this work.","pdf":"/static/upload/ow193/events/ev667/abssub/EffenbergerTutorialPaper_1.pdf"}]},{"sessionid":"5538423","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"16:00-17:30","room":"A2 Auditorium 2","type":"Invited and contributed","typeColor":"#dae3f3","category":"SC 10: Control and management of optical networks","title":"Tu4-B Optical networks for AI datacenters and workloads","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Yvan Pointurier","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1162 / Tu4-B1","title":"Dynamic Optical Pluggable Allocation and LLM-aware Job Scheduling for Distributed AI training in Regional Multi-Cluster Data Centers","speaker":"Varsha Lohani","affiliation":"Centre Tecnològic de Telecomunicacions de Catalunya (CTTC)","authors":"Varsha  Lohani, Raul  Muñoz, Ramon  Casellas","start":"16:00","end":"","abstractid":212367,"order":1,"abstract":"Abstract (summary)  We propose an LLM-aware dynamic optical pluggable allocation for regional multi-cluster data centers, jointly optimizing DCI capacity and job queuing to support heterogeneous distributed AI training workloads, improving utilization, blocking probability, and training efficiency significantly.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1162.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Nguyen-Cac Tran","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#209 / Tu4-B2","title":"Energy-Efficient Machine Learning-Assisted Load Balancing for Fully Virtualized Access Networks on Multi-Node GPU Servers","speaker":"Takahiro Suzuki","affiliation":"","authors":"Takahiro  Suzuki, Yasuhiro  Matsumoto, Jun-Ichi  Kani, Tatsuya  Shimada","start":"16:15","end":"","abstractid":210934,"order":2,"abstract":"Abstract (summary)  We propose energy-efficient machine learning-assisted load balancing for fully-virtualized OLTs. The nonlinear change in computational load is estimated using a decision tree. Experiments on multi-node GPU servers show a 62% improvement in inference error and power savings of 95% to 98%.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-209.pdf"},{"role":"speaker","rolename":"Invited","code":"#1433 / Tu4-B3","title":"The Role of Optics in Next-Generation Multi-Gigawatt Datacenters","speaker":"Bodhisattwa Gangopadhyay","affiliation":"","authors":"Bodhisattwa  Gangopadhyay, Arash  vakili, Debottym  Mukherjee, Jeff  Rahn","start":"16:30","end":"17:00","abstractid":215006,"order":3,"abstract":"Abstract (summary)  Multi-gigawatt AI datacenters demand optical interconnects scaling from intra-cluster fabrics to inter-building backbone rings under strict power, latency, and reliability constraints. We present the deployed optical architecture spanning disaggregated AI fabrics and metro-ring backbones, covering 2×400G FR4-LITE optics, 800GZR coherent modules, and optical protection switching.","pdf":"/static/upload/ow193/events/ev667/abssub/The Role of Optics in Next-Generation Multi-Gigawatt Datacenters.pdf"},{"role":"speaker","rolename":"Invited","code":"#0 /","title":"Tu4-b4 optical networks for ai: the challenge and optimization for llm training and inference across datacenters","speaker":"Jiawei Zhang","affiliation":"Beijing University of Posts and Telecommunications","authors":"","start":"17:00","end":"","abstractid":null,"order":4}]},{"sessionid":"5538428","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"16:00-17:30","room":"C1.1 Conference room 1.1","type":"Invited and contributed","typeColor":"#ead1dc","category":"SC 11: Quantum communications, physical layer security, and optical quantum technologies","title":"Tu4-D Long-range QKD and fields trials","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Annachiara Pagano","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#0 /","title":"Tu4-D1 Practical quantum communications in deployed optical telecom networks","speaker":"Mirko Pittaluga","affiliation":"","authors":"","start":"16:00","end":"16:30","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1157 / Tu4-D2","title":"Field Trial of Commercial 1295-nm O-Band DV-QKD under Coexistence with Classical Channels in a High-Capacity ROADM-based Metropolitan Production Fiber Network","speaker":"José Manuel Rivas-Moscoso","affiliation":"Telefónica CDO","authors":"José Manuel  Rivas-Moscoso, Javier  Núñez-Bon, Antonio  Melgar, Pablo  Armingol, Vanessa  Villegas Zannella, Pablo  Golderos Espadas, Pedro  Penedo, Gianluca  Boso, Daniel  Spitzbart, Florian  Fröwis, Rafael  Cantó Palancar, Jesús  Folgueira","start":"16:30","end":"","abstractid":212362,"order":2,"abstract":"Abstract (summary)  We report field deployment of a 1295.56 nm O-band DV-QKD system coexisting with high-capacity C-band traffic in a metropolitan link. Measurements under varying channel allocations and powers show robust coexistence, improved tolerance over 1310 nm operation, and no degradation in classical C-band performance or capacity.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1157.pdf"},{"role":"speaker","rolename":"Contributed","code":"#617 / Tu4-D3","title":"Field Demonstration of QKD–Classical Coexistence with Real-Time Encryption over Multi-Core Fiber","speaker":"Ibrahim Mohamed Ramadan","affiliation":"Università degli Studi dell'Aquila, Department of Physical and Chemical Sciences","authors":"Ibrahim Mohamed  Ramadan, Giammarco  Di Sciullo, Qi  Wu, Domenico  Ribezzo, Divya  Ann Shaji, Lucas  Alves Zischler, Ruben  S. Luís, Paolo  Serena, Chiara  Lasagni, Alberto  Bononi, Tetsuya  Hayashi, Alessandro  Gagliano, Paolo  Martelli, Alberto  Gatto, Paola  Parolari, Pierpaolo  Boffi, Andrea  Marotta, Carlo  Centofanti, Fabio  Graziosi, Antonio  Mecozzi, Cristian  Antonelli","start":"16:45","end":"","abstractid":211769,"order":3,"abstract":"Abstract (summary)  We report the first field trial of quantum key distribution coexisting with classical signals over a fielddeployed multi-core fiber link, achieving 106.7 Tb/s classical transmission alongside real-time networklayer encryption at 132 Gb/s, with 63 µs latency overhead and key-refresh time interval of 15 seconds.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-617.pdf"},{"role":"speaker","rolename":"Contributed","code":"#722 / Tu4-D4","title":"Field Trials of Restoration-Capable Quantum Key Distribution Networks with Optical Routers","speaker":"Xiao Duan","affiliation":"KDDI Research, Inc.","authors":"Xiao  Duan, Hou Shun  Poh, Matthew  Wee, Yu  Cai, Jing Yan  Haw, Hao  Qin, Michael  Kasper, Christian  Kurtsiefer, Alexander  Ling","start":"17:00","end":"","abstractid":211894,"order":4,"abstract":"Abstract (summary)  We demonstrate physical-layer failure detection and automated recovery in quantum key distribution ne works utilising commercial prepare-and-measure BB84 and polarisation entanglement-based BBM92 systems integrated with self-developed all-transparent optical routers over a field-deployed network testbed.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-722.pdf"},{"role":"speaker","rolename":"Contributed","code":"#949 / Tu4-D5","title":"Demonstration of a Dynamic SD-KMS with Batch-Based Multipath Routing in a Field-Deployed QKD Network","speaker":"Konstantinos Tsimvrakidis","affiliation":"National and Kapodistrian University of Athens","authors":"Konstantinos  Tsimvrakidis, Antonis  Selentis, Alkinoos  Papageorgopoulos, Ilias  Papastamatiou, Konstantinos  Christodoulopoulos, George  Kanellos","start":"17:15","end":"","abstractid":212143,"order":4,"abstract":"Abstract (summary)  We present a dynamic Software-Defined Key Management System (SD-KMS), integrated with a custom batch-based Linear Programming (LP) routing engine, to optimize dynamic key provision-ing in Quantum Key Distribution (QKD) networks. The SD-KMS is experimentally validated across diverse operational scenarios in a field-deployed QKD network.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-949.pdf"}]},{"sessionid":"5538431","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"16:00-16:45","room":"C1.4 Conference room 1.4","type":"Contributed session","typeColor":"#e2efda","category":"SC 02: Discrete photonic devices and technologies","title":"Tu4-E Mode division multiplexing","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Eric Bernier","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#620 / Tu4-E1","title":"20-Mode Spatial and Polarization Multiplexer using Vertically Stacked Three-Layer Dielectric Metasurfaces","speaker":"Takahiro Suganuma Mr","affiliation":"The University of Tokyo","authors":"Takahiro  Suganuma, Chun  Ren, Nicolas  Fontaine, Yusuke  Tsubai, Go  Soma, Takuo  Tanemura","start":"16:00","end":"","abstractid":211773,"order":1,"abstract":"Abstract (summary)  A spatial and polarization multiplexer based on compact stacked metasurfaces is experimentally demonstrated. Using three metasurface layers with 800-μm-diameter aperture, we achieve simultaneous conversion of 20 input beams to the desired Hermite–Gaussian modes at 1550 nm, demonstrating a scalable optical interface for space-division-multiplexed systems.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-620.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Despoina Petousi","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#402 / Tu4-E2","title":"Inversely Designed Ultrasmall Scrambling-Type Mode Multiplexer Based on Mosaic Structure","speaker":"Shizunari Aomori","affiliation":"Graduate School of Science and Engineering, Hosei University","authors":"Shizunari  Aomori, Yasuhide  Tsuji, Takuya  Mitarai, Yusuke  Sawada, Takuya  Okimoto, Takuo  Hiratani, Kento  Komatsu, Hideki  Yagi, Naoki  Fujiwara, Takeshi  Fujisawa","start":"16:15","end":"","abstractid":211281,"order":2,"abstract":"Abstract (summary)  We propose and experimentally demonstrate first scrambling-type mode multiplexers based on mosaic structure. Two- and three-mode multiplexers with an ultrasmall footprint of < 10 µm2 are successfully demonstrated with the help of inverse design method based on gradient-based and machine learning techniques.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-402.pdf"},{"role":"speaker","rolename":"Contributed","code":"#438 / Tu4-E3","title":"Ultrasmall 8-Channel Wavelength/Mode Hybrid Multiplexer with Mosaic Structures for Beyond-Tbit/s Optical Ethernet","speaker":"Yusuke Sawada","affiliation":"Sumitomo Electric Industries, Ltd.","authors":"Yusuke  Sawada, Takeshi  Fujisawa, Takuya  Mitarai, Kento  Komatsu, Takuya  Okimoto, Takuo  Hiratani, Hideki  Yagi, Naoki  Fujiwara","start":"16:30","end":"","abstractid":211380,"order":3,"abstract":"Abstract (summary)  We demonstrate ultrasmall wavelength/mode hybrid multiplexers for the C- and O-bands. Integrating mosaic structures designed using machine learning enables ultrasmall footprint of 50 × 50 µm2 while maintaining low loss property. To the best of our knowledge, these devices are the smallest for 8-channel multiplexers.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-438.pdf"}]},{"sessionid":"5538433","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"16:00-17:30","room":"C2.1 Conference room 2.1","type":"Symposia","typeColor":"","category":"","title":"Tu4-F AI for 6G and 6G for AI","description":"The use of AI in society is exploding and quickly changing how businesses and public functions operate. It’s speculated that Generative AI could drive a 10x traffic growth in 6G mobile networks. This workshop will outline the background of such predictions.\tOrganisers: Stefan Dahlfort (Ericsson), Oskars Ozolinš (RTU), Philippe Chanclou (Orange)\tSession 2: 16:00-17:30\t16:00 - 16:35\tFrançois Fredricx, MOPA Technical Committee Co-chair, Nokia, Belgium\tFabio Cavaliere, \"When AI Meets Light - Rethinking Optical Link Design for 6G (and not only)”, Ericsson, Italy\tRaza Khan. “How can optical solutions and components for 6G match the needs of AI?”, Semtech, Canada\tAcademia section – Moderator: Oskars Ozolins, RTU, Latvia\t16:35-17:30\tRoberto Gaudino, “Next-generation optical access networks and their possible impact on AI”, Politecnico di Torino, Italy\tCarlos Natalino Da Silva “6G transport networks for an agentic future: synergies and opportunities”, Chalmers, Sweden\tPatryk Urban “Resiliency of fiber-optic access network in the 6G and AI era”, West Pomeranian University of Technology in Szczecin, Poland\tChristina Lim, “AI-Native Radio-over-Fiber Receivers for 6G\", University of Melbourne, Australia\tPanel Vendors and Academia","goal":"","papers":[{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Stefan Dahlfort","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Oskars Ozolinš","affiliation":"Riga Technical University","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Philippe Chanclou","affiliation":"Orange","authors":"","start":"","end":"","abstractid":null,"order":3}]},{"sessionid":"5538437","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"16:00-17:30","room":"C2.2 Conference room 2.2","type":"Invited and contributed","typeColor":"#e4dfec","category":"SC 04: Signal processing for optical communication and sensing","title":"Tu4-G Optical sensing in telecommunications networks","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Fatih Yaman","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#308 / Tu4-G1","title":"Enhancing Telecommunications Network Availability through Infrastructure Protection with High-Spatial-Resolution Sensing","speaker":"André Sandmann","affiliation":"Adtran Networks SE","authors":"André  Sandmann, Lutz  Rapp, Florian  Azendorf","start":"16:00","end":"16:30","abstractid":211094,"order":1,"abstract":"Abstract (summary)  A framework for increasing optical fiber network availability by integrating high-spatial-resolution distributed fiber sensing in data transmission systems is presented. Coexistence with parallel data channels on a separate wavelength, mitigation of nonlinear signal interaction impacts, applications and challenges are investigated.","pdf":"/static/upload/ow193/events/ev667/abssub/Sandmann_ECOC26_paper_final_2.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Elie Awwad","affiliation":"Télécom Paris","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#523 / Tu4-G2","title":"Generalised Bidirectional ODN Characterisation with Unknown Number of Loss Events for Coherent PONs","speaker":"Chenxi Tan","affiliation":"University of Cambridge","authors":"Chenxi  Tan, Xiaoyan  Ye, Seb  Savory","start":"16:30","end":"","abstractid":211606,"order":2,"abstract":"Abstract (summary)  We propose a generalised bidirectional DSP-based framework using adaptive Gaussian process regression and Bayesian information criterion for precise and efficient ODN characterisation in coherent PONs with unknown loss events. Experiments demonstrate accurate dual-loss localisation and quantification, with maximum mean errors of 0.26km and 0.17dB.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-523.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1381 / Tu4-G3","title":"Multipoint Vibration Localization in Forward Coherent ISAC  Enabled by Blind Source Separation","speaker":"Bowen Yin","affiliation":"School of Optical and Electronic Information, Huazhong University of Science and Technology","authors":"Bowen  Yin, Yang  Shi, Yalin  Gao, Zhiyong  Zhao, Ming  Tang","start":"16:45","end":"","abstractid":212604,"order":3,"abstract":"Abstract (summary)   We demonstrate multipoint vibration localization in forward ISAC by extracting perturbations directly from the communication signal phase. Leveraging blind source separation, three concurrent vibrations are blindly localized over a 63-km link with meter-level accuracy, alongside penalty-free 30-GBaud 16-QAM transmission.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1381.pdf"},{"role":"speaker","rolename":"Contributed","code":"#358 / Tu4-G4","title":"Flexible DAS Implementation over a Self-Homodyne Optical Link","speaker":"Junda Chen","affiliation":"Chalmers University Of Technology","authors":"Yucheng  Yao, Can  chen, Junda  Chen, Zhonghong  Lin, Zhiyong  Zhao, Ming  Tang, Peter  A. Andrekson, Magnus  Karlsson","start":"17:00","end":"","abstractid":211168,"order":4,"abstract":"Abstract (summary)  We demonstrate a flexible ISAC architecture over a 25-km polarization-division-multiplexed self-homodyne link using a shared continuous frequency-swept carrier, achieving 160-Gbps 16QAM transmission with negligible communication penalty and 30-kHz vibration recovery. High-sampling-rate DAS is realized via continuous-wave sub-band multiplexing, increasing sampling rate 45× without spectral overhead.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-358.pdf"},{"role":"speaker","rolename":"Contributed","code":"#95 / Tu4-G5","title":"Hybrid Phase and Polarization Sensing Using OIF DSP Frame Pilot Symbols and Training Sequences in Integrated Receivers","speaker":"Hao Zhou","affiliation":"Beijing University of Posts and Telecommunications","authors":"Hao  Zhou, Fan  Yang, Du  Tang, Wen  Zuo, Zekai  Li, Yingjie  Jiang, Baoxuan  Quan, Yutao  Zhou, Hengying  Xu, Chenglin  Bai, Yaojun  Qiao","start":"17:15","end":"","abstractid":210548,"order":5,"abstract":"Abstract (summary)  A hybrid feedforward phase and polarization sensing architecture is proposed for integrated coherent receivers with 100-kHz ECLs, directly utilizing OIF-defined DSP frame pilot symbols and training sequences. By adaptively selecting modalities based on frequency-dependent sensing SNR, we achieve sub-Hz-to-10-MHz vibration detection for fiber-ISAC optical networks.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-95.pdf"}]},{"sessionid":"5538440","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"16:00-17:30","room":"E2 Exhibition room 2","type":"Invited and contributed","typeColor":"#fce5cd","category":"SC 06: Architecture, modelling and performance of optical networks","title":"Tu4-H Impairments monitoring in optical networks","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Camille Delezoide","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#511 / Tu4-H1","title":"Estimation of Nonlinear Intra- and Inter-Channel Impairments in Optical Fiber Transmission","speaker":"Joana Girard-Jollet","affiliation":"Nokia Bell Labs","authors":"Joana  Girard-Jollet, Lina  Shi, Fabien  Boitier, Camille  Delezoide, Jean-Christophe  Antona, Patricia  Layec","start":"16:00","end":"","abstractid":211570,"order":1,"abstract":"Abstract (summary)  We propose a neural network to estimate the relative contributions of intra- and inter-channel nonlinear impairments in fiber optic transmission from received-signal power spectral densities. Trained and tested on experimental data, the model achieves 1% RMSE across varying launch powers, symbol rates, and transmission distances.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-511.pdf"},{"role":"speaker","rolename":"Contributed","code":"#572 / Tu4-H2","title":"First Distributed PDL Monitoring on Coherent DSP Chip in Pluggable Transceiver","speaker":"Minami Takahashi","affiliation":"NTT, Inc.","authors":"Minami  Takahashi, Takeo  Sasai, Etsushi  Yamazaki","start":"16:15","end":"","abstractid":211704,"order":2,"abstract":"Abstract (summary)  We demonstrate the first experimental localization and quantification of distributed PDL, fully implemented on a coherent DSP in a 118-GBd OSFP transceiver. Over a WDM link, on-chip digital-SOP-optimized polarization-resolved power profiles identify multiple PDL elements solely from ZR+ traffic signals, with <1.0-dB estimation error.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-572.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Emanuele Virgillito","affiliation":"Politecnico di Torino","authors":"","start":"","end":"","abstractid":null,"order":3},{"role":"speaker","rolename":"Invited","code":"#1224 / Tu4-H3","title":"First Implementation of NLI Estimation on Coherent DSP Enabled by On-Chip Longitudinal Power Monitoring","speaker":"Takeo Sasai","affiliation":"NTT","authors":"Takeo  Sasai, Etsushi  Yamazaki","start":"16:30","end":"17:00","abstractid":212436,"order":3,"abstract":"Abstract (summary)  We report the first implementation of NLI estimation on a real-time coherent DSP, enabled by on-chip longitudinal power monitoring inside an OSFP. We demonstrate NLI estimation over a 450-km link using only standard 400ZR+ traffic, achieving a 0.62-dB maximum absolute error in generalized OSNR.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1224.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1091 / Tu4-H4","title":"Near-Symbol-Rate Linear Least-Square Longitudinal Power Monitoring","speaker":"Junho Chang","affiliation":"Huawei Technologies Canada","authors":"Junho  Chang, Choloong  Hahn, Qingyi  Guo, Zhiping  Jiang","start":"17:00","end":"","abstractid":212293,"order":4,"abstract":"Abstract (summary)  We characterize the dependency of the spatial response function on the waveform sampling rate used for LPM. By proposing an optimized near-symbol-rate approach, we achieve mean absolute error of the estimated profile comparable to 2-SpS processing with lower sampling requirements, supporting more resource-efficient real-time monitoring.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1091.pdf"},{"role":"speaker","rolename":"Contributed","code":"#512 / Tu4-H5","title":"Generalizable PDL Regression via Transfer Learning in Optical Links","speaker":"Lina Shi","affiliation":"Nokia Bell Labs France","authors":"Lina  Shi, Joana  Girard-Jollet, Fabien  Boitier, Patricia  Layec","start":"17:15","end":"","abstractid":211571,"order":5,"abstract":"Abstract (summary)  We demonstrate transfer learning for PDL regression by adapting a simulation-trained model to experimental data under unseen operating conditions. Across different symbol rates, launch powers, and modulation formats, it consistently outperforms a source-only baseline, demonstrating robust cross-domain generalization with few target samples.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-512.pdf"}]},{"sessionid":"5538734","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"17:30-19:30","room":"E2 Exhibition room 2","type":"EPIF","typeColor":"","category":"","title":"Tu5-H European photonic integration forum (EPIF)","description":"The European Photonic Integration Forum is organized every year at ECOC by ePIXfab and JePPIX, and is this year again supported by PhotonDelta. In the 2026 edition, EPIF focuses on the pathways to European scaling of the photonics ecosystem: from public funding to venture capital.\tKeynote speakers: \t \tClaudia Hoessbacher (Polariton) will tell the exceptional story of Polariton, going from an academic spin-off setting world-record modulator speeds to a successful acquisition by Marvell in 2025. \t \tEwit Roos (PhotonVentures) will give insights in the investment strategies in Europe, and how new pathways to venture capital can enable photonic start-ups and scale-ups in the European ecosystem/ \t \tEach of the keynotes will be accompanied by a one-on-one interview diving deeper into the topic, followed by an interactive panel discussion session. The event will be closed by a networking drink.","goal":"","papers":[]},{"sessionid":"5538613","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"17:45-19:30","room":"E1 Exhibition room 1","type":"Special Events","typeColor":"","category":"","title":"Tu5-C Hack your research! Tools and tricks for today’s telecommunications techies","description":"Join us at Hack Your Research for an exciting event featuring interactive demos of the most powerful tools and techniques used by expert researchers and professionals to simplify all aspects of optical communication research. Whether you are a student or a highly experienced researcher, everyone is welcome! Come and learn from the trial-and-error experiences of others, connect with peers and experts and engage in stimulating discussions, all while enjoying light food and drinks in a relaxed and fun environment.\tOrganizing Committee: \tBesma Kalla, Eindhoven University of Technology, Netherlands \tGiammarco Di Sciullo, Università degli Studi dell’Aquila, Italy \tAmol Delmade, Pilot Photonics, Ireland\tAdvisory Committee: \tMarco Eppenberger, PsiQuantum, USA \tVincent van Vliet, Eindhoven University of Technology, Netherlands \tRekha Yadav, University College London, United Kingdom\tDemo Presenters\tDemo 1 \tTitle: Designing an experimental setup using CAD \tPresenter: Omar Abdel-Aal - Eindhoven University of Technology, the Netherlands\tAbstract: This demo shows how to use Autodesk Inventor to create a 3D blueprint of your setup. Check tolerances, align optics, ensure components fit, and design custom 3D-printed parts which help you avoid headaches during assembly even before purchasing any components.\tDemo 2 \tTitle: Making Wavelength Selective Switching Devices \tPresenter: Lauren Dallachiesa - Nokia Bell Labs, USA\tAbstract: Come and look inside a wavelength selective switch and a channel blocker. We'll talk through the shared architecture, the one design choice that separates them, the budgets that limit both, and the alignment, gluing and calibration that make a built device work.\tDemo 3 \tTitle: From the Theory to the Lab: Utilizing Simulations to Guide Experimental Work in SDM Fibers \tPresenter: Lucas Alves Zischler - University of L'Aquila, Italy\tAbstract: Many physical effects occur simultaneously in space-division-multiplexed fiber systems,making measurements challenging to interpret. Theory helps disentangle these effects and connect experimental observations to their physical origins. Using examples from non-linear measurements in multimode and multicore fibers, this demo illustrates how simulations and analytical models can aid studies in these novel fiber types.\tDemo 4 \tTitle: Recirculating loops: go across the ocean comfortably sitting in your lab \tPresenter: Stefano Gaiani - National Institute of Information and Communications Technology, Japan\tAbstract: The total available length of optical fibers in laboratories is always limited, which makes research on transmission over long-haul and transoceanic distances more complex. Here, we detail how to set up a multiband recirculating loop to perform experiments with single-mode and SDM fibers over hundreds or thousands of kilometers starting from just a few kilometers of fiber.\tDemo 5 \tTitle: Lab Equipment Control with python \tPresenter: Julian
