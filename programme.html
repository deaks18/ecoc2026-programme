,"day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"17:00-18:30","room":"A1 Auditorium 1","type":"Tutorial and contributed session","typeColor":"#dae3f3","category":"SC 10: Control and management of optical networks","title":"We5-A Network operation and fault management in optical networks","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Shuangyi Yan","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Tutorial","code":"#1416 / We5-A1","title":"SDN Agents for IPoWDM Routers and Coherent Pluggables","speaker":"Andrea Sgambelluri","affiliation":"Scuola Superiore Sant'Anna","authors":"Andrea  Sgambelluri, Nicola  Sambo, Piero  Castoldi, Filippo  Cugini","start":"17:00","end":"18:00","abstractid":213043,"order":1,"abstract":"Abstract (summary)  This tutorial presents an overview of the IPoWDM technology and devices, coherent pluggable transceivers and recent studies on SDN agents enabling the deep control of those devices, exposing standard NETCONF/YANG APIs, while envisioning the next future towards agentic paradigm.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_Tutorial (2).pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Joao Pedro","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1311 / We5-A2","title":"Experimental Multimodal Dataset and Benchmark for Soft-Fault Classification in Coherent Optical Transmission Systems","speaker":"Zhiming Sun","affiliation":"Peking University","authors":"Zhiming  Sun, Xiang  Cai, Runzhe  Fan, Xulong  Yan, Cen  Wang, Xian  Zhou, Fan  Zhang","start":"18:00","end":"","abstractid":212531,"order":2,"abstract":"Abstract (summary)  We present a multimodal experimental dataset for soft-fault classification in coherent optical transmission systems. It contains 3463 receiver captures, 34 structured features, and four tensor modalities. Extra Trees achieves 0.9356 macro-F1 on the four-class benchmark, with WSS showing the clearest separation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1311.pdf"},{"role":"speaker","rolename":"Contributed","code":"#812 / We5-A3","title":"Fault Prediction and Localization in Optical Networks Based on Incremental Tensor Network-GRU","speaker":"Yuxuan Gao","affiliation":"Beijing University of Posts and Telecommunications","authors":"Yuxuan  Gao, Cristina  Rottondi, Andrea  Bianco, Bingli  Guo, Andrea  Sgambelluri, Luca  Valcarenghi, Emilio  Paolini, Shanguo  Huang","start":"18:15","end":"","abstractid":211995,"order":3,"abstract":"Abstract (summary)  An iTenGRU model is proposed for fault prediction and localization,achieving 91% prediction and 96% localization accuracy in the testbed.When retraining less than 1% of parameters on unseen faults, >93% prediction and 96% localization accuracy with respect to full retraining are still achieved.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-812.pdf"}]},{"sessionid":"5538454","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"17:00-18:30","room":"A2 Auditorium 2","type":"Invited and contributed","typeColor":"#f4cccc","category":"SC 03: Photonic integrated circuits, assemblies and packaging","title":"We5-B Optical transmitters and transceivers","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Chin-Hui (Janet) Chen","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#1430 / We5-B1","title":"Progress of High-speed VCSELs and VCSEL-based Co-Packaging for Short Reach Communications","speaker":"Daniel Michael Kuchta","affiliation":"Nvidia Corp.","authors":"Daniel  Kuchta","start":"17:00","end":"17:30","abstractid":214702,"order":1,"abstract":"Abstract (summary)  This talk will cover the state of art of VCSELs used for short reach data communications and VCSEL-based packaging solutions of co-packaged transceivers for scale-up applications.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Invited Paper_Kuchta v3d_1.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Lian Qin","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#290 / We5-B2","title":"19.1-THz Tunable Wideband TFLN/SiPh Hybrid Integrated 800G CFP2 Transceiver for AIDC Scale-Across Clusters","speaker":"Baoluo Yan","affiliation":"ZTE Corporation","authors":"Baoluo  Yan, Decai  Deng, Zhenqian  Yang, Tao  Qin, Haiqing  Zhu, Shikui  Shen, Dongchen  Zhang, Hong  Liu, Hu  Shi, Zhiyong  Zhao, Yangguang  Liu, Kezhi  Qiao","start":"17:30","end":"","abstractid":211045,"order":2,"abstract":"Abstract (summary)  We demonstrate a CFP2 coherent transceiver with hybrid TFLN/SiPh COSA and ultra-wideband SOA, enabling 800G PS-16QAM across 19.1-THz S+C+L bands. Achieving 0-dBm output, >35-dB Tx OSNR, and 74.8% fiber saving, it addresses AIDC scale-across cluster demands.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-290.pdf"},{"role":"speaker","rolename":"Contributed","code":"#44 / We5-B3","title":"Industry’s First 12.8T 8×DR8 High-Density Liquid-Cooled 64-Channel Pluggable XPO Optical Module for Scale-Up","speaker":"Sunil Priyadarshi","affiliation":"Arista Networks","authors":"Sunil  Priyadarshi","start":"17:45","end":"","abstractid":209766,"order":3,"abstract":"Abstract (summary)  This work presents a 12.8T liquid-cooled pluggable optical module addressing bandwidth and thermal challenges in AI data centers. The XPO architecture enables high-density silicon photonics integration. Measurements demonstrate 212 Gbps PAM4 performance, ~188 W power consumption, and improved thermal efficiency. ©2026 The Author(s)","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-44.pdf"},{"role":"speaker","rolename":"Invited","code":"#437 / We5-B4","title":"Advanced Industrial Silicon Photonics Platform on 300mm wafer for Optical Interconnect and Beyond","speaker":"Frederic Boeuf","affiliation":"STMicroelectronics","authors":"Frederic  Boeuf, Louise-Eugenie  Bataille, Leopold  Virot, Stephane  Allegret, Guillaume  Bruel, Marvin  Frauenrath, Sylvain  Guerber, André  Myko, Daivid  Fowler, Aurelia  Plihon, David  Henry, Amelie  Bellemin-Comte, Marion  Volpert, Eva  Kempf, Lorenzo  Lazzari, Stephane  Monfray, Victor  Milon, Benjamin  Blampey, Sylvie  Gellida, Sebastien  Cremer","start":"18:00","end":"","abstractid":211375,"order":4,"abstract":"Abstract (summary)  We review the development of 300mm wafer Silicon Photonics platform for 200Gbps/lane  and its extension towards Co-Packaged-Optics (CPO) through the addition of 110GHz GeSi electro-absorption modulator (EAM), 70GHz Micro-Ring Modulators (MRM) and Through Silicon Via (TSV). Investigations on integration of III-V materials is also discussed.","pdf":"/static/upload/ow193/events/ev667/abssub/boeuf-ecoc-paper-2026_VF_1.pdf"}]},{"sessionid":"5538458","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"17:00-18:30","room":"E1 Exhibition room 1","type":"Invited and contributed","typeColor":"#d9ead3","category":"SC 08: Sensing and microwave photonics","title":"We5-C Integrated sensing and communication","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"María del Rosario Fernández-Ruíz","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#822 / We5-C1","title":"Experimental Assessment of CP-DAS+DWDM Co- and Counter-propagation in C+L Bands","speaker":"Hugo Fidalgo Martins","affiliation":"Instituto de Óptica CSIC (IO-CSIC)","authors":"Laura  Hernández-Martín, Saverio  Pellegrini, Giuseppe  Rizzelli, Juan Diego  Ania-Castañón, Hugo Fidalgo  Martins, Roberto  Gaudino","start":"17:00","end":"","abstractid":212005,"order":1,"abstract":"Abstract (summary)  An in-depth experimental characterization of the compatibility between C+L band DWDM coherent transmission and chirped-pulse DAS is performed under realistic conditions, showcasing strong impairments to the telecom signals in co-propagating configurations, but robust performance in counter-propagation, with DAS performance largely unaffected in both cases.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-822.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Sonia Martín López","affiliation":"Consejo Superior de Investigadores Científicas","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#85 / We5-C2","title":"Field Trial of SDN-controlled Point-to-MultiPoint Sensing of Weak Urban Events in 50G HS-PON","speaker":"Margarita Fylaktaki","affiliation":"Aristotle University of Thessaloniki","authors":"Margarita  Fylaktaki, Maria  Vargemidou, Fabienne  Saliou, Erwan  Deleurme, Savvas I.  Raptis, Maël  Bideau, Chris  Vagionas, Nikos  Pleros, Philippe  Chanclou, Amalia  Miliou","start":"17:15","end":"","abstractid":210449,"order":2,"abstract":"Abstract (summary)  The first field-trial of Point-to-MultiPoint sensing in field-deployed 50G HS-PONs is demonstrated exploiting real-time SDN-allocation of its wavelength-tunable sensing-channels and wavelet-transform-based DSP-techniques for detection of weak non-stationary urban events beyond the limits of conventional Fourier-transform spectrograms","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-85.pdf"},{"role":"speaker","rolename":"Invited","code":"#806 / We5-C3","title":"Advancing Forward-Transmission Fibre Sensing for Precise Event Localisation","speaker":"Jian Fang","affiliation":"NEC Laboratories America","authors":"Jian  Fang, Ming-Fang  Huang, Ezra  Ip, Scott  Kotrla, Jeffrey  Mundt, Yue-Kai  Huang, Ting  Wang, Yoshiaki  Aono","start":"17:30","end":"18:00","abstractid":211989,"order":3,"abstract":"Abstract (summary)  We review recent progress in forward-transmission fibre sensing from a practical perspective, revisit the fundamental challenges in the localisation performance, and discuss possible approaches to improve event localisation accuracy.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Invited_Final2.pdf"},{"role":"speaker","rolename":"Contributed","code":"#753 / We5-C4","title":"Large-Scale Integrated Sensing and Communication over Bidirectional 200-Gb/s Coherent PON with 256 ONUs","speaker":"Qi Wu","affiliation":"The Hong Kong Polytechnic University","authors":"Qi  Wu, Shuai  Qu, Zhihang  Tang, Xiaoying  Zhang, Chao  Lu, Kangping  Zhong, Alan Pak Tao  Lau, Yaxi  Yan","start":"18:00","end":"","abstractid":211928,"order":4,"abstract":"Abstract (summary)  We experimentally demonstrate a large-scale PON that integrates distributed optical fiber sensing with bidirectional single-wavelength 200-Gb/s transmission. The system achieves 37-dB optical power budgets, 25-m localization accuracy, and supports up to 256 ONUs with distinguishable multi-point simultaneous vibrations.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-753.pdf"},{"role":"speaker","rolename":"Contributed","code":"#422 / We5-C5","title":"Over-80-km Transmission of Image-Derived Semantic Data via a Distributed Fiber-Optic Acoustic Sensing Link","speaker":"Wataru Kohno","affiliation":"NEC Corporation","authors":"Wataru  Kohno, Sarper  Ozharar, Yaowen  Li, Shuji  Murakami, Junqiang  Hu, Ting  Wang","start":"18:15","end":"","abstractid":211327,"order":5,"abstract":"Abstract (summary)  We demonstrate underwater acoustic transmission of image-derived semantic messages using an over-80-km distributed fiber-optic acoustic sensing link with chirp-coded pulse interrogation, Raman amplification, and fiber-optic hydrophones. At 50~bps with Raman amplification, 100 scene-graph messages (21,193 bits) are delivered without observed errors (BER upper bound $<4.72\\times10^{-5}$","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-422.pdf"}]},{"sessionid":"5538462","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"17:00-18:15","room":"C1.1 Conference room 1.1","type":"Invited and contributed","typeColor":"#c9daf8","category":"SC 09: Free-space optics and optical wireless technologies","title":"We5-D Optical wireless technologies for next-generation networks  systems","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Volker Jungnickel","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Beatriz Ortega Tamarit","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Invited","code":"#1090 / We5-D1","title":"In-Orbit Demonstration of Dual-ITLA Silicon Photonics Coherent Optical Module Supporting 100/200 Gbps Communications","speaker":"Quan Li","affiliation":"Shanghai Optoelectronics Science and Technology Innovation Center","authors":"Quan  Li, Fang  Wei, Xiao  Hu, Kun  Zhao, Quan  Cao, Luluzi  Lu, Hong  Liang, Jinwen  Song, Yi  Yan, Jianlai  Du, Wei  Chu, Jiao  Chai, Yun  Cao, Jianfeng  Sun, Haiwen  Cai","start":"17:00","end":"17:30","abstractid":212292,"order":4,"abstract":"Abstract (summary)  We demonstrate the in-orbit validation of a dual-ITLA silicon photonics coherent optical module for LEO inter-satellite laser communication. In-orbit loopback test at 492 km LEO confirms the key performances at both 100 Gbps and 200 Gbps PM-QPSK modes.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1090.pdf"},{"role":"speaker","rolename":"Contributed","code":"#615 / We5-D2","title":"Hybrid Free-space-optics and Millimetre-wave D-band Trans-mitter enabled by Optically Harmonically Locked Lasers","speaker":"Zichuan Zhou","affiliation":"University College London","authors":"Zichuan  Zhou, Zun  Htay, Amany  Kassem, Izzat  Darwazeh, Zhixin  Liu","start":"17:30","end":"","abstractid":211767,"order":4,"abstract":"Abstract (summary)  We demonstrated hybrid free-space optics (FSO) and D-band (110-170GHz) millimetre wave transmitter enabled by a single phase-locked laser pair, simultaneously enabling ultra-low RF phase noise and optical linewidth for communications. Based on this, we further study combined capacity with beam angle misalignment using >100Gb/s signalling.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-615.pdf"},{"role":"speaker","rolename":"Invited","code":"#1392 / We5-D3","title":"Optical Satellite Communication Systems – A Canadian Perspective","speaker":"Steve Hranilovic","affiliation":"McMaster University","authors":"Steve  Hranilovic, Liam  Flannigan, Jonathan D.B.  Bradley, M. Jamal  Deen, Andrew P.  Knights, Shiva  Kumar, Chang-Qing  Xu, Rafael  Kleiman","start":"17:45","end":"","abstractid":212630,"order":5,"abstract":"Abstract (summary)  Optical satellite communications is maturing globally, yet Canada faces unique challenges including high-latitude orbital constraints, persistent cloud cover, and connectivity for remote northern communities. This paper surveys recent Canadian research at McMaster University highlighting advances in coherent receivers, mid-infrared links, silicon photonics, and adaptive optics.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026-2_1.pdf"}]},{"sessionid":"5538466","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"17:00-18:15","room":"C1.4 Conference room 1.4","type":"Invited and contributed","typeColor":"#dce6f1","category":"SC 07: Optical networks for access, mobile X-haul, in-building, and intra-datacentre interconnects","title":"We5-E PON sensing, monitoring & energy efficiency","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Paola Parolari","affiliation":"Politecnico di Milano","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#294 / We5-E1","title":"Sensing in PON – techniques and applications","speaker":"Jochen Maes","affiliation":"Nokia Bell Labs","authors":"Jochen  Maes, Robbe  Van Rompaey, Christoph  Füllner, Michael  Straub, Sterenn  Guerrier, Robert  Borkowski, Kovendhan  Vijayan, Dora  Van Veen, Vincent  Houtsma","start":"17:00","end":"17:30","abstractid":211050,"order":1,"abstract":"Abstract (summary)  We provide an overview of use cases and methodologies for sensing in passive optical networks. With its point-to-multipoint nature, we address the potential to resolve events between drop fibers, and the preference for low-cost central-side solutions.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26_Maes_Sensing_Invited_for_upload_20260422_1.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Salvatore Spadaro","affiliation":"Technical University of Catalonia (UPC)","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#392 / We5-E2","title":"Burst-Mode Polarization Sensing and ODN Monitoring for Aerial Fiber Using a Commercial 25G PON","speaker":"Vincent Houtsma","affiliation":"Nokia, Bell Labs","authors":"Vincent  Houtsma, Doutje  Van Veen, Robert  Borkowski, Sandip  Das, Michael  Straub, Kovendhan  Vijayan, Robbe  Van Rompaey, Jochen  Maes","start":"17:30","end":"","abstractid":211256,"order":2,"abstract":"Abstract (summary)  We report on a low-cost polarization sensing element located at OLT side of a commercial 25G PON system to enable ODN monitoring. Sensing is performed in burst-mode on upstream PON wavelength. Field results using aerial fiber are reported as well.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-392.pdf"},{"role":"speaker","rolename":"Contributed","code":"#389 / We5-E3","title":"Experimental Demonstration of Simultaneous SOP Sensing on All Active ONUs in Upstream GPON","speaker":"Saverio Pellegrini","affiliation":"Dipartimento di Elettronica e Telecomunicazioni, Politecnico di Torino","authors":"Saverio  Pellegrini, Laura  Greborio, Giuseppe  Rizzelli, Valter  Ferrero, Annachiara  Pagano, Roberto  Gaudino","start":"17:45","end":"","abstractid":211239,"order":3,"abstract":"Abstract (summary)  We experimentally investigate SOP-based sensing in upstream GPON using a single OLT-side polarimeter, focusing on sampling rate, synchronization, averaging strategies, and resulting SOP angular deviation. We show coarse localization capabilities, discriminating whether vibrations occurred on the feeder or in each distribution fiber.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-389.pdf"},{"role":"speaker","rolename":"Contributed","code":"#125 / We5-E4","title":"Experimental Evaluation of Energy Saving in XGS-PON ONU","speaker":"Philippe Chanclou","affiliation":"Orange","authors":"Philippe  Chanclou, Stéphane  Le Huérou, Fabienne  Saliou, Gaël  Simon, Jérémy  Potet","start":"18:00","end":"","abstractid":210663,"order":4,"abstract":"Abstract (summary)  This paper experimentally evaluates XGS-PON ONU doze mode, demonstrating up to 1 Watt energy savings while preserving service continuity. It analyzes how low-power and aware intervals affect consumption, and shows practical bandwidth–energy trade-offs for 128 shared ONUs and supporting greener broadband network operation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-125.pdf"}]},{"sessionid":"5538470","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"17:00-18:30","room":"C2.1 Conference room 2.1","type":"Invited and contributed","typeColor":"#ead1dc","category":"SC 11: Quantum communications, physical layer security, and optical quantum technologies","title":"We5-F Quantum devices","description":"","goal":"","papers":[{"role":"speaker","rolename":"Contributed","code":"#746 / We5-F1","title":"Contextuality-based Integrated Semi-Device-Independent Quantum Random Number Generator","speaker":"Maddalena Genzini Genzini","affiliation":"Technical University of Denmark","authors":"Maddalena  Genzini, Caterina  Vigliar, Mujtaba  Zahidy, Hamid  Tebyanian, Andrzej  Gajda, Klaus  Petermann, Lars  Zimmermann, Davide  Bacco, Francesco  Da Ros","start":"17:00","end":"","abstractid":211920,"order":1,"abstract":"Abstract (summary)  We demonstrate an integrated semi-device-independent quantum random number generator based on contextuality. By implementing a KCBS inequality test on a programmable photonic circuit, we certify genuine randomness and achieve an extractable rate of 0.077 bits per round, enabling scalable, chip-based certified QRNGs.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-746.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Yunhong Ding","affiliation":"DTU Electro, Technical University of Denmark","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#468 / We5-F2","title":"High-Speed Quantum Random Number Generator Using Flip-Chip Bonded Laser","speaker":"Axl Bomhals","affiliation":"IDLab, Ghent University - imec","authors":"Axl  Bomhals, Sarah  Bastiaens, Simone  Cammarata, Cédric  Bruynsteen, Xin  Yin","start":"17:15","end":"","abstractid":211457,"order":2,"abstract":"Abstract (summary)  We present an advancement in quantum random number generator integration by using a fully integrated vacuum fluctuation-based noise source containing a flip-chip bonded laser and low-noise TIA to produce secure random numbers in real-time at rates up to 87.46 Gbit/s.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-468.pdf"},{"role":"speaker","rolename":"Invited","code":"#1413 / We5-F3","title":"Engineering Deterministic Quantum Light Sources at Telecom Wavelengths","speaker":"Elizaveta  Semenova","affiliation":"Technical University of Denmark","authors":"Pawel  Holewa, Karolina E.  Polczynska, Christian  Ruiz, Emilia  Zieba-Ostój, Daniel A.  Vajner, Marek Grzegorz  Mikulicz, Baptiste  Lefaucher, Pawel  Mrowinski, Pawel Daniel  Wyborski, Battulga  Munkhbat, Meng  Xiong, Kresten  Yvind, Niels  Gregersen, Alexander  Huck, Tobias  Heindel, Marcin  Syperek, Elizaveta  Semenova","start":"17:30","end":"18:00","abstractid":213035,"order":3,"abstract":"Abstract (summary)  Deterministic telecom quantum light sources are limited by stochastic emitter properties and placement. We present paths to address these issues: near-critical InAs/InP quantum dot (QD) epitaxy, Stark tuning, deterministic cavity fabrication, and site-controlled epitaxy,- enabling QD device fabrication with improved yield, tunability, and single-photon purity.","pdf":"/static/upload/ow193/events/ev667/abssub/Semenova_4.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1377 / We5-F4","title":"Ultra-Compact and High-Bandwidth Silicon Photonic Chip for Fully Integrated CV-QKD Systems","speaker":"Taijie Li","affiliation":"zhejiang university","authors":"Taijie  Li, Gong  Zhang","start":"18:00","end":"","abstractid":212599,"order":4,"abstract":"Abstract (summary)  We demonstrate a fully integrated CV-QKD chip system including a laser chip, a transimpedance amplifier chip, and silicon photonic chips, which features a compact micro-ring IQ modulator and a high-speed homodyne detector operating up to >16 GHz frequency","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1377.pdf"},{"role":"speaker","rolename":"Contributed","code":"#681 / We5-F5","title":"Towards Scalable Quantum Clock Synchronization Networks Using InGaAs Single Photon Avalanche Detectors and High-Brightness Integrated Entanglement Photon Pair Sources","speaker":"Kostas Sozos","affiliation":"University of West Attica, Department of Informatics and Computer Engineering","authors":"Kostas  Sozos, Panagiotis  Kourelias, Hercules  Nicolaides, Kamil  Gradkowski, Xiuyun  He, Noreen  Nudds, Alexandre  Bazin, Aristeidis  Stathis, Argiris  Ntanos, Dimitris  Apostolopoulos, Hercules  Avramopoulos, Veronika  Kaminski, Ekaterina  Protsenko, Caterina  Vigliar, Alberto  Tosi, Charis  Mesaritakis, Giannis  Giannoulis, Adonis  Bogris","start":"18:15","end":"","abstractid":211847,"order":5,"abstract":"Abstract (summary)  We experimentally showcase the potential of ps-level precision quantum clock synchronization based on silicon nitride microring resonators as sources of entangled photons. We also propose a quantum clock synchronisation architecture that improves scalability requiring only one single-photon avalanche detector per user at the server side.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-681.pdf"}]},{"sessionid":"5538474","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"17:00-18:30","room":"C2.2 Conference room 2.2","type":"Invited and contributed","typeColor":"#e4dfec","category":"SC 04: Signal processing for optical communication and sensing","title":"We5-G Advance phase and timing recovery","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Andrea Carnio","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#846 / We5-G1","title":"Mitigation of Error Bursts after Pilot-Aided Carrier Phase Recovery","speaker":"Han Cui","affiliation":"Chalmers University of Technology","authors":"Han  Cui, Frank  R. Kschischang, Magnus  Karlsson, Erik  Agrell","start":"17:00","end":"","abstractid":212035,"order":1,"abstract":"Abstract (summary)  We propose two phase estimation error (PEE)-aware schemes for bursty phase noise channels: one based on average PEE and one capturing bursty PEE statistics. Simulations show that both outperform the conventional scheme, with the latter performing best under strong burst conditions.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-846.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Sjoerd Van Der Heide","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#709 / We5-G2","title":"Phase-Recovery-Free 6bit/4D Coherent Transmission Using Subcarrier-Joint Modulation for Large-Linewidth Lasers","speaker":"Tianhong Zhang","affiliation":"Peking University","authors":"Tianhong  Zhang, Yutong  Pan, Yixiao  Zhu, Wenhao  Wang, Ning  Zhang, Fan  Zhang","start":"17:15","end":"","abstractid":211877,"order":2,"abstract":"Abstract (summary)  We propose a subcarrier-joint modulation scheme and experimentally demonstrate, to the best of our knowledge, the first high-order coherent transmission without phase recovery in a large-linewidth system. Robust 80-km operation and strong linewidth tolerance are verified under 100-kHz and 1-MHz lasers.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-709.pdf"},{"role":"speaker","rolename":"Contributed","code":"#370 / We5-G3","title":"Baud-Rate Timing Recovery with 1UI DGD Tolerance for Dual Polarization Coherent Systems","speaker":"Xiaofei Su","affiliation":"FRDC","authors":"Xiaofei  Su, Tong  Ye, Jingnan  Li, Hisao  Nakashima, Takeshi  Hoshida, Yasuhiko  Aoki, Zhenning  Tao","start":"17:30","end":"","abstractid":211197,"order":3,"abstract":"Abstract (summary)  A baud-rate timing recovery to mitigate the impact of polarization mode dispersion is proposed and validated by simulations and experiments. It does not rely on successful PMD compensation and carrier phase recovery and achieves 1 UI DGD tolerance, enhancing robustness in baud-rate coherent systems.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-370.pdf"},{"role":"speaker","rolename":"Contributed","code":"#51 / We5-G4","title":"Receiver-Side Compensation of TI-DAC Offset Mismatch in Optical Transceivers","speaker":"Xuefeng Tang","affiliation":"Huawei Technologies Canada","authors":"Meng  Qiu, Xuefeng  Tang, Yiki  Fung, Chuandong  Li","start":"17:45","end":"","abstractid":209879,"order":4,"abstract":"Abstract (summary)  We propose a calibration and compensation technique, performed in receiver digital signal processing, to mitigate effects of offset mismatch in digital-to-analog converters (DAC) with time-interleaving (TI). It enables on-demand re-calibration during system operation thanks to its post-processing nature, and achieves effective compensation with low complexity.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-51.pdf"},{"role":"speaker","rolename":"Invited","code":"#255 / We5-G5","title":"Modeling and Mitigation of Equalization-Enhanced Phase Noise","speaker":"Benedikt Geiger","affiliation":"Karlsruhe Institute of Technology","authors":"Benedikt  Geiger, Fred  Buchali, Vahid  Aref, Laurent  Schmalen","start":"18:00","end":"","abstractid":210985,"order":5,"abstract":"Abstract (summary)  Equalization-enhanced phase noise (EEPN) emerges as a key performance limitation in high symbol-rate coherent transmission systems. In this paper, we highlight recent advances in modeling EEPN and show that the temporal Gaussian noise model reproduces the characteristic burst-like SNR degradation, enabling efficient system simulation.","pdf":"/static/upload/ow193/events/ev667/abssub/2026_ECOC_Modeling_and_Mitigation_of_EEPN_1.pdf"}]},{"sessionid":"5538478","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"17:00-18:30","room":"E2 Exhibition room 2","type":"Contributed session","typeColor":"#d0e0e3","category":"SC 05: Optical transmission systems","title":"We5-H Coupled core MCF systems","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Adolfo Cartaxo","affiliation":"Instituto de Telecomunicações","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#664 / We5-H1","title":"1.17-Pbps C + Extended-L Band 68-km Transmission over Field-Installed 12-Coupled-Core Fibre Cable","speaker":"Kohki Shibahara","affiliation":"NTT Inc.","authors":"Kohki  Shibahara, Akira  Kawai, Megumi  Hoshi, Shimpei  Shimizu, Masanori  Nakamura, Fukutaro  Hamaoka, Ryota  Imada, Taiji  Sakamoto, Manabu  Arikawa, Kohei  Hosokawa, Takayuki  Kobayashi, Yutaka  Miyamoto","start":"17:00","end":"","abstractid":211830,"order":1,"abstract":"Abstract (summary)  We demonstrate 10.2-THz-bandwidth 12-coupled-core-fibre multiband transmission over a field-installed cable, achieving a record 1.17-Pbps net capacity (12 SDM × 68 WDM × 1.43 Tbps/λ/SDM). Real-time FPGA-based MIMO-DSP prototype also confirms stable BER performance for 1-GBd QPSK with C+extended-L band spatially-coupled channel copropagation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-664.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Mingming Tan","affiliation":"Aston University","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#810 / We5-H2","title":"Real-Time Dual-Polarization IM-DD Transmission over Coupled-Core 4-Core Fiber Using All-Optical MIMO and FPGA Transceivers","speaker":"Stefano  Grillanda","affiliation":"Nokia Bell Labs","authors":"Stefano  Grillanda, Nicolas  Fontaine, Mohamad Hossein  Idjadi, Kwangwoong  Kim, David  Winter, Cuong  Tran, Haoshuo  Chen, Roland  Ryf, Aymeric  Arnould, Pamir  Oezsuna, Georg  Rademacher, Ronald  Freund, Takuji  Nagashima, Tetsuya  Hayashi","start":"17:15","end":"","abstractid":211993,"order":2,"abstract":"Abstract (summary)  We perform the first real-time dual-polarization IM-DD transmission over 5 km of randomly-coupled 4-core fiber using a silicon photonic all-optical MIMO chip and a real-time DSP engine, made by hard-silicon transceivers inside an FPGA. We show real-time demultiplexing and tracking of 10 Gb/s NRZ-OOK channels.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-810.pdf"},{"role":"speaker","rolename":"Contributed","code":"#666 / We5-H3","title":"Power-Safe Inter-Core Split-Pumping for C+L-Band Distributed Raman Amplified Transmission Using Randomly Coupled 12-Core Fiber","speaker":"Kouki Taguchi","affiliation":"Network innovation Laboratories, NTT inc.","authors":"Kouki  Taguchi, Shimpei  Shimizu, Kohki  Shibahara, Ryota  Imada, Taiji  Sakamoto, Kazuhide  Nakajima, Takayuki  Kobayashi, Yutaka  Miyamoto","start":"17:30","end":"","abstractid":211832,"order":3,"abstract":"Abstract (summary)   We propose an inter-core split-pumping scheme for power-safe operation in distributed Raman-amplified transmission over randomly coupled multicore fibers. A ≥5-dB distributed gain (up to 8.3 dB) in a 51-km 12-core fiber over the 10.2-THz C+L-band is demonstrated with <800 mW launched into each SMF section","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-666.pdf"},{"role":"speaker","rolename":"Contributed","code":"#874 / We5-H4","title":"Unrepeatered 312.5 km Transmission Over a Randomly-Coupled Multicore Fiber With Bidirectional Raman Amplification","speaker":"Ruben Luis","affiliation":"National Institute of Information and Communications Technology","authors":"Ruben  Luis, Besma  Kalla, Daniele  Orsuti, Chiara  Lasagni, Cristian  Antonelli, Michihiro  Nakanishi, Shigehiro  Takasaka, Junji  Yoshida, Shuhei  Tomina, Hirotaka  Sakuma, Takemi  Hasegawa, Tetsuya  Hayashi, Thomas  Bradley, Chigo  Okonkwo, Hideaki  Furukawa","start":"17:45","end":"","abstractid":212066,"order":4,"abstract":"Abstract (summary)  We demonstrate a 39.9 nm, C-band, 312.5 km, 160.8 Tb/s transmission on a 4-core, randomly-coupled, multicore fiber. The link uses bidirectional Raman amplification with conventional and incoherent pumps shared over all cores through random coupling in the fiber.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-874.pdf"}]},{"sessionid":"5538482","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"17:00-18:30","room":"PV-R Multipurpose room","type":"Invited and contributed","typeColor":"#e2efda","category":"SC 02: Discrete photonic devices and technologies","title":"We5-I VCSELs","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Selina Farwell","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#504 / We5-I1","title":"2.3 Tbit/s Backside-Emitting 1060 nm VCSEL Array on Silicon Interposer for CPO Applications","speaker":"Marc  Ganzhorn","affiliation":"Coherent","authors":"Manuel  Kohli, Marc  Ganzhorn, Franz  Eberhard, Wilfried  Maineult, Rokhaya  Mueller, Leonardo  Marcon, Philipp  Taeschler, Christian M.  Schaefer, Wolfgang  Kaiser, Achim  Thies, Donato  Bonfrate, Martin  Spieser, Jean  Teissier, Stefano  Tirelli, Evgeny  Zibik","start":"17:00","end":"","abstractid":211558,"order":1,"abstract":"Abstract (summary)  Communication inside AI datacenters requires highest bandwidth-densities and energy-efficiency. We demonstrate a 2x9 VCSEL array at 128 Gbit/s PAM-4 (2.3 Tbit/s) with 160 µm pitch. We further show 32 Gbit/s NRZ operation up to 125° C without DSP and no power degradation at 125° C.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-504.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Eric Bernier","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1223 / We5-I2","title":"62-GHz Bandwidth 1060-nm Metal-Aperture VCSELs Enabling 256-Gbps PAM4 and Modal-Dispersion-Free SMF/MMF Links","speaker":"Fumio Koyama","affiliation":"Institute of Science Tokyo","authors":"Hameeda  Ibrahim, Ahmed  Hassan, Xiaodong  Gu, Fumio  Koyama","start":"17:15","end":"","abstractid":212435,"order":2,"abstract":"Abstract (summary)  We report record 62-GHz bandwidth in 1060-nm metal-aperture coupled-cavity VCSELs with highly-strained QWs and optimized damping. These devices enable 256-Gbps PAM4 back-to-back and 200-Gbps over 1-km SMF. Additionally, SMF-mode-filtered 500-m MMF (OM4) links exhibit >50-GHz link bandwidth with ±4-µm VCSEL-coupling tolerance, ensuring modal-dispersion-free MMF transmission.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1223.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1221 / We5-I3","title":"Low-Threshold Single-Frequency Intra-Cavity VCSELs for Scalable Cryogenic Computing","speaker":"Behzad Namvar","affiliation":"Tampere University","authors":"Behzad  Namvar, Patrik  Rajala, Teemu  Hakkarainen, Mircea  Guina, Jukka  Viheriälä","start":"17:30","end":"","abstractid":212432,"order":3,"abstract":"Abstract (summary)  VCSELs suitable for cryogenic optical interconnects to superconducting processors are demonstrated. An intra-cavity design was used to minimize Joule losses and ensure high thermal dissipation. Single-mode operation with SMSR > 45 dB and 130 µA threshold is demonstrated at 5 K.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1221.pdf"},{"role":"speaker","rolename":"Contributed","code":"#433 / We5-I4","title":"1060 nm back-emitting VCSEL modulated at 106 Gbps PAM4 transmission over 100 m OM3 MMF for NPO Applications","speaker":"Constance Jui-Hua Chang-Hasnain","affiliation":"Berxel Photonics, USA","authors":"Huawen  Hu, Yipeng  Ji, Binbin  Zhao, Sui  Zhang, Shasha  Li, Jianqiang  Chen, Zhenglai  Zhang, ChihChiang  Shen, Jiaxing  Wang, Connie J.  Chang-Hasnain","start":"17:45","end":"","abstractid":211368,"order":4,"abstract":"Abstract (summary)  We demonstrate 1060 nm back‑emitting VCSELs with 37 GHz bandwidth, −149.5 dB/Hz RIN, and transmits 50 Gbps NRZ and 106 Gbps PAM4 over 100 m OM3 fiber. Accelerated aging predicts >1000‑year lifetime under normal operation, promising for low‑cost optical interconnects.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-433.pdf"},{"role":"speaker","rolename":"Invited","code":"#394 / We5-I5","title":"Performance, Reliability and Manufacturability of 1060nm VCSEL Arrays for AI Data Center Scale-Up","speaker":"Matthew Glenn Peters","affiliation":"Lumentum","authors":"Matthew  Peters","start":"18:00","end":"","abstractid":211261,"order":5,"abstract":"Abstract (summary)  Lumentum’s 1060nm multi-mode VCSEL arrays will enable scalable parallel optical interconnects for high-speed links with excellent power efficiency, thermal performance, and reliability making them well suited for both scale-up bandwidth density and scale-out reach in next-generation data center architectures. ©2026 Matthew Peters","pdf":"/static/upload/ow193/events/ev667/abssub/Matt Peters Invited ECOC_2026_Paper_Submit20260414_1.pdf"}]},{"sessionid":"5538446","day":3,"date":"Wednesday, 23 September 2026","dateISO":"2026-09-23","time":"19:30-22:30","room":"Finca Nadales","type":"Conference Dinner","typeColor":"","category":"","title":"Conference dinner at  Finca Nadales","description":"An Unforgettable Evening in the Heart of Malaga! The conference dinner is the perfect opportunity to network and build lasting connections with colleagues from around the world in a truly magical setting. We will gather at Finca Nadales, a stunning 19th-century historic gem nestled in a lush natural oasis. The evening kicks off with a dynamic networking cocktail featuring refreshing drinks and iconic Spanish starters. This will be followed by an exceptional banquet: a seated two-course dinner concluded by a spectacular dessert. Get ready for a night of inspiration, extraordinary connections, and exquisite cuisine! \tPrivate buses for conference attendees from FYCMA to Hacienda Nadales\tRoute 1: \tFYCMA–MALAGA CITY CENTER–HACIENDA NADALES at 18:45. Route with a stop at CITY CENTER at 19:00 (You can take the bus from that stop at that time) \tHACIENDA NADALES–MALAGA CITY CENTER at 23:00\tRoute 2: \tFYCMA–HACIENDA NADALES at 19:00 \tHACIENDA NADALES–MÁLAGA CITY CENTER at 23:00\tThis information is subject to change; please check the details of the stop at the conference venue.","goal":"","papers":[]},{"sessionid":"5538612","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"","room":"","type":"Registration","typeColor":"black","category":"","title":"Registration","description":"","goal":"","papers":[]},{"sessionid":"5538655","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"08:30-09:00","room":"","type":"Coffee break","typeColor":"black","category":"","title":"Morning coffee","description":"","goal":"","papers":[]},{"sessionid":"5538402","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"09:00-10:30","room":"A1 Auditorium 1","type":"Tutorial and contributed session","typeColor":"#e2efda","category":"SC 02: Discrete photonic devices and technologies","title":"Th1-A Novel modulators","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Wilfried  Maineult","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":3},{"role":"speaker","rolename":"Tutorial","code":"#409 / Th1-A1","title":"Silicon Slow-Light-Based Modulators and High-Efficiency Optical Transmitters","speaker":"Toshihiko Baba","affiliation":"Yokohama National University","authors":"Toshihiko  Baba, Keisuke  Kawahara","start":"09:00","end":"","abstractid":211289,"order":3,"abstract":"Abstract (summary)  We present CMOS-compatible silicon Mach-Zehnder modulators in which slow-light phase shifters enable a small footprint suitable for dense integration, high-speed at 200 Gb/s and beyond, and low bit-energy consumption below 100 fJ/bit. Such modulators also enable reduced transmitter power consumption through an open-collector configuration.","pdf":"/static/upload/ow193/events/ev667/abssub/Baba2026.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Yuriko Maegami","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":4},{"role":"speaker","rolename":"Contributed","code":"#849 / Th1-A2","title":"Epitaxial PLZT Mach–Zehnder Modulators with Low Vπ?L, Low Loss, and High-Speed Operation","speaker":"Keiichi Nashimoto","affiliation":"EpiPhotonics Corp","authors":"Keiichi  Nashimoto","start":"10:00","end":"","abstractid":212039,"order":4,"abstract":"Abstract (summary)  Epitaxial PLZT Mach–Zehnder modulators achieve Vπ·L of 0.21 V·cm with propagation loss of 0.8–0.9 dB/cm. Small-signal measurements show ~25 GHz bandwidth, extendable beyond 40 GHz. The devices also support high optical power operation up to 30 dBm.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-849.pdf"}]},{"sessionid":"5538403","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"09:00-10:30","room":"A2 Auditorium 2","type":"Tutorial and contributed session","typeColor":"#c9daf8","category":"SC 09: Free-space optics and optical wireless technologies","title":"Th1-B Turbulence mitigation in free-space optical communications","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Hidenori Takahashi","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Tutorial","code":"#1428 / Th1-B1","title":"Coherent Free-Space Optical Communications in AtmosphericTurbulence: Principles, Limits, and Emerging Strategies","speaker":"Aniceto Belmonte","affiliation":"","authors":"Aniceto  Belmonte","start":"09:00","end":"","abstractid":214643,"order":1,"abstract":"Abstract (summary)  Coherent free-space optical communication is fundamentally limited by atmospheric turbulence. This tutorial presents a unified statistical modal framework for analyzing performance limits and reviewing mitigation strategies, highlighting statistically matched transmission modes that enable robust and scalable link design without instantaneous wavefront correction.","pdf":"/static/upload/ow193/events/ev667/abssub/Belmonte ECOC 2026 Tutorial Paper.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Eduward Tangdiongga","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#221 / Th1-B2","title":"Turbulence-Resilient MMF-MCF Interface for FSO-to-Fibre SDM Transmission via Adaptive Wavefront Shaping","speaker":"Xuchen Hua","affiliation":"Huazhong University of Science and Technology (HUST)","authors":"Xuchen  Hua, Zhuyixiao  Liu, Mingming  Zhang, Hao  Wu, Huibin  Zhou, Ming  Tang","start":"10:00","end":"","abstractid":210947,"order":2,"abstract":"Abstract (summary)  We demonstrate an interface between free-space OAM-multiplexed link and multi-core fibre link using an MMF-MCF coupling structure with wavefront shaping. We achieve SDM transmission of two 32-GBaud-QPSK channels under turbulence (D/r0 ~14), with channel crosstalk reduced by 12.6 dB compared to conventional mode demultiplexing approach.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-221.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1035 / Th1-B3","title":"Reducing Turbulence-Induced Outages in a Deployed Terrestrial Free-Space Optical Communication Link via Interleaving","speaker":"Kadir Gumus","affiliation":"Eindhoven University of Technology","authors":"Kadir  Gumus, Vincent  Van Vliet, Menno  Van Den Hout, Thomas  Bradley, Eduward  Tangdiongga, Chigo  Okonkwo","start":"10:15","end":"","abstractid":212234,"order":3,"abstract":"Abstract (summary)  We present an experimental study of data interleaving for terrestrial free-space optical communication over a 4.6 km urban testbed. Results demonstrate a two-order-of-magnitude reduction in outage probability. A dependency between measured turbulence strength, interleaver length, and achievable data rate is revealed, enabling robust system design.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1035.pdf"}]},{"sessionid":"5538405","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"09:00-10:30","room":"E1 Exhibition room 1","type":"Contributed session","typeColor":"#e2efda","category":"SC 02: Discrete photonic devices and technologies","title":"Th1-C Photodiodes","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Despoina Petousi","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#201 / Th1-C1","title":"Record Gain-Bandwidth Product Si-Ge Avalanche Photodiode Enabling an 8x300 Gbps DWDM Receiver","speaker":"Chao Cheng","affiliation":"University of Chinese Academy of Sciences","authors":"Chao  Cheng, Xishan  Yu, Qian  Liu, Xianglin  Bu, Shen  Bao, Jintao  Xue, Wenfu  Zhang, Binhao  Wang","start":"09:00","end":"","abstractid":210882,"order":1,"abstract":"Abstract (summary)  We demonstrate a Si-Ge avalanche photodiode with a record 9460 GHz gain-bandwidth product via inductive peaking, achieving a 55 GHz bandwidth and a peak gain of 172. Integrated with dual-ring filters on an SOI platform, it enables an 8×300 Gbps PAM4 DWDM receiver.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-201v2.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Selina Farwell","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#561 / Th1-C2","title":"100-GHz and >0.5-A/W Balanced Photodiodes with Interference-Enhanced Absorption in O- and C-Bands","speaker":"Yuki Yamada","affiliation":"NTT","authors":"Yuki  Yamada, Yusuke  Araki, Takuya  Hoshi, Shohei  Kosuga, Takahiro  Nakamura, Shoko  Tatsumi, Fumito  Nakajima","start":"09:15","end":"","abstractid":211692,"order":2,"abstract":"Abstract (summary)  We demonstrate vertical-illumination InGaAs/InP balanced photodiodes (PDs) using interference-enhanced absorption for high-speed coherent detection. O-band- and C-band-optimized PDs achieve 100 GHz bandwidth, 0.52 A/W responsivity, 0.06 nA dark current, <0.1 dB polarization-dependent loss (PDL), and <-35 dB common-mode rejection ratio (CMRR).","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-561.pdf"},{"role":"speaker","rolename":"Contributed","code":"#110 / Th1-C3","title":"Bias-free operational 200 GHz bandwidth photodetector toward 800 Gbps/ lane communication","speaker":"Toshimasa Umezawa","affiliation":"National Institute of Information and Communications Technology (NICT)","authors":"Toshimasa  Umezawa, Shinya  Nakajima, Atsushi  Matsumoto, Yuya  Yamaguchi, Kouichi  Akahane, Naokatsu  Yamamoto, Satoshi  Shinada","start":"09:30","end":"","abstractid":210612,"order":3,"abstract":"Abstract (summary)  We proposed a bias-free operational 200-GHz photodetector assuming an integrated photoreceiver with a transimpedance amplifier toward the next-generation 800-Gbps per lane optical transceiver. The device performance of its high-baud-rate signal detection are discussed.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-110.pdf"},{"role":"speaker","rolename":"Contributed","code":"#602 / Th1-C4","title":"100 GHz Ge/Si Avalanche Photodiodes Enabling Net 400 Gbps Data Reception at a Low Voltage of 5 V","speaker":"Amir Shahin","affiliation":"Ugent - Imec","authors":"Amir  Shahin, Conor  Coughlan, Nishant  Singh, Hakim  Kobbi, Leandro  Dasilva, Simone  Cammarata, Joris  Vankerrebrouck, Shalini  Jakanadan, Roger  Loo, Swetanshu  Bipul, Imene  Jadli, Xin  Yin, Ozan  Aktas, Filippo  Ferraro, Peter  Ossieur, Dries  Vanthourhout, Joris  Vancampenhout","start":"09:45","end":"","abstractid":211742,"order":4,"abstract":"Abstract (summary)  We present Ge/Si avalanche photodiodes operating at low voltages (<6.5 V) achieving BWs of 100 GHz and 50 GHz at 1.8 A/W and 3.7 A/W responsivity levels across the O- and C-bands, enabling net 400 Gbps PAM-4 data link demonstration below the FEC threshold.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-602.pdf"},{"role":"speaker","rolename":"Contributed","code":"#266 / Th1-C5","title":"High Performance Waveguide GeSi Avalanche Photodiode Fully-integrated on a 220nm Silicon Photonics Platform","speaker":"Jiliang Wu","affiliation":"SiFotonics Technologies Co., Ltd","authors":"Jiliang  Wu, Fan  Qi, Pengfei  Cai, Bin  Shi, Chingyin  Hong, Tehuang  Chiu, Guanghui  Hou, Jiaxing  Zhao, Ming  Sun, Zengwen  He, Dong  Pan","start":"10:00","end":"","abstractid":210999,"order":5,"abstract":"Abstract (summary)  We demonstrate a 100Gbps Ge/Si waveguide APD integrated with low loss SiN edge couplers and other components on a 220nm SOI platform, achieving ultra-low dark currents and record sensitivity. Our results offer a high-density integration path for APDs in high-link budget and low-power dissipation scenarios.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-266.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1125 / Th1-C6","title":"Heterogeneous Integration of Low Loss Si3N4 Waveguides and High-Speed Si-Ge Photodiodes","speaker":"Martin Peyrou","affiliation":"CEA","authors":"Amin  Souleiman, Martin  Peyrou, Léopold  Virot, Baptiste  Routier, Nicolas  Dunoyer, Stéphane  Brision, Jean-Michel  Hartmann, Vincent  Larrey, Franck  Fournel, Gabriel  Lima, Vincent  Mathieu, Sébastien  Kerdiles, Jonathan  Faugier-Tovar, Quentin  Wilmart","start":"10:15","end":"","abstractid":212330,"order":6,"abstract":"Abstract (summary)  We demonstrate a Ge photodiode heterogeneously integrated on a low-loss Si3N4 200mm platform, achieving a 3dB bandwidth beyond 50GHz at 1550nm. This approach enables high-speed photodetection while leveraging low-loss waveguides, compatible with Kerr frequency comb generation, paving the way for highly scalable DWDM transceivers.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1125.pdf"}]},{"sessionid":"5538407","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"09:00-10:15","room":"C1.1 Conference room 1.1","type":"Contributed session","typeColor":"#f4cccc","category":"SC 03: Photonic integrated circuits, assemblies and packaging","title":"Th1-D Advanced photonic integration","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"António Teixeira","affiliation":"PICadvanced SA","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#979 / Th1-D1","title":"Silicon Photonic CWDM Filter with Compact Footprint, Low Loss, Flat-Top Transmission and High Yield","speaker":"Qingzhong Deng","affiliation":"imec","authors":"Qingzhong  Deng, Alaa  Elshazly, Rafal  Magdziak, Liesbeth  Witters, Swetanshu  Bipul, Maumita  Chakrabarti, Dimitrios  Velenis, Filippo  Ferraro, Huseyin  Sar, Peter  Verheyen, Philippe  Absil, Peter  Ossieur, Imene  Jadli, Joris  Van Campenhout","start":"09:00","end":"","abstractid":212175,"order":1,"abstract":"Abstract (summary)  A novel silicon photonic CWDM filter design is proposed and experimentally demonstrated. The design has achieved flat-top transmission across all dies on a wafer, with a device footprint of 48×25µm2, an insertion loss of 0.24±0.18dB, and a channel central wavelength standard deviation of 0.77nm.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-979.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Jose Manuel Luque González","affiliation":"University of Málaga","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1307 / Th1-D2","title":"Dual Self-Injection Locking for Hybrid-Integrated Laser Linewidth Reduction and Stabilization","speaker":"Jamal  Mohammad Khani","affiliation":"UBC","authors":"Omid  Esmaeeli, Jamal  Mohammad Khani, Masih  Bahrani, Tenna  Yuan, Lukas  Chrostowski, Sudip  Shekhar","start":"09:15","end":"","abstractid":212525,"order":2,"abstract":"Abstract (summary)  Short on-chip external cavities improve laser stability but offer limited linewidth reduction, while long reflections narrow linewidth. We combine phase- and amplitude-controlled short and long cavities in a zero-process-change silicon-on-insulator circuit to simultaneously reduce linewidth and enhance stability against reflections in a hybrid-integrated DFB laser.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1307.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1277 / Th1-D3","title":"Field demonstration of an unshielded InP photonic integrated circuit (PIC) onboard a PocketQube picosatellite payload","speaker":"José Manuel Delgado Mendinueta","affiliation":"Carlos III University of Madrid","authors":"José Manuel  Delgado Mendinueta, Robinson  Guzmán, Jéssica  César-Cuello, Eduardo  Alonso, Luis  González-Guerrero, Guillermo  Carpintero Del Barrio","start":"09:30","end":"","abstractid":212493,"order":3,"abstract":"Abstract (summary)  We developed a picosatellite payload with a PIC consisting of a laser and a photodiode, mounted with no metallic shielding. Experimental field results demonstrate a success in the mission after more than one year orbiting the earth, showing no degradation due to ionizing radiation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1277.pdf"},{"role":"speaker","rolename":"Contributed","code":"#578 / Th1-D4","title":"Monolithically Integrated Quad-Line Comb Generation in Thin-Film LiNbO3 enabling 3.2 Tb/s Superchannel Transmission","speaker":"Fabian  Chowanek","affiliation":"Fraunhofer Institute for Telecommunications, Heinrich-Hertz-Institut (HHI), Einsteinufer 37,","authors":"Fabian  Chowanek, Robert  Emmerich, Carsten  Schmidt-Langhorst, Colja  Schubert, Hanwei  Chen, Takeshi  Hoshida, Ronald  Freund","start":"09:45","end":"","abstractid":211711,"order":4,"abstract":"Abstract (summary)  We realize a 3.2 Tb/s superchannel (4x800 Gb/s/λ) at 1550 nm by using monolithic integrated quad-carrier generation. The fabricated TFLN device exhibits 36% on-chip conversion efficiency and 32 dB suppression of interjacent sidelines. Employing 81.1 GBd DP-64QAM, the BER after 100.8 km remains below 2E-2.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-578.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1276 / Th1-D5","title":"Low loss Digitally Tunable Dispersion Controller Using Ridge Waveguides","speaker":"Ruitao  Ma","affiliation":"Zhejiang University","authors":"Ruitao  Ma, Shujun  Liu, Zexu  Wang, Yuyan  Yao, Zejie  Yu, Daoxin  Dai","start":"10:00","end":"","abstractid":212490,"order":5,"abstract":"Abstract (summary)  We demonstrate a low-loss digitally tunable dispersion controller based on rib waveguides on a silicon-on-insulator (SOI) platform. The device achieves a digital dispersion tuning range of −251.87 to +262.33 ps/nm over the 1544–1553.2 nm wavelength band.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1276.pdf"}]},{"sessionid":"5538409","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"09:00-10:15","room":"C1.4 Conference room 1.4","type":"Contributed session","typeColor":"#d9ead3","category":"SC 08: Sensing and microwave photonics","title":"Th1-E Sub-THz transmission and photonic sensing techniques","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Oskars Ozolinš","affiliation":"Riga Technical University","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#585 / Th1-E1","title":"400-Gbit/s Net Transmission Over a 56-m Single-Carrier and Single-Aperture Dual-Polarization Sub-THz Link","speaker":"Joel Dittmer","affiliation":"Institute of Photonics and Quantum Electronics (IPQ), Karlsruhe Institute of Technology (KIT)","authors":"Joel  Dittmer, Dario  Pilori, Akanksha  Bhutani, Felix  Beuthan, Josefine  Seidel, Yanick  Mezger, Axel  Tessmann, Sandrine  Wagner, Lisa  Nolte, Haizheng  Li, Wolfgang  Freude, Christian  Koos, Zwick  Thomas, Laurent  Schmalen, Sebastian  Randel","start":"09:00","end":"","abstractid":211719,"order":1,"abstract":"Abstract (summary)  We demonstrate a single-carrier and dual-polarization wireless point-to-point transmission at 287 GHz over 56 m with a net data rate of 400 Gbit/s using a single aperture. We employ a novel mHEMT receiver and PCS-16-QAM at 64 GBd, compliant with IEEE 802.15.3d.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-585.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Sebastian Randel","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1332 / Th1-E2","title":"In-band Noise Mitigation of Broadband Chirped Signals Based on Joint Time-Frequency Photonic Processing","speaker":"Hao Sun","affiliation":"Institut National de la Recherche Scientifique, Centre Énergie Matériaux Télécommunication (INRS-EMT)","authors":"Xinyi  Zhu, Benjamin  Crockett, Hao  Sun, José  Azaña","start":"09:15","end":"","abstractid":212554,"order":2,"abstract":"Abstract (summary)  We demonstrate a real-time microwave photonic approach for in-band noise mitigation using time–frequency domain processing. In the experiment, chirped signals with up to 23-GHz bandwidth are recovered under strong optical noise, achieving up to ~9 dB SNR improvements for high-speed applications.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1332.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1288 / Th1-E3","title":"Demonstration of Photonic Chip-based Ultra-high-resolution Dual-band Microwave Imaging of Non-cooperative Targets","speaker":"Weichao Ma","affiliation":"Aerospace Information Research Institute, Chinese Academy of Sciences","authors":"Weichao  Ma, Zichao  Shen, Jianwei  Liu, Wangzhe  Li","start":"09:30","end":"","abstractid":212504,"order":3,"abstract":"Abstract (summary)  To break electronic bandwidth bottleneck limited frequency band and resolution, and architectural constraints from generic discrete components, a photonic transceiver chip for radar is presented. It enables concurrent dual-band ultra-high-resolution imaging, demonstrating the first photonic chip-based microwave imaging of non-cooperative targets in realistic environment.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1288.pdf"},{"role":"speaker","rolename":"Contributed","code":"#770 / Th1-E4","title":"Pulsed Interferometry Towards Real Time PON Monitoring with Feeder and Drop Fibres Discrimination","speaker":"Marco Fasano","affiliation":"Politecnico Di Milano","authors":"Marco  Fasano, Georgios Aias  Karydis, Paola  Parolari, Andrea  Madaschi, Charis  Mesaritakis, Adonis  Bogris, Pierpaolo  Boffi","start":"09:45","end":"","abstractid":211949,"order":4,"abstract":"Abstract (summary)  We present a non-invasive interferometric method for simultaneous and unambiguous monitoring of PON drop fibres. Drop fibre discrimination is demonstrated with a 30 km feeder fibre deployed in Athens, even with 1:32 splitting ratio and 52 dB budget losses.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-770.pdf"},{"role":"speaker","rolename":"Contributed","code":"#652 / Th1-E5","title":"Gain-switched DOFC for real-time interrogation of FBGs","speaker":"Minghao Wei","affiliation":"Dublin City University","authors":"Minghao  Wei, Conor  Mcardle, Alejandro  Rosado, Malhar A.  Nagar, Davide  Janner, Prince  Anandarajah","start":"10:00","end":"","abstractid":211815,"order":5,"abstract":"Abstract (summary)  We demonstrate a real-time fibre Bragg grating interrogation system using externally injected gain-switched dual optical frequency comb and embedded receiver. The system achieves interrogation rates up to 1 kHz, while a minimum Bragg wavelength tracking uncertainty of 64.9 fm is obtained at reduced measurement rate.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-652.pdf"}]},{"sessionid":"5538411","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"09:00-10:30","room":"C2.1 Conference room 2.1","type":"Symposia","typeColor":"","category":"","title":"Th1-F Programmable photonics: architectures, control and applications","description":"Programmable Integrated Photonics (PIP) represents a paradigm shift from application-specific PICs to reconfigurable optical subsystems integrating hardware, electronics, and control algorithms.\tOrganisers: Wim Bogaerts (Ghent University–imec), Ioannis Tomkos (University of Patras)\tPart 1. Chair: Ioannis Tomkos\tWim Bogaerts (Ghent University, Belgium). “Introduction: The state of Programmable Photonics”\tDarius Bunandar (co-Founder and Chief Scientist of Lightmatter). \"Photonics for AI Information Processing: Interconnect and Memory Bandwidth Before Computation\"\tKeren Bergman (Columbia University, US). “Programmable photonics for AI clusters”\tDaniel Perez (iPronics, Spain). \"Programmable photonics for Optical Switching\"\tBhavin Shastri (Queens University, Canada). \"Programmable photonic Ising machine for combinatorics and optimization problems\"\tFrancesco Da Ros (Danmark University of Technology, Denmark). \"Physics-Informed Machine Learning to model and compensate thermal crosstalk”\tPanel session (30 mins).","goal":"","papers":[{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Wim Bogaerts","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Ioanis Tomkos","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2}]},{"sessionid":"5538413","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"09:00-10:30","room":"C2.2 Conference room 2.2","type":"Invited and contributed","typeColor":"#fce5cd","category":"SC 06: Architecture, modelling and performance of optical networks","title":"Th1-G Ai-training in optical networks","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Paolo Monti","affiliation":"Chalmers University of Technology","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#878 / Th1-G1","title":"Modeling the Impact of Fiber Latency on Compute-Communication Overlap in Geo-Distributed Multi-Datacenter AI Training","speaker":"Ioannis Papavasileiou","affiliation":"Corning Inc","authors":"Ioannis  Papavasileiou, Sairam  Prabhakar, Indu Kant  Deo, Sergejs  Makovejs","start":"09:00","end":"","abstractid":212070,"order":1,"abstract":"Abstract (summary)  We use discrete-event simulation to quantify the impact of fiber latency on the efficacy of geo-distributed AI model training with data parallelism. We conclude that the optimum distances between two AI clusters is 10-100km, over which hollow-core fiber enables 25% higher compute-communication overlap.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-878.pdf"},{"role":"speaker","rolename":"Contributed","code":"#237 / Th1-G2","title":"Accurate and Dynamic Network Topology Representation based on Functional Block-based Disaggregation for a Common Reference of Network Digital Twins","speaker":"Kiyo Ishii","affiliation":"","authors":"Kiyo  Ishii, Kazuya  Kunita, Hiroyuki  Matsuura, Shu  Namiki, Kenji  Mizutani","start":"09:15","end":"","abstractid":210963,"order":2,"abstract":"Abstract (summary)  We develop a data platform integrating component-level topology and port-based reservations using a relational database for optical network digital twins. Field-testbed experiments evaluate the execution times of digital- and physical-space update operations, demonstrating timely and consistent synchronization and its role as a real-time common reference.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-237.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Takehiro Tsuritani","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#936 / Th1-G3","title":"Agent-to-Agent Protocol Enhanced Multi-Agent Coordination for Autonomous Service Provisioning in Agentic Optical Networks","speaker":"Zihao Cui","affiliation":"Beijing University of Posts and Telecommunications","authors":"Zihao  Cui, Yuchen  Song, Shengnan  Li, Yue  Pang, Min  Zhang, Danshi  Wang","start":"09:30","end":"","abstractid":212129,"order":3,"abstract":"Abstract (summary)  The A2A protocol is implemented into a multi-agent system for autonomous service provisioning in optical networks. The test results demonstrate reliable end-to-end execution across heterogeneous agents, with 100% routing accuracy and low overhead, supporting interoperable and scalable optical network O&M.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-936.pdf"},{"role":"speaker","rolename":"Contributed","code":"#69 / Th1-G4","title":"Anything over Dense Wavelength Division Multiplexing with Programmable Data Planes and Software Defined Networking","speaker":"Cristian Bermudez Serna","affiliation":"Universität der Bundeswehr München","authors":"Cristian  Bermudez Serna, Philip  Diederich, Carmen  Mas-Machuca","start":"09:45","end":"","abstractid":210240,"order":4,"abstract":"Abstract (summary)  This work proposes using Programmable Data Plane (PDP) switches with Digital Coherent Optical (DCO) pluggables to enable Anything over Dense Wavelength Division Multiplexing (XoDWDM) Open Line Systems (OLSs) with Software-Defined Networking (SDN) control plane. Feasibility is verified in a testbed using hardware PDP switches.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-69.pdf"},{"role":"speaker","rolename":"Invited","code":"#165 / Th1-G5","title":"Trade-Offs of AI-based Optical Performance Monitoring and Sensing Techniques","speaker":"Lena Wosinska","affiliation":"Chalmers University of Technology","authors":"Carlos  Natalino, Kaida  Kaeval, Lena  Wosinska","start":"10:00","end":"","abstractid":210770,"order":5,"abstract":"Abstract (summary)  Modern optical networks leverage AI/ML for performance monitoring and fiber sensing across Phi-OTDR/DAS and SOP technologies. We present a unified data-rate framework, showing that monitoring precision choices impact the generated data volumes over nine orders of magnitude, and analyze AI/ML processing trade-offs across these configurations.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Invited_AI_Monitoring_Sensing_202604221147.pdf"}]},{"sessionid":"5538415","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"09:00-10:30","room":"E2 Exhibition room 2","type":"Invited and contributed","typeColor":"#d0e0e3","category":"SC 05: Optical transmission systems","title":"Th1-H Coherent systems","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"David Millar","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#1401 / Th1-H1","title":"High Capacity Coherent Systems: EEPN Characterization, System Impact and Mitigation Options","speaker":"Fred Buchali","affiliation":"Nokia","authors":"Fred  Buchali","start":"09:00","end":"","abstractid":212973,"order":1,"abstract":"Abstract (summary)  Equalization-enhanced phase noise (EEPN) is a critical impairment in high-symbol-rate coherent optical systems. This paper analyses EEPN characteristics, system-level effects, and mitigation options. The dominant role of EEPN-induced timing jitter is demonstrated, and implications for pluggable transceivers across DCI, metro, and long-haul applications are discussed.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Paper_fbuchali_v3_1.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Tomoyuki Kato","affiliation":"1Finity Inc.","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#563 / Th1-H2","title":"Reach Extension of WDM DP-16QAM Signals Based on Decision-Feedforward Digital Backpropagation","speaker":"Takashi Inoue","affiliation":"National Institute of Advanced Industrial Science and Technology (AIST)","authors":"Takashi  Inoue","start":"09:30","end":"","abstractid":211694,"order":2,"abstract":"Abstract (summary)  We experimentally demonstrate an improved decision-feedforward digital backpropagation (DFF-DBP) to mitigate self- and cross-phase modulation in long-distance WDM systems without using neighboring-channel amplitudes. DFF-DBP with optimized design parameters extends the transmission reach of a 21-channel, 64-Gbaud DP-16QAM system from 2140 km to 2634 km.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-563.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1241 / Th1-H3","title":"Post-FEC Performance Prediction Using Distribution Transform Functions Under Non-Stationary Conditions","speaker":"Chuandong Li","affiliation":"Huawei Technologies Canada","authors":"Abbas  Abolfathimomtaz, Jianhong  Ke, Chuandong  Li, Yoones  Hashemi","start":"09:45","end":"","abstractid":212454,"order":3,"abstract":"Abstract (summary)  Static pre-FEC thresholds fail to guarantee requirements under non-stationary conditions. We propose a transform function leveraging pre-FEC distributions for accurate post-FEC estimation, simplifying to specific distribution moments at high SNR. Experimental validation confirms superior accuracy, preventing significant link margin monitoring errors in dynamic fiber environments.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1241.pdf"},{"role":"speaker","rolename":"Contributed","code":"#119 / Th1-H4","title":"Demonstration of PDM-16QAM Transmission Robust to Fast SOP Variations Using Real-Time 2×2 MIMO Equalization on a GPU","speaker":"Manabu Arikawa","affiliation":"NEC Corporation","authors":"Manabu  Arikawa, Takahiro  Odagawa, Kohei  Hosokawa, Norifumi  Kamiya","start":"10:00","end":"","abstractid":210643,"order":4,"abstract":"Abstract (summary)  We demonstrated 5-Gbaud PDM-16QAM transmission using GPU-based real-time DSP with 2×2 MIMO equalization tailored for parallel processing. The pre-FEC BER remained stable below 10-4 for over one hour after 240-km SMF transmission, and degradation was small under fast SOP variations up to 10 krad/s.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-119.pdf"},{"role":"speaker","rolename":"Contributed","code":"#884 / Th1-H5","title":"Optical-Analog-Optical Wavelength Converter for Multi-Domain Optical Direct-Connect Boundaries: 100G/400G Multi-FEC Characterization and Network Demonstration","speaker":"Hiroki Mori","affiliation":"NTT, inc.","authors":"Hiroki  Mori, Junnosuke  Hiyama, Mayuri  Nakagawa, Takeshi  Seki, J. Kenji  Clark, Yuna  Nakamura, Wakako  Maeda, Kohei  Hosokawa, Rie  Hayashi, Emmanuel  Le Taillandier De Gabory, Toshihiko  Tamura","start":"10:15","end":"","abstractid":212076,"order":5,"abstract":"Abstract (summary)  We experimentally evaluate an Optical-Analog-Optical wavelength converter as a boundary node for multi-domain optical direct-connect networks. 100G/400G multi-FEC and multi-vendor measurements indicate OSNR penalty variations correlate more strongly with transceiver-dependent characteristics than with FEC scheme. Multi-domain network demonstration confirms measurable margin and frequency-offset detection capability.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-884.pdf"}]},{"sessionid":"5538488","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"10:30-11:00","room":"","type":"Coffee break","typeColor":"black","category":"","title":"Coffee break","description":"","goal":"","papers":[]},{"sessionid":"5538401","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"11:00-12:30","room":"A1 Auditorium 1","type":"Tutorial and contributed session","typeColor":"#ead1dc","category":"SC 11: Quantum communications, physical layer security, and optical quantum technologies","title":"Th2-A Security of optical communication systems","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Zoe CM Davidson","affiliation":"BT","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Tutorial","code":"#1405 / Th2-A1","title":"Quantum Physical Unclonable Functions: Foundations and Applications","speaker":"Mina Doosti","affiliation":"University of Edinburgh, Quantum Software Lab","authors":"Mina  Doosti","start":"11:00","end":"","abstractid":213011,"order":1,"abstract":"Abstract (summary)  Quantum Physical Unclonable Functions extend the no-cloning principle from states to transformations, enabling hardware-rooted security for quantum networks. This tutorial introduces foundations, security notions, impossibility and positive results, and applications to authentication, identification, hybrid PUFs, and practical quantum communication infrastructures, with implementation considerations and outlook.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC2026_Tutorial_1.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1203 / Th2-A2","title":"Performance Evaluation of Hardening Measures for Quantum Key Management Systems","speaker":"Jonas Berl","affiliation":"Adva Network Security GmbH","authors":"Jonas  Berl, Mario  Wenning, Helmut  Grießer, Tobias  Fehenberger","start":"12:00","end":"","abstractid":212409,"order":2,"abstract":"Abstract (summary)  We propose a hardened QKMS for resilient key relaying, combining secret sharing, PQC-hybridization, path verification, and confidential computing techniques. Emulation of a nation-wide QKD network demonstrates that these safeguards add only minor processing overhead, with overall key relay latency dominated by propagation delay.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1203.pdf"},{"role":"speaker","rolename":"Contributed","code":"#640 / Th2-A3","title":"Breaking AES at 50 km: Long-Range Optical Side-Channel Attack over Fiber","speaker":"Victor Gerenton","affiliation":"SAMOVAR, Télécom SudParis - Institut Polytechnique de Paris","authors":"Victor  Gérenton, Philippe  Jaillon, Antoine  Lavignotte, Rosario  Patanè, Franck  Gillet, Fabienne  Saliou, Catherine  Lepers","start":"12:15","end":"","abstractid":211795,"order":3,"abstract":"Abstract (summary)  Passive optical networks rely on AES-128 for traffic confidentiality. We demonstrate that AES-induced power fluctuations on microcontrollers can modulate a co-powered laser and propagate through 50 km of fiber. This enables key recovery using 1500 optical traces, making this the first long-range optical side-channel attack.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-640.pdf"}]},{"sessionid":"5538404","day":4,"date":"Thursday, 24 September 2026","dateISO":"2026-09-24","time":"11:00-12:30","room":"A2 Auditorium 2","type":"Invited and contributed","typeColor":"#d9ead3","category":"SC 08: Sensing and microwave photonics","title":"Th2-B SoP sensing and aplications","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Ming-Fang Huang","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1364 / Th2-B1","title":"Fully Unsupervised Detection of Physical Contacts on Subsea Cables via State-of-Polarization Monitoring","speaker":"Agastya Raj","affiliation":"Trinity College Dublin","authors":"Agastya  Raj, Alvaro  Doval, Tian  Tian, Steinar  Bjørnstad, Marco  Ruffini","start":"11:00","end":"","abstractid":212586,"order":1,"abstract":"Abstract (summary)  We present a fully unsupervised Fast-Slow DSVDD detector for continuous State-of-Polarization monitoring on a deployed subsea cable. Trained without event labels, it ranks all five confirmed trawler contacts within the top 13 of 122,174 recordings and surfaces additional corroborated cable-contact events.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1364.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Steinar Bjørnstad","affiliation":"Tampnet AS","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#882 / Th2-B2","title":"On SOP Vibration Sensitivity in Hollow Core Fibers and the Impact of Multipath Interference","speaker":"Zhiping Jiang","affiliation":"","authors":"Pedro  Tovar, Yang  Lan, Xutao  Wang, Xianchao  Guan, Han  Luo, Xingyu  Zhou, Zhiping  Jiang","start":"11:15","end":"","abstractid":212074,"order":2,"abstract":"Abstract (summary)  A recent study reported two-order-of-magnitude higher SOP vibration sensitivity in hollow-core fibers (HCF). We demonstrate that multipath interference might greatly skew these measurements when using narrow-linewidth lasers. Utilizing a proposed robust characterization method, we show that HCF SOP sensitivity is actually comparable to solid-core fibers.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-882.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1060 / Th2-B3","title":"State-of-Polarisation (SoP) Monitoring of Wind-Induced Resonance Oscillations on Power Lines","speaker":"Alvaro Doval","affiliation":"Tampnet AS","authors":"Alvaro  Doval, Steinar  Bjørnstad, Krister  De Vries, Kristina  Skarvang Vaskinn","start":"11:30","end":"","abstractid":212260,"order":3,"abstract":"Abstract (summary)  Aeolian vibrations cause fatigue damage to power-line infrastructure. We monitor SoP on a live OPGW link over seven months, correlating with wind-speed data. Discrete resonance tones below 25 Hz occur at wind speeds up to 7 m/s, demonstrating SoP sensing for proactive structural condition monitoring","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1060.pdf"},{"role":"speaker","rolename":"Contributed","code":"#537 / Th2-B4","title":"Per-Span Microwave Frequency Fiber Interferometry in Sub
