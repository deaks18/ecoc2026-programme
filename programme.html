eaker","rolename":"Contributed","code":"#1138 / Mo5-B2","title":"A Unified Framework for Understanding Confinement Loss, and Engineering Bandwidth, and Modal-Dependent Loss in Hollow-Core Fibers","speaker":"Federico Melli","affiliation":"Università di Parma","authors":"Federico  Melli, Daniela  Trivigno, Lorenzo  Rosa, Fetah  Benabid, Annamaria  Cucinotta, Luca  Vincetti","start":"17:15","end":"","abstractid":212343,"order":2,"abstract":"Abstract (summary)  Exploiting a unified framework linking mode-coupling and tube-tunneling losses in Hollow-Core Inhibited-Coupling Fibers, we show how tube shape and position govern transmission bandwidth and anisotropic leakage, revealing Mode-Dependent loss in HC-IC fibers as a controllable outcome of geometric and azimuthal design choices","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1138.pdf"},{"role":"speaker","rolename":"Contributed","code":"#973 / Mo5-B3","title":"Ultra-high Mode Purity and SMF-matched O-Band Hybrid Antiresonant Hollow Core Fiber for Intra Data Center Connection","speaker":"Zihan Dong","affiliation":"Yangtze Optical Fiber and Cable Joint Stock Limited Company","authors":"Zihan  Dong, Peng  Li, Jun  Chu, Lu  Dai, Hongmin  Li, Yifei  Xu, Guoqun  Chen, Anqing  Jia, Lei  Zhang, Jie  Luo","start":"17:30","end":"","abstractid":212169,"order":3,"abstract":"Abstract (summary)  We report the first demonstration of an O-band hybrid antiresonant hollow core fiber with ~ 6000 dB/km LP₁₁ mode loss and 14/240 μm core/coating diameters. Meanwhile, this fiber delivers macrobending loss comparable to G.657.A2, rendering it well suited for high-density IDC interconnections.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-973.pdf"},{"role":"speaker","rolename":"Invited","code":"#862 / Mo5-B4","title":"Active Antiresonant Hollow-Core Fibres Enabled by Internal Semiconductor Quantum-Dot Coatings","speaker":"Alexander Heidt","affiliation":"","authors":"Gabriel  Nagamine, Katarzyna  Rechcinska, Pascal  Hänzi, Mateusz  Winkowski, Fatima  Alhadi, Flavio  Giorgianni, Tadeusz  Stacewicz, Ryszard  Buczynski, Donghyo  Hahm, Victor  Klimov, Alexander  Heidt","start":"17:45","end":"","abstractid":212053,"order":4,"abstract":"Abstract (summary)  We demonstrate an active antiresonant hollow-core fibre with optical gain provided by thin internal semiconductor quantum-dot coatings. In a side-pumped all-fibre cavity, it shows 625-nm laser emission while preserving air-core guidance and eliminating the need for liquid or gas-based gain media.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-862.pdf"}]},{"sessionid":"5538370","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"16:45-18:15","room":"E1 Exhibition room 1","type":"Invited and contributed","typeColor":"#e2efda","category":"SC 02: Discrete photonic devices and technologies","title":"Mo5-C Resonators, TFLT and integrated routing devices","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Yuriko Maegami","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#839 / Mo5-C1","title":"Ultrafast Resonance-Tracking Thin-Film Lithium Tantalate Resonator: Enabling Colorless Self-Coherent Reception","speaker":"Haojie Zhu","affiliation":"Westlake University","authors":"Haojie  Zhu, Lei  Pang, Miao  Deng, Cheng  Zeng, Yuhao  Fang, Jinhong  Xu, Jianghao  Shan, Weiqi  Lu, Dayu  Shi, Xue  Cheng, Shuai  Yuan, Jinsong  Xia, William  Shieh","start":"16:45","end":"","abstractid":212025,"order":1,"abstract":"Abstract (summary)   We demonstrate a high-Q thin-film lithium tantalate (TFLT) microring resonator featuring a fast adaptive resonance-tracking speed with a convergence time below 1.3 μs. The ultrafast-tracking TFLT resonator enables colorless carrier-extracted self-coherent reception, achieving 375-Gbps transmission over 50-km SSMF using an uncooled DFB laser.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-839.pdf"},{"role":"speaker","rolename":"Contributed","code":"#549 / Mo5-C2","title":"Low-Noise Agile FMCW Source via Self-Injection Locking of a DFB Laser to a Micro-Transfer-Printed TFLT-on-Si3N4 Cavity","speaker":"Jinwei Su","affiliation":"Shanghai Jiao Tong University","authors":"Jinwei  Su, Xinhang  Li, Yiqi  Dai, Yifan  Xia, Liangjun  Lu, Yuyao  Guo, Cheng  Zeng, Jinsong  Xia, Jianping  Chen, Linjie  Zhou","start":"17:00","end":"","abstractid":211668,"order":2,"abstract":"Abstract (summary)  We demonstrate a low-noise, frequency-agile FMCW source by self-injection-locking a DFB laser to a micro-transfer-printed TFLT-on-Si3N4 cavity, achieving a 100 Hz linewidth and highly linear frequency sweeps from 1 kHz to 10 MHz.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-549.pdf"},{"role":"speaker","rolename":"Invited","code":"#0 /","title":"Mo5-C3 Thin film lithium tantalate photonic integrated circuits for next generation high speed communications and lasers.","speaker":"Tobias  Kippenberg","affiliation":"","authors":"","start":"17:15","end":"","abstractid":null,"order":3},{"role":"speaker","rolename":"Contributed","code":"#1334 / Mo5-C4","title":"Reconfigurable Optical Routing Using Microring Resonators with Interferometric Arms","speaker":"Hilmi Othman","affiliation":"University of Southampton","authors":"Martin  Skenderas, Hilmi  Othman, Kyle R. H.  Bottrill, David J.  Thomson, Periklis  Petropoulos","start":"17:45","end":"","abstractid":212556,"order":4,"abstract":"Abstract (summary)  We demonstrate energy-efficient, resonance-stable, reconfigurable optical power routing in a microring resonator with interferometrically controlled coupling. The device achieves up to 20 dB power extinction ratio and error-free 80 Gb/s transmission, establishing a compact building block for scalable reconfigurable silicon photonic interconnects.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1334.pdf"},{"role":"speaker","rolename":"Contributed","code":"#803 / Mo5-C5","title":"A 500 Gbps PAM4 Silicon Microdisk Modulator With a 3.2 THz FSR and >110 GHz Bandwidth","speaker":"Houyou Lai","affiliation":"Xi'an Institute of Optics and Precision Mechanics, CAS","authors":"Shenlei  Bao, Houyou  Lai, Chao  Cheng, Wenfu  Zhang, Binhao  Wang","start":"18:00","end":"","abstractid":211986,"order":5,"abstract":"Abstract (summary)  We demonstrate a microdisk modulator with an ultra-high bandwidth exceeding 110 GHz at a 6 dB IL detuning and a FSR of 3.2 THz. Clear PAM4 eye diagrams at 448 and 500 Gbps are obtained, with TDECQ values of 1.41 dB and 2.46 dB, respectively.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-803.pdf"}]},{"sessionid":"5538372","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"16:45-18:15","room":"C1.1 Conference room 1.1","type":"Invited","typeColor":"#FFCCFF","category":"SC 12: CLEO® Special Session on Emerging Trends in Optics and Photonics","title":"Mo5-D Integrated quantum photonics (II)","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Carlos Alonso Ramos","affiliation":"C2N, CNRS","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#0 /","title":"Mo5-D1 Photonic integrated circuits on soi and sin for quantum communications and quantum computing","speaker":"Segolene Olivier","affiliation":"","authors":"","start":"16:45","end":"","abstractid":null,"order":1},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Laurent Vivien","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Invited","code":"#312 / Mo5-D2","title":"Quantum and Classical Photonics for Advanced Smart Applications","speaker":"Roberto Morandotti","affiliation":"","authors":"Domenico  Bongiovanni, Luigi  Di Lauro, Xutong  Wang, Hosne  Shamim, Hao  Yu, Imtiaz  Alamgir, Celine  Mazoukh, Yang  Liu, Nicolas  Perron, Pavel  Dmitriev, Masnad Md.  Mahadi, Monika  Monika, Brent E.  Little, Zhiming  Wang, Ulf  Peschel, Sai T.  Chu, José  azaña, David J.  Moss, Roberto  Morandotti","start":"17:15","end":"","abstractid":211105,"order":2,"abstract":"Abstract (summary)  We report fiber-based and integrated photonic platforms that use time and frequency control to address scalable quantum communication and classical information processing. Through high-dimensional entanglement, ultrafast time-bin encoding, reservoir computing, spectral machine learning, and microcomb optimization, we demonstrate scalable telecom-compatible architectures for next-generation smart applications.","pdf":"/static/upload/ow193/events/ev667/abssub/INVITED-Morandotti R_1.pdf"},{"role":"speaker","rolename":"Invited","code":"#72 / Mo5-D3","title":"III-V nanostructures for lasers and quantum emitters","speaker":"Hark Hoe  Tan","affiliation":"The Australian National University","authors":"Hark Hoe  Tan","start":"17:45","end":"","abstractid":210360,"order":3,"abstract":"Abstract (summary)  Selective area epitaxy is used to grow III-V semiconductor nanostructures – ranging from nanowires to nanosheets to microrings. The nanostructures are then used for various light emitting applications","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Paper_Template - Tan.pdf"}]},{"sessionid":"5538374","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"16:45-18:15","room":"C1.4 Conference room 1.4","type":"Contributed session","typeColor":"#f4cccc","category":"SC 03: Photonic integrated circuits, assemblies and packaging","title":"Mo5-E Packaging and dense integration","description":"","goal":"","papers":[{"role":"speaker","rolename":"Contributed","code":"#1121 / Mo5-E1","title":"Ultra-broadband, Ultra-Dense 2D-Array Optical I/O Interface Enabled by 3D Nanoprinting","speaker":"Huiyu Huang","affiliation":"University of Cambridge","authors":"Huiyu  Huang, Zhitian  Shi, Chunhui  Yao, Richard  Penty, Qixiang  Cheng","start":"16:45","end":"","abstractid":212326,"order":1,"abstract":"Abstract (summary)  We demonstrate a 3D-nanoprinted high-efficiency, ultra-dense 2D-array optical I/O interface for photonic packaging, integrating 16 channels within 160×120μm². Experiments show stable 1–2dB channel losses, with rigorous simulations indicating a potential reduction to 0.4dB.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1121.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Nobuhiko Nishiyama","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#848 / Mo5-E2","title":"Laser-Induced Forward Transfer of Photonic Integrated Circuits","speaker":"Nick de Louw","affiliation":"TNO/PITC","authors":"Nick  De Louw, Gari  Arutinov, Aly  Abdou, Gerwin  Gelinck, Merijn  Giesbers, Sergio  Roso Casares, Akchheta  Karki, Henri  Fledderus, Riccardo  Ollearo","start":"17:00","end":"","abstractid":212038,"order":2,"abstract":"Abstract (summary)  We present laser-induced forward transfer (LIFT) as a novel die-to-wafer assembly approach for photonic integrated circuits (PICs). Placement accuracies approaching 500 nm (3σ) are achieved, alongside efficient electro-optical coupling, underscoring LIFT’s promise for high-throughput, high-precision PIC integration.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-848.pdf"},{"role":"speaker","rolename":"Contributed","code":"#500 / Mo5-E3","title":"Fully Interconnected Die-to-Wafer Hybrid Copper Bonding Process for Opto-Electrical Routing Platforms","speaker":"Da In Song","affiliation":"SAMSUNG ELECTRONICS","authors":"Da In  Song, Byung-Ju  Min, JungHo  Cha, Seok-Geun  Ahn, Sungbong  Park, Shin  Kwon, Yong-Jae  Kim, Kwangil  Shin, Woong  Huh, Hyunjin  Lee, Jaewon  Hwang, Dong Su  Yoo, Yunseo  Lee, Han-Hyoung  Kim, Jihyun  Seo, Hyerin  Kim, Jongmin  Chung, Hyun-Chul  Jung, Kimin  Jun","start":"17:15","end":"","abstractid":211547,"order":3,"abstract":"Abstract (summary)  We demonstrate simultaneous opto-electrical interconnection on a die-to-wafer hybrid bonding system. CMP erosion is < 100 A Å  even with pattern density mismatch between optic and electric layers. Measured evanescent coupler loss is 0.32 dB at 1310 nm and measured electrical resistance is 0.30 Ω.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-500.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1086 / Mo5-E4","title":"Ultra-High-Resolution Silicon Photonic Beamformer via Path-Reversal Optical True-Time Delay","speaker":"Senyu Zhang","affiliation":"Huazhong University of Science and Technology (HUST)","authors":"Senyu  Zhang, Yifei  Chong, Wei  Luo, Yunlong  Li, Shuang  Zheng, Minming  Zhang","start":"17:30","end":"","abstractid":212288,"order":4,"abstract":"Abstract (summary)  We demonstrate a silicon photonic beamformer employing a path-reversal optical true-time delay mechanism, increasing squint-free pointing angles in switched M-bit architectures from 2M to 2M+1-1 without additional delay stages. Our 5-bit chip achieves 63 angles over 35 GHz with <0.5 ps delay error.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1086.pdf"},{"role":"speaker","rolename":"Contributed","code":"#127 / Mo5-E5","title":"Double-Layer Metasurface-based Interface for Dense PIC-to-MCF Polarization-Multiplexed Coupling","speaker":"Yusuke Tsubai","affiliation":"","authors":"Yusuke  Tsubai, Chun  Ren, Takahiro  Suganuma, Go  Soma, Shota  Ishimura, Abdulaziz E.  Elfiqi, Hidenori  Takahashi, Takehiro  Tsuritani, Takuo  Tanemura","start":"17:45","end":"","abstractid":210669,"order":4,"abstract":"Abstract (summary)  Efficient and compact edge-coupling interface between SiN photonic integrated circuit (PIC) and multicore fiber (MCF) is demonstrated using a double-layer metasurface device. The PIC-to-MCF coupling losses below 1.4 dB (numerically) and 4.9 dB (experimentally) with polarization-multiplexing functionality are obtained for all eight channels.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-127.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1197 / Mo5-E6","title":"Hybrid Photonic Integrated O-band PLC with SiN SSC and SOA Array Switches for Lossless Wavelength Selective Switching","speaker":"Amare Kindu  Tesfa","affiliation":"Eindhoven University of Technology","authors":"Amare Kindu  Tesfa, Marijn  Rombouts, Zhaolong  Shi, Boyang  Zheng, Shiyi  Xia, Nicola  Calabretta","start":"18:00","end":"","abstractid":212403,"order":5,"abstract":"Abstract (summary)  We demonstrate O-band lossless wavelength-selective switch using hybrid photonic-integrated U-shaped InP-SOA arrays and silica PLC AWGs with integrated SiN spot-size converters. Results show efficient coupling <1.5dB/facet, 12dB net-gain and WDM 100G/λ PAM4 switching with >46dB on-off ratio and <0.52dB power penalties at KP4.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1197.pdf"}]},{"sessionid":"5538376","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"16:45-18:15","room":"C2.1 Conference room 2.1","type":"Contributed session","typeColor":"#e4dfec","category":"SC 04: Signal processing for optical communication and sensing","title":"Mo5-F ML and nonlinearity mitigation","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Fernando Guiomar","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#755 / Mo5-F1","title":"Unsupervised-Domain-Adaptation Enhanced Learned Subband-based Perturbation Nonlinear Compensation for Optical Transmission Systems","speaker":"Xuan Tang","affiliation":"South China University of Technology","authors":"Xuan  Tang, Wanzhen  Guo, Hao  Deng, Jian  Zhao","start":"16:45","end":"","abstractid":211930,"order":1,"abstract":"Abstract (summary)  We propose a learned subband-based perturbation-aided nonlinear compensation method, enhanced by unsupervised domain adaptation using polarization- and phase-agnostic power moments. Experiments of PS-64QAM signals over 1200 km demonstrate that this method is robust to parameter mismatch and can adapt to channel variations quickly and blindly.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-755.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Adonis Bogris","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1337 / Mo5-F2","title":"A Realistic Implementation of Fast Convergence Hypernetwork-based DSP for Coherent Data Centre Links","speaker":"Samuel Lennard","affiliation":"University College London","authors":"Samuel  Lennard, Fabio Aparecido  Barbosa, Filipe  Marques Ferreira","start":"17:00","end":"","abstractid":212559,"order":2,"abstract":"Abstract (summary)  We experimentally demonstrate a hypernetwork-based algorithm to generate the weights of an adaptive equalizer in 30-GBaud DP-16-QAM coherent transmission. It achieves better performance than conventional algorithms, providing purely feed-forward coherent DSP and locking to unseen channels with comparable computational complexity but without feedback paths.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1337.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1366 / Mo5-F3","title":"Sequential Neural Probabilistic Amplitude Shaping: Learning the Channel’s Language","speaker":"Mohammad Taha Askari","affiliation":"University of British Columbia","authors":"Mohammad Taha  Askari, Lutz  Lampe, Amirhossein  Ghazisaeidi","start":"17:15","end":"","abstractid":212588,"order":3,"abstract":"Abstract (summary)  We present the first neural probabilistic amplitude shaping that outperforms existing methods while accounting for all implementation losses, using a block‑less, easily implementable sequential autoregressive encoder compatible with arithmetic distribution matching, yielding reduced rate loss and higher achievable information rates.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1366.pdf"},{"role":"speaker","rolename":"Contributed","code":"#180 / Mo5-F4","title":"DPD-KAN: Kolmogorov-Arnold Networks for Low Complexity Digital Predistortion in 5G Analog Radio-over-Fiber Systems","speaker":"Rana Ahmad Bilal Khalid","affiliation":"Aston University","authors":"Bilal  Khalid, Fabio  Cavaliere, Luca  Giorgi, Pedro  freire, Sergei K.  Turitsyn, Jaroslaw E.  Prilepsky","start":"17:30","end":"","abstractid":210817,"order":4,"abstract":"Abstract (summary)  We demonstrate the first KAN-based DPD model for 5G analog RoF fronthaul link, achieving a 24.2% lower EVM than multi-layer perceptron and 29.6% lower than Volterra-based GMP at equivalent Bit Operations. To attain an EVM below 2%, KAN requires ≈52% fewer BOPs than a perceptron.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-180.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1042 / Mo5-F5","title":"168-GBd PCS-324QAM Signal Transmission with 2.1-Tb/s Net Bitrate Using Sample-Domain Volterra Nonlinear Pre-distortion","speaker":"Masanori Nakamura","affiliation":"Network Innovation Laboratories, NTT, Inc.","authors":"Masanori  Nakamura, Fukutaro  Hamaoka, Takayuki  Kobayashi, Etsushi  Yamazaki","start":"17:45","end":"","abstractid":212241,"order":5,"abstract":"Abstract (summary)  We demonstrate 168-GBd PCS-324QAM signal generation and transmission using sample-domain Volterra nonlinear pre-distortion applied to the oversampled high-PAPR waveform. Our approach provides a 0.7-dB peak-SNR gain over a symbol-domain Volterra filter and achieves net bitrates of 2.18 Tb/s back-to-back and 2.10 Tb/s after 80-km transmission.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1042.pdf"},{"role":"speaker","rolename":"Contributed","code":"#867 / Mo5-F6","title":"Physics-Aware Contribution-Guided Pruning for Low-Complexity Sparse Volterra Equalization in 100-Gb/s IM/DD PAM4 Links","speaker":"Govind Sharan Yadav","affiliation":"Institute of Communications Engineering, National Tsing Hua University","authors":"Govind Sharan  Yadav, Cheng-Chieh  Wang, Kai-Ming  feng","start":"18:00","end":"","abstractid":212059,"order":6,"abstract":"Abstract (summary)  We experimentally demonstrate a novel physics-aware, contribution-guided pruned Volterra equalization framework for distortion mitigation in a 100-Gb/s PAM4 IM/DD link over 4.2-km SMF, achieving ~92% complexity reduction versus full VE and ~36.5% reduction relative to baseline MP-VE, while delivering superior performance at the KP4-FEC limit.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-867.pdf"}]},{"sessionid":"5538378","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"16:45-18:15","room":"C2.2 Conference room 2.2","type":"Invited and contributed","typeColor":"#dce6f1","category":"SC 07: Optical networks for access, mobile X-haul, in-building, and intra-datacentre interconnects","title":"Mo5-G Very high speed PON","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Rene Bonk","affiliation":"Nokia","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#336 / Mo5-G1","title":"Low-Complexity VSB Generation and Chirp Management for VHSP Downstream Links Supporting GPON Coexistence","speaker":"Christoph  Füllner","affiliation":"Nokia Bell Labs","authors":"Christoph  Füllner, Laurens  Breyne, Wouter  Lanneer, René  Bonk","start":"16:45","end":"","abstractid":211132,"order":1,"abstract":"Abstract (summary)  We propose a novel hybrid PON concept at 100 Gb/s combining vestigial sideband (VSB) generation with an easy-to-implement transmitter chirp management to enable GPON coexistence of VHSP. We show that dispersion levels from 0 to 125 ps/nm can be covered.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-336.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Derek Nesset","affiliation":"Huawei","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#198 / Mo5-G2","title":"On the Extinction Ratio penalty and Sensitivity of next-generation 120 Gb/s upstream IM solutions for Very High-Speed PONs","speaker":"Vincent Houtsma","affiliation":"Nokia, Bell Labs","authors":"Vincent  Houtsma, Kovendhan  Vijayan, Laurens  Breyne, Robert  Borkowski, Doutje  Van Veen","start":"17:00","end":"","abstractid":210873,"order":2,"abstract":"Abstract (summary)  The sensitivity and impact of extinction ratio on proposed IM upstream solutions for next generation 100-120 Gb/s VHSP is investigated","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-198.pdf"},{"role":"speaker","rolename":"Contributed","code":"#613 / Mo5-G3","title":"Investigation of MPI and DGD Tolerance in Digitally CD Pre-Compensated PAM-2 for Very High Speed PON Systems","speaker":"Hanane Kharbich","affiliation":"Politecnico di Torino","authors":"Hanane  Kharbich, Gabriella  Bosco, Giuseppe  Rizzelli, Dario  Pilori, Valter  Ferrero, Giuseppe  Talli, Ivan  Cano, Roberto  Gaudino","start":"17:15","end":"","abstractid":211763,"order":3,"abstract":"Abstract (summary)  Digital Chromatic Dispersion Compensation (DCPC) has been investigated through both experiments and simulations to assess its resilience to multipath interference and differential group delay. The results show a performance similar to conventional PAM-2, with MPI-induced penalty below 1 dB for interference values under 15 dB.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-613.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1095 / Mo5-G4","title":"200 Gb/s PolMux Link with 32 dB optical power budget, 28GHz electrical bandwidth and LO reuse for VHS-PONs","speaker":"Ignacio Garcés Gregorio","affiliation":"University of Zaragoza","authors":"David  Izquierdo, Natalia  Herguedas, Pascual  Sevillano, Ramón  Cajal-Pérez, Ignacio  Garcés","start":"17:30","end":"","abstractid":212299,"order":4,"abstract":"Abstract (summary)  In this work we experimentally demonstrate a 25km long, 200Gb/s PolMux multiCAP downstream link for Very-High Speed PONs, using a narrow 28GHz electrical bandwidth and obtaining an optical power budget of 32dB while reusing the LO at the receiver as the upstream source","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1095.pdf"},{"role":"speaker","rolename":"Invited","code":"#1394 / Mo5-G5","title":"Research Directions on Hybrid PON for Very High Speed PON","speaker":"Ivan Cano","affiliation":"Huawei Technologies Duesseldorf GmbH","authors":"Ivan  Cano","start":"17:45","end":"","abstractid":212683,"order":5,"abstract":"Abstract (summary)  Two systems are proposed for VHSP that aim to centralize the complexity at the OLT while having simple DD at the ONU-Rx: DCPC and SSB. An evaluation of both systems in terms of their CD tolerance is provided as well as motivations for further research","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_invited_IC_v5.pdf"}]},{"sessionid":"5538380","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"16:45-18:15","room":"E2 Exhibition room 2","type":"Contributed session","typeColor":"#dae3f3","category":"SC 10: Control and management of optical networks","title":"Mo5-H Control and optimization of optical network systems","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Joao Pedro","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#471 / Mo5-H1","title":"Physical-Model-Based Optical Line System Transmission Optimization Integrating Probing Transceivers","speaker":"Giacomo Borraccini","affiliation":"NEC Laboratories America","authors":"Giacomo  Borraccini, Andrea  D'Amico, Yue-Kai  Huang, Ting  Wang, Koji  Asahi","start":"16:45","end":"","abstractid":211470,"order":1,"abstract":"Abstract (summary)  An automated methodology for optical line systems integrating probing transceivers to initialize a system-level digital twin is described. Physical model parameters are inferred from scratch by combining end-to-end spectrum measurements, pre-FEC BER and optical amplifier telemetry, enabling near-optimal configuration, model alignment, and precise QoT tuning.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-471.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1295 / Mo5-H2","title":"Importance Sampling for Deterministic Uncertainty when Estimating QoT in Autonomous Optical Networks","speaker":"Camille Delezoide","affiliation":"","authors":"Camille  Delezoide, Petros  Ramantanis, Patricia  Layec","start":"17:00","end":"","abstractid":212512,"order":2,"abstract":"Abstract (summary)  We investigate importance sampling to significantly improve computational efficiency when assessing the probability of lightpath failure in complex scenarios. Results pave the way towards risk-informed decision-making in self-driven optical networks.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1295.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Shuangyi Yan","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#754 / Mo5-H3","title":"Experimental Demonstration of Optical Network Partitioning and Parallel Configuration for Autonomous Power Re-Equalization","speaker":"Chenyu Sun","affiliation":"Sorbonne Université","authors":"Chenyu  Sun, Louis  Aknin, Reda  Ayassi, Photios A.  Stavrou, Yvan  Pointurier, Gabriel  Charlet","start":"17:15","end":"","abstractid":211929,"order":3,"abstract":"Abstract (summary)  We propose and experimentally demonstrate a digital twin–based optical network partitioning strategy on a 7-OMS mesh optical network testbed. By leveraging parallel closed-loop control across subnets, the proposed approach reduces power re-equalization time by over 80%.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-754.pdf"},{"role":"speaker","rolename":"Contributed","code":"#980 / Mo5-H4","title":"Hybrid FXC-WXC Networks with Selective Wavelength Conversion: Dynamic Path Control and Experimental Demonstration","speaker":"Ryota Hosokawa","affiliation":"Nagoya University","authors":"Ryota  Hosokawa, Shunya  Shimoi, Taisei  Sekizuka, Koki  Mano, Takuma  Kuno, Yojiro  Mori, Kohei  Hosokawa, Shigeyuki  Yanagimachi, Hiroshi  Hasegawa","start":"17:30","end":"","abstractid":212176,"order":4,"abstract":"Abstract (summary)  We propose a hybrid FXC-WXC architecture with selective wavelength conversion for low-loss and flexible optical networks. Network simulations show reduced blocking and improved OSNR under dynamic control, while transmission experiments demonstrate lower BER and longer reach than WXC-only networks, supporting ZR+ deployment in metro/core networks.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-980.pdf"},{"role":"speaker","rolename":"Contributed","code":"#371 / Mo5-H5","title":"LOME: A Low-latency Optimal Ports Matching Engine for Optical Circuit Switches","speaker":"Yangmiao Yu","affiliation":"Institute of Computing Technology, Chinese Academy of Sciences","authors":"Yangmiao  Yu, Can  Chen, Yifan  Zhang, Dawei  Zang","start":"17:45","end":"","abstractid":211199,"order":5,"abstract":"Abstract (summary)  We propose a hardware-accelerated, low-latency,optimal ports matching engine for optical circuit switches to accommodate mouse flows.It reduces port-matching latency to hundreds of nanoseconds,an improvement by multiple orders of magnitude compared to CPU baselines,and reduces mouse flow latency by a factor of 19 on the demo.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-371.pdf"},{"role":"speaker","rolename":"Contributed","code":"#195 / Mo5-H6","title":"Selective Deployment of Bidirectional Hollow-Core Fibers in Hybrid SMF/HCF Optical Networks","speaker":"Mëmëdhe (Mem) Ibrahimi","affiliation":"Politecnico di Milano","authors":"Mëmëdhe  Ibrahimi, Giovanni S.  Sticca, Angelo  Ferrara, Massimo  Tornatore","start":"18:00","end":"","abstractid":210864,"order":6,"abstract":"Abstract (summary)  We investigate selectively deploying bidirectional transmission in hybrid Hollow-Core Fiber (HCF) networks. Upgrading 50% of links to bidirectional HCF yields at least a 40% throughput increase compared to unidirectional SMF and captures 85% of the power consumption reduction of a full unidirectional HCF network upgrade.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-195.pdf"}]},{"sessionid":"5538382","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"16:45-18:15","room":"PV-R Multipurpose room","type":"Symposia","typeColor":"","category":"","title":"Mo4-I Winning interconnects for AI: scale-up & scale-out technology paths","description":"AI/ML growth is driving a surge in interconnect bandwidth as models and datasets scale and workloads become increasingly token-centric—reshaping system design. Modern systems have converged on a two-tier hierarchy: scale-up fabrics that tightly couple XPU, memory, and switching into a coherent “virtual XPU,” and scale-out networks that connect many scale-up fabrics across the data centre.\t16:45 - 18:15:\tOrganisers: Daniel Kuchta (Nvidia), Lidia Galdino (Corning), Connie Chang-Hasnain (Berxel), Julie Raulin (Adtran), Paul Gunning (British Telecom)\tRajiv Pancholy, Broadcom - \"Scaling Optical Interconnects for AI: Manufacturing Pathways to Massive CPO-Enabled Clusters\"\tFotini Karinou, Microsoft Azure - \"AI Scale-up and GP Compute Use Cases for Optical Interconnects\"\tClaudia Hössbacher, Marvell - \"Silicon Photonics at Every Layer: Optical Interconnect Solutions for Scale-Up and Scale-Out\"\tJean Philippe Fricker, Cerebras - \"Heterogeneous Hybrid Bonding: A Path to Wafer-Scale Optical Systems\"\tLing Liao, Nvidia - \"Optical solutions for scale-up and scale-out connectivity\"\tAndy Bechtolsheim, Arista - (Title: TBC)","goal":"","papers":[{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Daniel Michael Kuchta","affiliation":"Nvidia Corp.","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Lidia Galdino","affiliation":"Corning,UK","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Constance Jui-Hua Chang-Hasnain","affiliation":"Berxel Photonics, USA","authors":"","start":"","end":"","abstractid":null,"order":3},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Julie Raulin","affiliation":"Adtran, Germany","authors":"","start":"","end":"","abstractid":null,"order":4},{"role":"moderator","rolename":"Organizer","code":"#0 /","title":"","speaker":"Paul Gunning","affiliation":"BT Group, UK","authors":"","start":"","end":"","abstractid":null,"order":5}]},{"sessionid":"5538445","day":1,"date":"Monday, 21 September 2026","dateISO":"2026-09-21","time":"19:30-21:30","room":"Cruise Terminal","type":"Wecome Reception","typeColor":"","category":"","title":"Welcome reception at Cruise Terminal","description":"Join us at the welcome reception at Cruise Terminal where we celebrate the beginning of ECOC2026. Meet old and new colleagues while enjoying a sea view in a unique venue, an exceptional waterfront space with a Mediterranean essence.\tPrivate buses for conference attendees from FYCMA to the Cruise Terminal:\tRoute 1: \tFYCMA–MALAGA CITY CENTER–CRUISE TERMINAL at 18:45. Route with a stop at CITY CENTER at 19:00 (You can take the bus from that stop at that time) \tCRUISE TERMINAL–MALAGA CITY CENTER at 22:30\tRoute 2: \tFYCMA–CRUISE TERMINAL at 19:00 \tCRUISE TERMINAL–MALAGA CITY CENTER at 22:30\tThis information is subject to change; please check the details of the stop at the conference venue.","goal":"","papers":[]},{"sessionid":"5538610","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"","room":"","type":"Registration","typeColor":"black","category":"","title":"Registration","description":"","goal":"","papers":[]},{"sessionid":"5538681","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"08:30-09:00","room":"","type":"Coffee break","typeColor":"black","category":"","title":"Morning coffee","description":"","goal":"","papers":[]},{"sessionid":"5538418","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"09:00-10:30","room":"A1 Auditorium 1","type":"Tutorial and Invited","typeColor":"#FFCCFF","category":"SC 12: CLEO® Special Session on Emerging Trends in Optics and Photonics","title":"Tu1-A From high-Q resonators to frequency comb generation","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Laurent Vivien","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":3},{"role":"speaker","rolename":"Tutorial","code":"#1415 / Tu1-A1","title":"High-Q Integrated Photonics","speaker":"Kerry Vahala","affiliation":"California Institute of Technology","authors":"Kerry  Vahala","start":"09:00","end":"10:00","abstractid":213039,"order":4,"abstract":"Abstract (summary)  We review recent progress in chip-integrated high-Q resonators and discuss their applications to frequency microcombs, second-harmonic generation, and spontaneous parametric down-conversion, along with recent system-level demonstrations of high-performance microwave signal sources.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Tutorial (Vahala)_2.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Camille-Sophie Brès","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":4},{"role":"speaker","rolename":"Invited","code":"#0 /","title":"Tu1-A2 flattop soliton microcombs for low power optical data links","speaker":"Scott Papp","affiliation":"National Institute of Standards and Technology","authors":"","start":"10:00","end":"10:30","abstractid":null,"order":5}]},{"sessionid":"5538421","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"09:00-10:30","room":"A2 Auditorium 2","type":"Invited and contributed","typeColor":"#fce5cd","category":"SC 06: Architecture, modelling and performance of optical networks","title":"Tu1-B Hollow core fibers in optical networks","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Carmen Vázquez","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#548 / Tu1-B1","title":"On the Practical Impacts of Inter-Modal-Interference (IMI) in Hollow-Core Fibers for High-Speed Data Center Interconnects","speaker":"Yan He","affiliation":"The Hong Kong Polytechnic University","authors":"Yan  He, Liang  Dou, Sai  Chen, Zhiqun  Zhai, Huan  Zhang, Yuanchao  Su, Alan Pak Tao  Lau","start":"09:00","end":"","abstractid":211666,"order":1,"abstract":"Abstract (summary)  We measured IMI-induced SNR after different HCF transmission with different transponders and frequency and found that SNR can be worse than theoretical value. A delivered OSNR model validated by 1.6T/λ transmission experiments identify -54dB/km as a practical IMI threshold, providing guidance on HCF-based DCI standardization/optimization.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-548.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Fatima  Gunning","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1314 / Tu1-B2","title":"MIMO Channel Memory Requirements for Randomly-Coupled Multicore Fiber Networks","speaker":"Besma Kalla","affiliation":"Eindhoven University of Technology","authors":"Besma  Kalla, Ruben  S. Luis, Stefano  Gaiani, Daniele  Orsuti, Patrick  Blown, Menno  Van Den Hout, Robson  A. Colares, Darli  A. A. Mello, Pierpaolo  Boffi, Thomas  Bradley, Chigo  Okonkwo, Hideaki  Furukawa","start":"09:15","end":"","abstractid":212536,"order":2,"abstract":"Abstract (summary)  We evaluate the impact of network nodes on MIMO memory requirements in a C+L-band randomly-coupled multicore fiber network. While point-to-point transmission requires less than 1 ns of memory, constraining network operation to this length results in throughput penalties of 50–75% due to path delay misalignment.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1314.pdf"},{"role":"speaker","rolename":"Invited","code":"#1400 / Tu1-B3","title":"New opportunities in optical networks enabled by hollow-core fibres","speaker":"Periklis Petropoulos","affiliation":"Optoelectronics Research Centre, University of Southampton","authors":"Periklis  Petropoulos, Suttikarn  Wantee, Douglas  Mcculloch, Hao  Liu, Armands  Ostrovskis, Darja  Cirjulina, Gregory T.  Jasion, Hesham  Sakr, Xiaodan  Pang, Oskars  Ozolins, Francesco  Poletti, Kyle R.H.  Bottrill, Yongmin  Jung","start":"09:30","end":"10:00","abstractid":212953,"order":3,"abstract":"Abstract (summary)  Hollow-core fibres enable performance and applications that are challenging to achieve in conventional solid-core fibre systems. Here we review demonstrations in intensity modulation direct-detection transmission and simultaneous power-and-data delivery that offer opportunities for new  services and enhanced performance in optical communication networks.","pdf":"/static/upload/ow193/events/ev667/abssub/ppetropoulos ECOC_2026_Invited HCF-based applications.pdf"},{"role":"speaker","rolename":"Contributed","code":"#977 / Tu1-B4","title":"Physics-Driven Transfer Learning Approach for OSNR Prediction in Hollow-Core Fiber-Based Data Center Interconnect Networks","speaker":"Jiahui Xu","affiliation":"State Key Laboratory of Information Photonics and Optical Communications, Beijing University of Posts and Telecommunications","authors":"Jiahui  Xu, Xin  Qin, Zhiqun  Gu, Wei  Chen, Shaopeng  Li, Xiaotian  Jiang, Zheng  Yang, Yuqing  Han, Jiawei  Zhang, Rentao  Gu, Yuefeng  Ji","start":"10:00","end":"","abstractid":212173,"order":4,"abstract":"Abstract (summary)  This paper proposes a physics-driven transfer learning approach for Hollow-Core Fiber (HCF) OSNR prediction. Utilizing a theoretical analytical model for pre-training, it achieves robust predictions with minimal experimental samples, eliminating 17 dB cliffs, reaching 0.388 dB RMSE and 0.6 dB 95% error bounds.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-977.pdf"}]},{"sessionid":"5538424","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"09:00-10:30","room":"E1 Exhibition room 1","type":"Invited and contributed","typeColor":"#c9daf8","category":"SC 09: Free-space optics and optical wireless technologies","title":"Tu1-C Advanced enabling technologies for free-space optical and optical wireless communications","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Beatriz Ortega Tamarit","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1147 / Tu1-C1","title":"Sweep-Free Coherent Tracking Using a Multi-Tone Local Oscillator with a 100-MHz-Bandwidth Quadrant Photodetector","speaker":"Takashi Kan","affiliation":"KDDI Research, Inc.","authors":"Takashi  Kan, Shin  Fukuhara, Kensuke  Murakami, Akira  Akasaka, Hidenori  Takahashi, Takehiro  Tsuritani","start":"09:00","end":"","abstractid":212352,"order":1,"abstract":"Abstract (summary)  With narrowband detectors, coherent beam tracking is challenging under signal–local oscillator frequency offset uncertainty, given reliance on frequency sweeping or wideband reception. We demonstrate frequency‑offset‑tolerant error signal generation and closed‑loop beam tracking under realistic disturbances using a multi‑tone local oscillator.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1147.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Amalia Miliou","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#475 / Tu1-C2","title":"Diversity Gain of 2-D PD Array in a 13.3°/s High-mobility FSO System with 13-ms Handover Latency","speaker":"Yuki Yoshida","affiliation":"NICT","authors":"Yuki  Yoshida, Zu-Kai  Weng, Toshimasa  Umezawa, Michikazu  Hattori, Yuichiro  Hara, Atsushi  Matsumoto, Kouichi  Akahane, Satoshi  Shinada, Naokatsu  Yamamoto","start":"09:15","end":"","abstractid":211475,"order":2,"abstract":"Abstract (summary)  We investigate the impact of 2-D PD array-based diversity reception in realistic mobile FSO scenarios, including terminal mobility and handovers. By eliminating tracking jitter-induced outages through diversity combining, the arrayed receiver achieved zero tracking-induced interruption under a 13.3°/s terminal velocity and 13-ms handover latency.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-475.pdf"},{"role":"speaker","rolename":"Contributed","code":"#439 / Tu1-C3","title":"Increasing the Alignment Tolerance in Long-Reach FSO Links by using a Photodiode Matrix","speaker":"Ton Koonen","affiliation":"Eindhoven University of Technology","authors":"Ton  Koonen, Eduward  Tangdiongga","start":"09:30","end":"","abstractid":211381,"order":3,"abstract":"Abstract (summary)  A matrix of 2D-interconnected PDs enables a broadband FSO receiver with large effective aperture and wide field-of-view. Without needing adaptive optics, it offers superior link robustness over single-PD and MMF-coupled FSO receivers, and compact receiver solution. Alignment tolerances increase >3x and scale with matrix size.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-439.pdf"},{"role":"speaker","rolename":"Contributed","code":"#68 / Tu1-C4","title":"Cost-Effective 448-Gbps Indoor Optical Wireless Access Via Dual-Polarization Carrier-Extracted Direct Detection","speaker":"Haojie Zhu","affiliation":"Westlake University","authors":"Haojie  Zhu, Lei  Pang, Jinhong  Xu, Yuhao  Fang, Weiqi  Lu, Dayu  Shi, Puzhen  Yuan, William  Shieh","start":"09:45","end":"","abstractid":210210,"order":4,"abstract":"Abstract (summary)  We propose a dual-polarization carrier-extracted direct detection without polarization tracking because of the polarization stability in free-space environment. The system achieves a 448-Gbps transmission data rate in 9-meter indoor free-space link without expensive local oscillators while meeting the eye-safety standard.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-68.pdf"},{"role":"speaker","rolename":"Invited","code":"#260 / Tu1-C5","title":"Free-Space Optical Communication using Photonic-Crystal Sur-face-Emitting Lasers","speaker":"Shota Ishimura","affiliation":"KDDI Research, Inc.","authors":"Shota  Ishimura, Takuya  Inoue, Ryohei  Morita, Hidenori  Takahashi, Takehiro  Tsuritani, Menaka  De Zoysa, Kenji  Ishizaki, Masatoshi  Suzuki, Susumu  Noda","start":"10:00","end":"","abstractid":210992,"order":5,"abstract":"Abstract (summary)  Photonic-crystal surface-emitting lasers (PCSELs) offer a compelling route to compact free-space optical (FSO) transmitters by combining watt-class single-mode output, narrow divergence, and direct modulation on a single chip. This invited paper reviews recent progress from initial lens-free demonstrations to >10-Gbit/s, and coherent PCSEL-based links.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC2026_KDDI_invited_r3.pdf"}]},{"sessionid":"5538426","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"09:00-10:30","room":"C1.1 Conference room 1.1","type":"Invited and contributed","typeColor":"#d9eaf7","category":"SC 01: Novel fibres, fibre devices and amplifiers","title":"Tu1-D Optical amplification","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Lutz Rapp","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#225 / Tu1-D1","title":"High-gain and Low-noise Integrated Fiber Amplifier with Seamless 102 nm Bandwidth Across the Extended C+L Band","speaker":"Huang Xin","affiliation":"YOFC","authors":"Xin  Huang, Lei  Shen, Junjie  Qi, Shiqi  Zhou, Zhaolong  Liao, Yuanpeng  Ding, Chan  Li, Yuan  Gao, Hui  Zhang, Zhixiong  He, Lei  Zhang, Jie  Luo","start":"09:00","end":"","abstractid":210951,"order":1,"abstract":"Abstract (summary)  We report a hybrid EBDF/BDF fiber amplifier that achieves integrated amplification with a seamless 102 nm spectral bandwidth in the extended C+L band for the first time. The amplifier exhibits a gain of 26.7 dB and a noise figure of 4.6 dB.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-225.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Marco Santagiustina","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#598 / Tu1-D2","title":"High-Gain Sub-3 dB Noise Figure Chip-Based Phase Sensitive Preamplifier with Pulsed Pumping","speaker":"Junda Chen","affiliation":"Chalmers University Of Technology","authors":"Junda  Chen, Rasmus  Larsson, Peter  A. Andrekson","start":"09:15","end":"","abstractid":211738,"order":2,"abstract":"Abstract (summary)  We demonstrate a sub-3dB “black box” noise figure, Si₃N₄ waveguide-based phase-sensitive preamplifier receiver using pulsed pump. A 37 dB gain yields a sensitivity of -59 dBm at BER=10-3 for a 2 Gb/s QPSK signal, with an estimated 0.5 dB on-chip noise figure.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-598.pdf"},{"role":"speaker","rolename":"Invited","code":"#1411 / Tu1-D3","title":"Optical Amplification in the S-band and Beyond: From Materials and Mechanisms to Practical Deployment","speaker":"Aleksandr Donodin","affiliation":"Aston University","authors":"Aleksandr  Donodin, Vitaly  Mikhailov, Dini  Pratiwi, Dmitrii  Stoliarov, Mingming  Tan, Jiawei  Luo, David J.  Digiovanni, Ian  Phillips, Wladek  Forysiak, Sergei K.  Turitsyn","start":"09:30","end":"10:00","abstractid":213031,"order":3,"abstract":"Abstract (summary)  We review recent advances in S-band optical amplifiers for communication systems, comparing doped-fibre, Raman, parametric, and semiconductor approaches. Gain mechanisms, performance, and efficiency are analysed, highlighting key trade-offs and emerging solutions for scalable, energy-efficient transmission within and beyond the S-band.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC2026___Invited (1)_2.pdf"},{"role":"speaker","rolename":"Invited","code":"#330 / Tu1-D4","title":"Energy Harvesting over Optical Communication Networks Using Discarded Light from a Gain-Flattening Filter","speaker":"Masaki Wada","affiliation":"NTT, Inc.","authors":"Masaki  Wada, Taiji  Sakamoto, Takashi  Matsui, Kazuhide  Nakajima","start":"10:00","end":"","abstractid":211123,"order":4,"abstract":"Abstract (summary)  We demonstrate electrical-domain energy harvesting over optical communication networks and show for the first time that more than 10 mW of electrical power per core can be extracted from discarded optical power at a gain-flattening filter in a four-core erbium-doped fibre amplifier.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-330.pdf"}]},{"sessionid":"5538429","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"09:00-10:30","room":"C1.4 Conference room 1.4","type":"Invited and contributed","typeColor":"#f4cccc","category":"SC 03: Photonic integrated circuits, assemblies and packaging","title":"Tu1-E Optical switches and demultiplexers","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Keijiro Suzuki","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#251 / Tu1-E1","title":"200 Gbps Coherent Optical Switching Enabled by an Integrated Si3N4-TFLN Laser","speaker":"Yilin Wu","affiliation":"Tsinghua University","authors":"Yilin  Wu, Yan  Ma, Deqi  Li, Qiyin  Xue, Sigang  Yang, Hongwei  Chen, Liwei  Tang, Hui  Wang, Zhenming  Yu, Minghua  Chen","start":"09:00","end":"","abstractid":210981,"order":1,"abstract":"Abstract (summary)  We achieve 200 Gbps coherent optical switching with a switching latency of 80 ns and bit error ratios of below 1×10-4. It is enabled by a tri-material Integrated Si3N4-TFLN laser unifying an intrinsic linewidth of 181 Hz and below-15-ns electro-optic wavelength switching.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-251.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Nobuhiko Nishiyama","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#451 / Tu1-E2","title":"Low-loss Silicon Photonic MEMS Switch Array Based on 2.5D Torus Topology","speaker":"Jiayue Zhu","affiliation":"Zhejiang University","authors":"Jiayue  Zhu, Xiang  Zhang, Yinpeng  Hu, Jianxing  Liao, Xiaowen  Dong, Huan  Li, Daoxin  Dai","start":"09:15","end":"","abstractid":211406,"order":2,"abstract":"Abstract (summary)  A scheme for scalable low-loss silicon photonic switch arrays using micro-electro-mechanical systems (MEMS) switches and a novel 2.5D Torus topology is proposed and demonstrated, which exhibits one of the lowest insertion losses among widely used wide-sense and strictly non-blocking topologies.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-451.pdf"},{"role":"speaker","rolename":"Invited","code":"#0 /","title":"Tu1-E3 breaking the AI networking and memory wall with a wide-and-slow architecture and microleds","speaker":"Paolo Costa","affiliation":"Microsoft","authors":"","start":"09:30","end":"10:00","abstractid":null,"order":6},{"role":"speaker","rolename":"Contributed","code":"#626 / Tu1-E4","title":"An 8×8 Optical Circuit Switch in Thin-Film Lithium Tantalate","speaker":"Dennis Maes","affiliation":"OneTouch Technology","authors":"Dennis  Maes, Dimitrios  Chatzitheocharis, Ju  Bing, Bert  De Mulder, William  Chen","start":"10:00","end":"","abstractid":211779,"order":7,"abstract":"Abstract (summary)  We demonstrate the first 8×8 electro-optic optical circuit switch (OCS) on thin-film lithium tantalate (TFLT). The photonic integrated circuit comprises twelve 2×2 switches and achieves <4 ns switching, sub-1-µW static power consumption, and <0.5 dB output power stability over 1 hour without active feedback.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-626.pdf"},{"role":"speaker","rolename":"Contributed","code":"#395 / Tu1-E5","title":"Static and Dynamic Ring Assignment in a Clock-Forwarded DWDM Optical Link","speaker":"Angad Singh Rekhi","affiliation":"NVIDIA Corporation","authors":"Angad  Rekhi, Stephen  Tell, Brian  Zimmer, Li  Xu, Georgios  Kalogerakis, Sanquan  Song, Nandish  Mehta, Nikola  Nedovic, Yoshi  Nishi, Xi  Chen, Ward  Lopes, Benjamin  Lee, Thomas  Greer, Thomas  Gray","start":"10:15","end":"","abstractid":211267,"order":8,"abstract":"Abstract (summary)  We present heater sweep-based in-situ minimum-power assignment of microrings to lasers during clock-forwarded optical link initialization (“static ring assignment”). We also show rotation of microring-to-laser assignment during live link operation (“dynamic ring assignment”).","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-395.pdf"}]},{"sessionid":"5538432","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"09:00-10:30","room":"C2.1 Conference room 2.1","type":"Invited and contributed","typeColor":"#dae3f3","category":"SC 10: Control and management of optical networks","title":"Tu1-F AI-driven control and monitoring in optical access networks","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Nguyen-Cac Tran","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#1330 / Tu1-F1","title":"Digital Twin, Agent and Artificial Intelligence Towards ION-2030","speaker":"Italo Busi","affiliation":"Huawei","authors":"Italo  Busi, Xiao  Li, Henry  Yu","start":"09:00","end":"09:30","abstractid":212552,"order":1,"abstract":"Abstract (summary)  This paper explores trends in Artificial Intelligence, Network Digital Twin, and Agents aimed at enhancing the operations of optical networks. Following the ITU-T ION-2030 vision, it also addresses the standardization gaps that remain.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC_2026_Paper_10.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Yvan Pointurier","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#744 / Tu1-F2","title":"A Deterministic Bandwidth-Mapper Scheme in Upstream TDM-PON for Time-Sensitive Industrial AI Applications","speaker":"Sandip Das","affiliation":"Nokia Bell Labs","authors":"Sandip  Das, Rene  Bonk, Paschalis  Tsiaflakis","start":"09:30","end":"","abstractid":211917,"order":2,"abstract":"Abstract (summary)  This paper proposes a real‑time, scalable deterministic bandwidth-mapper (BWmapper) for upstream TDM‑PON, capable of supporting a large number of Time-Sensitive Industrial-AI flows with diverse latency and jitter requirements alongside best‑effort traffic. Validated through simulation and experiments, the scheme demonstrates low computational complexity and high efficiency.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-744.pdf"},{"role":"speaker","rolename":"Contributed","code":"#139 / Tu1-F3","title":"Dynamic PON Monitoring System Based on Time-Frequency Encoded Optical Pulses","speaker":"Ruisi Wang","affiliation":"School of Optical and Electronic Information, Huazhong University of Science and Technology","authors":"Ruisi  Wang, Yijie  Zhang, Xiangpeng  Xiao, Qi  Yang, Lei  Deng, Mengfan  Cheng, Qizhen  Sun, Zhijun  Yan, Ming  Tang","start":"09:45","end":"","abstractid":210708,"order":3,"abstract":"Abstract (summary)  We propose a novel PON monitoring method using time–frequency encoded optical pulse sequences and cross-correlation analysis for real-time fault localization and port detection in dynamic port switching scenarios. Experimental results show that the proposed method achieves sub-meter localization accuracy and 100% port identification accuracy.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-139.pdf"},{"role":"speaker","rolename":"Contributed","code":"#860 / Tu1-F4","title":"Passive GPON Monitoring for Network Load Forecasting Using BWMap Information","speaker":"Lucas Ingles Loggia","affiliation":"","authors":"Lucas  Ingles Loggia, Luiz  Anet Neto, Claudina  Rattaro, Michel  Morvan, Alberto  Castro, Loutfi  Nuaymi","start":"10:00","end":"","abstractid":212051,"order":4,"abstract":"Abstract (summary)  We present a vendor and element management system-agnostic solution for passive upstream bandwidth monitoring in GPON. We demonstrate its usage in a commercial platform for forecasting the network congestion state and providing services profiling, enabling SLA verification and identification of low-congestion windows. ©2026 The Author(s)","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-860.pdf"},{"role":"speaker","rolename":"Contributed","code":"#478 / Tu1-F5","title":"Demonstration of Optical Access Network Failure Management for RAN Control toward Rapid Recovery","speaker":"Megumi Asada","affiliation":"NTT, Inc.","authors":"Megumi  Asada, Takumi  Harada, Kenji  Miyamoto, Tomoya  Hatano, Tatsuya  Shimada","start":"10:15","end":"","abstractid":211479,"order":5,"abstract":"Abstract (summary)  We propose RAN control based on failure notifications from the optical access network to shorten failure recovery time for high reliability services. Experiments show that the interruption time can be reduced by 66.9% compared with the conventional method.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-478.pdf"}]},{"sessionid":"5538435","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"09:00-10:30","room":"C2.2 Conference room 2.2","type":"Invited and contributed","typeColor":"#d0e0e3","category":"SC 05: Optical transmission systems","title":"Tu1-G Short reach interconnects","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Tomoyuki Kato","affiliation":"1Finity Inc.","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Invited","code":"#1414 / Tu1-G1","title":"Scalable, High-Capacity Optical Transmission for AI Data Centre Networks","speaker":"Yuta Wakayama","affiliation":"KDDI Research","authors":"Yuta  Wakayama, Daniel  J. Elson, Cen  Wang, Han  Wang, Takehiro  Tsuritani","start":"09:00","end":"09:30","abstractid":213037,"order":1,"abstract":"Abstract (summary)  This paper reviews ultrawideband optical transmission technologies for scalable AI data centre networks and presents an optical‑gateway‑based scale‑across architecture. Exploiting O‑band expansion, WDM/SDM aggregation, and RDMA‑over‑WDM, the approach enables capacity scaling beyond single‑facility limits whilst reducing fibre deployment.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26_Invited_ScalableAIdatacentre-2.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Chiara  Lasagni","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#1101 / Tu1-G2","title":"24-l Coherent Optical Communications Using Passive Coherence Cloning of Dark-Soliton Microcombs for Homodyne Detection","speaker":"Huanfa Peng","affiliation":"Karlsruhe Institute of Technology","authors":"Huanfa  Peng, Yiyang  Bao, Yi  Zheng, Wolfgang  Freude, Kresten  Yvind, Sebastian  Randel, Minhao  Pu, Christian  Koos","start":"09:30","end":"09:45","abstractid":212306,"order":2,"abstract":"Abstract (summary)  We report on the first demonstration of coherent multi-wavelength transmission using passive coherence cloning of Kerr microcombs. Our scheme leverages a coherence-cloned replica of the transmitter comb as a multi-wavelength local oscillator for homodyne reception of 24 16QAM and 32QAM channels with reduced digital-signal-processing effort.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1101.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1083 / Tu1-G3","title":"Regular Perturbation on the Group-Velocity Dispersion Parameter for Dual-Polarization Short-Reach Systems","speaker":"Dario Cellini","affiliation":"Scuola Superiore Sant'Anna","authors":"Dario  Cellini, Vinícius  Oliari, Erik  Agrell, Marco  Secondini, Gabriele  Liga, Alex  Alvarado","start":"09:45","end":"10:00","abstractid":212285,"order":3,"abstract":"Abstract (summary)  The Manakov equation governs the propagation of signals in dual-polarization systems. Its solution is usually approximated by regular perturbation on the nonlinear Kerr parameter. In this paper, we propose a novel regular perturbation on the group-velocity dispersion parameter for the Manakov equation.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1083.pdf"},{"role":"speaker","rolename":"Contributed","code":"#400 / Tu1-G4","title":"Water Vapor Robustness of Hollow-Core Fiber for O-Band Short Reach Interconnects","speaker":"Yuan Gao","affiliation":"Yangtze Optical Fiber and Cable Joint Stock Limited Company","authors":"Yuan  Gao, Lu  Dai, Yifei  Xu, Zihan  Dong, Jun  Chu, Peng  Li, Lei  Shen, Lei  Zhang, Jie  Luo","start":"10:00","end":"10:15","abstractid":211279,"order":7,"abstract":"Abstract (summary)  This work presents the first experimental investigation of water vapor's impact on O‑band hollow-core fibres. Results show that HCFs are robust to water vapor: even after prolonged high-humidity exposure, attenuation at the O‑band operating wavelengths remains virtually unaffected, confirming their reliability for O‑band short‑reach interconnects.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-400.pdf"},{"role":"speaker","rolename":"Contributed","code":"#811 / Tu1-G5","title":"172 Tb/s GMI, O-band Coherent Transmission with OSNR Optimization","speaker":"Aleksandr Donodin","affiliation":"Aston University","authors":"Aleksandr  Donodin, Shekhar  Saxena, Daniel J.  Elson, Vitaly  Mikhailov, Robert  Emmerich, Dmitrii  Stoliarov, Ruben S.  Luis, Jiawei  Luo, Hideaki  Furukawa, Colja  Schubert, Ronald  Freund, David J.  Digiovanni, Yuta  Wakayama, Takehiro  Tsuritani, Ian  Phillips, Sergei K.  Turistyn","start":"10:15","end":"10:30","abstractid":211994,"order":8,"abstract":"Abstract (summary)  We report a record GMI-estimated transmission of 172.87 Tb/s over 25 km of G.652.D in the O-band, achieved using 633 × 24.5 GBaud DP-64QAM and DP-128QAM channels, with optimized launched signal and Raman pump powers.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-811.pdf"}]},{"sessionid":"5538438","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"09:00-10:30","room":"E2 Exhibition room 2","type":"Invited and contributed","typeColor":"#d9ead3","category":"SC 08: Sensing and microwave photonics","title":"Tu1-H Microwave photonics and radio over fiber","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Guy Torfs","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1275 / Tu1-H1","title":"Reconfigurable Microwave Photonic Demultiplexer Using Integrated CROW and Lattice Filters","speaker":"Luis Gonzalez Guerrero","affiliation":"Universidad Carlos III de Madrid","authors":"Luis  Gonzalez Guerrero, Alberto  Zarzuelo, Jiale  Tian, Jose Manuel  Delgado Mendinueta, Charoula  Mitsolidou, Chris G. H.  Roeloffzen, Guillermo  Carpintero","start":"09:00","end":"","abstractid":212489,"order":1,"abstract":"Abstract (summary)  We demonstrate an integrated microwave photonic demultiplexer using cascaded CROW and lattice filters, enabling tunable bandwidth (125–500 MHz) and strong channel suppression. Experimental demultiplexing of 16-QAM signals at 23 GHz is demonstrated, confirming reconfigurable filtering for flexible satellite payloads.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1275.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Keisuke Kasai","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#609 / Tu1-H2","title":"Photonic Millimeter-wave Parallel Chaos Source Enabling Multi-Channel Secure Communication and Sensing","speaker":"Qiuzhuo Deng","affiliation":"Zhejiang University","authors":"Qiuzhuo  Deng, Can  Wang, Kangpeng  Ye, Guanyu  Chen, Oskars  Ozolins, Xiaodan  Pang, Lu  Zhang, Xianbin  Yu","start":"09:15","end":"","abstractid":211756,"order":2,"abstract":"Abstract (summary)  We experimentally demonstrate a 2×5 Gbps photonic mmWave secure communication and an interference-free MISO sensing with a single receiver, empowered by a parallel chaos source with 40 channels and up to 94.5 GHz bandwidth per channel, overcoming hardware bottlenecks in future multi-functional mmWave networks.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-609.pdf"},{"role":"speaker","rolename":"Contributed","code":"#896 / Tu1-H3","title":"A Monolithic Analog Radio-over-Fiber Uplink Transmitter with –100.8 to –98.3 dBm Effective Isotropic Sensitivity for mm-Wave Communications","speaker":"Jiacong Ke","affiliation":"the university of british columbia","authors":"Jiacong  Ke, Jiaqin  Fang, Sudip  Shekhar","start":"09:30","end":"","abstractid":212088,"order":3,"abstract":"Abstract (summary)  We present a monolithic analog radio-over-fiber uplink transmitter co-integrating LNAs, driver, and MZM on a CMOS SOI process. The transmitter achieves 26.1-dB gain, 8.2-dB noise figure, and –100.8-dBm EIS, enabling DPD-free 1.1% and 2.25% EVM of 16-QAM and 32-QAM, respectively, meeting 3GPP requirements.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-896.pdf"},{"role":"speaker","rolename":"Contributed","code":"#526 / Tu1-H4","title":"Integrated Photonic RF Receiver with Frequency Downconversion in a Packaged InP PIC for Satellite Payloads","speaker":"Metodi Belchovski","affiliation":"Eindhoven University of Technology","authors":"Metodi  Belchovski, Benoit  Benazet, Michel  Sotom, Simon  Rommel","start":"09:45","end":"","abstractid":211612,"order":4,"abstract":"Abstract (summary)  We demonstrate an integrated photonic RF front-end for satellite payloads using a packaged InP PIC, combining optical LO distribution with Ka- to C-band microwave downconversion, supporting 1×128 antenna elements, achieving 24 dB conversion loss, 53 dB noise figure, and < 15% EVM across modulation formats.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-526.pdf"},{"role":"speaker","rolename":"Invited","code":"#47 / Tu1-H5","title":"Processing THz Signals with GHz Electronics","speaker":"Thomas Schneider","affiliation":"THz-Photonics, TU-Braunschweig","authors":"Thomas  Schneider","start":"10:00","end":"","abstractid":209817,"order":5,"abstract":"Abstract (summary)  We present the fundamentals and latest findings on the generation, processing and reception of THz-bandwidth signals using low-bandwidth electronics and orthogonal base functions for communication and the acceleration of photonic signal processing.","pdf":"/static/upload/ow193/events/ev667/abssub/THz_with_GHz.pdf"}]},{"sessionid":"5538441","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"09:00-10:30","room":"PV-R Multipurpose room","type":"Contributed session","typeColor":"#e4dfec","category":"SC 04: Signal processing for optical communication and sensing","title":"Tu1-I Optical fiber sensing and its aplications","description":"","goal":"","papers":[{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Elie Awwad","affiliation":"Télécom Paris","authors":"","start":"","end":"","abstractid":null,"order":1},{"role":"speaker","rolename":"Contributed","code":"#1296 / Tu1-I1","title":"End-to-End Modelling of Earthquake-Induced Polarisation Perturbations in Submarine Optical Fibres","speaker":"Rick M. Butler","affiliation":"","authors":"Rick M.  Butler, José  Núñez-Kasaneva, Gabriele  Liga, Magnus  Karlsson, Alex  Alvarado, Christian  Häger","start":"09:00","end":"","abstractid":212513,"order":1,"abstract":"Abstract (summary)  We present an end-to-end model of earthquake-perturbed signal propagation in submarine fibres. Ground displacements are converted to fibre strain via ocean pressure, and injected into a split-step model. Our model shows good qualitative alignment with measurements from the Curie cable during the 2020 Oaxaca earthquake.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1296.pdf"},{"role":"moderator","rolename":"Chair","code":"#0 /","title":"","speaker":"Bernhard  Spinnler","affiliation":"","authors":"","start":"","end":"","abstractid":null,"order":2},{"role":"speaker","rolename":"Contributed","code":"#944 / Tu1-I2","title":"Polarization Noise Anisotropy-Aware Technique for Enhanced Earthquake Detection Using Coherent Subsea Transponders","speaker":"Mohammad  Mohammad Hosseini","affiliation":"Nokia","authors":"Mohammad  Mohammad Hosseini, Miquel  Masanas, Giuseppe  Parisi, Antonio  Mecozzi, Alberto  Marullo, Danilo  Decaroli, Antonio  Napoli","start":"09:15","end":"","abstractid":212138,"order":2,"abstract":"Abstract (summary)  Polarization noise anisotropy, in coherent subsea transponders, limits the reliability of earthquake detection. We analyze lab- and field-deployed transponders using a tensor-based eigenvalue decomposition technique that dynamically aligns seismic signals with the eigenvectors, enhancing detection sensitivity up to 16 dB improvement in SNR.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-944.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1140 / Tu1-I3","title":"Path-Integrated Polarization Rotation Signatures in Subsea Networks: Cable Geometry Effects in 2023 Turkey Earthquakes","speaker":"Miquel Masanas","affiliation":"Nokia","authors":"Mohammad  Mohammad Hosseini, Miquel  Masanas, Giuseppe  Parisi, Wesley  Braga Melo, Alberto  Marullo, Danilo  Decaroli, Sergei  K. Turitsyn, Antonio  Napoli","start":"09:30","end":"","abstractid":212345,"order":3,"abstract":"Abstract (summary)  We analyze polarization data streamed from a commercial coherent transponder, used in MedNautilus link, during 2023 Turkey earthquakes. We show how earthquake features and cable geometry fundamentally govern the optical polarization response, taking the first steps for detailed interpretation in designing fiber-based seismic sensing systems.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1140.pdf"},{"role":"speaker","rolename":"Contributed","code":"#1322 / Tu1-I4","title":"Towards SOP-based Real-Time Earthquake Detection: Limitations and Opportunities","speaker":"Wesley Melo","affiliation":"","authors":"Wesley  Melo, Geraldo  Gomes, Pedro  Freire, Sergei  Turitsyn, Antonio  Mecozzi, Mohammad  Hosseini, Antonio  Napoli","start":"09:45","end":"","abstractid":212544,"order":4,"abstract":"Abstract (summary)  We statistically analyze real SOP data using a physics-informed seismic event-labelling model and show that 95% of the 798 seismic events have SNR below 1.64dB, independent of distance. We demonstrate a real-time low-cost pipeline extensible to 20Hz Jones sampling, while highlighting limitations and research opportunities.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1322.pdf"},{"role":"speaker","rolename":"Contributed","code":"#87 / Tu1-I5","title":"Passive Distributed Acoustic Sensing for Borehole Seismic Velocity Profiling: A 3 km Geothermal Well Field Trial","speaker":"Philip Ji","affiliation":"NEC Laboratories America, Inc.","authors":"Zehao  Wang, Anastasia  Stroujkova, Franklin G.  Horowitz, Jeffrey  Eppink, Philip N.  Ji, Yaowen  Li, Peter  Malin, Tingjun  Chen","start":"10:00","end":"","abstractid":210458,"order":5,"abstract":"Abstract (summary)  We demonstrate passive borehole velocity profiling using coherent DAS on a 3 km geothermal well. Deconvolution interferometry with phase-weighted stacking recovers velocities from ambient micro-vibrations without active sources, achieving <80 m/s mean absolute error at 0.5–1 km depth against a calibration shot ground truth.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-87.pdf"},{"role":"speaker","rolename":"Contributed","code":"#961 / Tu1-I6","title":"Real-time Tracking and Localization of Rapid Instantaneous SOP Fluctuations for 100G Coherent System over FPGA","speaker":"Yu Tang","affiliation":"China Unicom Research Institute","authors":"Yu  Tang, Shikui  Shen, Yan  Shi, Sheng  Cui, Jingpeng  Liu, Menghong  xu, Chuanbiao  Zhang, Ming  Tang, Guangquan  Wang","start":"10:15","end":"","abstractid":212156,"order":6,"abstract":"Abstract (summary)  We demonstrate a two-step AEQ cooperating a loopback configuration to track and locate rapid instantaneous state of polarization in a 100G 16QAM coherent optical system based on FPGA. The localization error is within 115 m at 5 MHz.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-961.pdf"}]},{"sessionid":"5538735","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"10:30-12:30","room":"","type":"Exhibition","typeColor":"black","category":"","title":"Exhibition & coffee break","description":"","goal":"","papers":[]},{"sessionid":"5538443","day":2,"date":"Tuesday, 22 September 2026","dateISO":"2026-09-22","time":"11:00-12:30","room":"Exhbition – Pavillion 1– Area 1065","type":"Exhibition","typeColor":"","category":"","title":"Tu2-Ex Demo zone","description":"","goal":"","papers":[{"role":"speaker","rolename":"Exhibition","code":"#1440 / Tu2-Ex1","title":"TwinLight: A Multi-Timescale Physical-Layer-Aware T-API-Compliant Optical Domain Controller Digital Twin","speaker":"Carlos Natalino","affiliation":"Chalmers University of Technology","authors":"Carlos  Natalino, Piotr  Lechowicz, Renato  Ambrosone, Enrico  Miotto, Vittorio  Curri, Paolo  Monti","start":"","end":"","abstractid":215372,"order":1,"abstract":"Abstract (summary)  We demonstrate TwinLight, an open-source optical-network digital twin acting as an optical domain controller. Its T-API REST and telemetry streaming interfaces use a physical-layer engine comprising a GNPy steady-state QoT baseline and four analytical transients.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1440.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1475 / Tu2-Ex2","title":"Comparative Demonstration of Coherent-Pluggable Control Architectures for Disaggregated IPoWDM Networks","speaker":"Angela Mitrovska","affiliation":"Fraunhofer HHI","authors":"Hussein  Zaid, Angela  Mitrovska, Julie  Raulin, Chunmin  Xia, Behnam  Shariati, Aydin  Jafari, Stefan  Kremling, Fabian  Lipp, David  Hock, Stefan  Melin, Anders  Lindgren, Johannes K. Fischer, Ronald  Freund","start":"","end":"","abstractid":216505,"order":2,"abstract":"Abstract (summary)  We demonstrate three IPoWDM coherent-pluggable workflows: hierarchical IP-controller-only management, EDCC-governed dual-controller access with hierarchical SDN coordination, and direct optical-controller access without hierarchical controller, validating responsibilities, access control, and policy enforcement on a live multi-vendor testbed","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1475.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1454 / Tu2-Ex3","title":"MCP-Enabled Agentic AI for Autonomous IPoDWDM Network Lifecycle Automation","speaker":"Chunmin Xia","affiliation":"Adtran Networks SE","authors":"Chunmin  Xia, Jakub  Harbaczewski, Nikhil  Dsilva, Julie  Raulin, Dominic  Schneider, Achim  Autenrieth","start":"","end":"","abstractid":215902,"order":3,"abstract":"Abstract (summary)  This demo presents an MCP-enabled agentic AI architecture for autonomous control of vendor-agnostic IPoDWDM networks. We demonstrate live end-to-end lifecycle multi-layer automation and closed-loop control using GNPy and telemetry, validated on a real testbed.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1454.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1444 / Tu2-Ex4","title":"Inter-Satellite All-Optical Networks (ISAON): Hands-on Demonstration of Orbit-Aware Routing Design and WDM Ground-Emulator Control","speaker":"Anthony Brasi","affiliation":"National Institute of Information and Communications Technology (NICT)","authors":"Anthony  Brasi, Yusuke  Hirota, Shoichiro  Oda, Hideaki  Kotake, Satoshi  Shinada, Hideaki  Furukawa","start":"","end":"","abstractid":215656,"order":4,"abstract":"Abstract (summary)  We developed a software prototype for inter-satellite all-optical network operation, demonstrating GUI-based visualisation of orbit-aware routing and live WDM ground-emulator control to monitor 100/200/300 Gbps transmission performance on the path corresponding to Barcelona–Mumbai.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1444.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1457 / Tu2-Ex5","title":"Demonstration of a Quantum-Safe Network Service Including Quantum Key Distribution, Software-Define Networking and Telco Edge Cloud Integration","speaker":"Elisa Redolfi","affiliation":"FiberCop S.p.A.","authors":"Elisa  Redolfi, Domenico  Orto, Marco  Manco, Alessandro  Emanuele, Piotr  Kwiecien, Alberto  Gatto, Daniele  Franceschini","start":"","end":"","abstractid":216029,"order":5,"abstract":"Abstract (summary)  This demonstration presents a quantum-safe network service integrating QKD, SDN, and Telco Edge Cloud technologies, enabling secure key distribution, real-time monitoring, and industrial application protection, demonstrating scalability, interoperability, and deployment feasibility in realistic telecom environments.","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1457.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1484 / Tu2-Ex6","title":"GsOQDC: A GUI-Driven Interactive Framework for End-to-End Simulation of Optical Quantum Data Centers","speaker":"Seyed Navid Elyasi","affiliation":"University of Bristol","authors":"Seyed Navid Elyasi, Sima  Bahrani, Rui  Wang, Dimitra  Simeonidou, Paolo  Monti, Rui  Lin","start":"","end":"","abstractid":216788,"order":6,"abstract":"Abstract (summary)  We present GsOQDC, an open-source graphical framework integrating optical-network design, distributed quantum-circuit compilation, scheduling, and DES-based remote-gate simulation, enabling end-to-end cross-layer evaluation of entanglement-resource dynamics and system-level performance in Optical Quantum Data Centers ©2026 The Author(s)","pdf":"/static/upload/ow193/events/ev667/abssub/ECOC26-1484.pdf"},{"role":"speaker","rolename":"Exhibition","code":"#1466 / Tu2-Ex7","title":"Demonstration of Digital Twin Development and Validation Workflows in Heterogeneous Multi-Party Environments using OTDS","speaker":"Hassan Akbari","affiliation":"Fraunhofer HHI","authors":"Hassan  Akbari, Angela  Mitrovska, Yusuke  Hirota, Sugang  Xu, Taiga  Suzuki, Agastya  Raj, Claudio  Crognale, Behnam  Shariati, Pooyan  Safari, Yuki  Yoshida, Marco  Ruffini, Pietro  Invernizzi, Satoshi  Shinada, Hideaki  Furukawa, Yoshinari  Awaji, Mattia  Pasti, Sara  Corti, Silvia  Turolla, Johannes Karl Fi
